const JSPDF = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";

function cargarScript(url, queEs = "el generador de PDF") {
  return new Promise((listo, falla) => {
    if (document.querySelector(`script[src="${url}"]`)) return listo();
    const s = document.createElement("script");
    s.src = url;
    s.onload = listo;
    s.onerror = () => falla(new Error(`No se pudo cargar ${queEs}. ¿Hay internet?`));
    document.head.appendChild(s);
  });
}

/** Carga el logo reducido. A tamaño completo son 140 KB que se incrustan en
 *  cada PDF y lo dejan en más de un mega; a 150 px se ve igual de nítido en
 *  los 20 mm que ocupa en la hoja. */
const cargarLogo = (src, lado = 150) => new Promise(listo => {
  const i = new Image();
  i.onload = () => {
    const c = document.createElement("canvas");
    c.width = c.height = lado;
    c.getContext("2d").drawImage(i, 0, 0, lado, lado);
    listo(c.toDataURL("image/png"));
  };
  i.onerror = () => listo(null);     // sin logo, el PDF se arma igual
  i.src = src;
});

async function generarPDF(c) {
  const msj = $(".pie-form .mensaje");
  decir(msj, "Armando el PDF…");
  try {
    await cargarScript(JSPDF);
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "mm", format: "a4" });
    const A = 210, M = 16;
    const der = A - M;
    const gris = [110, 110, 134], tinta = [19, 0, 82];
    let y = 16;

    const logo = await cargarLogo("logo.png");
    if (logo) doc.addImage(logo, "PNG", M, y - 2, 20, 20);

    doc.setFont("helvetica", "bold").setFontSize(15).setTextColor(...tinta);
    doc.text("SEGURIDAD GARRIDOS", M + (logo ? 24 : 0), y + 5);
    doc.setFont("helvetica", "normal").setFontSize(8.5).setTextColor(...gris);
    doc.text("GLOBSEG SPA · RUT 78.095.104-4", M + (logo ? 24 : 0), y + 10);
    doc.text("Seguridad privada: guardias, rondas, cámaras y eventos.", M + (logo ? 24 : 0), y + 14);

    doc.setFont("helvetica", "bold").setFontSize(13).setTextColor(...tinta);
    doc.text("COTIZACIÓN", der, y + 4, { align: "right" });
    doc.setFontSize(11);
    doc.text("N° " + c.numero, der, y + 10, { align: "right" });
    doc.setFont("helvetica", "normal").setFontSize(8.5).setTextColor(...gris);
    doc.text("Fecha: " + fecha(c.fecha), der, y + 15, { align: "right" });
    doc.text("Válida por " + c.validez_dias + " días", der, y + 19, { align: "right" });

    y += 27;
    doc.setDrawColor(...tinta).setLineWidth(0.5).line(M, y, der, y);
    y += 7;

    doc.setFont("helvetica", "bold").setFontSize(8).setTextColor(...gris);
    doc.text("CLIENTE", M, y);
    y += 5;
    doc.setFont("helvetica", "bold").setFontSize(11).setTextColor(...tinta);
    doc.text(c.cliente_nombre, M, y);
    doc.setFont("helvetica", "normal").setFontSize(9).setTextColor(60, 60, 80);
    const datos = [
      c.cliente_rut && "RUT " + c.cliente_rut,
      c.cliente_contacto, c.cliente_email,
    ].filter(Boolean);
    if (datos.length) { y += 5; doc.text(datos.join("  ·  "), M, y); }
    if (c.instalacion) { y += 5; doc.text("Instalación: " + c.instalacion, M, y); }

    y += 9;
    doc.setFillColor(231, 235, 227).rect(M, y, der - M, 8, "F");
    doc.setFont("helvetica", "bold").setFontSize(8).setTextColor(...tinta);
    doc.text("DETALLE", M + 2, y + 5.5);
    doc.text("CANT.", der - 76, y + 5.5, { align: "right" });
    doc.text("P. UNITARIO", der - 40, y + 5.5, { align: "right" });
    doc.text("SUBTOTAL", der - 2, y + 5.5, { align: "right" });
    y += 12;

    doc.setFont("helvetica", "normal").setFontSize(9).setTextColor(30, 25, 60);
    for (const i of c.items) {
      const lineas = doc.splitTextToSize(i.descripcion, 92);
      if (y + lineas.length * 4.6 > 262) { doc.addPage(); y = 22; }
      doc.text(lineas, M + 2, y);
      const cant = i.cantidad + (i.unidad ? " " + i.unidad : "");
      doc.text(String(cant), der - 76, y, { align: "right" });
      doc.text(clp(i.precio_unitario), der - 40, y, { align: "right" });
      doc.setFont("helvetica", "bold");
      doc.text(clp(i.subtotal), der - 2, y, { align: "right" });
      doc.setFont("helvetica", "normal");
      y += lineas.length * 4.6 + 3;
      doc.setDrawColor(207, 214, 201).setLineWidth(0.15).line(M, y - 1.5, der, y - 1.5);
    }

    y += 4;
    if (y > 232) { doc.addPage(); y = 22; }
    const x1 = der - 62, x2 = der - 2;
    doc.setFontSize(9.5).setTextColor(...gris);
    doc.text("Neto", x1, y);
    doc.setTextColor(30, 25, 60).text(clp(c.neto), x2, y, { align: "right" });
    y += 5.5;
    doc.setTextColor(...gris).text("IVA 19%", x1, y);
    doc.setTextColor(30, 25, 60).text(clp(c.iva), x2, y, { align: "right" });
    y += 3;
    doc.setDrawColor(...tinta).setLineWidth(0.4).line(x1, y, x2, y);
    y += 6.5;
    doc.setFont("helvetica", "bold").setFontSize(12.5).setTextColor(...tinta);
    doc.text("TOTAL", x1, y);
    doc.text(clp(c.total), x2, y, { align: "right" });

    y += 12;
    for (const [rotulo, texto] of [["CONDICIONES", c.condiciones], ["OBSERVACIONES", c.observaciones]]) {
      if (!texto) continue;
      const lineas = doc.splitTextToSize(texto, der - M);
      if (y + lineas.length * 4.2 > 272) { doc.addPage(); y = 22; }
      doc.setFont("helvetica", "bold").setFontSize(8).setTextColor(...gris);
      doc.text(rotulo, M, y);
      y += 5;
      doc.setFont("helvetica", "normal").setFontSize(8.8).setTextColor(60, 60, 80);
      doc.text(lineas, M, y);
      y += lineas.length * 4.2 + 6;
    }

    const n = doc.internal.getNumberOfPages();
    for (let p = 1; p <= n; p++) {
      doc.setPage(p);
      doc.setFont("helvetica", "normal").setFontSize(7.5).setTextColor(...gris);
      doc.text("Seguridad Garridos · GLOBSEG SPA · RUT 78.095.104-4", M, 288);
      doc.text(`Página ${p} de ${n}`, der, 288, { align: "right" });
    }

    // \w no incluye letras acentuadas: sin la u y el rango, "Energía" quedaba
    // como "Energa" en el nombre del archivo.
    const limpio = c.cliente_nombre
      .replace(/[^\p{L}\p{N}\s-]/gu, "").replace(/\s+/g, " ").trim().slice(0, 40);
    doc.save(`Cotizacion-${c.numero}-${limpio}.pdf`);
    decir(msj, "PDF descargado", "ok");
  } catch (e) {
    decir(msj, e.message, "error");
  }
}

          <td><select data-estado="${c.id}" style="min-width:132px">
            ${ESTADOS_CONTACTO.map(e => `<option value="${e}"${e === c.estado ? " selected" : ""}>${e}</option>`).join("")}
          </select></td>
          <td><input data-notas="${c.id}" value="${esc(c.notas || "")}" placeholder="Qué se hizo" style="min-width:180px"></td>
        </tr>`).join("")}
      </tbody></table></div>`
      : `<p class="vacio">Todavía no ha llegado ningún contacto desde la página.</p>`}
    </section>`;

  conectarSeleccion();
  const guardar = async (id, campos) => {
    try { await pedir(`/contactos/${id}`, { method: "PATCH", body: JSON.stringify(campos) }); }
    catch (e) { alert(e.message); }
  };
  document.querySelectorAll("[data-estado]").forEach(sel => {
    sel.onchange = () => guardar(sel.dataset.estado, { estado: sel.value });
  });
  document.querySelectorAll("[data-notas]").forEach(inp => {
    inp.onchange = () => guardar(inp.dataset.notas, { notas: inp.value });
  });
}

// ------------------------------------------------------------- asistencia
/**
 * Trabajadores y libro de asistencia.
 *
 * Acá se crean las cuentas con las que los guardias entran a
 * asistencia.seggarridos.com. El usuario no se escribe: lo arma el sistema con
 * la regla de siempre —inicial del nombre, apellido paterno, inicial del
 * materno— y la clave es el RUT. Eso evita el ida y vuelta de inventar
 * usuarios y contraseñas para gente que no trabaja frente a un computador.
 *
 * La oficina no marca por nadie. El libro se lee, no se edita: es lo que lo
 * hace servir de respaldo cuando alguien reclama un turno.
 */
const CARGOS = ["guardia", "supervisor", "nochero", "rondin"];

const sinTildes = s => String(s ?? "").normalize("NFD")
  .replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z]/g, "");

/** La misma regla que aplica el servidor, para mostrarla mientras se escribe. */
function usuarioPropuesto(nombres, paterno, materno) {
  const n = sinTildes(String(nombres ?? "").trim().split(/\s+/)[0]);
  const p = sinTildes(paterno);
  const m = sinTildes(String(materno ?? "").trim().split(/\s+/)[0]);
  if (!n || !p) return "";
  return n[0] + p + (m ? m[0] : "");
}

const rutLindo = v => {
  const t = String(v ?? "").toUpperCase().replace(/[^0-9K]/g, "");
  if (t.length < 2) return t;
  return t.slice(0, -1).replace(/\B(?=(\d{3})+(?!\d))/g, ".") + "-" + t.slice(-1);
};

// ------------------------------------------------------------- Excel del libro
/**
 * El libro en una planilla.
 *
 * Esto existe para remuneraciones: lo que se hace con el libro al final de mes
 * es sumar horas por persona, y eso se hace en Excel. Por eso las horas van
 * como número y no como texto —si no, no se pueden sumar— y la fecha va como
 * fecha de verdad, para poder ordenar y filtrar por mes.
 *
 * Tres hojas: el resumen de lo que se descargó (para que el archivo diga solo
 * de qué periodo es cuando llegue por correo), una fila por jornada, y las
 * correcciones aparte, con quién las hizo y por qué. Lo que la oficina
 * intervino nunca se mezcla en silencio con lo que marcó el guardia.
 */
const SHEETJS = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";

async function bajarLibroExcel(libro) {
  await cargarScript(SHEETJS, "el generador de Excel");
  const XLSX = window.XLSX;
  if (!XLSX) throw new Error("No se pudo cargar el generador de Excel.");

  // Mediodía para que el cambio de huso no corra la fecha un día.
  const comoFecha = iso => iso ? new Date(iso + "T12:00:00") : null;
  const r = libro.resumen;
  const quien = estado.usuario ? `${estado.usuario.nombre} (${estado.usuario.usuario})` : "";

  const resumen = [
    ["Libro de asistencia"],
    ["Seguridad Garridos · GLOBSEG SPA"],
    [],
    ["Desde", comoFecha(libro.desde)],
    ["Hasta", comoFecha(libro.hasta)],
    ["Jornadas", r.jornadas],
    ["Trabajadores", r.trabajadores],
    ["Horas registradas", r.horas],
    ["Sin salida marcada", r.sin_salida],
    ["Corregidas por la oficina", r.corregidas || 0],
    [],
    ["Descargado", new Date()],
    ["Por", quien],
  ];
  if (r.sin_salida) {
    resumen.push([], ["Aviso", "Las jornadas sin salida no suman horas: falta la marca."]);
  }

  const jornadas = libro.jornadas.map(j => ({
    "Fecha": comoFecha(j.fecha),
    "Trabajador": j.trabajador,
    "RUT": j.rut || "",
    "Usuario": j.usuario || "",
    "Instalación": j.instalacion || "",
    "Entrada": j.hora_entrada || "",
    "Salida": j.hora_salida || "",
    "Horas": j.horas ?? "",
    "Estado": j.completa ? "Completa" : "Sin salida",
    "Entrada marcada por": j.entrada_origen === "oficina" ? "Oficina" : (j.entrada ? "El guardia" : ""),
    "Salida marcada por": j.salida_origen === "oficina" ? "Oficina" : (j.salida ? "El guardia" : ""),
    "Con ubicación": j.entrada_ubicada || j.salida_ubicada ? "Sí" : "No",
  }));

  const correcciones = libro.jornadas.flatMap(j =>
    (j.correcciones || []).map(c => ({
      "Fecha": comoFecha(j.fecha),
      "Trabajador": j.trabajador,
      "RUT": j.rut || "",
      "Qué se agregó": c.tipo === "entrada" ? "Entrada" : "Salida",
      "Hora": c.hora || "",
      "Quién la puso": c.por_nombre || c.por || "",
      "Motivo": c.motivo || "",
      "Cuándo se registró": c.cuando ? new Date(c.cuando) : "",
    })));

  const libroXL = XLSX.utils.book_new();

  const hojaResumen = XLSX.utils.aoa_to_sheet(resumen);
  hojaResumen["!cols"] = [{ wch: 26 }, { wch: 46 }];
  formatear(hojaResumen, { "B4": "dd-mm-yyyy", "B5": "dd-mm-yyyy", "B12": "dd-mm-yyyy hh:mm" });
  XLSX.utils.book_append_sheet(libroXL, hojaResumen, "Resumen");

  const hojaJornadas = XLSX.utils.json_to_sheet(jornadas);
  hojaJornadas["!cols"] = [{ wch: 11 }, { wch: 28 }, { wch: 13 }, { wch: 13 }, { wch: 22 },
                           { wch: 9 }, { wch: 9 }, { wch: 8 }, { wch: 12 },
                           { wch: 19 }, { wch: 19 }, { wch: 13 }];
  // La primera fila es el encabezado; Excel la congela y se puede filtrar.
  hojaJornadas["!freeze"] = { xSplit: 0, ySplit: 1 };
  if (jornadas.length) {
    hojaJornadas["!autofilter"] = { ref: XLSX.utils.encode_range({
      s: { r: 0, c: 0 }, e: { r: jornadas.length, c: 11 } }) };
  }
  formatearColumna(hojaJornadas, 0, "dd-mm-yyyy", jornadas.length);
  formatearColumna(hojaJornadas, 7, "0.00", jornadas.length);
  XLSX.utils.book_append_sheet(libroXL, hojaJornadas, "Jornadas");

  if (correcciones.length) {
    const hojaCorr = XLSX.utils.json_to_sheet(correcciones);
    hojaCorr["!cols"] = [{ wch: 11 }, { wch: 28 }, { wch: 13 }, { wch: 14 }, { wch: 8 },
                         { wch: 24 }, { wch: 52 }, { wch: 19 }];
    formatearColumna(hojaCorr, 0, "dd-mm-yyyy", correcciones.length);
    formatearColumna(hojaCorr, 7, "dd-mm-yyyy hh:mm", correcciones.length);
    XLSX.utils.book_append_sheet(libroXL, hojaCorr, "Correcciones");
  }

  XLSX.writeFile(libroXL, `asistencia ${libro.desde} a ${libro.hasta}.xlsx`);
}

/** Pone el formato de una celda suelta, si existe. */
function formatear(hoja, formatos) {
  for (const [celda, z] of Object.entries(formatos)) {
    if (hoja[celda]) hoja[celda].z = z;
  }
}

/** Pone el formato a toda una columna de datos, sin tocar el encabezado. */
function formatearColumna(hoja, columna, z, filas) {
  for (let i = 1; i <= filas; i++) {
    const celda = hoja[window.XLSX.utils.encode_cell({ r: i, c: columna })];
    if (celda && celda.v !== "") celda.z = z;
  }
}

// ============================================================ recursos humanos
/**
 * RRHH en cuatro pantallas:
 *   · RRHH      — qué vence, qué falta y a quién. Lo primero que hay que mirar.
 *   · Personal  — la ficha de cada uno, con su contrato, sus papeles y su feriado.
 *   · Sueldos   — liquidación estimada, finiquito estimado y los parámetros del año.
 *   · Carga masiva — subir la planilla que ya existe, en vez de teclearla.
 *
 * Todo lo que es estimación lo dice. Todo parámetro que nadie confirmó se
 * muestra en ámbar, igual que en la página pública: un número sin confirmar
 * que se ve como un número confirmado es peor que no tenerlo.
 */
const RRHH = {
  catalogos: null, panel: null, personal: null, ficha: null,
  verFicha: null,            // id de la persona abierta, o null para la lista
  busca: "", soloActivos: true,
  docFiltro: { estado: "", grupo: "", trabajador: "" },
  sueldos: { trabajador: "", mes: hoyISO().slice(0, 7), vista: "liquidacion" },
  subirA: null,                // documento al que va el archivo que se está eligiendo
  carga: { tipo: "trabajadores", filas: null, encabezados: null, mapa: null,
           revision: null, avance: null },
};

async function catalogosRrhh() {
  if (!RRHH.catalogos) RRHH.catalogos = await pedir("/rrhh/catalogos");
  return RRHH.catalogos;
}

const ROTULO_DOC = { vencido: "Vencido", por_vencer: "Por vencer", vigente: "Vigente",
  sin_vencimiento: "Sin vencimiento", anulado: "Anulado" };
const SELLO_DOC = { vencido: "e-rechazada", por_vencer: "e-solicitar_oc",
  vigente: "e-cerrado", sin_vencimiento: "e-en_curso", anulado: "e-borrador" };

const ROTULO_CONTRATO = { indefinido: "Indefinido", plazo_fijo: "Plazo fijo",
  por_obra: "Por obra o faena" };
const ROTULO_JORNADA = {
  art22: "Jornada ordinaria (art. 22)",
  art38_2: "Turnos continuos (art. 38 N°2)",
  excepcional: "Sistema excepcional autorizado por la DT",
  parcial: "Jornada parcial (art. 40 bis)",
  art22_excluido: "Sin fiscalización de jornada (art. 22 inc. 2°)",
};
const ROTULO_AUSENCIA = {
  feriado: "Feriado legal", feriado_progresivo: "Feriado progresivo",
  licencia_medica: "Licencia médica", accidente_trabajo: "Accidente del trabajo",
  permiso_legal: "Permiso legal", permiso_con_goce: "Permiso con goce",
  permiso_sin_goce: "Permiso sin goce", falta_injustificada: "Falta injustificada",
  suspension: "Suspensión", otra: "Otra",
};
const ROTULO_CARGO = {
  guardia: "Guardia", supervisor: "Supervisor", nochero: "Nochero", rondin: "Rondín",
  jefe_servicio: "Jefe de servicio", administrativo: "Administrativo",
  prevencionista: "Prevencionista", conductor: "Conductor",
};
const rotCargo = c => ROTULO_CARGO[c] || (c ? c[0].toUpperCase() + c.slice(1) : "—");

/** Cuántos días faltan, dicho como lo diría una persona. */
function enDias(n) {
  if (n === null || n === undefined) return "";
  if (n < 0) return `hace ${Math.abs(n)} día${Math.abs(n) === 1 ? "" : "s"}`;
  if (n === 0) return "hoy";
  if (n === 1) return "mañana";
  return `en ${n} días`;
}

const rutLindoSeguro = v => { try { return rutLindo(v); } catch { return v || "—"; } };

/** El peso de un archivo como lo diría una persona. Un PDF chico no puede
 *  salir como «0 KB»: parece que no se subió nada. */
const pesoArchivo = n => !n ? "—"
  : n < 1024 ? `${n} bytes`
  : n < 1048576 ? `${Math.round(n / 1024)} KB`
  : `${(n / 1048576).toFixed(1)} MB`;

const MAX_ARCHIVO = 10 * 1024 * 1024;

/**
 * Sube un archivo a un documento.
 *
 * Va como bytes crudos y no como formulario: el nombre viaja en una cabecera y
 * el cuerpo es el archivo tal cual, así que no se arma una copia en memoria
 * para envolverlo. El tamaño se mira acá antes de mandarlo, para no hacer
 * subir diez megas por la red y recién entonces decir que no.
 */
async function subirArchivo(documentoId, archivo) {
  if (!archivo) return null;
  if (archivo.size > MAX_ARCHIVO) {
    throw new Error(`«${archivo.name}» pesa ${pesoArchivo(archivo.size)} y el máximo es 10 MB. `
      + "Si es una foto, sáquela con menos resolución o conviértala a PDF.");
  }
  const r = await fetch(`/api/rrhh/documentos/${documentoId}/archivo`, {
    method: "POST",
    headers: {
      "content-type": archivo.type || "application/octet-stream",
      // El nombre puede traer acentos y una cabecera HTTP no los admite tal cual.
      "x-archivo-nombre": encodeURIComponent(archivo.name || ""),
    },
    body: archivo,
  });
  const cuerpo = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(cuerpo.error || `Error ${r.status} al subir el archivo`);
  return cuerpo;
}

          <td class="nowrap"><button class="bt bt--fino bt--chico" data-ficha="${t.id}">Ver ficha</button></td>
        </tr>`).join("")}
      </tbody></table></div>`
      : `<p class="vacio">No hay nadie que calce con lo buscado.

          <label class="campo"><span>RUT *</span><input name="rut" required placeholder="12.345.678-9"></label>
          <label class="campo"><span>Fecha de nacimiento</span><input type="date" name="fecha_nacimiento"></label>
          <label class="campo"><span>Sexo</span><select name="sexo"><option value="">—</option>
            <option value="F">Femenino</option><option value="M">Masculino</option><option value="X">Otro</option></select></label>
          <label class="campo"><span>Teléfono</span><input name="telefono" inputmode="tel" placeholder="+56 9 ..."></label>
          <label class="campo"><span>Correo</span><input name="email" type="email" autocomplete="off"></label>
          <label class="campo"><span>Cargo</span><select name="cargo">
            ${c.cargos.map(x => `<option value="${x}">${rotCargo(x)}</option>`).join("")}</select></label>
          <label class="campo"><span>Instalación habitual</span><select name="instalacion_id">
            <option value="">Sin asignar</option>
            ${c.instalaciones.map(i => `<option value="${i.id}">${esc(i.nombre)}</option>`).join("")}</select></label>
          <label class="campo"><span>Fecha de ingreso</span><input type="date" name="fecha_ingreso"></label>
          <label class="campo"><span>AFP</span><select name="afp"><option value="">—</option>
            ${c.afps.map(a => `<option value="${esc(a.nombre)}">${esc(a.nombre)} (${a.comision}%)</option>`).join("")}</select></label>
          <label class="campo"><span>Salud</span><select name="salud_sistema"><option value="">—</option>
            <option value="fonasa">Fonasa</option><option value="isapre">Isapre</option></select></label>
          <label class="campo"><span>Isapre</span><input name="salud_isapre" autocomplete="off"></label>
          <label class="campo"><span>Plan de isapre (UF)</span><input name="salud_plan_uf" inputmode="decimal"></label>
          <label class="campo"><span>Dirección</span><input name="direccion" autocomplete="off"></label>
          <label class="campo"><span>Comuna</span><input name="comuna" autocomplete="off"></label>
          <label class="campo"><span>Contacto de emergencia</span><input name="emergencia_nombre" autocomplete="off"></label>
          <label class="campo"><span>Teléfono de emergencia</span><input name="emergencia_telefono" inputmode="tel"></label>
        </div>
        <div class="pie-form">
          <button class="bt" type="submit">Crear</button>
          <span class="sub" id="previo-usuario" style="margin:0"></span>
          <span class="mensaje"></span>
        </div>
      </form>
    </section>`;

  $("#volver").onclick = () => { RRHH.verFicha = null; pintarPersonal(); };
  const f = $("#f-nueva");
  const previo = $("#previo-usuario");
  const verPrevio = () => {
    const u = usuarioPropuesto(f.nombres.value, f.apellido_paterno.value, f.apellido_materno.value);
    previo.textContent = u ? `Entrará a asistencia como «${u}», con su RUT de clave` : "";
  };
  ["nombres", "apellido_paterno", "apellido_materno"].forEach(k => { f[k].oninput = verPrevio; });
  f.rut.onblur = () => { if (f.rut.value) f.rut.value = rutLindoSeguro(f.rut.value); };

  f.onsubmit = async ev => {
    ev.preventDefault();
    const m = f.querySelector(".mensaje"), bt = f.querySelector("button");
    decir(m, "Guardando…"); bt.disabled = true;
    try {
      const r = await pedir("/rrhh/personal", { method: "POST",
        body: JSON.stringify(Object.fromEntries(new FormData(f))) });
      RRHH.verFicha = r.trabajador.id;
      pintarFicha(RRHH.verFicha);
    } catch (e) { decir(m, e.message, "error"); bt.disabled = false; }
  };
}

// ------------------------------------------------------------- ficha
async function pintarFicha(id) {
  $("#app").innerHTML = `<p class="cargando">Cargando la ficha…</p>`;
  const [datos] = await Promise.all([pedir(`/rrhh/personal/${id}`), catalogosRrhh()]);
  RRHH.ficha = datos;
  const { ficha: t, contratos, contrato_vigente: cv, documentos, ausencias, feriado } = datos;
  const c = RRHH.catalogos;

  const vencidos = documentos.filter(d => d.estado === "vencido");
  const porVencer = documentos.filter(d => d.estado === "por_vencer");

  $("#app").innerHTML = `
    <p style="margin-bottom:14px">
      <button class="bt bt--fino bt--chico" id="volver">← Volver al personal</button></p>

    ${!cv ? aviso("mal", "Esta persona no tiene contrato cargado",
      "Sin contrato no se puede calcular el sueldo, ni el feriado, ni un finiquito, "
      + "y no hay nada que mostrar en una fiscalización. Cárguelo más abajo.") : ""}
    ${vencidos.length ? aviso("mal",
      `${vencidos.length} documento${vencidos.length > 1 ? "s" : ""} vencido${vencidos.length > 1 ? "s" : ""}`,
      vencidos.map(d => d.tipo_nombre).join(", ") + ".") : ""}
    ${porVencer.length ? aviso("ojo",
      `${porVencer.length} por vencer`, porVencer.map(d =>
        `${d.tipo_nombre} (${fecha(d.fecha_vencimiento)})`).join(", ") + ".") : ""}

    <dl class="resumen">
      <div class="ficha ficha--plata"><dt>${esc(t.nombre)}</dt>
        <dd style="font-size:1.1rem">${rutLindoSeguro(t.rut_plano)}</dd>
        <small>${rotCargo(t.cargo)}${t.instalacion ? " · " + esc(t.instalacion) : ""}
          ${t.activo ? "" : " · <b>de baja</b>"}</small></div>
      <div class="ficha"><dt>Antigüedad</dt>
        <dd class="num" style="font-size:1.3rem">${t.fecha_ingreso ? fecha(t.fecha_ingreso) : "—"}</dd>
        <small>${feriado.anios_empresa !== undefined && t.fecha_ingreso
          ? `${feriado.anios_empresa} años en la empresa` : "Falta la fecha de ingreso"}</small></div>
      <div class="ficha ${feriado.saldo < 0 ? "ficha--ojo" : ""}"><dt>Feriado disponible</dt>
        <dd class="num">${t.fecha_ingreso ? feriado.saldo : "—"}</dd>
        <small>días hábiles · ${feriado.dias_por_anio || 15} al año${
          feriado.progresivo ? ` (${feriado.progresivo} de progresivo)` : ""}</small></div>
      <div class="ficha"><dt>Sueldo base</dt>
        <dd class="num" style="font-size:1.3rem">${cv ? clp(cv.sueldo_base) : "—"}</dd>
        <small>${cv ? (ROTULO_CONTRATO[cv.tipo] || cv.tipo) : "sin contrato"}</small></div>
      <div class="ficha"><dt>Documentos</dt><dd class="num">${documentos.filter(d => d.vigente).length}</dd>
        <small>${vencidos.length} vencidos · ${porVencer.length} por vencer</small></div>
    </dl>

    ${seccionContratos(contratos, cv, c)}
    ${seccionDocumentos(documentos, c)}
    ${seccionAusencias(ausencias, feriado, t)}
    ${seccionDatos(t, c)}`;

  $("#volver").onclick = () => { RRHH.verFicha = null; pintarPersonal(); };
  conectarFicha(datos);
}

          <label class="campo"><span>Jornada</span><select name="jornada_tipo">

          <label class="campo"><span>Horas semanales</span><input name="horas_semanales" inputmode="decimal" placeholder="42"></label>
          <label class="campo"><span>Turno</span><input name="turno" placeholder="4x4 de 12 horas" autocomplete="off"></label>

          <label class="campo"><span>Sueldo base *</span><input name="sueldo_base" inputmode="numeric" required></label>
          <label class="campo"><span>Gratificación</span><select name="gratificacion">
            <option value="legal_25">Legal: 25% con tope (art. 50)</option>

function seccionDocumentos(documentos, c) {
  const porGrupo = {};
  for (const d of documentos) (porGrupo[d.tipo_grupo] ||= []).push(d);

    salud: "Salud ocupacional", prevencion: "Prevención de riesgos",
    conduccion: "Conducción", termino: "Término", general: "Otros" };

  return `<section class="caja">
    <div class="caja__tit"><h2>Documentos</h2>
      <span class="nota">El archivo se guarda acá; el enlace a Drive sigue sirviendo para lo que ya está allá</span></div>
    ${documentos.length ? Object.entries(porGrupo).map(([g, docs]) => `
      <div style="padding:10px 16px 0"><b style="font-size:.84rem;color:var(--texto-2)">${esc(GRUPO[g] || g)}</b></div>
      <div class="desliza"><table>
        <thead><tr><th>Documento</th><th>N°</th><th>Emisión</th><th>Vencimiento</th>
          <th>Estado</th><th>Archivo</th><th></th></tr></thead><tbody>
        ${docs.map(d => `<tr${d.estado === "vencido" ? ' class="fila--atrasado"' : ""}>
          <td><b>${esc(d.tipo_nombre)}</b>${d.glosa ? `<span class="sub">${esc(d.glosa)}</span>` : ""}
            ${d.base_legal ? `<span class="sub" title="${esc(d.base_legal)}">${esc(d.base_legal.slice(0, 70))}${d.base_legal.length > 70 ? "…" : ""}</span>` : ""}</td>
          <td class="nowrap">${esc(d.numero || "—")}</td>
          <td class="nowrap">${d.fecha_emision ? fecha(d.fecha_emision) : "—"}</td>
          <td class="nowrap">${d.fecha_vencimiento
            ? `${fecha(d.fecha_vencimiento)}<span class="sub">${enDias(d.dias_para_vencer)}</span>` : "—"}</td>
          <td><span class="sello ${SELLO_DOC[d.estado]}">${ROTULO_DOC[d.estado]}</span></td>
          <td>${d.archivo_ruta
            ? `<a class="bt bt--fino bt--chico" href="/api/rrhh/documentos/${d.id}/archivo"
                 target="_blank" rel="noopener">Ver archivo</a>
               <span class="sub">${esc(d.archivo_nombre)} · ${pesoArchivo(d.archivo_bytes)}</span>`
            : `<button class="bt bt--fino bt--chico" data-subir="${d.id}">Subir archivo</button>`}
            ${d.enlace ? `<a class="sub" href="${esc(d.enlace)}" target="_blank" rel="noopener"
                 style="color:var(--acento)">También en Drive</a>` : ""}</td>
          <td class="nowrap">
            ${d.archivo_ruta ? `<button class="bt bt--fino bt--chico" data-subir="${d.id}">Reemplazar</button>
               <button class="bt bt--fino bt--chico" data-quitar-archivo="${d.id}">Quitar archivo</button>` : ""}
            ${d.vigente ? `<button class="bt bt--fino bt--chico" data-anular-doc="${d.id}">Anular</button>` : ""}
          </td>
        </tr>`).join("")}
      </tbody></table></div>`).join("")
      : `<p class="vacio">Sin documentos cargados.</p>`}

    <!-- Uno solo para toda la tabla: un input por fila serían treinta. El
         botón que se apretó deja su id en RRHH.subirA antes de abrirlo. -->
    <input type="file" id="archivo-oculto" style="display:none"
           accept="application/pdf,image/jpeg,image/png,image/webp,image/heic">

      <form id="f-documento">

          <label class="campo" style="grid-column:span 2"><span>Archivo (PDF o foto)</span>

        </div>
        <div class="pie-form">

function conectarFicha(datos) {
  const id = datos.ficha.id;
  const recargar = () => pintarFicha(id);

  const enviar = (sel, ruta, extra = {}, despues = recargar) => {
    const f = $(sel);
    if (!f) return;
    f.onsubmit = async ev => {
      ev.preventDefault();
      const m = f.querySelector(".mensaje"), bt = f.querySelector("button[type=submit]");
      decir(m, "Guardando…"); bt.disabled = true;
      try {
        const cuerpo = { ...Object.fromEntries(new FormData(f)), ...extra };
        const r = await pedir(ruta, { method: "POST", body: JSON.stringify(cuerpo) });
        if (r.avisos?.length) alert("Guardado.\n\nTenga presente:\n\n· " + r.avisos.join("\n· "));
        despues(r);
      } catch (e) { decir(m, e.message, "error"); bt.disabled = false; }
    };
  };

  enviar("#f-contrato", "/rrhh/contratos", { trabajador_id: id });

  // El documento se crea primero y el archivo se sube después, contra el id
  // recién creado. No se puede al revés: el archivo se guarda en una ruta que
  // lleva ese id adentro.
  const fdoc = $("#f-documento");
  if (fdoc) {
    fdoc.onsubmit = async ev => {
      ev.preventDefault();
      const m = fdoc.querySelector(".mensaje"), bt = fdoc.querySelector("button[type=submit]");
      const archivo = fdoc.archivo.files[0] || null;
      if (archivo && archivo.size > MAX_ARCHIVO) {
        return decir(m, `«${archivo.name}» pesa ${pesoArchivo(archivo.size)} y el máximo es 10 MB.`, "error");
      }
      decir(m, "Guardando…"); bt.disabled = true;
      try {
        const campos = Object.fromEntries(new FormData(fdoc));
        delete campos.archivo;                 // el archivo no va en el JSON
        const r = await pedir("/rrhh/documentos", { method: "POST",
          body: JSON.stringify({ ...campos, trabajador_id: id }) });
        if (archivo) {
          decir(m, `Subiendo ${esc(archivo.name)}…`);
          try {
            await subirArchivo(r.documento.id, archivo);
          } catch (e) {
            // El documento ya quedó creado: decirlo evita que lo carguen de
            // nuevo y queden dos.
            alert(`El documento se guardó, pero el archivo no se pudo subir.\n\n${e.message}`
              + "\n\nPuede subirlo desde el botón «Subir archivo» de su fila.");
          }
        }
        recargar();
      } catch (e) { decir(m, e.message, "error"); bt.disabled = false; }
    };
  }
  enviar("#f-ausencia", "/rrhh/ausencias", { trabajador_id: id }, r => {
    if (r.saldo) {
      alert(`Registrada.\n\nFeriado disponible ahora: ${r.saldo.saldo} días hábiles.`);
    }
    recargar();
  });

  // Ayuda viva mientras se escribe: el tipo de documento dice su validez y su
  // base legal, que es lo que nadie se sabe de memoria.
  const fd = $("#f-documento");
  if (fd) {
    const ayuda = $("#ayuda-doc");
    const verTipo = () => {
      const td = RRHH.catalogos.tipos_documento.find(x => x.codigo === fd.tipo.value);
      ayuda.textContent = td
        ? [td.vence ? (td.meses_validez ? `Vence a los ${td.meses_validez} meses (se propone solo)`
                                        : "Lleva fecha de vencimiento") : "No vence",
           td.base_legal].filter(Boolean).join(" · ")
        : "";
    };
    fd.tipo.onchange = verTipo;
    verTipo();
  }

  // Y lo mismo con las ausencias: cuántos días hábiles van a quedar, antes de
  // apretar guardar.
  const fa = $("#f-ausencia");
  if (fa) {
    const nota = $("#calculo-dias");
    const base = nota.textContent;
    const ver = () => {
      if (!fa.desde.value || !fa.hasta.value || fa.hasta.value < fa.desde.value) {
        nota.textContent = base; return;
      }
      const n = habilesLocal(fa.desde.value, fa.hasta.value);
      nota.textContent = `Son ${n} día${n === 1 ? "" : "s"} hábiles. Si no calza, escríbalo a mano.`;
    };
    fa.desde.onchange = ver; fa.hasta.onchange = ver;
  }

  const ff = $("#f-ficha");
  if (ff) {
    ff.onsubmit = async ev => {
      ev.preventDefault();
      const m = ff.querySelector(".mensaje"), bt = ff.querySelector("button[type=submit]");
      decir(m, "Guardando…"); bt.disabled = true;
      try {
        await pedir(`/rrhh/personal/${id}`, { method: "PATCH",
          body: JSON.stringify(Object.fromEntries(new FormData(ff))) });
        decir(m, "Guardado", "ok");
        bt.disabled = false;
        RRHH.panel = null;
      } catch (e) { decir(m, e.message, "error"); bt.disabled = false; }
    };
    $("#bt-baja").onclick = async () => {
      const activo = datos.ficha.activo;
      if (activo && !confirm("¿Dar de baja?\n\nNo podrá entrar a marcar asistencia. "
        + "Su ficha, contratos y documentos se conservan enteros.")) return;
      try {
        await pedir(`/rrhh/personal/${id}`, { method: "PATCH",
          body: JSON.stringify({ activo: !activo }) });
        recargar();
      } catch (e) { alert(e.message); }
    };
  }

  // Terminar un contrato lleva al finiquito: la causal decide lo que se paga,
  // así que elegirla sin ver el monto es elegir a ciegas.
  document.querySelectorAll("[data-terminar]").forEach(b => {
    b.onclick = () => {
      RRHH.sueldos = { trabajador: String(id), mes: hoyISO().slice(0, 7), vista: "finiquito" };
      ir("sueldos");
    };
  });

  // Un solo input para toda la tabla: el botón apretado deja su documento acá.
  const oculto = $("#archivo-oculto");
  if (oculto) {
    document.querySelectorAll("[data-subir]").forEach(b => {
      b.onclick = () => {
        RRHH.subirA = Number(b.dataset.subir);
        oculto.value = "";          // sin esto, elegir el mismo archivo no dispara nada
        oculto.click();
      };
    });
    oculto.onchange = async () => {
      const archivo = oculto.files[0];
      if (!archivo || !RRHH.subirA) return;
      const fila = document.querySelector(`[data-subir="${RRHH.subirA}"]`);
      const antes = fila ? fila.textContent : "";
      if (fila) { fila.disabled = true; fila.textContent = "Subiendo…"; }
      try {
        const r = await subirArchivo(RRHH.subirA, archivo);
        if (r?.reemplazo) console.log("archivo reemplazado");
        recargar();
      } catch (e) {
        alert(e.message);
        if (fila) { fila.disabled = false; fila.textContent = antes; }
      }
    };
  }

  document.querySelectorAll("[data-quitar-archivo]").forEach(b => {
    b.onclick = async () => {
      if (!confirm("¿Quitar el archivo?\n\nEl documento sigue registrado con sus fechas; "
        + "lo que se borra es el archivo subido, y eso no se deshace.")) return;
      try {
        await pedir(`/rrhh/documentos/${b.dataset.quitarArchivo}/archivo`, { method: "DELETE" });
        recargar();
      } catch (e) { alert(e.message); }
    };
  });

  document.querySelectorAll("[data-anular-doc]").forEach(b => {
    b.onclick = async () => {
      if (!confirm("¿Anular este documento?\n\nNo se borra: queda registrado como anulado, "
        + "para que se vea que alguna vez estuvo.")) return;
      try {
        await pedir(`/rrhh/documentos/${b.dataset.anularDoc}`, { method: "PATCH",
          body: JSON.stringify({ vigente: false }) });
        recargar();
      } catch (e) { alert(e.message); }
    };
  });
  document.querySelectorAll("[data-aprobar]").forEach(b => {
    b.onclick = async () => {
      try {
        await pedir(`/rrhh/ausencias/${b.dataset.aprobar}`, { method: "PATCH",
          body: JSON.stringify({ estado: "aprobada" }) });
        recargar();
      } catch (e) { alert(e.message); }
    };
  });
  document.querySelectorAll("[data-anular-aus]").forEach(b => {
    b.onclick = async () => {
      if (!confirm("¿Anular esta ausencia? Deja de descontar feriado.")) return;
      try {
        await pedir(`/rrhh/ausencias/${b.dataset.anularAus}`, { method: "PATCH",
          body: JSON.stringify({ estado: "anulada" }) });
        recargar();
      } catch (e) { alert(e.message); }
    };
  });
}

/**
 * Días hábiles, calculados en el navegador solo para mostrarlos mientras se
 * escribe. El número que se guarda lo calcula el servidor, que es el que
 * conoce los feriados: acá se usa una lista corta, a propósito, para no tener
 * dos verdades. Si el servidor dice otra cosa, manda el servidor.
 */
function habilesLocal(desde, hasta) {
  let n = 0;
  let t = Date.parse(desde + "T00:00:00Z");
  const fin = Date.parse(hasta + "T00:00:00Z");
  if (!(fin >= t) || fin - t > 400 * 86400000) return 0;
  while (t <= fin) {
    const d = new Date(t).getUTCDay();
    if (d >= 1 && d <= 5) n++;
    t += 86400000;
  }
  return n;
}

// ------------------------------------------------------------- sueldos
async function pintarSueldos() {
  const c = await catalogosRrhh();
  if (!RRHH.personal) RRHH.personal = (await pedir("/rrhh/personal")).personal;
  const s = RRHH.sueldos;
  const gente = RRHH.personal.filter(t => t.activo || String(t.id) === String(s.trabajador));

  const cabecera = `
    <div class="caja" style="padding:14px 16px;margin-bottom:18px;display:flex;gap:14px;
         align-items:center;flex-wrap:wrap">
      <div class="segmento" role="group" id="seg-sueldos">
        <button type="button" data-sub="liquidacion" aria-pressed="${s.vista === "liquidacion"}">Liquidación</button>
        <button type="button" data-sub="finiquito" aria-pressed="${s.vista === "finiquito"}">Finiquito</button>
        <button type="button" data-sub="parametros" aria-pressed="${s.vista === "parametros"}">Parámetros</button>
      </div>
      <span class="sub" style="margin:0;max-width:52ch">Los dos primeros son
        <b>estimaciones</b>: sirven para saber cuánto da antes de comprometerlo. El documento
        que se firma lo emite quien corresponda.</span>
    </div>`;

  $("#app").innerHTML = cabecera + `<p class="cargando">Cargando…</p>`;
  document.querySelectorAll("#seg-sueldos button").forEach(b => {
    b.onclick = () => { RRHH.sueldos.vista = b.dataset.sub; pintarSueldos(); };
  });

  const caja = document.createElement("div");
  if (s.vista === "parametros") caja.innerHTML = await htmlParametros();
  else caja.innerHTML = htmlSelectorPersona(gente, s);

  $("#app").querySelector(".cargando").replaceWith(caja);

  if (s.vista === "parametros") return conectarParametros();

  const selector = $("#f-sueldo-persona");
  if (selector) {
    selector.onchange = () => {
      RRHH.sueldos.trabajador = selector.value;
      pintarSueldos();
    };
  }
  const selMes = $("#f-sueldo-mes");
  if (selMes) selMes.onchange = () => { RRHH.sueldos.mes = selMes.value; calcular(); };

  const destino = document.createElement("div");
  $("#app").append(destino);

  async function calcular() {
    if (!RRHH.sueldos.trabajador) {
      destino.innerHTML = `<p class="vacio">Elija a una persona.</p>`;
      return;
    }
    destino.innerHTML = `<p class="cargando">Calculando…</p>`;
    try {
      if (s.vista === "liquidacion") {
        const r = await pedir("/rrhh/liquidacion", { method: "POST", body: JSON.stringify({
          trabajador_id: Number(RRHH.sueldos.trabajador), mes: RRHH.sueldos.mes }) });
        destino.innerHTML = htmlLiquidacion(r);
      } else {
        const f = $("#f-finiquito");
        const cuerpo = { trabajador_id: Number(RRHH.sueldos.trabajador),
          causal: f?.causal.value || "161-1",
          fecha_termino: f?.fecha_termino.value || hoyISO(),
          aviso_dado: f?.aviso_dado.value === "true",
          base: f?.base.value || null };
        const r = await pedir("/rrhh/finiquito", { method: "POST", body: JSON.stringify(cuerpo) });
        destino.innerHTML = htmlFiniquito(r, cuerpo);
        conectarFiniquito(cuerpo, calcular);
      }
    } catch (e) {
      destino.innerHTML = aviso("mal", "No se pudo calcular", e.message);
    }
  }

  if (s.vista === "finiquito") {
    const caja2 = document.createElement("div");
    caja2.innerHTML = htmlFormFiniquito();
    $("#app").insertBefore(caja2, destino);
    $("#f-finiquito").oninput = () => { clearTimeout(RRHH._tf); RRHH._tf = setTimeout(calcular, 300); };
    $("#f-finiquito").onchange = calcular;
  }
  calcular();
}

function conectarParametros() {
  const f = $("#f-uf-utm");
  if (f) {
    f.onsubmit = async ev => {
      ev.preventDefault();
      const m = f.querySelector(".mensaje"), bt = f.querySelector("button");
      const desde = f.vigente_desde.value;
      if (!desde) return decir(m, "Falta la fecha de vigencia", "error");
      decir(m, "Guardando…"); bt.disabled = true;
      try {
        for (const codigo of ["uf", "utm"]) {
          const v = f[codigo].value.replace(/[^\d,.-]/g, "").replace(/\./g, "").replace(",", ".");
          if (!v) continue;
          await pedir("/rrhh/parametros", { method: "PATCH", body: JSON.stringify({
            codigo, vigente_desde: desde, valor: Number(v), unidad: "pesos",
            por_confirmar: false }) });
        }
        pintarSueldos();
      } catch (e) { decir(m, e.message, "error"); bt.disabled = false; }
    };
  }
  document.querySelectorAll(".val-param").forEach(inp => {
    const original = inp.value;
    inp.onkeydown = ev => { if (ev.key === "Enter") { ev.preventDefault(); inp.blur(); } };
    inp.onblur = async () => {
      if (inp.value === original) return;
      const v = Number(inp.value.replace(/\./g, "").replace(",", "."));
      if (!Number.isFinite(v)) { inp.value = original; return alert("Eso no es un número."); }
      try {
        await pedir("/rrhh/parametros", { method: "PATCH", body: JSON.stringify({
          codigo: inp.dataset.codigo, vigente_desde: inp.dataset.desde,
          valor: v, por_confirmar: false }) });
        pintarSueldos();
      } catch (e) { inp.value = original; alert(e.message); }
    };
  });
}

/** Arma la plantilla en Excel: una hoja para pegar, otra con las listas válidas. */
async function bajarPlantilla(tipo) {
  const XLSX = await cargarSheetJS();
  const c = RRHH.catalogos;
  const def = c.plantillas[tipo];

  const libro = XLSX.utils.book_new();

  // Hoja de datos: encabezados y una fila de ejemplo, para que se vea el
  // formato de cada celda antes de pegar nada.
  const hoja = XLSX.utils.aoa_to_sheet([
    def.columnas.map(x => x.nombre),
    def.columnas.map(x => x.ejemplo || ""),
  ]);
  hoja["!cols"] = def.columnas.map(x => ({ wch: Math.max(14, x.nombre.length + 2) }));
  XLSX.utils.book_append_sheet(libro, hoja, "Datos");

  // Instrucciones: quien abre esto no vio esta pantalla.
  const inst = [
    [`Plantilla de carga: ${def.rotulo}`],
    [def.nota],
    [],
    ["Cómo se usa"],
    ["1. Borre la fila de ejemplo (la fila 2) y pegue sus datos debajo de los encabezados."],
    ["2. No cambie los encabezados de la fila 1. Si su planilla ya usa otros nombres, el sistema"],
    ["   reconoce varias formas de escribirlos: vea la columna «También se acepta» más abajo."],
    ["3. Las fechas pueden ir como fecha de Excel, como 15-06-2024 o como 2024-06-15."],
    ["4. Suba el archivo en Administración → Carga masiva. Primero se revisa sin escribir nada."],
    [],
    ["Columna", "¿Obligatoria?", "Ejemplo", "También se acepta"],
    ...def.columnas.map(x => [x.nombre,
      x.requerido === true ? "sí" : (x.requerido || "no"),
      String(x.ejemplo ?? ""), (x.alias || []).join(", ")]),
  ];
  const hojaInst = XLSX.utils.aoa_to_sheet(inst);
  hojaInst["!cols"] = [{ wch: 34 }, { wch: 14 }, { wch: 24 }, { wch: 60 }];
  XLSX.utils.book_append_sheet(libro, hojaInst, "Instrucciones");

  // Listas: los valores que el sistema acepta. Sin esto, la mitad de las filas
  // se rechaza por escribir "Plazo Fijo" donde va "plazo_fijo".
  const listas = [["Valores que acepta el sistema"], []];
  const poner = (titulo, valores) => {
    listas.push([titulo]);
    for (const v of valores) listas.push(["", v]);
    listas.push([]);
  };
  if (tipo === "trabajadores") {
    poner("Cargo", c.cargos);
    poner("Sexo", ["F", "M", "X"]);
    poner("Salud", ["fonasa", "isapre"]);
    poner("AFP", c.afps.map(a => a.nombre));
  }
  if (tipo === "contratos") {
    poner("Tipo de contrato", c.tipos_contrato);
    poner("Jornada", c.jornadas);
    poner("Gratificación", ["legal_25", "convencional", "sin"]);
    poner("Cargo", c.cargos);
  }
  if (tipo === "documentos") {
    listas.push(["Tipo de documento: use el código de la primera columna"], []);
    listas.push(["Código", "Nombre", "¿Vence?", "Base legal"]);
    for (const td of c.tipos_documento) {
      listas.push([td.codigo, td.nombre, td.vence ? `sí, ${td.meses_validez || "?"} meses` : "no",
                   td.base_legal || ""]);
    }
  }
  if (tipo === "ausencias") {
    poner("Tipo de ausencia", c.tipos_ausencia);
    poner("Estado", ["aprobada", "solicitada", "rechazada", "anulada"]);
  }
  const hojaListas = XLSX.utils.aoa_to_sheet(listas);
  hojaListas["!cols"] = [{ wch: 22 }, { wch: 42 }, { wch: 18 }, { wch: 70 }];
  XLSX.utils.book_append_sheet(libro, hojaListas, "Listas");

  XLSX.writeFile(libro, `plantilla ${tipo}.xlsx`);
}

async function cargarSheetJS() {
  await cargarScript(SHEETJS, "el lector de Excel");
  if (!window.XLSX) throw new Error("No se pudo cargar el lector de Excel.");
  return window.XLSX;
}

/** Lee el archivo, empareja los encabezados y pide la revisión al servidor. */
async function leerPlanilla(archivo) {
  if (!archivo) return;
  const m = $("#m-carga");
  decir(m, "Leyendo la planilla…");
  $("#nombre-archivo").textContent = archivo.name;

  const XLSX = await cargarSheetJS();
  const datos = new Uint8Array(await archivo.arrayBuffer());
  // cellDates: las celdas con formato de fecha vuelven como Date construida en
  // hora local, no como número de serie de Excel. Pasar el serial a fecha a
  // mano es de donde salen las fechas corridas en un día: el serial cuenta
  // días desde 1900 (con el error del 1900 bisiesto encima) y convertirlo
  // mete la zona horaria de quien convierte. SheetJS ya sabe qué día decía la
  // celda; `comoCelda` solo escribe ese día.
  const libro = XLSX.read(datos, { type: "array", cellDates: true });
  const hoja = libro.Sheets[libro.SheetNames.includes("Datos")
    ? "Datos" : libro.SheetNames[0]];
  if (!hoja) throw new Error("El archivo no tiene ninguna hoja con datos.");

  const matriz = XLSX.utils.sheet_to_json(hoja, { header: 1, raw: true, blankrows: false });
  if (matriz.length < 2) throw new Error("La hoja no tiene filas de datos bajo los encabezados.");

  const encabezados = matriz[0].map(x => String(x ?? "").trim());
  const def = RRHH.catalogos.plantillas[RRHH.carga.tipo];
  const { mapa, sobran, faltan } = emparejarLocal(def, encabezados);

  if (faltan.length) {
    throw new Error(`Faltan columnas obligatorias: ${faltan.join(", ")}. `
      + "Descargue la plantilla para ver cómo tienen que llamarse.");
  }

  const filas = [];
  for (let i = 1; i < matriz.length; i++) {
    const cruda = matriz[i];
    if (!cruda || cruda.every(v => v === null || v === undefined || v === "")) continue;
    const fila = {};
    encabezados.forEach((e, j) => {
      const campo = mapa[e];
      if (campo) fila[campo] = comoCelda(cruda[j]);
    });
    // La fila de ejemplo de la plantilla no es un dato.
    const esEjemplo = def.columnas.every(col => !col.ejemplo
      || String(fila[col.campo] ?? "") === String(col.ejemplo));
    if (esEjemplo) continue;
    filas.push({ fila, n: i + 1 });
  }
  if (!filas.length) throw new Error("No quedó ninguna fila con datos.");

  RRHH.carga.filas = filas;
  RRHH.carga.encabezados = encabezados;
  RRHH.carga.mapa = mapa;
  RRHH.carga.sobran = sobran;

  decir(m, `Revisando ${filas.length} fila${filas.length === 1 ? "" : "s"}…`);
  RRHH.carga.revision = await revisar(filas);
  decir(m, "");
  pintarRevision();
}

/**
 * El valor de una celda, listo para mandar.
 *
 * Lo único que necesita trato aparte son las fechas: SheetJS las entrega como
 * Date construida en la hora local, así que se escribe el día que muestra el
 * reloj local y no el UTC. `toISOString()` acá restaría un día.
 */
function comoCelda(v) {
  if (v === undefined || v === "") return null;
  if (v instanceof Date) {
    const p = n => String(n).padStart(2, "0");
    return `${v.getFullYear()}-${p(v.getMonth() + 1)}-${p(v.getDate())}`;
  }
  return v ?? null;
}

function emparejarLocal(def, encabezados) {
  const limpiar = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "")
    .toLowerCase().replace(/[^a-z0-9]/g, "");
  const porAlias = new Map();
  for (const col of def.columnas) {
    porAlias.set(limpiar(col.nombre), col.campo);
    porAlias.set(limpiar(col.campo), col.campo);
    for (const a of col.alias || []) porAlias.set(limpiar(a), col.campo);
  }
  const mapa = {}, sobran = [];
  for (const e of encabezados) {
    const campo = porAlias.get(limpiar(e));
    if (campo && !Object.values(mapa).includes(campo)) mapa[e] = campo;
    else if (!campo && e) sobran.push(e);
  }
  const faltan = def.columnas
    .filter(col => col.requerido === true && !Object.values(mapa).includes(col.campo))
    .map(col => col.nombre);
  return { mapa, sobran, faltan };
}

/** Revisión en seco. Va en tandas porque el servidor tiene tope por llamada. */
async function revisar(filas) {
  const POR_VEZ = 200;
  const resultados = [];
  let extra = {};
  for (let i = 0; i < filas.length; i += POR_VEZ) {
    const tanda = filas.slice(i, i + POR_VEZ);
    const r = await pedir("/rrhh/carga", { method: "POST", body: JSON.stringify({
      tipo: RRHH.carga.tipo, confirmar: false,
      filas: tanda.map(x => x.fila), desde_fila: tanda[0].n }) });
    resultados.push(...r.resultados);
    extra = { ...extra, ...r };
  }
  return { resultados, resumen: {
    total: resultados.length,
    nuevos: resultados.filter(x => x.accion === "crear").length,
    actualiza: resultados.filter(x => x.accion === "actualizar").length,
    errores: resultados.filter(x => x.estado === "error").length,
  }, instalaciones_nuevas: extra.instalaciones_nuevas, nota_instalaciones: extra.nota_instalaciones };
}

function pintarRevision() {
  const g = RRHH.carga;
  const rev = g.revision;
  const r = rev.resumen;
  const esEscritura = x => x.accion === "crear" || x.accion === "actualizar";
  const buenas = rev.resultados.filter(x => x.estado !== "error" && esEscritura(x));
  const conAvisos = rev.resultados.filter(x => x.avisos?.length);

  const SELLO = { ok: "e-cerrado", ojo: "e-solicitar_oc", error: "e-rechazada",
    sin_cambios: "e-borrador" };
  const ROT = { ok: "Lista", ojo: "Con aviso", error: "No se carga", sin_cambios: "Sin cambios" };

  $("#resultado-carga").innerHTML = `
    ${r.errores ? aviso("ojo", `${r.errores} fila${r.errores > 1 ? "s" : ""} no se va${r.errores > 1 ? "n" : ""} a cargar`,
      "Las demás sí. Abajo está el motivo de cada una, con el número de fila de su planilla: "
      + "corrija, vuelva a subir el archivo y las repetidas se actualizan en vez de duplicarse.") : ""}
    ${rev.nota_instalaciones ? aviso("ojo",
      `${rev.instalaciones_nuevas.length} instalación${rev.instalaciones_nuevas.length > 1 ? "es" : ""} no está${rev.instalaciones_nuevas.length > 1 ? "n" : ""} en el catálogo`,
      rev.instalaciones_nuevas.join(", ") + ". " + rev.nota_instalaciones) : ""}
    ${g.sobran?.length ? aviso("ojo", "Columnas que no se reconocieron",
      g.sobran.join(", ") + ". Se ignoran; lo demás se carga igual.") : ""}

    <dl class="resumen">
      <div class="ficha ficha--plata"><dt>Filas leídas</dt><dd class="num">${r.total}</dd>
        <small>de la planilla ${esc(g.tipo)}</small></div>
      <div class="ficha"><dt>Se crean</dt><dd class="num">${r.nuevos}</dd><small>registros nuevos</small></div>
      <div class="ficha"><dt>Se actualizan</dt><dd class="num">${r.actualiza}</dd>
        <small>ya existían, se completan</small></div>
      <div class="ficha ${r.errores ? "ficha--ojo" : ""}"><dt>No se cargan</dt>
        <dd class="num">${r.errores}</dd><small>con el motivo escrito</small></div>
    </dl>

    <section class="caja">
      <div class="caja__tit"><h2>Qué va a pasar con cada fila</h2>
        <span class="nota">Todavía no se ha escrito nada</span></div>
      <div class="desliza"><table>
        <thead><tr><th>Fila</th><th>Persona</th><th>Acción</th><th>Detalle</th><th>Estado</th></tr></thead>
        <tbody>
        ${rev.resultados.map(x => `<tr${x.estado === "error" ? ' class="fila--atrasado"' : ""}>
          <td class="num nowrap">${x.n}</td>
          <td>${x.nombre ? `<b>${esc(x.nombre)}</b>` : ""}
            ${x.rut ? `<span class="sub">${esc(x.rut)}</span>` : ""}</td>
          <td class="nowrap">${x.accion === "crear" ? "Crear"
            : x.accion === "actualizar" ? "Actualizar" : "—"}</td>
          <td>${esc(x.detalle || x.motivo || "")}
            ${(x.avisos || []).map(a => `<span class="sub" style="color:var(--ambar)">${esc(a)}</span>`).join("")}</td>
          <td><span class="sello ${SELLO[x.estado] || "e-borrador"}">${ROT[x.estado] || x.estado}</span></td>
        </tr>`).join("")}
      </tbody></table></div>
      <div class="pie-form">
        <button class="bt" type="button" id="bt-confirmar" ${buenas.length ? "" : "disabled"}>
          Cargar ${buenas.length} fila${buenas.length === 1 ? "" : "s"}</button>
        <button class="bt bt--fino" type="button" id="bt-cancelar">Descartar</button>
        <span class="sub" style="margin:0">${conAvisos.length
          ? `${conAvisos.length} con aviso: se cargan igual, pero revíselas.`
          : "Esto sí escribe en el sistema."}</span>
        <span class="mensaje" id="m-confirmar"></span>
      </div>
      <div id="avance-carga"></div>
    </section>`;

  $("#bt-cancelar").onclick = () => {
    RRHH.carga = { tipo: g.tipo, filas: null, encabezados: null, mapa: null,
                   revision: null, avance: null };
    pintarCarga();
  };
  $("#bt-confirmar").onclick = confirmarCarga;

  // La revisión queda debajo de la tabla de columnas, que es larga: sin esto
  // se sube la planilla y en pantalla no pasa nada visible.
  $("#resultado-carga").scrollIntoView({ block: "start", behavior: "smooth" });
}

async function confirmarCarga() {
  const g = RRHH.carga;
  const buenos = new Set(g.revision.resultados
    .filter(x => x.estado !== "error" && (x.accion === "crear" || x.accion === "actualizar"))
    .map(x => x.n));
  const filas = g.filas.filter(x => buenos.has(x.n));
  if (!filas.length) return;

  if (!confirm(`¿Cargar ${filas.length} fila${filas.length === 1 ? "" : "s"}?\n\n`
    + "Esto sí escribe en el sistema. Lo que quede mal se corrige volviendo a subir la "
    + "planilla: las personas que ya estén se actualizan, no se duplican.")) return;

  const bt = $("#bt-confirmar"), m = $("#m-confirmar"), avance = $("#avance-carga");
  bt.disabled = true;
  $("#bt-cancelar").disabled = true;

  const porTanda = RRHH.catalogos.por_tanda || 25;
  const hechos = [];
  try {
    for (let i = 0; i < filas.length; i += porTanda) {
      const tanda = filas.slice(i, i + porTanda);
      decir(m, `Cargando ${Math.min(i + tanda.length, filas.length)} de ${filas.length}…`);
      const r = await pedir("/rrhh/carga", { method: "POST", body: JSON.stringify({
        tipo: g.tipo, confirmar: true,
        filas: tanda.map(x => x.fila), desde_fila: tanda[0].n }) });
      hechos.push(...r.resultados);
    }
  } catch (e) {
    // Lo que alcanzó a entrar, entró: la carga no se deshace sola. Decirlo es
    // lo que evita que alguien vuelva a subir todo y duplique la mitad.
    avance.innerHTML = aviso("mal", "La carga se cortó a mitad de camino",
      `${hechos.length} de ${filas.length} filas alcanzaron a entrar. Motivo: ${e.message}. `
      + "Vuelva a subir la misma planilla: lo ya cargado se reconoce por el RUT y se actualiza, "
      + "no se duplica.");
    decir(m, "", "error");
    $("#bt-cancelar").disabled = false;
    return;
  }

  const errores = hechos.filter(x => x.estado === "error");
  RRHH.panel = null; RRHH.personal = null;
  decir(m, "");
  avance.innerHTML = aviso(errores.length ? "ojo" : "bien",
    `${hechos.length - errores.length} de ${filas.length} filas cargadas`,
    errores.length
      ? `${errores.length} fallaron al escribir: ` + errores.map(x => `fila ${x.n} (${x.motivo})`).join(", ")
      : "Ya están en el sistema. Revise el panel de RRHH: puede que aparezcan vencimientos nuevos.")
    + `<p style="margin-top:12px"><button class="bt" type="button" id="bt-ir-panel">Ir al panel de RRHH</button>
       <button class="bt bt--fino" type="button" id="bt-otra">Cargar otra planilla</button></p>`;
  $("#bt-ir-panel").onclick = () => ir("rrhh");
  $("#bt-otra").onclick = () => {
    RRHH.carga = { tipo: g.tipo, filas: null, encabezados: null, mapa: null,
                   revision: null, avance: null };
    pintarCarga();
  };
}

const VISTAS = {
  panel: { rotulo: "Panel", pintar: pintarPanel, modulo: "facturacion" },
  calendario: { rotulo: "Calendario", pintar: pintarCalendario, modulo: "facturacion" },
  contactos: { rotulo: "Contactos web", pintar: pintarContactos, modulo: "facturacion" },
  cotizaciones: { rotulo: "Cotizaciones", pintar: pintarCotizaciones, modulo: "cotizaciones" },
  servicio: { rotulo: "Servicios", pintar: pintarServicios, modulo: "facturacion" },
  instalaciones: { rotulo: "Instalaciones", pintar: pintarInstalaciones, modulo: "facturacion" },
  extra: { rotulo: "Registrar extra", pintar: pintarNuevoExtra, modulo: "facturacion" },
  trabajadores: { rotulo: "Trabajadores", pintar: pintarTrabajadores, modulo: "personal" },
  libro: { rotulo: "Asistencia", pintar: pintarLibro, modulo: "personal" },
  bitacora: { rotulo: "Bitácora", pintar: pintarBitacora, modulo: "facturacion" },
  rrhh: { rotulo: "RRHH", pintar: pintarRrhh, modulo: "rrhh" },
  personal: { rotulo: "Personal", pintar: pintarPersonal, modulo: "rrhh" },
  sueldos: { rotulo: "Sueldos", pintar: pintarSueldos, modulo: "rrhh" },
  carga: { rotulo: "Carga masiva", pintar: pintarCarga, modulo: "rrhh" },
};

// Cada quien ve solo las pestañas de los módulos a los que tiene acceso.
const vistasPermitidas = () =>
  Object.entries(VISTAS).filter(([, v]) => !v.modulo || estado.usuario.permisos.includes(v.modulo));

function ir(vista) {
  // Cambiar de sección descarta lo marcado: las acciones de la barra no
  // aplican a lo que se está mirando ahora y quedaría apuntando a otra cosa.
  if (vista !== estado.vista) {
    seleccion.tipo = null;
    seleccion.ids.clear();
    seleccion.op = 0;
    seleccion.aviso = null;
    pintarBarraSel();
  }
  estado.vista = vista;
  // Sin esto, entrar a una sección nueva desde el final de la anterior deja la
  // pantalla a media altura y parece que no hubiera pasado nada.
  window.scrollTo({ top: 0 });
  document.querySelectorAll("#pestanas button").forEach(b =>
    b.setAttribute("aria-current", String(b.dataset.vista === vista)));
  // Varias vistas son asíncronas: si fallan y nadie atrapa el error, la
  // pantalla se queda en blanco sin decir por qué. Mejor mostrar el motivo.
  Promise.resolve()
    .then(() => VISTAS[vista].pintar())
    .catch(e => {
      $("#app").innerHTML = aviso("mal", "No se pudo cargar esta sección", e.message);
    });
}

async function recargar({ repintar = true } = {}) {
  estado.panel = await pedir("/panel");
  // Traer los datos no servía de nada si la pantalla seguía mostrando los viejos.
  if (repintar && estado.vista === "panel") pintarPanel();
}

function pintarIngreso(mensaje) {
  document.body.innerHTML = `<div class="puerta"><div class="puerta__caja">
    <div class="puerta__tit"><img src="logo.png" alt="">
      <span><b>Administración</b><span>Seguridad Garridos</span></span></div>
    <form id="f-entrar">
      <label class="campo"><span>Usuario</span>
        <input name="usuario" autocomplete="username" autocapitalize="none"
               spellcheck="false" required autofocus></label>
      <label class="campo"><span>Contraseña</span>
        <input name="clave" type="password" autocomplete="current-password" required></label>
      <button class="bt" type="submit">Entrar</button>
      <span class="mensaje"></span>
    </form>
  </div></div>`;
  const f = document.getElementById("f-entrar");
  if (mensaje) { const m = f.querySelector(".mensaje"); decir(m, mensaje, "error"); }
  f.onsubmit = async ev => {
    ev.preventDefault();
    const m = f.querySelector(".mensaje"), bt = f.querySelector("button");
    decir(m, "Entrando…"); bt.disabled = true;
    try {
      await pedir("/sesion", { method: "POST", body: JSON.stringify(Object.fromEntries(new FormData(f))) });
      location.reload();
    } catch (e) {
      decir(m, e.message, "error");
      bt.disabled = false;
      f.clave.value = ""; f.clave.focus();
    }
  };
}

function pintarCambioClave(usuario) {
  document.body.innerHTML = `<div class="puerta"><div class="puerta__caja">
    <div class="puerta__tit"><img src="logo.png" alt="">
      <span><b>Cambie su contraseña</b><span>${esc(usuario.nombre)}</span></span></div>
    <form id="f-clave">
      <label class="campo"><span>Contraseña actual</span>
        <input name="actual" type="password" autocomplete="current-password" required autofocus></label>
      <label class="campo"><span>Contraseña nueva</span>
        <input name="nueva" type="password" autocomplete="new-password" required></label>
      <label class="campo"><span>Repita la nueva</span>
        <input name="repetir" type="password" autocomplete="new-password" required></label>
      <button class="bt" type="submit">Guardar y entrar</button>
      <span class="mensaje"></span>
    </form>
    <div class="puerta__aviso" style="background:var(--ambar-suave);color:#7A4A00">
      Al menos 8 caracteres, mezclando letras y números. Es suya: nadie más,
      yo incluido, puede verla después de guardada.
    </div>
  </div></div>`;
  const f = document.getElementById("f-clave");
  f.onsubmit = async ev => {
    ev.preventDefault();
    const m = f.querySelector(".mensaje"), bt = f.querySelector("button");
    if (f.nueva.value !== f.repetir.value) {
      decir(m, "Las dos contraseñas nuevas no coinciden", "error");
      f.repetir.focus(); return;
    }
    decir(m, "Guardando…"); bt.disabled = true;
    try {
      await pedir("/clave", { method: "POST",
        body: JSON.stringify({ actual: f.actual.value, nueva: f.nueva.value }) });
      location.reload();
    } catch (e) { decir(m, e.message, "error"); bt.disabled = false; }
  };
}

async function arrancar() {
  let usuario, quien_borra;
  try {
    ({ usuario, quien_borra } = await pedir("/yo"));
  } catch (e) {
    return pintarIngreso(e.message.includes("Sin sesión") ? "" : e.message);
  }
  if (usuario.debe_cambiar_clave) return pintarCambioClave(usuario);

  try {
    estado.usuario = usuario;
    estado.quienBorra = quien_borra || [];
    $("#quien").innerHTML =
      `<b>${esc(usuario.nombre)}</b>${esc(usuario.usuario)} · ${esc(usuario.rol)}`;
    $("#quien").insertAdjacentHTML("afterend",
      `<button class="bt bt--fino bt--chico" id="salir" style="margin-left:12px">Cerrar sesión</button>`);
    $("#salir").onclick = async () => {
      await pedir("/sesion", { method: "DELETE" }).catch(() => {});
      location.reload();
    };
    const permitidas = vistasPermitidas();
    if (!permitidas.length) {
      $("#app").innerHTML = aviso("ojo", "Su cuenta todavía no tiene módulos asignados",
        "Su rol es «" + esc(usuario.rol) + "». El módulo correspondiente aún no está construido.");
      return;
    }
    $("#pestanas").innerHTML = permitidas
      .map(([k, v]) => `<button data-vista="${k}">${v.rotulo}</button>`).join("");
    document.querySelectorAll("#pestanas button").forEach(b => { b.onclick = () => ir(b.dataset.vista); });

    // Cada cosa se pide solo si la cuenta puede pedirla. Una cuenta de solo
    // RRHH no tiene acceso a /catalogos, y pedirlo igual la dejaba sin entrar.
    if (usuario.permisos.includes("facturacion") || usuario.permisos.includes("cotizaciones")) {
      estado.catalogos = await pedir("/catalogos");
    }
    if (usuario.permisos.includes("facturacion")) estado.panel = await pedir("/panel");
    ir(permitidas[0][0]);
  } catch (e) {
    $("#app").innerHTML = aviso("mal", "No se pudo entrar", e.message);
  }
}

conectarApariencia();
arrancar();
</script>

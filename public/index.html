function pintarNuevoExtra() {
  const { tarifas, instalaciones } = estado.catalogos;
  $("#app").innerHTML = `
    ${aviso("ojo", "Registre el extra el mismo día que ocurre",
      "El periodo lo decide la fecha del servicio. Si esa fecha no cae en ningún periodo —porque el parque no tiene servicio permanente— queda en el panel para cobrarlo aparte, y no se pierde.")}
    <section class="caja" style="max-width:860px">
      <div class="caja__tit"><h2>Registrar servicio extraordinario</h2>
        <span class="nota">Si el parque no existe todavía, escríbalo y se crea solo</span></div>
      <form id="f-extra">
        <div class="rejilla">
          <label class="campo" style="grid-column:1/-1"><span>Instalación o parque</span>
            <input name="instalacion" required list="lista-inst" autocomplete="off" id="in-inst"
                   placeholder="Ej: PMGD Los Maitenes"></label>
          <datalist id="lista-inst">
            ${instalaciones.map(i => `<option value="${esc(i.nombre)}">${esc(i.cliente)}</option>`).join("")}
          </datalist>
          <label class="campo"><span>Cliente</span>
            <input name="cliente" list="lista-clientes" autocomplete="off" id="in-cliente"
                   placeholder="A quién se le factura"></label>
          <datalist id="lista-clientes">
            ${[...new Set(instalaciones.map(i => i.cliente))].map(c => `<option value="${esc(c)}">`).join("")}
          </datalist>
          <label class="campo"><span>Fecha del servicio</span>
            <input name="fecha" type="date" required value="${hoyISO()}" id="in-fecha"></label>

          <label class="campo" style="grid-column:1/-1"><span>Qué se hizo</span>
            <input name="item" required list="lista-tarifas" autocomplete="off" id="in-item"
                   maxlength="200" placeholder="Escríbalo o elíjalo del tarifario"></label>
          <datalist id="lista-tarifas">
            ${tarifas.map(t => `<option value="${esc(t.nombre)}">${clp(t.precio)}${
              t.unidad ? " por " + esc(t.unidad) : ""}</option>`).join("")}
          </datalist>
          <label class="campo"><span>Precio unitario</span>
            <input name="precio_unitario" type="number" min="0" step="1" id="in-precio" placeholder="0"></label>
          <label class="campo"><span>Cantidad</span>
            <input name="cantidad" type="number" min="0.5" step="0.5" value="1" required id="in-cant"></label>
          <label class="campo" style="grid-column:1/-1"><span>Detalle</span>
            <input name="detalle" placeholder="Ej: 3 horas diarias sábado 30 y domingo 31"></label>
        </div>
        <div class="pie-form">
          <button class="bt" type="submit">Registrar</button>
          <span class="mensaje"></span>
          <span style="margin-left:auto;font-weight:600;text-align:right" id="calculo">Neto: —</span>
        </div>
      </form>
    </section>`;

  const igual = (a, b) => (a || "").trim().toLowerCase() === (b || "").trim().toLowerCase();
  /** La tarifa cuyo nombre calza con lo escrito, si es que alguna calza. */
  const tarifaEscrita = () =>
    tarifas.find(t => igual(t.nombre, $("#in-item").value)) || null;

  const recalcular = () => {
    const precio = Number($("#in-precio").value || 0);
    const cant = Number($("#in-cant").value || 0);
    const neto = Math.round(precio * cant);
    const t = tarifaEscrita();
    const ajustado = t && precio !== Number(t.precio);
    $("#calculo").innerHTML = neto
      ? `Neto: ${clp(neto)} · IVA: ${clp(neto * 0.19)} · Total: ${clp(neto * 1.19)}`
        + (ajustado ? `<span class="sub" style="color:var(--ambar)">precio ajustado · el de lista es ${clp(t.precio)}</span>` : "")
        + (!t ? `<span class="sub" style="color:var(--cian)">ítem fuera del tarifario</span>` : "")
      : "Neto: —";
  };

  // Al escribir o elegir un ítem del tarifario se propone su precio, y queda
  // editable: hay servicios que se negocian caso a caso.
  $("#in-item").oninput = () => {
    const t = tarifaEscrita();
    if (t) $("#in-precio").value = t.precio;
    $("#in-precio").placeholder = t?.unidad ? `Por ${t.unidad}` : "0";
    recalcular();
  };
  // Al elegir un parque conocido se completa su cliente, para no retipearlo.
  $("#in-inst").oninput = () => {
    const i = instalaciones.find(x => igual(x.nombre, $("#in-inst").value));
    if (i && !$("#in-cliente").value.trim()) $("#in-cliente").value = i.cliente;
  };
  $("#in-precio").oninput = recalcular;
  $("#in-cant").oninput = recalcular;

  $("#f-extra").onsubmit = async ev => {
    ev.preventDefault();
    const f = ev.target, msj = f.querySelector(".mensaje");
    decir(msj, "Guardando…");
    try {
      const r = await pedir("/extras", { method: "POST", body: JSON.stringify(Object.fromEntries(new FormData(f))) });
      // Dónde quedó importa tanto como el monto: un extra sin periodo es el que
      // se escapa sin facturar, y hay que saberlo ahora, no en un mes.
      decir(msj, `Registrado · ${clp(r.monto_neto)} neto`
        + (r.periodo ? ` · va en el periodo N°${r.periodo.numero}` : ""),
        r.nota ? "" : "ok");
      if (r.nota) recado(r.nota, "mal");
      f.reset();
      $("#in-fecha").value = hoyISO();
      $("#in-precio").placeholder = "0";
      recalcular();
      estado.catalogos = await pedir("/catalogos");
      await recargar({ repintar: false });
    } catch (e) { decir(msj, e.message, "error"); }
  };
}

// ------------------------------------------------------------- calendario
const MESES = ["enero","febrero","marzo","abril","mayo","junio",
               "julio","agosto","septiembre","octubre","noviembre","diciembre"];

let mesVisto = null;   // "YYYY-MM"
let diaAbierto = null; // "YYYY-MM-DD"

const mesVecino = (mes, paso) => {
  const [a, m] = mes.split("-").map(Number);
  const d = new Date(Date.UTC(a, m - 1 + paso, 1));
  return d.toISOString().slice(0, 7);
};

/**
 * Los años que vale la pena ofrecer: desde el primer dato cargado hasta el
 * último, más el que viene. Una lista de cien años para elegir uno es tan
 * latoso como ir mes por mes con la flecha.
 */
function aniosDe(ag) {
  const hasta = ag.anio_hasta || Number(ag.hoy.slice(0, 4)) + 1;
  const desde = Math.min(ag.anio_desde || hasta, hasta);
  const lista = [];
  for (let a = desde; a <= hasta; a++) lista.push(a);
  return lista;
}

/**
 * El calendario del mes. Existe porque el panel contesta "cuánto falta por
 * cobrar" pero no "qué pasa esta semana": cuándo cierra un periodo y hay que
 * pedir la OC, y qué días hubo servicios extra.
 */
async function pintarCalendario() {
  mesVisto = mesVisto || hoyISO().slice(0, 7);
  $("#app").innerHTML = `<p class="cargando">Cargando…</p>`;
  const ag = await pedir(`/agenda?mes=${mesVisto}`);

  // Todo lo del mes, indexado por día: así cada casilla se arma de una pasada.
  const porDia = new Map();
  const enDia = (f) => {
    if (!porDia.has(f)) porDia.set(f, []);
    return porDia.get(f);
  };
  for (const c of ag.ciclos) {
    enDia(c.desde).push({ tipo: "inicio", ciclo: c,
      texto: `Parte N°${c.numero} · ${c.instalacion}` });
    enDia(c.hasta).push({ tipo: "cierre", ciclo: c,
      texto: `Cierra N°${c.numero} · ${c.instalacion}` });
    if (c.factura_fecha) {
      enDia(c.factura_fecha).push({ tipo: "factura", ciclo: c,
        texto: `Factura ${c.factura_folio} · ${c.instalacion}` });
    }
  }
  for (const e of ag.extras) {
    enDia(e.fecha).push({ tipo: "extra", extra: e, suelto: !e.ciclo_id,
      texto: `${clp(e.monto_neto)} · ${e.item}` });
  }

  const [anio, mes] = mesVisto.split("-").map(Number);
  const primero = new Date(Date.UTC(anio, mes - 1, 1));
  const dias = new Date(Date.UTC(anio, mes, 0)).getUTCDate();
  // getUTCDay() da 0 para domingo; acá la semana parte el lunes.
  const corrimiento = (primero.getUTCDay() + 6) % 7;

  const netoExtras = ag.extras.reduce((t, e) => t + Number(e.monto_neto || 0), 0);
  const cierran = ag.ciclos.filter(c => c.hasta >= ag.primer_dia && c.hasta <= ag.ultimo_dia);

  let casillas = "";
  for (let i = 0; i < corrimiento; i++) casillas += `<div class="cal__dia cal__dia--fuera"></div>`;
  for (let d = 1; d <= dias; d++) {
    const iso = `${mesVisto}-${String(d).padStart(2, "0")}`;
    const cosas = porDia.get(iso) || [];
    casillas += `<div class="cal__dia${iso === ag.hoy ? " cal__dia--hoy" : ""}">
      <span class="cal__n">${d}</span>
      <div class="cal__chips">
        ${cosas.slice(0, 3).map(x =>
          `<button class="chip chip--${x.tipo}${x.suelto ? " suelto" : ""}" data-dia="${iso}"
                   title="${esc(x.texto)}"><span>${esc(x.texto)}</span></button>`).join("")}
        ${cosas.length > 3
          ? `<button class="chip chip--mas" data-dia="${iso}" title="${cosas.length - 3} más ese día"><span>+${cosas.length - 3} más</span></button>`
          : ""}
      </div>
    </div>`;
  }
  const resto = (7 - ((corrimiento + dias) % 7)) % 7;
  for (let i = 0; i < resto; i++) casillas += `<div class="cal__dia cal__dia--fuera"></div>`;

  $("#app").innerHTML = `
    <div class="mes">
      <button class="bt bt--fino" id="mes-antes" aria-label="Mes anterior">←</button>
      <button class="bt bt--fino" id="mes-despues" aria-label="Mes siguiente">→</button>
      <div class="salto">
        <select id="salto-mes" aria-label="Mes">
          ${MESES.map((m, i) =>
            `<option value="${i + 1}"${i + 1 === mes ? " selected" : ""}>${m}</option>`).join("")}
        </select>
        <select id="salto-anio" aria-label="Año">
          ${aniosDe(ag).map(a =>
            `<option value="${a}"${a === anio ? " selected" : ""}>${a}</option>`).join("")}
        </select>
      </div>
      <button class="bt bt--fino" id="mes-hoy">Hoy</button>
      <span class="nota" style="margin-left:auto;color:var(--texto-2);font-size:.85rem">
        ${ag.ciclos.length} periodo${ag.ciclos.length === 1 ? "" : "s"} corriendo${
          cierran.length ? ` · ${cierran.length} cierra${cierran.length === 1 ? "" : "n"} este mes` : ""}${
          ag.extras.length ? ` · ${ag.extras.length} extra${ag.extras.length === 1 ? "" : "s"} por ${clp(netoExtras)}` : ""}
      </span>
    </div>

    <div class="cal">
      ${["lun","mar","mié","jue","vie","sáb","dom"].map(d =>
        `<div class="cal__dia-sem">${d}</div>`).join("")}
      ${casillas}
    </div>

    <div class="leyenda">
      <span><i style="background:var(--gris)"></i>Parte un periodo</span>
      <span><i style="background:var(--ambar)"></i>Cierra un periodo · pedir la OC</span>
      <span><i style="background:var(--cian)"></i>Servicio extra asignado</span>
      <span><i style="background:var(--rojo)"></i>Servicio extra sin asignar</span>
      <span><i style="background:var(--verde)"></i>Factura emitida</span>
    </div>

    <div id="detalle-dia" style="margin-top:20px"></div>`;

  const abrir = (iso) => {
    diaAbierto = iso;
    const cosas = porDia.get(iso) || [];
    $("#detalle-dia").innerHTML = `
      <section class="caja">
        <div class="caja__tit"><h2>${fecha(iso)}</h2>
          <span class="nota">${cosas.length} cosa${cosas.length === 1 ? "" : "s"} ese día</span></div>
        ${cosas.length ? `<div class="desliza"><table style="min-width:620px"><tbody>
          ${cosas.map(x => `<tr>
            <td style="width:190px"><span class="sello ${
              x.tipo === "cierre" ? "e-solicitar_oc"
              : x.tipo === "factura" ? "e-cerrado"
              : x.tipo === "extra" ? (x.suelto ? "p-por_cobrar atrasado" : "e-pendiente_facturacion")
              : "e-en_curso"}">${
              x.tipo === "inicio" ? "Parte periodo"
              : x.tipo === "cierre" ? "Cierra periodo"
              : x.tipo === "factura" ? "Factura"
              : x.suelto ? "Extra sin asignar" : "Extra"}</span></td>
            <td>${x.tipo === "extra"
              ? `<b>${esc(x.extra.item)}</b><span class="sub">${esc(x.extra.instalacion)}${
                  x.extra.detalle ? " · " + esc(x.extra.detalle) : ""}</span>`
              : `<b>${esc(x.ciclo.instalacion)}</b><span class="sub">${esc(x.ciclo.servicio)} · N°${x.ciclo.numero} · ${fecha(x.ciclo.desde)} → ${fecha(x.ciclo.hasta)}</span>`}</td>
            <td class="num nowrap"><b>${x.tipo === "extra"
              ? clp(x.extra.monto_neto) : clp(x.ciclo.total_neto)}</b>
              <span class="sub">${x.tipo === "extra"
                ? `${x.extra.cantidad} × ${clp(x.extra.precio_unitario)}` : "neto del periodo"}</span></td>
          </tr>`).join("")}
        </tbody></table></div>`
        : `<p class="vacio">Ese día no tiene nada registrado.</p>`}
      </section>`;
  };

  document.querySelectorAll("[data-dia]").forEach(b => {
    b.onclick = () => abrir(b.dataset.dia);
  });
  if (diaAbierto && diaAbierto.startsWith(mesVisto)) abrir(diaAbierto);

  const ir2 = (m) => { mesVisto = m; diaAbierto = null; pintarCalendario(); };
  $("#mes-antes").onclick = () => ir2(mesVecino(mesVisto, -1));
  $("#mes-despues").onclick = () => ir2(mesVecino(mesVisto, 1));
  $("#mes-hoy").onclick = () => ir2(ag.hoy.slice(0, 7));

  const saltar = () => ir2(`${$("#salto-anio").value}-${
    String($("#salto-mes").value).padStart(2, "0")}`);
  $("#salto-mes").onchange = saltar;
  $("#salto-anio").onchange = saltar;
}

const CONDICIONES_POR_DEFECTO =
  "Valores netos, no incluyen IVA. Facturación mensual contra orden de compra. " +
  "El servicio considera personal acreditado, uniformado y con los elementos de " +
  "protección que corresponden al puesto.";

let borrador = null;

function cotizacionNueva() {
  return {
    cliente_nombre: "", cliente_rut: "", cliente_contacto: "", cliente_email: "",
    instalacion: "", validez_dias: 30,
    condiciones: CONDICIONES_POR_DEFECTO, observaciones: "",
    items: [{ descripcion: "", unidad: "", cantidad: 1, precio_unitario: 0 }],
  };
}

/** La misma cuenta que hace el servidor en revisarItems(). Estaba escrita tres
 *  veces en esta vista —la celda, el refresco al teclear y la suma—, que es
 *  pedir que algún día las tres dejen de decir lo mismo. */
const subtotalDe = i =>
  Math.round((Number(i.precio_unitario) || 0) * (Number(i.cantidad) || 0));

const sumasDe = items => {
  const neto = items.reduce((t, i) => t + subtotalDe(i), 0);
  const iva = Math.round(neto * 0.19);
  return { neto, iva, total: neto + iva };
};

function pintarLineas() {
  const c = borrador;

    <td class="col-sub num" data-rotulo="Subtotal"><b>${clp(subtotalDe(i))}</b></td>
    <td class="col-x"><button class="quitar" data-quitar="${n}" title="Quitar línea">×</button></td>
  </tr>`).join("");

  $("#lineas").oninput = ev => {
    const el = ev.target;
    if (!el.dataset.campo) return;
    const v = el.dataset.campo === "descripcion" || el.dataset.campo === "unidad"
      ? el.value : Number(el.value);
    c.items[el.dataset.i][el.dataset.campo] = v;
    const fila = el.closest("tr");
    fila.querySelector(".col-sub b").textContent = clp(subtotalDe(c.items[el.dataset.i]));
    pintarSumas();
  };
  document.querySelectorAll("[data-quitar]").forEach(b => {
    b.onclick = () => {
      if (c.items.length === 1) return;
      c.items.splice(Number(b.dataset.quitar), 1);
      pintarLineas();
    };
  });
  pintarSumas();
}

async function guardarCotizacion() {
  const c = borrador, msj = $(".pie-form .mensaje");
  c.cliente_nombre = $("#c-nombre").value.trim();
  c.cliente_rut = $("#c-rut").value.trim();
  c.cliente_contacto = $("#c-contacto").value.trim();
  c.cliente_email = $("#c-email").value.trim();
  c.instalacion = $("#c-inst").value.trim();
  c.validez_dias = Number($("#c-validez").value);
  c.condiciones = $("#c-cond").value.trim();
  c.observaciones = $("#c-obs").value.trim();
  if ($("#c-estado")) c.estado = $("#c-estado").value;

  decir(msj, "Guardando…");
  try {
    if (c.id) {
      await pedir(`/cotizaciones/${c.id}`, { method: "PATCH", body: JSON.stringify(c) });
      // Se vuelve a pedir lo guardado, igual que al crear. El PDF imprime
      // item.subtotal y los totales de la cabecera, que los calcula el
      // servidor: una línea agregada en esta pasada todavía no trae subtotal,
      // y sin este paso el PDF la imprimía en $0 con el neto y el total viejos.
      const { cotizacion } = await pedir(`/cotizaciones/${c.id}`);
      borrador = cotizacion;
      pintarEditor();
      decir($(".pie-form .mensaje"), "Guardada", "ok");
    } else {
      const r = await pedir("/cotizaciones", { method: "POST", body: JSON.stringify(c) });
      const { cotizacion } = await pedir(`/cotizaciones/${r.cotizacion.id}`);
      borrador = cotizacion;
      pintarEditor();
      decir($(".pie-form .mensaje"), `Creada con el N° ${cotizacion.numero}`, "ok");
    }
  } catch (e) { decir(msj, e.message, "error"); }
}

// ------------------------------------------------------------- PDF
const JSPDF = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";

function cargarScript(url, queEs = "el generador de PDF") {
  return new Promise((listo, falla) => {
    if (document.querySelector(`script[src="${url}"]`)) return listo();
    const s = document.createElement("script");
    s.src = url;
    s.onload = listo;
    s.onerror = () => falla(new Error(`No se pudo cargar ${queEs}. ¿Hay internet?`));
    document.head.appendChild(s);
  });
}

/** Carga el logo reducido. A tamaño completo son 140 KB que se incrustan en
 *  cada PDF y lo dejan en más de un mega; a 150 px se ve igual de nítido en
 *  los 20 mm que ocupa en la hoja. */
const cargarLogo = (src, lado = 150) => new Promise(listo => {
  const i = new Image();
  i.onload = () => {
    const c = document.createElement("canvas");
    c.width = c.height = lado;
    c.getContext("2d").drawImage(i, 0, 0, lado, lado);
    listo(c.toDataURL("image/png"));
  };
  i.onerror = () => listo(null);     // sin logo, el PDF se arma igual
  i.src = src;
});

async function generarPDF(c) {
  const msj = $(".pie-form .mensaje");

  // El PDF imprime lo que guardó el servidor, no lo que hay en pantalla: es el
  // documento que se le manda al cliente y tiene que decir lo mismo que la
  // cotización. Si todavía no se guarda, los montos no calzan y se avisa en
  // vez de emitir un PDF con otras cifras.
  if (sumasDe(c.items).total !== c.total) {
    return decir(msj, "Hay cambios sin guardar: guarde antes de descargar el PDF.", "error");
  }

  decir(msj, "Armando el PDF…");
  try {
    await cargarScript(JSPDF);
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "mm", format: "a4" });
    const A = 210, M = 16;
    const der = A - M;
    const gris = [110, 110, 134], tinta = [19, 0, 82];
    let y = 16;

    const logo = await cargarLogo("logo.png");
    if (logo) doc.addImage(logo, "PNG", M, y - 2, 20, 20);

    doc.setFont("helvetica", "bold").setFontSize(15).setTextColor(...tinta);
    doc.text("SEGURIDAD GARRIDOS", M + (logo ? 24 : 0), y + 5);
    doc.setFont("helvetica", "normal").setFontSize(8.5).setTextColor(...gris);
    doc.text("GLOBSEG SPA · RUT 78.095.104-4", M + (logo ? 24 : 0), y + 10);
    doc.text("Seguridad privada: guardias, rondas, cámaras y eventos.", M + (logo ? 24 : 0), y + 14);

    doc.setFont("helvetica", "bold").setFontSize(13).setTextColor(...tinta);
    doc.text("COTIZACIÓN", der, y + 4, { align: "right" });
    doc.setFontSize(11);
    doc.text("N° " + c.numero, der, y + 10, { align: "right" });
    doc.setFont("helvetica", "normal").setFontSize(8.5).setTextColor(...gris);
    doc.text("Fecha: " + fecha(c.fecha), der, y + 15, { align: "right" });
    doc.text("Válida por " + c.validez_dias + " días", der, y + 19, { align: "right" });

    y += 27;
    doc.setDrawColor(...tinta).setLineWidth(0.5).line(M, y, der, y);
    y += 7;

    doc.setFont("helvetica", "bold").setFontSize(8).setTextColor(...gris);
    doc.text("CLIENTE", M, y);
    y += 5;
    doc.setFont("helvetica", "bold").setFontSize(11).setTextColor(...tinta);
    doc.text(c.cliente_nombre, M, y);
    doc.setFont("helvetica", "normal").setFontSize(9).setTextColor(60, 60, 80);
    const datos = [
      c.cliente_rut && "RUT " + c.cliente_rut,
      c.cliente_contacto, c.cliente_email,
    ].filter(Boolean);
    if (datos.length) { y += 5; doc.text(datos.join("  ·  "), M, y); }
    if (c.instalacion) { y += 5; doc.text("Instalación: " + c.instalacion, M, y); }

    y += 9;
    doc.setFillColor(231, 235, 227).rect(M, y, der - M, 8, "F");
    doc.setFont("helvetica", "bold").setFontSize(8).setTextColor(...tinta);
    doc.text("DETALLE", M + 2, y + 5.5);
    doc.text("CANT.", der - 76, y + 5.5, { align: "right" });
    doc.text("P. UNITARIO", der - 40, y + 5.5, { align: "right" });
    doc.text("SUBTOTAL", der - 2, y + 5.5, { align: "right" });
    y += 12;

    doc.setFont("helvetica", "normal").setFontSize(9).setTextColor(30, 25, 60);
    for (const i of c.items) {
      const lineas = doc.splitTextToSize(i.descripcion, 92);
      if (y + lineas.length * 4.6 > 262) { doc.addPage(); y = 22; }
      doc.text(lineas, M + 2, y);
      const cant = i.cantidad + (i.unidad ? " " + i.unidad : "");
      doc.text(String(cant), der - 76, y, { align: "right" });
      doc.text(clp(i.precio_unitario), der - 40, y, { align: "right" });
      doc.setFont("helvetica", "bold");
      doc.text(clp(i.subtotal), der - 2, y, { align: "right" });
      doc.setFont("helvetica", "normal");
      y += lineas.length * 4.6 + 3;
      doc.setDrawColor(207, 214, 201).setLineWidth(0.15).line(M, y - 1.5, der, y - 1.5);
    }

    y += 4;
    if (y > 232) { doc.addPage(); y = 22; }
    const x1 = der - 62, x2 = der - 2;
    doc.setFontSize(9.5).setTextColor(...gris);
    doc.text("Neto", x1, y);
    doc.setTextColor(30, 25, 60).text(clp(c.neto), x2, y, { align: "right" });
    y += 5.5;
    doc.setTextColor(...gris).text("IVA 19%", x1, y);
    doc.setTextColor(30, 25, 60).text(clp(c.iva), x2, y, { align: "right" });
    y += 3;
    doc.setDrawColor(...tinta).setLineWidth(0.4).line(x1, y, x2, y);
    y += 6.5;
    doc.setFont("helvetica", "bold").setFontSize(12.5).setTextColor(...tinta);
    doc.text("TOTAL", x1, y);
    doc.text(clp(c.total), x2, y, { align: "right" });

    y += 12;
    for (const [rotulo, texto] of [["CONDICIONES", c.condiciones], ["OBSERVACIONES", c.observaciones]]) {
      if (!texto) continue;
      const lineas = doc.splitTextToSize(texto, der - M);
      if (y + lineas.length * 4.2 > 272) { doc.addPage(); y = 22; }
      doc.setFont("helvetica", "bold").setFontSize(8).setTextColor(...gris);
      doc.text(rotulo, M, y);
      y += 5;
      doc.setFont("helvetica", "normal").setFontSize(8.8).setTextColor(60, 60, 80);
      doc.text(lineas, M, y);
      y += lineas.length * 4.2 + 6;
    }

    const n = doc.internal.getNumberOfPages();
    for (let p = 1; p <= n; p++) {
      doc.setPage(p);
      doc.setFont("helvetica", "normal").setFontSize(7.5).setTextColor(...gris);
      doc.text("Seguridad Garridos · GLOBSEG SPA · RUT 78.095.104-4", M, 288);
      doc.text(`Página ${p} de ${n}`, der, 288, { align: "right" });
    }

    // \w no incluye letras acentuadas: sin la u y el rango, "Energía" quedaba
    // como "Energa" en el nombre del archivo.
    const limpio = c.cliente_nombre
      .replace(/[^\p{L}\p{N}\s-]/gu, "").replace(/\s+/g, " ").trim().slice(0, 40);
    doc.save(`Cotizacion-${c.numero}-${limpio}.pdf`);
    decir(msj, "PDF descargado", "ok");
  } catch (e) {
    decir(msj, e.message, "error");
  }
}

  document.querySelectorAll("[data-estado]").forEach(sel => {
    sel.onchange = () => guardar(sel.dataset.estado, { estado: sel.value });
  });
  document.querySelectorAll("[data-notas]").forEach(inp => {
    inp.onchange = () => guardar(inp.dataset.notas, { notas: inp.value });
  });
}

// ------------------------------------------------------------- asistencia
/**
 * Trabajadores y libro de asistencia.
 *
 * Acá se crean las cuentas con las que los guardias entran a
 * asistencia.seggarridos.com. El usuario no se escribe: lo arma el sistema con
 * la regla de siempre —inicial del nombre, apellido paterno, inicial del
 * materno— y la clave es el RUT. Eso evita el ida y vuelta de inventar
 * usuarios y contraseñas para gente que no trabaja frente a un computador.
 *
 * La oficina no marca por nadie. El libro se lee, no se edita: es lo que lo
 * hace servir de respaldo cuando alguien reclama un turno.
 */
const CARGOS = ["guardia", "supervisor", "nochero", "rondin"];

const sinTildes = s => String(s ?? "").normalize("NFD")
  .replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z]/g, "");

/** La misma regla que aplica el servidor, para mostrarla mientras se escribe. */
function usuarioPropuesto(nombres, paterno, materno) {
  const n = sinTildes(String(nombres ?? "").trim().split(/\s+/)[0]);
  const p = sinTildes(paterno);
  const m = sinTildes(String(materno ?? "").trim().split(/\s+/)[0]);
  if (!n || !p) return "";
  return n[0] + p + (m ? m[0] : "");
}

const rutLindo = v => {
  const t = String(v ?? "").toUpperCase().replace(/[^0-9K]/g, "");
  if (t.length < 2) return t;
  return t.slice(0, -1).replace(/\B(?=(\d{3})+(?!\d))/g, ".") + "-" + t.slice(-1);
};

// ------------------------------------------------------------- Excel del libro
/**
 * El libro en una planilla.
 *
 * Esto existe para remuneraciones: lo que se hace con el libro al final de mes
 * es sumar horas por persona, y eso se hace en Excel. Por eso las horas van
 * como número y no como texto —si no, no se pueden sumar— y la fecha va como
 * fecha de verdad, para poder ordenar y filtrar por mes.
 *
 * Tres hojas: el resumen de lo que se descargó (para que el archivo diga solo
 * de qué periodo es cuando llegue por correo), una fila por jornada, y las
 * correcciones aparte, con quién las hizo y por qué. Lo que la oficina
 * intervino nunca se mezcla en silencio con lo que marcó el guardia.
 */
const SHEETJS = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";

async function bajarLibroExcel(libro) {
  await cargarScript(SHEETJS, "el generador de Excel");
  const XLSX = window.XLSX;
  if (!XLSX) throw new Error("No se pudo cargar el generador de Excel.");

  // Mediodía para que el cambio de huso no corra la fecha un día.
  const comoFecha = iso => iso ? new Date(iso + "T12:00:00") : null;
  const r = libro.resumen;
  const quien = estado.usuario ? `${estado.usuario.nombre} (${estado.usuario.usuario})` : "";

  const resumen = [
    ["Libro de asistencia"],
    ["Seguridad Garridos · GLOBSEG SPA"],
    [],
    ["Desde", comoFecha(libro.desde)],
    ["Hasta", comoFecha(libro.hasta)],
    ["Jornadas", r.jornadas],
    ["Trabajadores", r.trabajadores],
    ["Horas registradas", r.horas],
    ["Sin salida marcada", r.sin_salida],
    ["Corregidas por la oficina", r.corregidas || 0],
    [],
    ["Descargado", new Date()],
    ["Por", quien],
  ];
  if (r.sin_salida) {
    resumen.push([], ["Aviso", "Las jornadas sin salida no suman horas: falta la marca."]);
  }

  const jornadas = libro.jornadas.map(j => ({
    "Fecha": comoFecha(j.fecha),
    "Trabajador": j.trabajador,
    "RUT": j.rut || "",
    "Usuario": j.usuario || "",
    "Instalación": j.instalacion || "",
    "Entrada": j.hora_entrada || "",
    "Salida": j.hora_salida || "",
    "Horas": j.horas ?? "",
    "Estado": j.completa ? "Completa" : "Sin salida",
    "Entrada marcada por": j.entrada_origen === "oficina" ? "Oficina" : (j.entrada ? "El guardia" : ""),
    "Salida marcada por": j.salida_origen === "oficina" ? "Oficina" : (j.salida ? "El guardia" : ""),
    "Con ubicación": j.entrada_ubicada || j.salida_ubicada ? "Sí" : "No",
  }));

  const correcciones = libro.jornadas.flatMap(j =>
    (j.correcciones || []).map(c => ({
      "Fecha": comoFecha(j.fecha),
      "Trabajador": j.trabajador,
      "RUT": j.rut || "",
      "Qué se agregó": c.tipo === "entrada" ? "Entrada" : "Salida",
      "Hora": c.hora || "",
      "Quién la puso": c.por_nombre || c.por || "",
      "Motivo": c.motivo || "",
      "Cuándo se registró": c.cuando ? new Date(c.cuando) : "",
    })));

  const libroXL = XLSX.utils.book_new();

  const hojaResumen = XLSX.utils.aoa_to_sheet(resumen);
  hojaResumen["!cols"] = [{ wch: 26 }, { wch: 46 }];
  formatear(hojaResumen, { "B4": "dd-mm-yyyy", "B5": "dd-mm-yyyy", "B12": "dd-mm-yyyy hh:mm" });
  XLSX.utils.book_append_sheet(libroXL, hojaResumen, "Resumen");

  const hojaJornadas = XLSX.utils.json_to_sheet(jornadas);
  hojaJornadas["!cols"] = [{ wch: 11 }, { wch: 28 }, { wch: 13 }, { wch: 13 }, { wch: 22 },
                           { wch: 9 }, { wch: 9 }, { wch: 8 }, { wch: 12 },
                           { wch: 19 }, { wch: 19 }, { wch: 13 }];
  // La primera fila es el encabezado; Excel la congela y se puede filtrar.
  hojaJornadas["!freeze"] = { xSplit: 0, ySplit: 1 };
  if (jornadas.length) {
    hojaJornadas["!autofilter"] = { ref: XLSX.utils.encode_range({
      s: { r: 0, c: 0 }, e: { r: jornadas.length, c: 11 } }) };
  }
  formatearColumna(hojaJornadas, 0, "dd-mm-yyyy", jornadas.length);
  formatearColumna(hojaJornadas, 7, "0.00", jornadas.length);
  XLSX.utils.book_append_sheet(libroXL, hojaJornadas, "Jornadas");

  if (correcciones.length) {
    const hojaCorr = XLSX.utils.json_to_sheet(correcciones);
    hojaCorr["!cols"] = [{ wch: 11 }, { wch: 28 }, { wch: 13 }, { wch: 14 }, { wch: 8 },
                         { wch: 24 }, { wch: 52 }, { wch: 19 }];
    formatearColumna(hojaCorr, 0, "dd-mm-yyyy", correcciones.length);
    formatearColumna(hojaCorr, 7, "dd-mm-yyyy hh:mm", correcciones.length);
    XLSX.utils.book_append_sheet(libroXL, hojaCorr, "Correcciones");
  }

  XLSX.writeFile(libroXL, `asistencia ${libro.desde} a ${libro.hasta}.xlsx`);
}

/** Pone el formato de una celda suelta, si existe. */
function formatear(hoja, formatos) {
  for (const [celda, z] of Object.entries(formatos)) {
    if (hoja[celda]) hoja[celda].z = z;
  }
}

/** Pone el formato a toda una columna de datos, sin tocar el encabezado. */
function formatearColumna(hoja, columna, z, filas) {
  for (let i = 1; i <= filas; i++) {
    const celda = hoja[window.XLSX.utils.encode_cell({ r: i, c: columna })];
    if (celda && celda.v !== "") celda.z = z;
  }
}

// ============================================================ recursos humanos
/**
 * RRHH en cuatro pantallas:
 *   · RRHH      — qué vence, qué falta y a quién. Lo primero que hay que mirar.
 *   · Personal  — la ficha de cada uno, con su contrato, sus papeles y su feriado.
 *   · Sueldos   — liquidación estimada, finiquito estimado y los parámetros del año.
 *   · Carga masiva — subir la planilla que ya existe, en vez de teclearla.
 *
 * Todo lo que es estimación lo dice. Todo parámetro que nadie confirmó se
 * muestra en ámbar, igual que en la página pública: un número sin confirmar
 * que se ve como un número confirmado es peor que no tenerlo.
 */
const RRHH = {
  catalogos: null, panel: null, personal: null, ficha: null,
  verFicha: null,            // id de la persona abierta, o null para la lista
  editaContrato: null,       // contrato que se está corrigiendo dentro de esa ficha
  ingresos: null, verIngreso: null,   // enlaces de ficha de ingreso y el que se revisa
  busca: "", soloActivos: true,
  docFiltro: { estado: "", grupo: "", trabajador: "" },
  sueldos: { trabajador: "", mes: hoyISO().slice(0, 7), vista: "liquidacion" },
  subirA: null,                // documento al que va el archivo que se está eligiendo
  carga: { tipo: "trabajadores", filas: null, encabezados: null, mapa: null,
           revision: null, avance: null },
};

async function catalogosRrhh() {
  if (!RRHH.catalogos) RRHH.catalogos = await pedir("/rrhh/catalogos");
  return RRHH.catalogos;
}

const ROTULO_DOC = { vencido: "Vencido", por_vencer: "Por vencer", vigente: "Vigente",
  sin_vencimiento: "Sin vencimiento", anulado: "Anulado" };
const SELLO_DOC = { vencido: "e-rechazada", por_vencer: "e-solicitar_oc",
  vigente: "e-cerrado", sin_vencimiento: "e-en_curso", anulado: "e-borrador" };

const ROTULO_CONTRATO = { indefinido: "Indefinido", plazo_fijo: "Plazo fijo",
  por_obra: "Por obra o faena" };
const ROTULO_JORNADA = {
  art22: "Jornada ordinaria (art. 22)",
  art38_2: "Turnos continuos (art. 38 N°2)",
  excepcional: "Sistema excepcional autorizado por la DT",
  parcial: "Jornada parcial (art. 40 bis)",
  art22_excluido: "Sin fiscalización de jornada (art. 22 inc. 2°)",
};
const ROTULO_AUSENCIA = {
  feriado: "Feriado legal", feriado_progresivo: "Feriado progresivo",
  licencia_medica: "Licencia médica", accidente_trabajo: "Accidente del trabajo",
  permiso_legal: "Permiso legal", permiso_con_goce: "Permiso con goce",
  permiso_sin_goce: "Permiso sin goce", falta_injustificada: "Falta injustificada",
  suspension: "Suspensión", otra: "Otra",
};
const ROTULO_CARGO = {
  guardia: "Guardia", supervisor: "Supervisor", nochero: "Nochero", rondin: "Rondín",
  jefe_servicio: "Jefe de servicio", administrativo: "Administrativo",
  prevencionista: "Prevencionista", conductor: "Conductor",
};
const rotCargo = c => ROTULO_CARGO[c] || (c ? c[0].toUpperCase() + c.slice(1) : "—");

/** Cuántos días faltan, dicho como lo diría una persona. */
function enDias(n) {
  if (n === null || n === undefined) return "";
  if (n < 0) return `hace ${Math.abs(n)} día${Math.abs(n) === 1 ? "" : "s"}`;
  if (n === 0) return "hoy";
  if (n === 1) return "mañana";
  return `en ${n} días`;
}

const rutLindoSeguro = v => { try { return rutLindo(v); } catch { return v || "—"; } };

/** El peso de un archivo como lo diría una persona. Un PDF chico no puede
 *  salir como «0 KB»: parece que no se subió nada. */
const pesoArchivo = n => !n ? "—"
  : n < 1024 ? `${n} bytes`
  : n < 1048576 ? `${Math.round(n / 1024)} KB`
  : `${(n / 1048576).toFixed(1)} MB`;

const MAX_ARCHIVO = 10 * 1024 * 1024;

/**
 * Sube un archivo a un documento.
 *
 * Va como bytes crudos y no como formulario: el nombre viaja en una cabecera y
 * el cuerpo es el archivo tal cual, así que no se arma una copia en memoria
 * para envolverlo. El tamaño se mira acá antes de mandarlo, para no hacer
 * subir diez megas por la red y recién entonces decir que no.
 */
async function subirArchivo(documentoId, archivo) {
  if (!archivo) return null;
  if (archivo.size > MAX_ARCHIVO) {
    throw new Error(`«${archivo.name}» pesa ${pesoArchivo(archivo.size)} y el máximo es 10 MB. `
      + "Si es una foto, sáquela con menos resolución o conviértala a PDF.");
  }
  const r = await fetch(`/api/rrhh/documentos/${documentoId}/archivo`, {
    method: "POST",
    headers: {
      "content-type": archivo.type || "application/octet-stream",
      // El nombre puede traer acentos y una cabecera HTTP no los admite tal cual.
      "x-archivo-nombre": encodeURIComponent(archivo.name || ""),
    },
    body: archivo,
  });
  const cuerpo = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(cuerpo.error || `Error ${r.status} al subir el archivo`);
  return cuerpo;
}

// ------------------------------------------------------------- panel de RRHH
async function pintarRrhh() {
  const [panel] = await Promise.all([pedir("/rrhh/panel"), catalogosRrhh()]);
  RRHH.panel = panel;

  const d = panel.dotacion;
  const urgentes = panel.vencidos.length + panel.plazo_por_vencer.filter(c => c.dias <= 15).length;

  let html = "";

  if (panel.vencidos.length) {
    const guardias = panel.vencidos.filter(x => x.tipo.startsWith("os10"));
    html += aviso("mal",
      `${panel.vencidos.length} documento${panel.vencidos.length > 1 ? "s" : ""} vencido${panel.vencidos.length > 1 ? "s" : ""}`,
      guardias.length
        ? `${guardias.length} ${guardias.length > 1 ? "son credenciales o cursos OS-10" : "es una credencial o curso OS-10"}. `
          + "Sin credencial vigente esa persona no puede hacer turno, y el mandante puede "
          + "cerrar la faena si lo revisa."
        : "Están abajo, en rojo, con el nombre de cada uno.");
  }
  const plazoCerca = panel.plazo_por_vencer.filter(c => c.dias <= 15);
  if (plazoCerca.length) {
    html += aviso("mal",
      `${plazoCerca.length} contrato${plazoCerca.length > 1 ? "s" : ""} a plazo vence${plazoCerca.length > 1 ? "n" : ""} en 15 días o menos`,
      "Si la persona sigue trabajando después de la fecha de término, el contrato pasa a ser "
      + "indefinido por el solo hecho de seguir (art. 159 N°4). Renueve o termine antes.");
  }
  if (panel.resoluciones.length) {
    html += aviso("ojo",
      `${panel.resoluciones.length} resolución${panel.resoluciones.length > 1 ? "es" : ""} de turnos excepcionales por vencer`,
      "Es la autorización de la Dirección del Trabajo para el 4x4 o el 7x7. Vencida, ese turno "
      + "deja de estar autorizado aunque siga saliendo igual todas las semanas.");
  }
  // Una ficha que llegó y nadie revisó no es una urgencia legal, pero sí es
  // trabajo esperando de alguien que ya hizo su parte. Va arriba para que no
  // se quede dos semanas en una pestaña que nadie abre.
  const porRevisar = panel.fichas_por_revisar || [];
  if (porRevisar.length) {
    html += aviso("ojo",
      `${porRevisar.length} ficha${porRevisar.length > 1 ? "s" : ""} de ingreso esperando revisión`,
      porRevisar.map(x => esc(x.nombre_referencia)).join(", ")
      + ". Lo que mandaron no está en el sistema hasta que alguien lo acepte, "
      + "acá mismo en Personas → Fichas.");
  }
  if (!urgentes && !panel.resoluciones.length) {
    html += aviso("bien", "Nada vencido ni por vencer en los próximos 15 días",
      `Se revisan ${panel.dias_aviso} días hacia adelante.`);
  }

  html += `<dl class="resumen">
    <div class="ficha ficha--plata"><dt>Dotación activa</dt><dd class="num">${d.activos}</dd>
      <small>${Object.entries(d.por_cargo).map(([c, n]) => `${n} ${rotCargo(c).toLowerCase()}`).join(" · ") || "sin cargos cargados"}</small></div>
    <div class="ficha ${d.con_contrato < d.activos ? "ficha--ojo" : ""}"><dt>Con contrato cargado</dt>
      <dd class="num">${d.con_contrato}</dd>
      <small>${d.activos - d.con_contrato} sin contrato en el sistema</small></div>
    <div class="ficha ${panel.vencidos.length ? "ficha--ojo" : ""}"><dt>Documentos vencidos</dt>
      <dd class="num">${panel.vencidos.length}</dd><small>Hay que renovarlos ya</small></div>
    <div class="ficha ${panel.por_vencer.length ? "ficha--ojo" : ""}"><dt>Por vencer</dt>
      <dd class="num">${panel.por_vencer.length}</dd><small>En los próximos ${panel.dias_aviso} días</small></div>
    <div class="ficha"><dt>Ausencias en curso</dt><dd class="num">${panel.ausencias_vigentes.length}</dd>
      <small>Hoy y los próximos 30 días</small></div>
  </dl>`;

  // Vencimientos: lo vencido primero y en rojo, lo que viene después.
  const vencimientos = [...panel.vencidos, ...panel.por_vencer];
  html += `<section class="caja">
    <div class="caja__tit"><h2>Vencimientos</h2>
      <span class="nota">${vencimientos.length} documento${vencimientos.length === 1 ? "" : "s"}</span></div>
    ${vencimientos.length ? `<div class="desliza"><table>
      <thead><tr><th>Persona</th><th>Documento</th><th>N°</th><th>Vence</th>
        <th>Estado</th><th></th></tr></thead><tbody>
      ${vencimientos.map(v => `<tr${v.estado === "vencido" ? ' class="fila--atrasado"' : ""}>
        <td><b>${esc(v.trabajador)}</b><span class="sub">${rotCargo(v.trabajador_cargo)}</span></td>
        <td>${esc(v.tipo_nombre)}${v.obligatorio ? '<span class="sub">Obligatorio</span>' : ""}</td>
        <td class="nowrap">${esc(v.numero || "—")}</td>
        <td class="nowrap">${fecha(v.fecha_vencimiento)}<span class="sub">${enDias(v.dias_para_vencer)}</span></td>
        <td><span class="sello ${SELLO_DOC[v.estado]}">${ROTULO_DOC[v.estado]}</span></td>
        <td class="nowrap"><button class="bt bt--fino bt--chico" data-ver-ficha="${v.trabajador_id}">Ver ficha</button></td>
      </tr>`).join("")}
    </tbody></table></div>`
    : `<p class="vacio">Ningún documento vence en los próximos ${panel.dias_aviso} días.</p>`}
  </section>`;

  if (panel.plazo_por_vencer.length) {
    html += `<section class="caja">
      <div class="caja__tit"><h2>Contratos a plazo por vencer</h2>
        <span class="nota">Pasada la fecha, el contrato se vuelve indefinido</span></div>
      <div class="desliza"><table>
        <thead><tr><th>Persona</th><th>Tipo</th><th>Termina</th><th></th></tr></thead><tbody>
        ${panel.plazo_por_vencer.map(c => `<tr${c.dias <= 15 ? ' class="fila--atrasado"' : ""}>
          <td><b>${esc(c.trabajador)}</b></td>
          <td>${ROTULO_CONTRATO[c.tipo] || c.tipo}</td>
          <td class="nowrap">${fecha(c.fecha_termino)}<span class="sub">${enDias(c.dias)}</span></td>
          <td class="nowrap"><button class="bt bt--fino bt--chico" data-ver-ficha="${c.trabajador_id}">Ver ficha</button></td>
        </tr>`).join("")}
      </tbody></table></div></section>`;
  }

  if (panel.resoluciones.length) {
    html += `<section class="caja">
      <div class="caja__tit"><h2>Resoluciones de turnos excepcionales</h2>
        <span class="nota">Art. 38 inciso final del Código del Trabajo</span></div>
      <div class="desliza"><table>
        <thead><tr><th>Persona</th><th>Resolución</th><th>Vence</th></tr></thead><tbody>
        ${panel.resoluciones.map(r => `<tr>
          <td><b>${esc(r.trabajador)}</b></td>
          <td>${esc(r.resolucion || "—")}</td>
          <td class="nowrap">${fecha(r.vence)}<span class="sub">${enDias(r.dias)}</span></td>
        </tr>`).join("")}
      </tbody></table></div></section>`;
  }

  if (panel.sin_contrato.length || panel.fichas_incompletas.length) {
    html += `<section class="caja">
      <div class="caja__tit"><h2>Lo que falta cargar</h2>
        <span class="nota">Sin esto no se puede calcular sueldo, feriado ni finiquito</span></div>
      <div class="desliza"><table>
        <thead><tr><th>Persona</th><th>Qué falta</th><th></th></tr></thead><tbody>
        ${panel.sin_contrato.map(t => `<tr>
          <td><b>${esc(t.nombre)}</b><span class="sub">${esc(t.rut)} · ${rotCargo(t.cargo)}</span></td>
          <td><span class="sello e-rechazada">Sin contrato</span></td>
          <td class="nowrap"><button class="bt bt--fino bt--chico" data-ver-ficha="${t.id}">Abrir ficha</button></td>
        </tr>`).join("")}
        ${panel.fichas_incompletas.map(t => `<tr>
          <td><b>${esc(t.nombre)}</b></td>
          <td>Falta ${esc(t.falta.join(", "))}</td>
          <td class="nowrap"><button class="bt bt--fino bt--chico" data-ver-ficha="${t.id}">Abrir ficha</button></td>
        </tr>`).join("")}
      </tbody></table></div></section>`;
  }

  if (panel.faltantes.length) {
    html += `<section class="caja">
      <div class="caja__tit"><h2>Documentos obligatorios que faltan</h2>
        <span class="nota">${panel.faltantes.length} persona${panel.faltantes.length === 1 ? "" : "s"}</span></div>
      <div class="desliza"><table>
        <thead><tr><th>Persona</th><th>Papeles que no están cargados</th><th></th></tr></thead><tbody>
        ${panel.faltantes.map(t => `<tr>
          <td><b>${esc(t.nombre)}</b><span class="sub">${rotCargo(t.cargo)}</span></td>
          <td>${t.faltan.map(f => `<span class="sello e-en_curso" style="margin:0 4px 4px 0">${esc(f)}</span>`).join("")}</td>
          <td class="nowrap"><button class="bt bt--fino bt--chico" data-ver-ficha="${t.id}">Abrir ficha</button></td>
        </tr>`).join("")}
      </tbody></table></div></section>`;
  }

  if (panel.ausencias_vigentes.length) {
    html += `<section class="caja">
      <div class="caja__tit"><h2>Quién no está</h2>
        <span class="nota">Hoy y los próximos 30 días</span></div>
      <div class="desliza"><table>
        <thead><tr><th>Persona</th><th>Motivo</th><th>Desde</th><th>Hasta</th>
          <th class="num">Días hábiles</th><th>Estado</th></tr></thead><tbody>
        ${panel.ausencias_vigentes.map(a => `<tr>
          <td><b>${esc(a.trabajadores?.nombre || "—")}</b></td>
          <td>${ROTULO_AUSENCIA[a.tipo] || a.tipo}${a.folio ? `<span class="sub">Folio ${esc(a.folio)}</span>` : ""}</td>
          <td class="nowrap">${fecha(a.desde)}</td>
          <td class="nowrap">${fecha(a.hasta)}</td>
          <td class="num">${a.dias_habiles ?? "—"}</td>
          <td><span class="sello ${a.estado === "aprobada" ? "e-cerrado" : "e-solicitar_oc"}">${esc(a.estado)}</span></td>
        </tr>`).join("")}
      </tbody></table></div></section>`;
  }

  if (panel.parametros_por_confirmar.length) {
    html += `<section class="caja">
      <div class="caja__tit"><h2>Parámetros sin confirmar</h2>
        <span class="nota">Se usan igual, pero nadie los ha revisado</span></div>
      <p style="padding:0 16px;color:var(--texto-3);font-size:.86rem;margin:0 0 4px">
        Estos números salen de la ley y cambian todos los años. El sistema trae un valor de
        partida, pero no tiene cómo verificarlo: mientras nadie lo confirme en
        <b>Sueldos → Parámetros</b>, todo cálculo que los use sale marcado.</p>
      <div class="desliza"><table>
        <thead><tr><th>Parámetro</th><th class="num">Valor</th><th>Vigente desde</th>
          <th>De dónde sale</th></tr></thead><tbody>
        ${panel.parametros_por_confirmar.map(p => `<tr class="fila--solicitar_oc">
          <td><b>${esc(p.glosa || p.codigo)}</b><span class="sub">${esc(p.codigo)}</span></td>
          <td class="num">${p.unidad === "pesos" ? clp(p.valor) : p.valor}${
            p.unidad === "porcentaje" ? "%" : p.unidad === "uf" ? " UF" : ""}</td>
          <td class="nowrap">${fecha(p.vigente_desde)}</td>
          <td><span class="sub" style="margin:0">${esc(p.base_legal || "—")}</span></td>
        </tr>`).join("")}
      </tbody></table></div></section>`;
  }

  $("#app").innerHTML = html;
  document.querySelectorAll("[data-ver-ficha]").forEach(b => {
    b.onclick = () => {
      RRHH.verFicha = Number(b.dataset.verFicha); RRHH.editaContrato = null; ir("personal");
    };
  });
}

// ------------------------------------------------------------- personal
async function pintarPersonal() {
  if (RRHH.verFicha) return pintarFicha(RRHH.verFicha);
  if (RRHH.verIngreso) return pintarFichaIngreso(RRHH.verIngreso);

  const [{ personal }, ingresos] = await Promise.all([
    pedir("/rrhh/personal"),
    // Si la migración de la ficha de ingreso todavía no corrió, esto no puede
    // dejar sin pantalla al resto: la lista queda vacía con su aviso.
    pedir("/rrhh/fichas-ingreso").catch(e => ({ fichas: [], sin_tabla: true, aviso: e.message })),
    catalogosRrhh(),
  ]);
  RRHH.personal = personal;
  RRHH.ingresos = ingresos;

  const q = RRHH.busca.trim().toLowerCase();
  const lista = personal
    .filter(t => (RRHH.soloActivos ? t.activo : true))
    .filter(t => !q || [t.nombre, t.rut, t.usuario, t.cargo, t.instalacion]
      .some(v => String(v || "").toLowerCase().includes(q)));

  $("#app").innerHTML = `
    ${seccionIngresos(ingresos)}
    <section class="caja">
      <div class="caja__tit"><h2>Personal</h2>
        <span class="nota">${lista.length} de ${personal.length}</span>
        <button class="bt bt--chico" type="button" id="nueva-persona">Nueva persona</button></div>
      <div class="rejilla">
        <label class="campo" style="grid-column:span 2"><span>Buscar</span>
          <input id="f-busca" value="${esc(RRHH.busca)}" placeholder="Nombre, RUT, cargo o instalación"
            autocomplete="off"></label>
        <label class="campo"><span>Mostrar</span>
          <select id="f-activos">
            <option value="si"${RRHH.soloActivos ? " selected" : ""}>Solo activos</option>
            <option value="no"${RRHH.soloActivos ? "" : " selected"}>Todos, incluidos los de baja</option>
          </select></label>
      </div>
      ${lista.length ? `<div class="desliza"><table>
        <thead><tr><th>Persona</th><th>RUT</th><th>Cargo</th><th>Instalación</th>
          <th>Contrato</th><th>Ingreso</th><th>Previsión</th><th></th></tr></thead><tbody>
        ${lista.map(t => `<tr${t.activo ? "" : ' class="fila--cerrado"'}>
          <td><b>${esc(t.nombre)}</b><span class="sub">${esc(t.usuario)}${
            t.telefono ? " · " + esc(t.telefono) : ""}</span></td>
          <td class="nowrap num">${rutLindoSeguro(t.rut)}</td>
          <td>${rotCargo(t.cargo)}</td>
          <td>${t.instalacion ? esc(t.instalacion) : '<span class="sub">Sin asignar</span>'}</td>
          <td>${t.sin_contrato
            ? '<span class="sello e-rechazada">Sin contrato</span>'
            : `<span class="sello e-cerrado">${ROTULO_CONTRATO[t.contrato_tipo] || t.contrato_tipo}</span>`
              + (t.contrato_hasta ? `<span class="sub">hasta ${fecha(t.contrato_hasta)}</span>` : "")}</td>
          <td class="nowrap">${t.fecha_ingreso ? fecha(t.fecha_ingreso)
            : '<span class="sello e-solicitar_oc">Falta</span>'}</td>
          <td>${t.afp || t.salud_sistema
            ? `${esc(t.afp || "sin AFP")}<span class="sub">${esc(t.salud_isapre || t.salud_sistema || "sin salud")}</span>`
            : '<span class="sello e-solicitar_oc">Falta</span>'}</td>
          <td class="nowrap"><button class="bt bt--fino bt--chico" data-ficha="${t.id}">Ver ficha</button></td>
        </tr>`).join("")}
      </tbody></table></div>`
      : `<p class="vacio">No hay nadie que calce con lo buscado.
           ${personal.length ? "" : "Empiece por «Carga masiva» si ya tiene la planilla."}</p>`}
    </section>`;

  const busca = $("#f-busca");
  busca.oninput = () => {
    RRHH.busca = busca.value;
    clearTimeout(RRHH._t);
    // Se espera a que deje de escribir: repintar en cada tecla con 150 filas
    // hace saltar el cursor.
    RRHH._t = setTimeout(pintarPersonal, 220);
  };
  $("#f-activos").onchange = e => { RRHH.soloActivos = e.target.value === "si"; pintarPersonal(); };
  document.querySelectorAll("[data-ficha]").forEach(b => {
    b.onclick = () => {
      RRHH.verFicha = Number(b.dataset.ficha); RRHH.editaContrato = null;
      pintarFicha(RRHH.verFicha);
    };
  });
  $("#nueva-persona").onclick = pintarNuevaPersona;
  conectarIngresos();
}

// ------------------------------------------- fichas de ingreso por enlace
/**
 * El enlace que se le manda a quien entra, para que llene su ficha solo.
 *
 * Vive dentro de «Fichas» y no en una pestaña aparte a propósito: es parte de
 * dar de alta a una persona, y una pestaña más en la lateral sería una
 * pantalla que hay que acordarse de visitar. Acá está donde ya se mira.
 *
 * Lo que llega NO entra a la ficha: queda esperando revisión, y de eso se
 * encarga pintarFichaIngreso().
 */
const SELLO_INGRESO = {
  pendiente: "e-en_curso", recibida: "e-solicitar_oc",
  aceptada: "e-cerrado", vencida: "e-borrador", anulada: "e-borrador",
};
const ROTULO_INGRESO = {
  pendiente: "Esperando", recibida: "Llegó: hay que revisarla",
  aceptada: "Aceptada", vencida: "Venció", anulada: "Anulada",
};

function seccionIngresos(ingresos) {
  const fichas = ingresos.fichas || [];
  const porRevisar = fichas.filter(f => f.estado_visible === "recibida");
  // Las vencidas y las anuladas se guardan, pero no tienen por qué estar a la
  // vista todos los días: la pregunta de esta pantalla es a quién hay que
  // perseguir y a quién hay que revisar.
  const vivas = fichas.filter(f => ["pendiente", "recibida"].includes(f.estado_visible));
  const viejas = fichas.length - vivas.length;

  return `<section class="caja">
    <div class="caja__tit"><h2>Fichas de ingreso</h2>
      <span class="nota">La llena la propia persona, desde su teléfono</span>
      <button class="bt bt--chico" type="button" id="bt-nuevo-enlace">Generar un enlace</button></div>

    ${ingresos.sin_tabla ? aviso("mal", "Esto todavía no está en la base",
      ingresos.aviso || "Falta aplicar la migración.") : ""}

    <div id="enlace-recien" hidden></div>

    ${porRevisar.length ? aviso("ojo",
      `${porRevisar.length} ficha${porRevisar.length > 1 ? "s" : ""} esperando revisión`,
      "Lo que mandaron no está en el sistema todavía. Revíselo y acéptelo: si alguien se "
      + "equivocó en el RUT o en la AFP, eso después sale en una liquidación.") : ""}

    ${vivas.length ? `<div class="desliza"><table class="ingresos">
      <thead><tr><th>A nombre de</th><th>Se mandó a</th><th>Estado</th><th>Vence</th>
        <th>Generó</th><th></th></tr></thead><tbody>
      ${vivas.map(f => `<tr>
        <td><b>${esc(f.nombre_referencia)}</b>${f.rut_esperado
          ? `<span class="sub">${esc(f.rut_esperado)}</span>` : ""}${f.trabajadores?.nombre
          ? '<span class="sub">Ya está en el sistema</span>' : ""}</td>
        <td>${esc(f.enviado_a || "—")}${f.nota ? `<span class="sub">${esc(f.nota)}</span>` : ""}</td>
        <td><span class="sello ${SELLO_INGRESO[f.estado_visible]}">${ROTULO_INGRESO[f.estado_visible]}</span>
          ${f.recibido_en ? `<span class="sub">${fecha(f.recibido_en.slice(0, 10))}</span>` : ""}</td>
        <td class="nowrap">${fecha(f.vence_en.slice(0, 10))}</td>
        <td><span class="sub" style="margin:0">${esc(f.creado_por)}</span></td>
        <td class="nowrap">${f.estado_visible === "recibida"
          ? `<button class="bt bt--chico" data-revisar-ingreso="${f.id}">Revisar</button>` : ""}
          <button class="bt bt--fino bt--chico" data-anular-ingreso="${f.id}">Anular</button></td>
      </tr>`).join("")}
    </tbody></table></div>`
      : `<p class="vacio">No hay enlaces esperando.
           ${ingresos.sin_tabla ? "" : "Genere uno y mándeselo por WhatsApp a quien entra."}</p>`}
    ${viejas ? `<p class="sub" style="padding:0 16px 14px;margin:0">${viejas} más ya aceptadas,
      vencidas o anuladas. Quedan guardadas.</p>` : ""}
  </section>`;
}

function conectarIngresos() {
  const caja = $("#enlace-recien");

  $("#bt-nuevo-enlace").onclick = () => {
    caja.hidden = false;
    caja.innerHTML = `<form id="f-enlace" style="padding:4px 16px 16px">
      <div class="rejilla">
        <label class="campo" style="grid-column:span 2"><span>¿Para quién es? *</span>
          <select name="trabajador_id" id="e-quien">
            <option value="">Alguien que todavía no está en el sistema</option>
            ${(RRHH.personal || []).filter(t => t.activo).map(t =>
              `<option value="${t.id}">${esc(t.nombre)}</option>`).join("")}
          </select></label>
        <label class="campo" id="e-nombre-caja" style="grid-column:span 2">
          <span>Nombre y apellido, para no perderle el rastro al enlace *</span>
          <input name="nombre_referencia" autocomplete="off" placeholder="Camila Núñez Soto"></label>
        <label class="campo"><span>RUT, si lo sabe</span>
          <input name="rut" placeholder="12.345.678-9" autocomplete="off">
          <span class="sub" style="margin:0">Si lo pone, el enlace queda amarrado a ese RUT y
            no sirve para cargar a otra persona.</span></label>
        <label class="campo"><span>¿A qué número o correo se lo va a mandar?</span>
          <input name="enviado_a" autocomplete="off" placeholder="+56 9 ..."></label>
        <label class="campo"><span>Sirve por</span><select name="dias">
          <option value="3">3 días</option>
          <option value="7" selected>7 días</option>
          <option value="15">15 días</option>
          <option value="30">30 días</option></select>
          <span class="sub" style="margin:0">Pasado el plazo deja de abrir, y hay que generar otro.</span></label>
        <label class="campo"><span>Nota para la oficina</span><input name="nota" autocomplete="off"></label>
      </div>
      <div class="pie-form">
        <button class="bt" type="submit">Generar el enlace</button>
        <span class="mensaje"></span>
      </div></form>`;

    // Para alguien que ya está cargado, el nombre y el RUT salen de su ficha.
    const quien = $("#e-quien");
    const verQuien = () => {
      const propio = !quien.value;
      $("#e-nombre-caja").style.display = propio ? "" : "none";
      $("#f-enlace").rut.closest("label").style.display = propio ? "" : "none";
    };
    quien.onchange = verQuien;
    verQuien();

    const f = $("#f-enlace");
    f.onsubmit = async ev => {
      ev.preventDefault();
      const m = f.querySelector(".mensaje"), bt = f.querySelector("button[type=submit]");
      decir(m, "Generando…"); bt.disabled = true;
      try {
        const r = await pedir("/rrhh/fichas-ingreso", { method: "POST",
          body: JSON.stringify(Object.fromEntries(new FormData(f))) });
        mostrarEnlace(r);
      } catch (e) { decir(m, e.message, "error"); bt.disabled = false; }
    };
  };

  document.querySelectorAll("[data-revisar-ingreso]").forEach(b => {
    b.onclick = () => {
      RRHH.verIngreso = Number(b.dataset.revisarIngreso);
      pintarFichaIngreso(RRHH.verIngreso);
    };
  });
  document.querySelectorAll("[data-anular-ingreso]").forEach(b => {
    b.onclick = async () => {
      const motivo = prompt("¿Por qué se anula este enlace?\n\n"
        + "Queda guardado con su nombre. Después de esto el enlace deja de abrir.");
      if (motivo === null) return;
      try {
        await pedir(`/rrhh/fichas-ingreso/${b.dataset.anularIngreso}`, { method: "PATCH",
          body: JSON.stringify({ motivo }) });
        pintarPersonal();
      } catch (e) { alert(e.message); }
    };
  });
}

/**
 * El enlace recién generado, que es la única vez que existe.
 *
 * El token no se guarda en ninguna parte: en la base vive su hash. Si esta
 * pantalla se cierra sin copiarlo, no hay de dónde sacarlo y hay que generar
 * otro. Por eso se muestra grande, con el texto listo para pegar, y se dice
 * que es ahora o nunca.
 */
function mostrarEnlace(r) {
  const caja = $("#enlace-recien");
  const mensaje = `Hola ${r.ficha.nombre_referencia.split(" ")[0]}, le dejo el enlace para que `
    + `llene su ficha de ingreso en Seguridad Garridos. Son unos minutos y se hace desde el `
    + `teléfono. Sirve ${r.dias} días y una sola vez: ${r.enlace}`;
  caja.innerHTML = `<div style="padding:4px 16px 18px">
    ${aviso("bien", "Enlace listo para " + r.ficha.nombre_referencia,
      "Cópielo ahora: el sistema no lo guarda en claro en ninguna parte, así que esta es la "
      + "única vez que se puede ver. Si se pierde, se genera otro. Este deja de servir "
      + `cuando lo llenen, o el ${fecha(r.ficha.vence_en.slice(0, 10))}.`)}
    <label class="campo" style="margin-top:10px"><span>El enlace</span>
      <input id="e-url" readonly value="${esc(r.enlace)}"></label>
    <label class="campo" style="margin-top:10px"><span>Mensaje listo para pegar en WhatsApp</span>
      <input id="e-msg" readonly value="${esc(mensaje)}"></label>
    <div class="pie-form">
      <button class="bt" type="button" id="e-copiar">Copiar el mensaje</button>
      <button class="bt bt--fino" type="button" id="e-copiar-url">Copiar solo el enlace</button>
      <button class="bt bt--fino" type="button" id="e-listo">Listo</button>
      <span class="mensaje" id="e-m"></span>
    </div></div>`;

  const copiar = async (campo, que) => {
    const el = $(campo);
    try {
      await navigator.clipboard.writeText(el.value);
      decir($("#e-m"), que + " copiado", "ok");
    } catch {
      // Sin permiso de portapapeles queda seleccionado: copiar a mano sigue
      // siendo posible, y es mejor que un error que no dice qué hacer.
      el.focus(); el.select();
      decir($("#e-m"), "Quedó seleccionado: cópielo con ⌘C o Ctrl+C", "ok");
    }
  };
  $("#e-copiar").onclick = () => copiar("#e-msg", "El mensaje");
  $("#e-copiar-url").onclick = () => copiar("#e-url", "El enlace");
  $("#e-listo").onclick = () => pintarPersonal();
}

/**
 * Revisar lo que llegó antes de escribirlo.
 *
 * La pantalla entera existe por un motivo: lo que manda la persona puede
 * estar mal, y el RUT y la AFP mal puestos no se notan hasta la primera
 * liquidación. Así que se muestra lo que llegó al lado de lo que había, se
 * marca en ámbar lo que pisa un dato que ya existía, y nada se escribe hasta
 * que alguien acepta.
 */
async function pintarFichaIngreso(id) {
  $("#app").innerHTML = `<p class="cargando">Cargando la ficha que llegó…</p>`;
  const [d] = await Promise.all([pedir(`/rrhh/fichas-ingreso/${id}`), catalogosRrhh()]);
  const c = RRHH.catalogos;
  const f = d.ficha;
  const nuevos = d.comparacion.filter(x => x.cambia && !x.pisa);
  const pisados = d.comparacion.filter(x => x.pisa);

  $("#app").innerHTML = `
    <p style="margin-bottom:14px">
      <button class="bt bt--fino bt--chico" id="volver">← Volver a las fichas</button></p>

    ${d.rut_distinto ? aviso("mal", "El RUT no calza con el de la ficha que ya existe",
      `Escribió ${d.rut} y ${d.trabajador.nombre} está cargado con ${d.trabajador.rut}. `
      + "El RUT es su clave del libro de asistencia, así que no se cambia desde acá. "
      + "Llámelo, confirme cuál es el bueno y arréglelo en su ficha, o anule este enlace.") : ""}
    ${pisados.length ? aviso("ojo",
      `${pisados.length} dato${pisados.length > 1 ? "s" : ""} que cambia${pisados.length > 1 ? "n" : ""} algo que ya estaba`,
      "Van marcados abajo. Lo que llega donde no había nada es lo que se estaba buscando; "
      + "lo que pisa un dato distinto es lo que hay que mirar dos veces.") : ""}

    <dl class="resumen">
      <div class="ficha ficha--plata"><dt>${esc(f.nombre_referencia)}</dt>
        <dd style="font-size:1.1rem">${esc(d.rut || "sin RUT")}</dd>
        <small>Llegó el ${f.recibido_en ? fecha(f.recibido_en.slice(0, 10)) : "—"}
          · enlace generado por ${esc(f.creado_por)}</small></div>
      <div class="ficha"><dt>${d.trabajador ? "Ya está en el sistema" : "Es alguien nuevo"}</dt>
        <dd style="font-size:1.05rem">${d.trabajador ? esc(d.trabajador.nombre) : "Se va a crear"}</dd>
        <small>${d.trabajador
          ? `usuario ${esc(d.trabajador.usuario)}`
          : "Con su cuenta del libro de asistencia y el RUT de clave"}</small></div>
      <div class="ficha ${nuevos.length ? "" : "ficha--ojo"}"><dt>Datos nuevos</dt>
        <dd class="num">${nuevos.length}</dd>
        <small>${pisados.length} cambian algo que ya había</small></div>
    </dl>

    <section class="caja">
      <div class="caja__tit"><h2>Lo que llegó</h2>
        <span class="nota">Destilde lo que no quiera escribir</span></div>
      ${d.comparacion.length ? `<div class="desliza"><table class="comparar">
        <thead><tr><th style="width:34px"></th><th>Dato</th><th>Lo que hay hoy</th>
          <th>Lo que mandó</th></tr></thead><tbody>
        ${d.comparacion.map(x => `<tr${x.pisa ? ' class="fila--solicitar_oc"' : ""}>
          <td><input type="checkbox" class="campo-ok" value="${x.campo}"
            ${x.cambia ? " checked" : ""} style="width:auto"></td>
          <td><b>${esc(x.rotulo)}</b></td>
          <td>${x.actual ? esc(x.actual) : '<span class="sub" style="margin:0">—</span>'}</td>
          <td>${x.propuesto ? `<b>${esc(x.propuesto)}</b>` : '<span class="sub" style="margin:0">—</span>'}
            ${x.pisa ? '<span class="sub" style="color:var(--ambar)">pisa lo anterior</span>' : ""}</td>
        </tr>`).join("")}
      </tbody></table></div>` : `<p class="vacio">No mandó ningún dato.</p>`}

      <div style="padding:14px 16px 4px">
        ${d.trabajador ? "" : `<div class="rejilla">
          <label class="campo"><span>Cargo</span><select id="i-cargo">
            ${(d.cargos || c.cargos).map(x => `<option value="${x}">${rotCargo(x)}</option>`).join("")}</select>
            <span class="sub" style="margin:0">Esto no se le pregunta a la persona: lo decide la oficina.</span></label>
          <label class="campo"><span>Instalación habitual</span><select id="i-instalacion">
            <option value="">Sin asignar</option>
            ${c.instalaciones.map(i => `<option value="${i.id}">${esc(i.nombre)}</option>`).join("")}</select></label>
        </div>`}
        <label class="campo" style="margin-top:10px"><span>Nota de la revisión</span>
          <input id="i-nota" autocomplete="off" placeholder="Qué confirmó por teléfono, si confirmó algo"></label>
      </div>
      <div class="pie-form">
        <button class="bt" type="button" id="i-aceptar">${d.trabajador
          ? "Aceptar y escribir en su ficha" : "Aceptar y crear su ficha"}</button>
        <button class="bt bt--fino" type="button" id="i-anular">Anular este enlace</button>
        <span class="sub" style="margin:0">Hasta que apriete, nada de esto está en el sistema.</span>
        <span class="mensaje"></span>
      </div>
    </section>`;

  const volver = () => { RRHH.verIngreso = null; pintarPersonal(); };
  $("#volver").onclick = volver;

  $("#i-aceptar").onclick = async () => {
    const bt = $("#i-aceptar"), m = $("#app .pie-form .mensaje");
    const campos = [...document.querySelectorAll(".campo-ok:checked")].map(x => x.value);
    decir(m, "Guardando…"); bt.disabled = true;
    try {
      const r = await pedir(`/rrhh/fichas-ingreso/${id}/aceptar`, { method: "POST",
        body: JSON.stringify({
          campos,
          cargo: $("#i-cargo") ? $("#i-cargo").value : undefined,
          instalacion_id: $("#i-instalacion") ? $("#i-instalacion").value : undefined,
          nota_revision: $("#i-nota").value,
        }) });
      RRHH.verIngreso = null; RRHH.panel = null; RRHH.personal = null;
      // Se abre su ficha: lo siguiente que hay que hacer con esta persona es
      // cargarle el contrato y sus papeles, y eso está ahí.
      RRHH.verFicha = r.trabajador_id;
      pintarFicha(r.trabajador_id);
    } catch (e) { decir(m, e.message, "error"); bt.disabled = false; }
  };

  $("#i-anular").onclick = async () => {
    const motivo = prompt("¿Por qué se anula?\n\nLo que mandó queda guardado, pero no se escribe "
      + "en ninguna ficha.");
    if (motivo === null) return;
    try {
      await pedir(`/rrhh/fichas-ingreso/${id}`, { method: "PATCH",
        body: JSON.stringify({ motivo }) });
      volver();
    } catch (e) { alert(e.message); }
  };
}

  const { ficha: t, contratos, contrato_vigente: cv, documentos, ausencias, feriado } = datos;

  $("#app").innerHTML = `

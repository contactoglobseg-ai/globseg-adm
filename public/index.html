<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Administración · Seguridad Garridos</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700&family=Archivo:wght@400;500;600;700&display=swap">
<script>
// Antes de pintar nada: si hay tema o tamaño guardados, se aplican ya. Si algo
// falla acá, la página igual carga con los valores por defecto.
try {
  var t = localStorage.getItem("globseg.tema");
  if (t === "claro" || t === "oscuro") document.documentElement.dataset.tema = t;
  var e = localStorage.getItem("globseg.escala");
  if (e) document.documentElement.style.setProperty("--escala", e);
} catch (_) {}
</script>
<link rel="stylesheet" href="apariencia.css">
<style>
/* Los tokens —colores, tamaños, formas, los dos temas— viven en
   apariencia.css, que cargan esta página y el libro de asistencia. Acá abajo
   va solo lo propio del panel. */

/* ---------- marco ---------- */
.barra{background:var(--cromo);color:var(--texto);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--cromo-borde);
  padding:7px clamp(12px,2vw,20px);padding-top:calc(7px + env(safe-area-inset-top,0px));
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:50px;
  position:sticky;top:0;z-index:20}
.marca{display:flex;align-items:center;gap:10px;margin-right:auto}
.marca img{width:28px;height:28px}
.marca b{font-family:var(--marca);font-size:1.05rem;text-transform:uppercase;letter-spacing:.02em}
.marca span{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--texto-3);display:block}

/* Pestañas en píldora: la activa se llena, no se subraya. */
.pestanas{display:flex;gap:2px;flex-wrap:wrap}
.pestanas button{background:none;border:0;color:var(--texto-2);
  font:500 .85rem var(--cuerpo);letter-spacing:-.01em;
  padding:6px 10px;border-radius:980px;cursor:pointer;white-space:nowrap}
.pestanas button:hover{color:var(--texto);background:var(--sup-3)}
.pestanas button[aria-current="true"]{color:var(--acento);background:var(--acento-suave);font-weight:600}
.barra__fin{display:flex;align-items:center;gap:11px;flex-wrap:wrap;
  justify-content:flex-end;margin-left:auto}
.quien{font-size:.78rem;color:var(--texto-3);text-align:right;line-height:1.3}
.quien b{display:block;color:var(--texto);font-weight:600;font-size:.85rem}

main{padding:clamp(16px,2.5vw,28px);max-width:1500px;margin-inline:auto}
.cargando{padding:60px 0;text-align:center;color:var(--texto-2)}

/* ---------- controles de apariencia ---------- */
.ajustes{display:flex;align-items:center;gap:6px}
.segmento{display:inline-flex;background:var(--sup-3);border-radius:980px;padding:2px;gap:2px}
.segmento button{border:0;background:none;cursor:pointer;color:var(--texto-2);
  font:500 .72rem var(--cuerpo);padding:5px 8px;border-radius:980px;line-height:1.2;
  min-width:26px;transition:background-color .15s,color .15s}
.segmento button:hover{color:var(--texto)}
.segmento button[aria-pressed="true"]{background:var(--sup);color:var(--texto);
  font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.segmento--letra button:nth-child(1){font-size:.7rem}
.segmento--letra button:nth-child(2){font-size:.82rem}
.segmento--letra button:nth-child(3){font-size:.95rem}
.segmento--letra button:nth-child(4){font-size:1.08rem}

/* En teléfono el encabezado se comía un cuarto de la pantalla antes de mostrar
   un solo dato. Se aprieta todo y el bajada de la marca sale: el escudo y
   "Administración" ya dicen dónde está uno. */
@media (max-width:620px){
  .barra{gap:8px;padding:6px 12px;padding-top:calc(6px + env(safe-area-inset-top,0px))}
  .marca{gap:8px}
  .marca img{width:24px;height:24px}
  .marca b{font-size:.98rem}
  .marca>span>span{display:none}
  .pestanas{gap:1px}
  .pestanas button{padding:5px 9px;font-size:.8rem}
  .barra__fin{gap:8px}
  .segmento button{padding:4px 7px;font-size:.68rem;min-width:22px}
  .quien{font-size:.72rem}
  .quien b{font-size:.8rem}
}

/* ---------- avisos ---------- */
.aviso{border-radius:4px;padding:14px 16px;margin-bottom:18px;display:flex;gap:12px;
  align-items:flex-start;font-size:.92rem;line-height:1.5}
.aviso b{display:block;font-weight:600;margin-bottom:2px}
.aviso--mal{background:var(--rojo-suave);color:var(--rojo)}
.aviso--ojo{background:var(--ambar-suave);color:var(--ambar)}
.aviso--bien{background:var(--verde-suave);color:var(--verde)}
.aviso svg{width:20px;height:20px;flex:none;margin-top:1px}

/* ---------- tarjetas de resumen ---------- */
.resumen{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:12px;margin-bottom:20px}
.ficha{background:var(--sup);border:1px solid var(--borde-suave);border-radius:var(--r);
  padding:16px 18px;box-shadow:var(--sombra)}
.ficha dt{font-size:.8rem;color:var(--texto-2);font-weight:500;letter-spacing:-.005em}
.ficha dd{margin:8px 0 0;font-size:1.8rem;line-height:1.05;font-weight:600;
  letter-spacing:-.03em;overflow-wrap:anywhere}
.ficha small{display:block;margin-top:6px;font-size:.78rem;color:var(--texto-3)}
.ficha--ojo dd{color:var(--ambar)} .ficha--plata dd{color:var(--texto)}

/* ---------- tablas ---------- */
.caja{background:var(--sup);border:1px solid var(--borde-suave);border-radius:var(--r);
  overflow:hidden;margin-bottom:22px;box-shadow:var(--sombra)}
.caja__tit{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:13px 16px;background:var(--sup-2);border-bottom:1px solid var(--borde-suave)}
.caja__tit h2{font-size:1.02rem}
.caja__tit .nota{font-size:.82rem;color:var(--texto-3);margin-left:auto}
.desliza{overflow-x:auto}
.desliza table{min-width:1080px}
.sub{color:var(--texto-3);font-size:.8rem;display:block;margin-top:2px}
.nowrap{white-space:nowrap}
td b{display:block}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{text-align:left;font-size:.72rem;letter-spacing:.02em;
  color:var(--texto-3);font-weight:500;padding:10px 12px;
  border-bottom:1px solid var(--borde-suave);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--borde-suave);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--sup-2)}
td.num,th.num{text-align:right}
.vacio{padding:30px 16px;text-align:center;color:var(--texto-3);font-size:.9rem}

/* Formularios de "agregar" plegados: la ficha de una persona tiene cuatro
   secciones con alta propia, y desplegadas todas no se ve ningún dato. */
details.agregar{border-top:1px solid var(--borde-suave)}
details.agregar>summary{cursor:pointer;padding:13px 16px;font-size:.86rem;font-weight:600;
  color:var(--acento);list-style:none;display:flex;align-items:center;gap:8px}
details.agregar>summary::-webkit-details-marker{display:none}
details.agregar>summary::before{content:"+";font-size:1.05rem;line-height:1;
  width:18px;height:18px;border-radius:50%;background:var(--acento-suave);
  display:inline-flex;align-items:center;justify-content:center}
details.agregar[open]>summary::before{content:"−"}
details.agregar>summary:hover{background:var(--sup-2)}
details.agregar[open]>summary{border-bottom:1px solid var(--borde-suave)}

/* ---------- cobranza ---------- */
.p-pagado{background:var(--verde-suave);color:var(--verde)}
.p-factorizado{background:var(--violeta-suave);color:var(--violeta)}
.p-por_cobrar{background:var(--cian-suave);color:var(--cian)}
.p-por_cobrar.atrasado{background:var(--ambar-suave);color:var(--ambar)}
tr.fila--cobrado td:first-child{box-shadow:inset 3px 0 0 var(--verde)}
tr.fila--facturado td:first-child{box-shadow:inset 3px 0 0 var(--cian)}
tr.fila--atrasado td:first-child{box-shadow:inset 3px 0 0 var(--ambar)}

/* ---------- estados ---------- */
.sello{display:inline-block;font-size:.7rem;letter-spacing:.01em;
  font-weight:700;padding:4px 8px;border-radius:3px;white-space:nowrap}
.e-solicitar_oc{background:var(--ambar-suave);color:var(--ambar)}
.e-pendiente_facturacion{background:var(--cian-suave);color:var(--cian)}
.e-cerrado{background:var(--verde-suave);color:var(--verde)}
.e-en_curso{background:var(--gris-suave);color:var(--gris)}
tr.fila--cerrado{background:var(--sup-2)}
tr.fila--cerrado td:first-child{box-shadow:inset 3px 0 0 var(--verde)}
tr.fila--solicitar_oc td:first-child{box-shadow:inset 3px 0 0 var(--ambar)}

/* ---------- jornadas corregidas por la oficina ----------
   Una jornada que cerró la oficina no puede parecerse a una que marcó el
   guardia: el libro vale por eso. Franja cian al costado y el nombre de quien
   la corrigió en la misma fila, no escondido en un tooltip. */
tr.fila--corregida td:first-child{box-shadow:inset 3px 0 0 var(--cian)}
.e-corregida{background:var(--cian-suave);color:var(--cian)}
tr[hidden]{display:none}
tr.fila-corr td,tr.fila-corr:hover td{background:var(--sup-2);padding:0}

/* ---------- cotizaciones ---------- */
.cot__cab{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;padding:16px}
.lineas{width:100%;border-collapse:collapse}
.lineas th{font-size:.64rem;padding:8px 10px}
.lineas td{padding:6px 8px;vertical-align:middle;border-bottom:1px solid var(--sup-2)}
.lineas input,.lineas select{padding:7px 9px;font-size:.86rem}
.lineas td.num input{text-align:right}
.lineas .quitar{background:none;border:0;color:var(--texto-2);cursor:pointer;font-size:1.1rem;
  line-height:1;padding:4px 7px;border-radius:3px}
.lineas .quitar:hover{color:var(--rojo);background:var(--rojo-suave)}
.col-desc{min-width:260px} .col-cant{width:92px} .col-uni{width:96px}
.col-precio{width:124px} .col-sub{width:124px} .col-x{width:40px}
.sumas{margin-left:auto;min-width:290px;padding:16px 18px;background:var(--sup-2);
  border-radius:var(--r);border:1px solid var(--borde-suave)}
.sumas div{display:flex;justify-content:space-between;gap:20px;padding:5px 0;font-size:.92rem}
.sumas .total{border-top:1px solid var(--borde);margin-top:8px;padding-top:11px;
  font-family:var(--display);font-size:1.5rem;font-weight:700;align-items:baseline}
.e-borrador{background:var(--gris-suave);color:var(--gris)}
.e-enviada{background:var(--cian-suave);color:var(--cian)}
.e-aceptada{background:var(--verde-suave);color:var(--verde)}
.e-rechazada{background:var(--rojo-suave);color:var(--rojo)}
.vencida{color:var(--ambar);font-size:.76rem}

/* ---------- entrada ---------- */
.puerta{min-height:100%;display:grid;place-items:center;padding:24px 16px;background:var(--fondo)}
.puerta__caja{width:100%;max-width:400px;background:var(--sup);border-radius:16px;
  border:1px solid var(--borde-suave);box-shadow:var(--sombra-alta);overflow:hidden}
.puerta__tit{padding:26px 26px 18px;display:flex;align-items:center;gap:12px}
.puerta__tit img{width:40px;height:40px}
.puerta__tit b{display:block;font-family:var(--marca);font-size:1.2rem;text-transform:uppercase}
.puerta__tit span{display:block;font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--texto-3);margin-top:3px}
.puerta form{padding:6px 26px 26px;display:flex;flex-direction:column;gap:14px}
.puerta .campo>span{color:var(--texto-2)}
.puerta .bt{justify-content:center;padding:12px;font-size:.92rem}
.puerta__aviso{margin:0 26px 24px;padding:12px 14px;border-radius:var(--r-s);
  font-size:.84rem;line-height:1.5}

/* ---------- controles ---------- */
.bt{display:inline-flex;align-items:center;gap:7px;font:600 .86rem var(--cuerpo);
  letter-spacing:-.01em;padding:9px 16px;border-radius:980px;border:1px solid transparent;
  cursor:pointer;background:var(--btn);color:var(--btn-texto);
  transition:background-color .15s,transform .08s}
.bt:hover{background:var(--btn-alta)}
.bt:active{transform:scale(.97)}
.bt--fino{background:var(--sup-3);color:var(--acento);border-color:transparent}
.bt--fino:hover{background:var(--borde-suave)}
.bt--chico{padding:6px 12px;font-size:.8rem}
a.bt{text-decoration:none}
.bt[disabled]{opacity:.42;cursor:not-allowed}
.bt[disabled]:active{transform:none}
label.campo{display:flex;flex-direction:column;gap:5px;font-size:.84rem;color:var(--texto-2);min-width:0}
label.campo>span{font-weight:500;letter-spacing:-.005em;font-size:.8rem;color:var(--texto-2)}
input,select,textarea{font:400 .92rem var(--cuerpo);color:var(--texto);background:var(--sup);
  border:1px solid var(--borde);border-radius:var(--r-s);padding:9px 11px;width:100%;
  caret-color:var(--acento);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acento);
  box-shadow:0 0 0 3.5px var(--acento-suave)}
input::placeholder{color:var(--texto-3)}
.rejilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;padding:16px}
.pie-form{padding:0 16px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.error{color:var(--rojo);font-size:.82rem;font-weight:500}
.ok{color:var(--verde);font-size:.82rem;font-weight:600}
details.detalle{border-top:1px solid var(--sup-2)}
details.detalle>summary{cursor:pointer;padding:9px 12px;font-size:.8rem;color:var(--acento);
  font-weight:600;list-style:none}
details.detalle>summary::-webkit-details-marker{display:none}
details.detalle>summary::before{content:"▸ ";display:inline-block;transition:transform .15s}
details.detalle[open]>summary::before{content:"▾ "}

/* ---------- selección de varias filas ---------- */
th.sel,td.sel{width:38px;padding-left:14px;padding-right:0}
th.sel input,td.sel input{width:16px;height:16px;accent-color:var(--btn);cursor:pointer;
  margin:0;padding:0}
tr.marcada{background:var(--acento-suave)}
tr.marcada:hover{background:var(--acento-suave)}

/* Panel flotante, no una franja pegada al borde: se despega del contenido y
   deja ver que hay tabla debajo. */
.barra-sel{position:fixed;left:0;right:0;z-index:30;
  bottom:calc(14px + env(safe-area-inset-bottom,0px));
  padding:0 clamp(10px,3vw,26px);pointer-events:none}
.barra-sel__fila,.barra-sel .omitidos{pointer-events:auto}
.barra-sel__fila{max-width:1100px;margin-inline:auto;
  background:var(--cromo);border:1px solid var(--cromo-borde);border-radius:16px;
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  box-shadow:var(--sombra-alta);padding:11px 14px;
  display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.barra-sel__n{font-size:1.25rem;font-weight:600;line-height:1.05;white-space:nowrap;
  letter-spacing:-.02em}
.barra-sel__n span{display:block;font-size:.72rem;font-weight:500;letter-spacing:-.005em;
  text-transform:none;color:var(--texto-3);margin-top:2px}
.barra-sel select,.barra-sel input{width:auto;min-width:0;padding:7px 10px;font-size:.86rem}
.barra-sel .bt--mal{background:var(--rojo);border-color:transparent;color:#fff}
.barra-sel .bt--mal:hover{filter:brightness(1.1)}
.barra-sel .mensaje{font-size:.84rem;color:var(--texto-2)}
.barra-sel .bt[disabled]{opacity:.42}
.omitidos{max-width:1100px;margin:8px auto 0;padding:10px 14px 10px 30px;border-radius:12px;
  background:var(--rojo-suave);border:1px solid var(--cromo-borde);
  font-size:.82rem;line-height:1.55;color:var(--rojo);
  max-height:132px;overflow-y:auto}
/* Lo que no se hizo va en rojo; lo que sí se hizo pero hay que saber, en ámbar. */
.omitidos--ojo{background:var(--ambar-suave);color:var(--ambar)}

/* ---------- calendario ---------- */
.mes{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.mes .bt{padding:7px 12px}
.salto{display:flex;gap:6px;align-items:center}
.salto select{width:auto;font-size:1.05rem;font-weight:600;letter-spacing:-.02em;
  padding:7px 10px;border-radius:var(--r-s);background:var(--sup);text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;
  background:var(--borde-suave);border:1px solid var(--borde-suave);
  border-radius:var(--r);overflow:hidden;box-shadow:var(--sombra)}
.cal__dia-sem{background:var(--sup-2);padding:9px 10px;font-size:.72rem;font-weight:600;
  letter-spacing:-.005em;color:var(--texto-3)}
.cal__dia{background:var(--sup);min-height:104px;padding:7px 8px;
  display:flex;flex-direction:column;gap:3px}
.cal__dia--fuera{background:var(--sup-2);opacity:.5}
.cal__dia--hoy{box-shadow:inset 0 0 0 2px var(--btn)}
.cal__n{font-size:.95rem;font-weight:500;line-height:1.1;color:var(--texto-2)}
.cal__dia--hoy .cal__n{color:var(--btn);font-weight:700}
.chip{display:block;width:100%;text-align:left;border:0;border-radius:var(--r-xs);cursor:pointer;
  padding:3px 6px;font:600 .7rem/1.3 var(--cuerpo);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.chip--inicio{background:var(--gris-suave);color:var(--gris)}
.chip--cierre{background:var(--ambar-suave);color:var(--ambar)}
.chip--extra{background:var(--cian-suave);color:var(--cian)}
.chip--extra.suelto{background:var(--rojo-suave);color:var(--rojo)}
.chip--factura{background:var(--verde-suave);color:var(--verde)}
.chip--mas{background:var(--sup-2);color:var(--texto-2)}
.cal__chips{display:flex;flex-direction:column;gap:3px;min-width:0}
.leyenda{display:flex;gap:14px;flex-wrap:wrap;margin:12px 0 0;font-size:.76rem;color:var(--texto-2)}
.leyenda span{display:flex;align-items:center;gap:5px}
.leyenda i{width:10px;height:10px;border-radius:50%;display:inline-block}
/* En teléfono el texto del chip no alcanza a leerse: queda un "$5…" que no
   dice nada. Mejor un punto de color, y el detalle al tocar el día. */
@media (max-width:620px){
  .cal__dia{min-height:58px;padding:5px 6px;gap:5px}
  .cal__chips{flex-direction:row;flex-wrap:wrap;gap:4px}
  /* currentColor es el color fuerte del chip: así el punto calza con la
     leyenda en vez de quedar en el tono pálido del fondo. */
  /* Con .chip a secas, la regla de dos clases .chip--extra.suelto le gana y el
     punto queda rosa pálido en vez de rojo. */
  .cal__chips .chip{width:9px;height:9px;padding:0;border-radius:50%;flex:none;
    background:currentColor}
  .chip span{display:none}
  .chip--mas{box-shadow:inset 0 0 0 1px var(--borde)}
  .salto select{font-size:.95rem;padding:6px 8px}
}
.barra-sel label.campo{gap:2px}
.barra-sel label.campo>span{color:var(--texto-3);font-size:.7rem}
.recado{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:50;
  background:var(--cromo);color:var(--texto);border:1px solid var(--cromo-borde);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  padding:12px 18px;border-radius:980px;font-size:.88rem;font-weight:500;
  box-shadow:var(--sombra-alta);display:flex;align-items:center;gap:9px;max-width:92vw}
.recado::before{content:"";width:8px;height:8px;border-radius:50%;flex:none;
  background:var(--verde)}
.recado--mal::before{background:var(--ambar)}
body.hay-seleccion .recado{bottom:104px}
</style>
</head>
<body>

<header class="barra">
  <div class="marca">
    <img src="logo.png" alt="">
    <span>
      <b>Administración</b>
      <span>Seguridad Garridos</span>
    </span>
  </div>
  <nav class="pestanas" id="pestanas" aria-label="Secciones"></nav>
  <div class="barra__fin">
  <div class="ajustes">
    <div class="segmento" role="group" aria-label="Apariencia" id="seg-tema">
      <button type="button" data-tema="claro">Claro</button>
      <button type="button" data-tema="oscuro">Oscuro</button>
      <button type="button" data-tema="auto">Auto</button>
    </div>
    <div class="segmento segmento--letra" role="group" aria-label="Tamaño de la letra" id="seg-letra">
      <button type="button" data-escala="0.875" aria-label="Letra chica">A</button>
      <button type="button" data-escala="1" aria-label="Letra normal">A</button>
      <button type="button" data-escala="1.125" aria-label="Letra grande">A</button>
      <button type="button" data-escala="1.25" aria-label="Letra muy grande">A</button>
    </div>
  </div>
  <div class="quien" id="quien"></div>
  </div>
</header>

<main id="app">
  <p class="cargando">Cargando…</p>
</main>

<script src="apariencia.js"></script>
<script>
"use strict";

const $ = (s, r = document) => r.querySelector(s);

/** Escribe en un cartel de estado conservando su clase .mensaje: asignar
 *  className a secas la borraba, y el siguiente intento ya no encontraba el
 *  elemento. tipo: "", "ok" o "error". */
function decir(el, texto, tipo = "") {
  if (!el) return;
  el.className = "mensaje" + (tipo ? " " + tipo : "");
  el.textContent = texto;
}
const clp = n => "$" + (Math.round(n || 0)).toLocaleString("es-CL");
const fecha = s => s ? s.split("-").reverse().join("-") : "—";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const ROTULO = {
  solicitar_oc: "Solicitar OC",
  pendiente_facturacion: "Pendiente de facturación",
  cerrado: "Facturado",
  en_curso: "En curso",
};

const ROTULO_PAGO = {
  por_cobrar: "Por cobrar",
  pagado: "Pagado",
  factorizado: "Factorizado",
};

/** Una factura sin cobrar a más de 45 días merece verse distinto. */
const atrasado = c => c.estado === "cerrado" && c.pago_estado === "por_cobrar"
  && (c.dias_desde_factura || 0) > 45;

/** El color de la fila dice lo que de verdad importa: si entró la plata. */
function marcaDeFila(c) {
  if (c.estado !== "cerrado") return c.estado === "solicitar_oc" ? "solicitar_oc" : c.estado;
  if (c.pago_estado !== "por_cobrar") return "cobrado";
  return atrasado(c) ? "atrasado" : "facturado";
}

const hoyISO = () => new Date().toISOString().slice(0, 10);


// ------------------------------------------- seleccionar varias filas a la vez
/**
 * Un solo motor para todas las tablas. Cada casilla dice de qué tipo es y qué
 * id tiene; marcar algo de otro tipo descarta lo anterior, porque las acciones
 * no son las mismas y mezclarlas solo lleva a equivocarse.
 *
 * Lo que el servidor omite vuelve marcado y con el motivo a la vista: así nadie
 * se queda con la idea de que se hicieron diez cuando se hicieron ocho.
 */
const seleccion = { tipo: null, ids: new Set(), op: 0, campos: {}, aviso: null };

const celdaSel = (tipo, id) =>
  `<td class="sel"><input type="checkbox" data-sel="${tipo}:${id}" aria-label="Seleccionar esta fila"></td>`;
const cabeceraSel = tipo =>
  `<th class="sel"><input type="checkbox" data-sel-todo="${tipo}" aria-label="Seleccionar todas"></th>`;

const ACCIONES = {
  ciclos: {
    rotulo: n => n === 1 ? "periodo marcado" : "periodos marcados",
    nombre: n => n === 1 ? "periodo" : "periodos",
    nota: "Para detener un servicio y sus periodos, vaya a Servicios.",
    opciones: [
      { rot: "Marcar como pagado", accion: "pago_estado", valor: "pagado",
        pide: ["fecha"], boton: "Marcar pagado" },
      { rot: "Marcar como factorizado", accion: "pago_estado", valor: "factorizado",
        pide: ["fecha", "factoring"], boton: "Marcar factorizado" },
      { rot: "Volver a por cobrar", accion: "pago_estado", valor: "por_cobrar",
        boton: "Volver a por cobrar" },
      { rot: "Eliminar", accion: "borrar", peligro: true, boton: "Eliminar", soloBorrador: true,
        confirmar: (n, ids) => {
          const sel = (estado.panel?.ciclos || []).filter(c => ids.includes(c.id));
          const conFactura = sel.filter(c => c.factura_folio);
          return `¿Eliminar ${n} periodo${n > 1 ? "s" : ""}?\n\n`
            + (conFactura.length
                ? `OJO: ${conFactura.length} ya tiene${conFactura.length > 1 ? "n" : ""} factura registrada (folio ${conFactura.map(c => c.factura_folio).join(", ")}).\n\n`
                : "")
            + "Los servicios extra que tengan quedan sin asignar, no se borran.";
        } },
    ],
  },
  extras: {
    rotulo: n => n === 1 ? "extra marcado" : "extras marcados",
    nombre: n => n === 1 ? "extra" : "extras",
    opciones: [
      { rot: "Asignar a un periodo", accion: "asignar", pide: ["ciclo"], boton: "Asignar" },
      { rot: "Dejar sin asignar", accion: "asignar", valor: null, boton: "Dejar sueltos" },
      { rot: "Eliminar", accion: "borrar", peligro: true, boton: "Eliminar", soloBorrador: true,
        confirmar: n => `¿Eliminar ${n} servicio${n > 1 ? "s" : ""} extra?\n\nEs trabajo que se hizo: borrado, ya no se cobra. Los que estén dentro de un periodo ya facturado no se tocan.` },
    ],
  },
  servicios: {
    rotulo: n => n === 1 ? "servicio marcado" : "servicios marcados",
    nombre: n => n === 1 ? "servicio" : "servicios",
    opciones: [
      { rot: "Dar de baja", accion: "activo", valor: false, boton: "Dar de baja",
        confirmar: n => `¿Dar de baja ${n} servicio${n > 1 ? "s" : ""}?\n\nDejan de generarse periodos nuevos. Todo lo registrado se conserva.` },
      { rot: "Reactivar", accion: "activo", valor: true, boton: "Reactivar" },
      { rot: "Recalcular fechas del ciclo", accion: "recalcular", boton: "Recalcular",
        confirmar: n => `¿Recalcular las fechas de ${n} servicio${n > 1 ? "s" : ""}?\n\nEl sistema ya endereza solo los periodos libres; esto sirve después de cambiar el tipo de ciclo. Los que tienen OC o factura NO se tocan: esas son las fechas del documento que tiene el cliente.` },
      { rot: "Eliminar", accion: "borrar", peligro: true, boton: "Eliminar", soloBorrador: true,
        confirmar: n => `¿Eliminar ${n} servicio${n > 1 ? "s" : ""}?\n\nSe borran también todos sus periodos. Los que tengan periodos ya facturados no se borran: a esos deles de baja.` },
    ],
  },
  instalaciones: {
    rotulo: n => n === 1 ? "instalación marcada" : "instalaciones marcadas",
    nombre: n => n === 1 ? "instalación" : "instalaciones",
    nota: "Dar de baja la saca de las listas sin perder nada de lo registrado.",
    opciones: [
      { rot: "Dar de baja", accion: "activa", valor: false, boton: "Dar de baja",
        confirmar: n => `¿Dar de baja ${n} instalación${n > 1 ? "es" : ""}?\n\nDejan de aparecer en los desplegables. Todo lo registrado se conserva.` },
      { rot: "Reactivar", accion: "activa", valor: true, boton: "Reactivar" },
      { rot: "Eliminar", accion: "borrar", peligro: true, boton: "Eliminar", soloBorrador: true,
        confirmar: n => `¿Eliminar ${n} instalación${n > 1 ? "es" : ""}?\n\nSolo se borran las que no tengan ningún servicio ni servicio extra. Las demás quedan marcadas con el motivo.` },
    ],
  },
  cotizaciones: {
    rotulo: n => n === 1 ? "cotización marcada" : "cotizaciones marcadas",
    nombre: n => n === 1 ? "cotización" : "cotizaciones",
    opciones: [
      { rot: "Marcar como enviada", accion: "estado", valor: "enviada", boton: "Marcar enviada" },
      { rot: "Marcar como aceptada", accion: "estado", valor: "aceptada", boton: "Marcar aceptada",
        confirmar: n => `¿Marcar ${n} como aceptada${n > 1 ? "s" : ""}?\n\nUna cotización aceptada ya no se puede editar.` },
      { rot: "Marcar como rechazada", accion: "estado", valor: "rechazada", boton: "Marcar rechazada" },
      { rot: "Volver a borrador", accion: "estado", valor: "borrador", boton: "Volver a borrador" },
      { rot: "Eliminar", accion: "borrar", peligro: true, boton: "Eliminar", soloBorrador: true,
        confirmar: n => `¿Eliminar ${n} cotización${n > 1 ? "es" : ""}?\n\nSe van también sus líneas. Las aceptadas quedan como respaldo y no se borran.` },
    ],
  },
  contactos: {
    rotulo: n => n === 1 ? "contacto marcado" : "contactos marcados",
    nombre: n => n === 1 ? "contacto" : "contactos",
    opciones: [
      { rot: "Marcar como contactado", accion: "estado", valor: "contactado", boton: "Marcar contactado" },
      { rot: "Marcar como cotizado", accion: "estado", valor: "cotizado", boton: "Marcar cotizado" },
      { rot: "Marcar como cerrado", accion: "estado", valor: "cerrado", boton: "Marcar cerrado" },
      { rot: "Marcar como descartado", accion: "estado", valor: "descartado", boton: "Descartar" },
      { rot: "Eliminar", accion: "borrar", peligro: true, boton: "Eliminar", soloBorrador: true,
        confirmar: n => `¿Eliminar ${n} contacto${n > 1 ? "s" : ""}? Son personas que pidieron que las llamaran.` },
    ],
  },
};

/** Vuelve a dibujar marcas y barra sin rehacer la tabla. */
function repintarSeleccion() {
  document.querySelectorAll("[data-sel]").forEach(c => {
    const [tipo, id] = c.dataset.sel.split(":");
    c.checked = seleccion.tipo === tipo && seleccion.ids.has(Number(id));
    c.closest("tr")?.classList.toggle("marcada", c.checked);
  });
  document.querySelectorAll("[data-sel-todo]").forEach(h => {
    const dentro = [...h.closest("table").querySelectorAll(`[data-sel^="${h.dataset.selTodo}:"]`)];
    h.checked = dentro.length > 0 && dentro.every(c => c.checked);
  });
  pintarBarraSel();
}

function cambiarTipo(tipo) {
  if (seleccion.tipo === tipo) return;
  seleccion.tipo = tipo;
  seleccion.ids.clear();
  seleccion.op = 0;
  seleccion.aviso = null;
}

/** Se llama después de pintar cualquier vista con tablas seleccionables. */
function conectarSeleccion() {
  const casillas = [...document.querySelectorAll("[data-sel]")];

  // Lo que ya no está en pantalla deja de estar seleccionado: así lo borrado
  // en la pasada anterior no sigue contando.
  if (seleccion.tipo) {
    const vivos = new Set(casillas
      .filter(c => c.dataset.sel.startsWith(seleccion.tipo + ":"))
      .map(c => Number(c.dataset.sel.split(":")[1])));
    seleccion.ids = new Set([...seleccion.ids].filter(id => vivos.has(id)));
  }

  for (const c of casillas) {
    const [tipo, id] = c.dataset.sel.split(":");
    c.onchange = () => {
      cambiarTipo(tipo);
      if (c.checked) seleccion.ids.add(Number(id)); else seleccion.ids.delete(Number(id));
      seleccion.aviso = null;
      repintarSeleccion();
    };
  }
  document.querySelectorAll("[data-sel-todo]").forEach(h => {
    const tipo = h.dataset.selTodo;
    h.onchange = () => {
      cambiarTipo(tipo);
      const dentro = [...h.closest("table").querySelectorAll(`[data-sel^="${tipo}:"]`)];
      for (const c of dentro) {
        const id = Number(c.dataset.sel.split(":")[1]);
        if (h.checked) seleccion.ids.add(id); else seleccion.ids.delete(id);
      }
      seleccion.aviso = null;
      repintarSeleccion();
    };
  });
  repintarSeleccion();
}

function campoSel(cual) {
  const v = seleccion.campos;
  if (cual === "fecha") {
    return `<label class="campo" style="color:var(--texto-3)"><span>Fecha en que entró</span>
      <input type="date" data-campo="fecha" value="${esc(v.fecha || hoyISO())}"></label>`;
  }
  if (cual === "factoring") {
    return `<label class="campo" style="color:var(--texto-3)"><span>Empresa de factoring</span>
      <input data-campo="factoring" value="${esc(v.factoring || "")}" placeholder="Quién compró la factura"></label>`;
  }
  if (cual === "ciclo") {
    const abiertos = (estado.panel?.ciclos || []).filter(c => c.estado !== "cerrado");
    return `<label class="campo" style="color:var(--texto-3)"><span>Periodo</span>
      <select data-campo="ciclo">
        <option value="">— elegir —</option>
        ${abiertos.map(c => `<option value="${c.id}"${String(v.ciclo) === String(c.id) ? " selected" : ""}>${esc(c.instalacion)} · N°${c.numero} (${fecha(c.desde)})</option>`).join("")}
      </select></label>`;
  }
  return "";
}

function pintarBarraSel() {
  $("#barra-sel")?.remove();
  const n = seleccion.ids.size;
  const def = ACCIONES[seleccion.tipo];
  // Una advertencia sobre algo que ya se hizo tiene que quedarse en pantalla
  // aunque no quede nada marcado, o nadie se entera.
  const soloAvisos = !n && seleccion.aviso?.avisos?.length > 0;
  if ((!n || !def) && !soloAvisos) {
    document.body.classList.remove("hay-seleccion");
    $("main").style.paddingBottom = "";
    return;
  }
  if (soloAvisos) return pintarBarraAvisos(def);
  if (seleccion.op >= def.opciones.length) seleccion.op = 0;
  const op = def.opciones[seleccion.op];
  const a = seleccion.aviso;
  // Borrar lo hace una sola persona. Al resto no se le esconde el botón: se le
  // muestra apagado y se le dice a quién pedírselo.
  const vetado = op.soloBorrador && estado.usuario?.puede_borrar !== true;
  const quienes = estado.quienBorra.length ? estado.quienBorra.join(" o ") : "la gerencia";

  const barra = document.createElement("div");
  barra.id = "barra-sel";
  barra.className = "barra-sel";
  barra.innerHTML = `
    <div class="barra-sel__fila">
      <span class="barra-sel__n">${n}<span>${def.rotulo(n)}</span></span>
      <select id="sel-accion" aria-label="Qué hacer con lo marcado">
        ${def.opciones.map((o, i) =>
          `<option value="${i}"${i === seleccion.op ? " selected" : ""}>${esc(o.rot)}</option>`).join("")}
      </select>
      ${(op.pide || []).map(campoSel).join("")}
      <button class="bt${op.peligro ? " bt--mal" : ""}" id="sel-aplicar"${vetado ? " disabled" : ""}>${esc(op.boton)}</button>
      <button class="bt bt--fino" id="sel-nada">Quitar selección</button>
      <span class="mensaje${vetado ? " error" : a ? (a.hechos ? " ok" : " error") : ""}">${
        vetado ? esc(`Solo ${quienes} puede eliminar. Pídaselo.`)
        : a ? esc(`${a.hechos} listo${a.hechos === 1 ? "" : "s"}${a.omitidos.length ? ` · ${a.omitidos.length} sin tocar` : ""}`)
          : esc(def.nota || "")}</span>
    </div>
    ${a && a.omitidos.length
      ? `<ul class="omitidos">${a.omitidos.map(o => `<li>${esc(o.razon)}</li>`).join("")}</ul>` : ""}
    ${a && a.avisos?.length
      ? `<ul class="omitidos omitidos--ojo">${a.avisos.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : ""}`;
  document.body.appendChild(barra);
  document.body.classList.add("hay-seleccion");
  // Sin este hueco la barra tapa las últimas filas de la tabla.
  $("main").style.paddingBottom = (barra.offsetHeight + 24) + "px";

  $("#sel-accion").onchange = ev => {
    seleccion.op = Number(ev.target.value);
    seleccion.aviso = null;
    pintarBarraSel();
    $("#sel-accion").focus();
  };
  barra.querySelectorAll("[data-campo]").forEach(c => {
    c.oninput = () => { seleccion.campos[c.dataset.campo] = c.value; };
  });
  $("#sel-nada").onclick = () => {
    seleccion.ids.clear();
    seleccion.aviso = null;
    repintarSeleccion();
  };
  if (!vetado) $("#sel-aplicar").onclick = aplicarSeleccion;
}

/** La barra cuando ya no queda nada marcado pero algo hay que advertir. */
function pintarBarraAvisos(def) {
  const a = seleccion.aviso;
  const barra = document.createElement("div");
  barra.id = "barra-sel";
  barra.className = "barra-sel";
  barra.innerHTML = `
    <div class="barra-sel__fila">
      <span class="barra-sel__n">${a.hechos}<span>${def ? def.nombre(a.hechos) : "registros"}</span></span>
      <span class="mensaje ok">Hecho. Lea esto antes de seguir:</span>
      <button class="bt bt--fino" id="sel-nada" style="margin-left:auto">Entendido</button>
    </div>
    <ul class="omitidos omitidos--ojo">${a.avisos.map(t => `<li>${esc(t)}</li>`).join("")}</ul>`;
  document.body.appendChild(barra);
  document.body.classList.add("hay-seleccion");
  $("main").style.paddingBottom = (barra.offsetHeight + 24) + "px";
  $("#sel-nada").onclick = () => {
    seleccion.aviso = null;
    repintarSeleccion();
  };
}

async function aplicarSeleccion() {
  const def = ACCIONES[seleccion.tipo];
  const op = def.opciones[seleccion.op];
  const ids = [...seleccion.ids];
  if (!ids.length) return;
  if (op.confirmar && !confirm(op.confirmar(ids.length, ids))) return;

  const cuerpo = { tipo: seleccion.tipo, accion: op.accion, ids };
  if ("valor" in op) cuerpo.valor = op.valor;
  for (const c of op.pide || []) {
    if (c === "fecha") cuerpo.fecha = seleccion.campos.fecha || hoyISO();
    if (c === "factoring") cuerpo.factoring = seleccion.campos.factoring || "";
    if (c === "ciclo") {
      if (!seleccion.campos.ciclo) {
        seleccion.aviso = { hechos: 0, omitidos: [{ razon: "Elija a qué periodo asignarlos" }] };
        return pintarBarraSel();
      }
      cuerpo.valor = Number(seleccion.campos.ciclo);
    }
  }

  const boton = $("#sel-aplicar");
  if (boton) { boton.disabled = true; boton.textContent = "Trabajando…"; }
  try {
    const r = await pedir("/lote", { method: "POST", body: JSON.stringify(cuerpo) });
    const omitidos = r.omitidos || [];
    const avisos = r.avisos || [];
    // Lo que no se pudo hacer queda marcado: así se ve sobre qué hay que volver.
    seleccion.ids = new Set(omitidos.map(o => o.id).filter(Boolean));
    seleccion.aviso = { hechos: r.hechos, omitidos, avisos };
    if (!omitidos.length && !avisos.length) {
      recado(`${r.hechos} ${def.nombre(r.hechos)}: listo`);
      seleccion.aviso = null;
    }
    await refrescarVista();
  } catch (e) {
    seleccion.aviso = { hechos: 0, omitidos: [{ razon: e.message }] };
    pintarBarraSel();
  }
}

/** Trae de nuevo los datos de la vista actual y la vuelve a pintar. */
async function refrescarVista() {
  if (estado.vista === "panel") await recargar();
  else ir(estado.vista);
}

let recadoReloj;
function recado(texto, tipo = "ok") {
  $("#recado")?.remove();
  const el = document.createElement("div");
  el.id = "recado";
  el.className = "recado" + (tipo === "mal" ? " recado--mal" : "");
  el.textContent = texto;
  document.body.appendChild(el);
  clearTimeout(recadoReloj);
  recadoReloj = setTimeout(() => el.remove(), 4200);
}

let estado = { usuario: null, quienBorra: [], panel: null, catalogos: null, vista: "panel" };

async function pedir(ruta, opciones) {
  const r = await fetch("/api" + ruta, {
    headers: { "content-type": "application/json" },
    ...opciones,
  });
  const cuerpo = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(cuerpo.error || `Error ${r.status}`);
  return cuerpo;
}

// ------------------------------------------------------------- vistas
function pintarPanel() {
  const { ciclos, extras_sueltos: sueltos, resumen: r } = estado.panel;
  const porEstado = e => ciclos.filter(c => c.estado === e);
  const pendientes = [...porEstado("solicitar_oc"), ...porEstado("pendiente_facturacion")];

  let html = "";

  if (r.extras_sin_asignar > 0) {
    html += aviso("mal",
      `${r.extras_sin_asignar} servicio${r.extras_sin_asignar > 1 ? "s" : ""} extra sin asignar a ningún periodo`,
      `Suman ${clp(r.neto_extras_sueltos)} neto y no se van a cobrar hasta que los asigne. Están al final de esta pantalla.`);
  }
  if (r.solicitar_oc > 0) {
    html += aviso("ojo",
      `${r.solicitar_oc} periodo${r.solicitar_oc > 1 ? "s ya cerraron" : " ya cerró"}`,
      "Hay que pedir la orden de compra al cliente para poder facturar.");
  }
  if (!r.extras_sin_asignar && !r.solicitar_oc && !r.pendiente_facturacion && ciclos.length) {
    html += aviso("bien", "No hay nada pendiente de cobro", "Todos los periodos cerrados o en curso.");
  }

  html += `<dl class="resumen">
    <div class="ficha ficha--plata"><dt>Neto por cobrar</dt><dd class="num">${clp(r.neto_por_cobrar)}</dd>
      <small>IVA aparte · ${ciclos.filter(c => c.estado !== "cerrado").length} periodos abiertos</small></div>
    <div class="ficha ficha--ojo"><dt>Solicitar OC</dt><dd class="num">${r.solicitar_oc}</dd>
      <small>El periodo ya cerró</small></div>
    <div class="ficha"><dt>Pendiente de facturación</dt><dd class="num">${r.pendiente_facturacion}</dd>
      <small>Con OC, sin factura</small></div>
    <div class="ficha ficha--ojo"><dt>Facturado sin cobrar</dt>
      <dd class="num">${clp(r.neto_facturado_sin_cobrar)}</dd>
      <small>${r.facturado_sin_cobrar} factura${r.facturado_sin_cobrar === 1 ? "" : "s"}${
        r.dias_mas_antiguo ? ` · la más antigua hace ${r.dias_mas_antiguo} días` : ""}</small></div>
    <div class="ficha"><dt>En curso</dt><dd class="num">${r.en_curso}</dd>
      <small>Periodo corriendo</small></div>
  </dl>`;

  html += tablaCiclos("Pendientes de cobro", pendientes,
    "Nada pendiente. Cuando un periodo cumpla 30 días aparece acá.");

  const cerrados = porEstado("cerrado"), enCurso = porEstado("en_curso");
  if (enCurso.length) html += tablaCiclos("Periodos en curso", enCurso, "");
  if (cerrados.length) html += tablaCiclos("Cerrados", cerrados, "");

  html += tablaSueltos(sueltos);
  $("#app").innerHTML = html;
  conectarPanel();
}

function aviso(tipo, titulo, texto) {
  const icono = tipo === "bien"
    ? '<path d="M4 12.5l5 5 11-11"/>'
    : '<path d="M12 8v5"/><circle cx="12" cy="16.5" r="1.1" fill="currentColor" stroke="none"/><path d="M10.3 3.9 2.6 17.4A2 2 0 0 0 4.3 20.4h15.4a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>';
  return `<div class="aviso aviso--${tipo}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${icono}</svg>
    <div><b>${esc(titulo)}</b>${esc(texto)}</div></div>`;
}

function tablaCiclos(titulo, filas, vacio) {
  if (!filas.length && !vacio) return "";
  const total = filas.reduce((t, c) => t + c.total_neto, 0);
  let h = `<section class="caja"><div class="caja__tit"><h2>${esc(titulo)}</h2>
    <span class="nota">${filas.length} · ${clp(total)} neto</span></div>`;
  if (!filas.length) return h + `<p class="vacio">${esc(vacio)}</p></section>`;
  h += `<div class="desliza"><table><thead><tr>
      ${cabeceraSel("ciclos")}
      <th>Instalación</th><th>Servicio</th><th>Periodo</th><th>Estado</th>
      <th class="num">Base</th><th class="num">Extras</th><th class="num">Neto</th>
      <th class="num">Total con IVA</th><th>OC</th><th>Factura</th><th>Cobranza</th><th></th>
    </tr></thead><tbody>`;
  for (const c of filas) {
    h += `<tr class="fila--${marcaDeFila(c)}">
      ${celdaSel("ciclos", c.id)}
      <td><b>${esc(c.instalacion)}</b><span class="sub">${esc(c.cliente)}</span></td>
      <td>${esc(c.servicio)}</td>
      <td class="num nowrap">N°${c.numero}<span class="sub nowrap">${fecha(c.desde)} → ${fecha(c.hasta)}</span></td>
      <td><span class="sello e-${c.estado}">${ROTULO[c.estado]}</span>
        ${c.estado === "solicitar_oc" && c.dias_desde_cierre > 0
          ? `<span class="sub" style="color:var(--ambar)">hace ${c.dias_desde_cierre} día${c.dias_desde_cierre > 1 ? "s" : ""}</span>` : ""}</td>
      <td class="num">${c.monto_neto ? clp(c.monto_neto) : "—"}</td>
      <td class="num">${c.extras_n ? `${clp(c.extras_neto)}<span class="sub">${c.extras_n} ítem${c.extras_n > 1 ? "s" : ""}</span>` : "—"}</td>
      <td class="num"><b>${clp(c.total_neto)}</b></td>
      <td class="num nowrap">${clp(c.total)}<span class="sub">IVA ${clp(c.iva)}</span></td>
      <td class="nowrap">${c.oc_numero ? esc(c.oc_numero) + `<span class="sub">${fecha(c.oc_fecha)}</span>` : "—"}</td>
      <td class="nowrap">${c.factura_folio ? esc(c.factura_folio) + `<span class="sub">${fecha(c.factura_fecha)}</span>` : "—"}</td>
      <td class="nowrap">${c.estado !== "cerrado" ? "—" : `
        <span class="sello p-${c.pago_estado}${atrasado(c) ? " atrasado" : ""}">${ROTULO_PAGO[c.pago_estado]}</span>
        ${c.pago_estado === "por_cobrar"
          ? (c.dias_desde_factura != null ? `<span class="sub">hace ${c.dias_desde_factura} días</span>` : "")
          : `<span class="sub">${fecha(c.pago_fecha)}${c.pago_monto ? " · " + clp(c.pago_monto) : ""}</span>`}
        ${c.factoring ? `<span class="sub">${esc(c.factoring)}</span>` : ""}`}</td>
      <td class="nowrap"><button class="bt bt--fino bt--chico" data-editar="${c.id}">${c.estado === "cerrado" ? "Ver" : "Registrar"}</button></td>
    </tr>
    <tr hidden data-form="${c.id}"><td colspan="13" style="background:var(--sup-2);padding:0">
      ${formCiclo(c)}
    </td></tr>`;
  }
  return h + "</tbody></table></div></section>";
}

    <div class="rejilla">
      <label class="campo"><span>N° de orden de compra</span>
        <input name="oc_numero" value="${esc(c.oc_numero || "")}" placeholder="OC-12345"></label>

    <div class="rejilla" style="padding-top:0">

    </div>
    <div class="pie-form">
      <button class="bt" type="submit">Guardar</button>
      <button class="bt bt--fino" type="button" data-cerrar="${c.id}">Cancelar</button>
      <span class="mensaje"></span>
      <span style="margin-left:auto;font-size:.8rem;color:var(--texto-2)">
        Con OC y folio queda facturado. Verde cuando la plata entró.</span>

  </form>`;
}

/**
 * Dice de dónde salió el precio de un extra. Un monto distinto al del tarifario
 * no es un error —hay servicios que se negocian— pero mirando la tabla nadie
 * tiene por qué adivinar cuál fue negociado y cuál no.
 */
function notaDePrecio(e) {
  if (!e.tarifa_id) {
    return `<span class="sub" style="color:var(--cian)">fuera del tarifario</span>`;
  }
  const t = (estado.catalogos?.tarifas || []).find(x => x.id === e.tarifa_id);
  if (!t || Number(t.precio) === Number(e.precio_unitario)) return "";
  return `<span class="sub" style="color:var(--ambar)">ajustado · lista ${clp(t.precio)}</span>`;
}

function tablaSueltos(sueltos) {
  let h = `<section class="caja"><div class="caja__tit">
    <h2>Servicios extra sin asignar</h2>
    <span class="nota">${sueltos.length} · ${clp(sueltos.reduce((t, e) => t + e.monto_neto, 0))} neto</span></div>`;
  if (!sueltos.length) {
    h += `<p class="vacio">Todos los servicios extra están asignados a un periodo.</p>`;
  } else {
    h += `<div class="desliza"><table><thead><tr>${cabeceraSel("extras")}
      <th>Fecha</th><th>Instalación</th><th>Ítem</th>
      <th class="num">Cant.</th><th class="num">Precio</th><th class="num">Neto</th>
      <th>Asignar al periodo</th></tr></thead><tbody>`;
    const abiertos = estado.panel.ciclos.filter(c => c.estado !== "cerrado");
    for (const e of sueltos) {
      h += `<tr>${celdaSel("extras", e.id)}<td class="num">${fecha(e.fecha)}</td><td>${esc(e.instalacion)}</td>
        <td>${esc(e.item)}${e.detalle ? `<br><span style="color:var(--texto-2);font-size:.8rem">${esc(e.detalle)}</span>` : ""}</td>
        <td class="num">${e.cantidad}</td>
        <td class="num nowrap">${clp(e.precio_unitario)}${notaDePrecio(e)}</td>
        <td class="num"><b>${clp(e.monto_neto)}</b></td>
        <td><select data-asignar="${e.id}">
          <option value="">— elegir —</option>
          ${abiertos.map(c => `<option value="${c.id}">${esc(c.instalacion)} · N°${c.numero} (${fecha(c.desde)})</option>`).join("")}
        </select></td></tr>`;
    }
    h += "</tbody></table></div>";
  }
  return h + "</section>";
}

function conectarPanel() {
  conectarSeleccion();
  document.querySelectorAll("[data-editar]").forEach(b => {
    b.onclick = () => {
      const fila = $(`[data-form="${b.dataset.editar}"]`);
      fila.hidden = !fila.hidden;
      if (!fila.hidden) fila.querySelector("input")?.focus();
    };
  });
  document.querySelectorAll("[data-cerrar]").forEach(b => {
    b.onclick = () => { $(`[data-form="${b.dataset.cerrar}"]`).hidden = true; };
  });
  document.querySelectorAll("form[data-ciclo]").forEach(f => {
    f.onsubmit = async ev => {
      ev.preventDefault();
      const msj = f.querySelector(".mensaje");
      const datos = Object.fromEntries(new FormData(f));
      decir(msj, "Guardando…");
      try {
        const r = await pedir(`/ciclos/${f.dataset.ciclo}`, { method: "PATCH", body: JSON.stringify(datos) });
        decir(msj, "Guardado · " + ROTULO[r.estado], "ok");
        await recargar({ repintar: false });
        setTimeout(() => { if (estado.vista === "panel") pintarPanel(); }, 650);
      } catch (e) { decir(msj, e.message, "error"); }
    };
  });
  document.querySelectorAll("[data-asignar]").forEach(s => {
    s.onchange = async () => {
      if (!s.value) return;
      try {
        await pedir(`/extras/${s.dataset.asignar}`, { method: "PATCH", body: JSON.stringify({ ciclo_id: Number(s.value) }) });
        await recargar();
      } catch (e) { alert(e.message); }
    };
  });
}

/**
 * Servicios continuos: el alta y, sobre todo, el listado de lo que ya existe.
 * Hasta acá solo se podían crear; sin una lista no había cómo corregir un
 * monto mal puesto ni detener un servicio que terminó, y el panel seguía
 * abriendo periodos de algo que ya nadie estaba cubriendo.
 */
let abrirFormServicio = false;

async function pintarServicios() {
  $("#app").innerHTML = `<p class="cargando">Cargando…</p>`;
  const { servicios } = await pedir("/servicios");
  const inst = estado.catalogos.instalaciones;
  const activos = servicios.filter(s => s.activo).length;
  const mostrarForm = abrirFormServicio || !servicios.length;

  const listaInst = `<datalist id="lista-inst">
      ${inst.map(i => `<option value="${esc(i.nombre)}">`).join("")}
    </datalist>
    <datalist id="lista-clientes">
      ${[...new Set(inst.map(i => i.cliente))].map(c => `<option value="${esc(c)}">`).join("")}
    </datalist>`;

  // Las fechas corregibles ya las endereza el sistema al entrar. Lo que queda
  // por avisar son las que no puede tocar solo, porque el cliente tiene un
  // documento con esas fechas.
  const congelados = servicios.filter(s => s.fechas_congeladas > 0);

  $("#app").innerHTML = `
    ${congelados.length ? aviso("ojo",
      `${congelados.length} servicio${congelados.length > 1 ? "s tienen" : " tiene"} periodos con fechas antiguas que el sistema no corrige solo`,
      "Son periodos con orden de compra o factura ya emitida: el cliente tiene un documento con esas fechas y cambiarlas dejaría al sistema diciendo otra cosa. El resto ya quedó al día.") : ""}
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap">
      <h2 style="font-size:1.5rem">Servicios</h2>
      <span class="nota" style="color:var(--texto-2);font-size:.85rem">
        ${activos} activo${activos === 1 ? "" : "s"}${servicios.length - activos
          ? ` · ${servicios.length - activos} de baja` : ""}</span>
      <button class="bt" id="nuevo-servicio" style="margin-left:auto">
        ${mostrarForm ? "Ocultar formulario" : "Nuevo servicio"}</button>
    </div>
    ${listaInst}

    <section class="caja" style="max-width:860px"${mostrarForm ? "" : " hidden"} id="caja-nuevo">
      ${aviso("ojo", "Acá empieza el control del cobro",
        "El día de inicio fija el día de cobro: un servicio que parte el 15 se cobra el 15 de cada mes. Al cerrar cada periodo, el sistema lo marca para solicitar la OC.")}
      <div class="caja__tit"><h2>Nuevo servicio</h2>
        <span class="nota">Si la instalación no existe todavía, escríbala y se crea sola</span></div>
      <form id="f-servicio">
        <div class="rejilla">
          <label class="campo" style="grid-column:1/-1"><span>Instalación o parque</span>
            <input name="instalacion" required list="lista-inst" autocomplete="off"
                   placeholder="Ej: PMGD Los Maitenes"></label>
          <label class="campo"><span>Cliente</span>
            <input name="cliente" list="lista-clientes" autocomplete="off"
                   placeholder="A quién se le factura"></label>
          <label class="campo"><span>Comuna</span>
            <input name="comuna" placeholder="Dónde queda"></label>
          <label class="campo" style="grid-column:1/-1"><span>Nombre del servicio</span>
            <input name="nombre" required placeholder="Ej: Vigilancia 24/7 con pareja de patrullaje"></label>
          <label class="campo"><span>Día de inicio</span>
            <input name="fecha_inicio" type="date" required value="${hoyISO()}" id="in-inicio"></label>
          <label class="campo"><span>Cada cuánto se cobra</span>
            <select name="ciclo_tipo" id="in-tipo">
              <option value="mensual" selected>Mensual, el mismo día de cada mes</option>
              <option value="dias">Cada cierta cantidad de días</option>
            </select></label>
          <label class="campo" id="campo-dias" hidden><span>Días del ciclo</span>
            <input name="dias_ciclo" type="number" min="1" max="365" value="30"></label>
          <label class="campo"><span>Monto base neto del periodo</span>
            <input name="monto_neto" type="number" min="0" step="1" placeholder="Opcional"></label>
        </div>
        <div class="pie-form">
          <button class="bt" type="submit">Crear servicio</button>
          <span class="mensaje"></span>
          <span style="margin-left:auto;font-size:.8rem;color:var(--texto-2)" id="aviso-ciclo"></span>
        </div>
      </form>
    </section>

    <section class="caja">
      <div class="caja__tit"><h2>Servicios cargados</h2>
        <span class="nota">Marque varios para darlos de baja o eliminarlos</span></div>
      ${servicios.length ? `<div class="desliza"><table style="min-width:980px"><thead><tr>
        ${cabeceraSel("servicios")}
        <th>Instalación</th><th>Servicio</th><th>Desde</th><th class="num">Cobro</th>
        <th class="num">Monto base</th><th class="num">Periodos</th><th>Situación</th><th></th>
      </tr></thead><tbody>
        ${servicios.map(s => `<tr${s.activo ? "" : ' style="opacity:.6"'}>
          ${celdaSel("servicios", s.id)}
          <td><b>${esc(s.instalacion)}</b><span class="sub">${esc(s.cliente)}${
            s.comuna ? " · " + esc(s.comuna) : ""}</span></td>
          <td>${esc(s.nombre)}</td>
          <td class="num nowrap">${fecha(s.fecha_inicio)}</td>
          <td class="num nowrap">${s.ciclo_tipo === "dias"
            ? `cada ${s.dias_ciclo} días`
            : `el ${Number(s.fecha_inicio.slice(8))} de cada mes`}${
            s.fechas_congeladas
              ? `<span class="sub" style="color:var(--ambar)">${s.fechas_congeladas} con OC o factura en fechas antiguas</span>` : ""}</td>
          <td class="num">${s.monto_neto ? clp(s.monto_neto) : "—"}</td>
          <td class="num">${s.periodos}<span class="sub">${s.periodos_cerrados} facturado${
            s.periodos_cerrados === 1 ? "" : "s"}</span></td>
          <td><span class="sello ${s.activo ? "e-cerrado" : "e-en_curso"}">${
            s.activo ? "Activo" : "De baja"}</span></td>
          <td class="nowrap"><button class="bt bt--fino bt--chico" data-editar-serv="${s.id}">Editar</button></td>
        </tr>
        <tr hidden data-form-serv="${s.id}"><td colspan="9" style="background:var(--sup-2);padding:0">
          ${formServicio(s)}
        </td></tr>`).join("")}
      </tbody></table></div>`
      : `<p class="vacio">Todavía no hay servicios cargados. Cree el primero con el formulario de arriba.</p>`}
    </section>`;

  conectarSeleccion();

  // El campo de días solo tiene sentido en el modo por días.
  const verDias = () => {
    const porDias = $("#in-tipo").value === "dias";
    $("#campo-dias").hidden = !porDias;
    const d = $("#in-inicio").value;
    $("#aviso-ciclo").textContent = porDias || !d ? ""
      : `Se cobrará el ${Number(d.slice(8))} de cada mes`;
  };
  if ($("#in-tipo")) {
    $("#in-tipo").onchange = verDias;
    $("#in-inicio").onchange = verDias;
    verDias();
  }

  document.querySelectorAll("[data-tipo]").forEach(sel => {
    sel.onchange = () => {
      $(`[data-campo-dias="${sel.dataset.tipo}"]`).hidden = sel.value !== "dias";
    };
  });

  $("#nuevo-servicio").onclick = () => {
    abrirFormServicio = !mostrarForm;
    pintarServicios();
  };

  $("#f-servicio").onsubmit = async ev => {
    ev.preventDefault();
    const f = ev.target, msj = f.querySelector(".mensaje");
    decir(msj, "Guardando…");
    try {
      await pedir("/servicios", { method: "POST", body: JSON.stringify(Object.fromEntries(new FormData(f))) });
      f.reset();
      abrirFormServicio = false;
      estado.catalogos = await pedir("/catalogos");
      await recargar({ repintar: false });
      recado("Servicio creado");
      await pintarServicios();
    } catch (e) { decir(msj, e.message, "error"); }
  };

  document.querySelectorAll("[data-editar-serv]").forEach(b => {
    b.onclick = () => {
      const fila = $(`[data-form-serv="${b.dataset.editarServ}"]`);
      fila.hidden = !fila.hidden;
      if (!fila.hidden) fila.querySelector("input")?.focus();
    };
  });
  document.querySelectorAll("[data-cerrar-serv]").forEach(b => {
    b.onclick = () => { $(`[data-form-serv="${b.dataset.cerrarServ}"]`).hidden = true; };
  });
  document.querySelectorAll("form[data-servicio]").forEach(f => {
    f.onsubmit = async ev => {
      ev.preventDefault();
      const msj = f.querySelector(".mensaje");
      const datos = Object.fromEntries(new FormData(f));
      datos.activo = f.querySelector("[name=activo]").value === "si";
      decir(msj, "Guardando…");
      try {
        await pedir(`/servicios/${f.dataset.servicio}`, { method: "PATCH", body: JSON.stringify(datos) });
        estado.catalogos = await pedir("/catalogos");
        await recargar({ repintar: false });
        recado("Servicio actualizado");
        await pintarServicios();
      } catch (e) { decir(msj, e.message, "error"); }
    };
  });
}

/**
 * Las instalaciones son el catálogo que alimenta los desplegables de todo el
 * sistema. Hasta acá se creaban al escribir el nombre en un servicio, pero un
 * nombre mal escrito quedaba en la lista para siempre y había que entrar a la
 * base para sacarlo.
 *
 * Dar de baja es lo que hay que usar casi siempre: la saca de las listas y no
 * toca nada de lo ya registrado. Borrar solo sirve para las que nacieron por
 * error y no tienen nada colgando.
 */
let abrirFormInst = false;

async function pintarInstalaciones() {
  $("#app").innerHTML = `<p class="cargando">Cargando…</p>`;
  const { instalaciones } = await pedir("/instalaciones");
  const activas = instalaciones.filter(i => i.activa).length;

  $("#app").innerHTML = `
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap">
      <h2 style="font-size:1.5rem">Instalaciones</h2>
      <span class="nota" style="color:var(--texto-2);font-size:.85rem">
        ${activas} en las listas${instalaciones.length - activas
          ? ` · ${instalaciones.length - activas} de baja` : ""}</span>
      <button class="bt" id="nueva-inst" style="margin-left:auto">
        ${abrirFormInst ? "Ocultar formulario" : "Nueva instalación"}</button>
    </div>
    ${aviso("ojo", "Esta es la lista que sale en los desplegables",
      "Se agregan acá, o se crean solas al escribir el nombre al cargar un servicio o un extra. En esta pantalla además se corrigen, se sacan de las listas o se borran las que quedaron por error.")}
    <datalist id="lista-clientes">
      ${[...new Set(instalaciones.map(i => i.cliente))].map(c => `<option value="${esc(c)}">`).join("")}
    </datalist>
    <section class="caja" style="max-width:860px"${abrirFormInst ? "" : " hidden"}>
      <div class="caja__tit"><h2>Nueva instalación</h2>
        <span class="nota">Si ya existe una con ese nombre, no se duplica</span></div>
      <form id="f-inst">
        <div class="rejilla">
          <label class="campo" style="grid-column:1/-1"><span>Instalación o parque</span>
            <input name="instalacion" required autocomplete="off"
                   placeholder="Ej: PMGD Los Maitenes"></label>
          <label class="campo"><span>Cliente</span>
            <input name="cliente" list="lista-clientes" autocomplete="off"
                   placeholder="A quién se le factura"></label>
          <label class="campo"><span>Comuna</span>
            <input name="comuna" placeholder="Dónde queda"></label>
          <label class="campo"><span>Región</span>
            <input name="region" placeholder="Opcional"></label>
        </div>
        <div class="pie-form">
          <button class="bt" type="submit">Agregar</button>
          <span class="mensaje"></span>
        </div>
      </form>
    </section>

    <section class="caja">
      <div class="caja__tit"><h2>Instalaciones cargadas</h2>
        <span class="nota">Marque varias para darlas de baja o eliminarlas</span></div>
      ${instalaciones.length ? `<div class="desliza"><table style="min-width:900px"><thead><tr>
        ${cabeceraSel("instalaciones")}
        <th>Instalación</th><th>Cliente</th><th>Dónde</th>
        <th class="num">Servicios</th><th class="num">Extras</th><th>Situación</th><th></th>
      </tr></thead><tbody>
        ${instalaciones.map(i => `<tr${i.activa ? "" : ' style="opacity:.6"'}>
          ${celdaSel("instalaciones", i.id)}
          <td><b>${esc(i.nombre)}</b></td>
          <td>${esc(i.cliente)}</td>
          <td>${esc(i.comuna || "—")}${i.region ? `<span class="sub">${esc(i.region)}</span>` : ""}</td>
          <td class="num">${i.servicios || "—"}</td>
          <td class="num">${i.extras || "—"}</td>
          <td><span class="sello ${i.activa ? "e-cerrado" : "e-en_curso"}">${
            i.activa ? "En las listas" : "De baja"}</span></td>
          <td class="nowrap"><button class="bt bt--fino bt--chico" data-editar-inst="${i.id}">Editar</button></td>
        </tr>
        <tr hidden data-form-inst="${i.id}"><td colspan="8" style="background:var(--sup-2);padding:0">
          ${formInstalacion(i)}
        </td></tr>`).join("")}
      </tbody></table></div>`
      : `<p class="vacio">Todavía no hay instalaciones. Agregue la primera con el botón de arriba, o escriba el nombre del parque al cargar un servicio y se crea sola.</p>`}
    </section>`;

  conectarSeleccion();

  $("#nueva-inst").onclick = () => { abrirFormInst = !abrirFormInst; pintarInstalaciones(); };

  $("#f-inst").onsubmit = async ev => {
    ev.preventDefault();
    const f = ev.target, msj = f.querySelector(".mensaje");
    decir(msj, "Guardando…");
    try {
      const r = await pedir("/instalaciones",
        { method: "POST", body: JSON.stringify(Object.fromEntries(new FormData(f))) });
      if (r.ya_existia) {
        // No es un error, pero tampoco es lo que pidió: hay que decirlo.
        decir(msj, "Ya existía una con ese nombre: no se creó otra", "error");
        return;
      }
      f.reset();
      abrirFormInst = false;
      estado.catalogos = await pedir("/catalogos");
      recado("Instalación agregada");
      await pintarInstalaciones();
    } catch (e) { decir(msj, e.message, "error"); }
  };

  document.querySelectorAll("[data-editar-inst]").forEach(b => {
    b.onclick = () => {
      const fila = $(`[data-form-inst="${b.dataset.editarInst}"]`);
      fila.hidden = !fila.hidden;
      if (!fila.hidden) fila.querySelector("input")?.focus();
    };
  });
  document.querySelectorAll("[data-cerrar-inst]").forEach(b => {
    b.onclick = () => { $(`[data-form-inst="${b.dataset.cerrarInst}"]`).hidden = true; };
  });
  document.querySelectorAll("form[data-instalacion]").forEach(f => {
    f.onsubmit = async ev => {
      ev.preventDefault();
      const msj = f.querySelector(".mensaje");
      const datos = Object.fromEntries(new FormData(f));
      datos.activa = f.querySelector("[name=activa]").value === "si";
      decir(msj, "Guardando…");
      try {
        await pedir(`/instalaciones/${f.dataset.instalacion}`,
                    { method: "PATCH", body: JSON.stringify(datos) });
        estado.catalogos = await pedir("/catalogos");
        await recargar({ repintar: false });
        recado("Instalación actualizada");
        await pintarInstalaciones();
      } catch (e) { decir(msj, e.message, "error"); }
    };
  });
}

      <label class="campo"><span>Cliente</span>
        <input name="cliente" list="lista-clientes" autocomplete="off" value="${esc(i.cliente)}"></label>
      <label class="campo"><span>Comuna</span>

      <label class="campo"><span>Región</span>

function pintarNuevoExtra() {
  const { tarifas, instalaciones } = estado.catalogos;
  $("#app").innerHTML = `
    ${aviso("ojo", "Registre el extra el mismo día que ocurre",
      "El periodo lo decide la fecha del servicio. Si esa fecha no cae en ningún periodo —porque el parque no tiene servicio permanente— queda en el panel para cobrarlo aparte, y no se pierde.")}
    <section class="caja" style="max-width:860px">
      <div class="caja__tit"><h2>Registrar servicio extraordinario</h2>
        <span class="nota">Si el parque no existe todavía, escríbalo y se crea solo</span></div>
      <form id="f-extra">
        <div class="rejilla">
          <label class="campo" style="grid-column:1/-1"><span>Instalación o parque</span>
            <input name="instalacion" required list="lista-inst" autocomplete="off" id="in-inst"
                   placeholder="Ej: PMGD Los Maitenes"></label>
          <datalist id="lista-inst">
            ${instalaciones.map(i => `<option value="${esc(i.nombre)}">${esc(i.cliente)}</option>`).join("")}
          </datalist>
          <label class="campo"><span>Cliente</span>
            <input name="cliente" list="lista-clientes" autocomplete="off" id="in-cliente"
                   placeholder="A quién se le factura"></label>
          <datalist id="lista-clientes">
            ${[...new Set(instalaciones.map(i => i.cliente))].map(c => `<option value="${esc(c)}">`).join("")}
          </datalist>
          <label class="campo"><span>Fecha del servicio</span>
            <input name="fecha" type="date" required value="${hoyISO()}" id="in-fecha"></label>

          <label class="campo" style="grid-column:1/-1"><span>Qué se hizo</span>
            <input name="item" required list="lista-tarifas" autocomplete="off" id="in-item"
                   maxlength="200" placeholder="Escríbalo o elíjalo del tarifario"></label>
          <datalist id="lista-tarifas">
            ${tarifas.map(t => `<option value="${esc(t.nombre)}">${clp(t.precio)}${
              t.unidad ? " por " + esc(t.unidad) : ""}</option>`).join("")}
          </datalist>
          <label class="campo"><span>Precio unitario</span>
            <input name="precio_unitario" type="number" min="0" step="1" id="in-precio" placeholder="0"></label>
          <label class="campo"><span>Cantidad</span>
            <input name="cantidad" type="number" min="0.5" step="0.5" value="1" required id="in-cant"></label>
          <label class="campo" style="grid-column:1/-1"><span>Detalle</span>
            <input name="detalle" placeholder="Ej: 3 horas diarias sábado 30 y domingo 31"></label>
        </div>
        <div class="pie-form">
          <button class="bt" type="submit">Registrar</button>
          <span class="mensaje"></span>
          <span style="margin-left:auto;font-weight:600;text-align:right" id="calculo">Neto: —</span>
        </div>
      </form>
    </section>`;

  const igual = (a, b) => (a || "").trim().toLowerCase() === (b || "").trim().toLowerCase();
  /** La tarifa cuyo nombre calza con lo escrito, si es que alguna calza. */
  const tarifaEscrita = () =>
    tarifas.find(t => igual(t.nombre, $("#in-item").value)) || null;

  const recalcular = () => {
    const precio = Number($("#in-precio").value || 0);
    const cant = Number($("#in-cant").value || 0);
    const neto = Math.round(precio * cant);
    const t = tarifaEscrita();
    const ajustado = t && precio !== Number(t.precio);
    $("#calculo").innerHTML = neto
      ? `Neto: ${clp(neto)} · IVA: ${clp(neto * 0.19)} · Total: ${clp(neto * 1.19)}`
        + (ajustado ? `<span class="sub" style="color:var(--ambar)">precio ajustado · el de lista es ${clp(t.precio)}</span>` : "")
        + (!t ? `<span class="sub" style="color:var(--cian)">ítem fuera del tarifario</span>` : "")
      : "Neto: —";
  };

  // Al escribir o elegir un ítem del tarifario se propone su precio, y queda
  // editable: hay servicios que se negocian caso a caso.
  $("#in-item").oninput = () => {
    const t = tarifaEscrita();
    if (t) $("#in-precio").value = t.precio;
    $("#in-precio").placeholder = t?.unidad ? `Por ${t.unidad}` : "0";
    recalcular();
  };
  // Al elegir un parque conocido se completa su cliente, para no retipearlo.
  $("#in-inst").oninput = () => {
    const i = instalaciones.find(x => igual(x.nombre, $("#in-inst").value));
    if (i && !$("#in-cliente").value.trim()) $("#in-cliente").value = i.cliente;
  };
  $("#in-precio").oninput = recalcular;
  $("#in-cant").oninput = recalcular;

  $("#f-extra").onsubmit = async ev => {
    ev.preventDefault();
    const f = ev.target, msj = f.querySelector(".mensaje");
    decir(msj, "Guardando…");
    try {
      const r = await pedir("/extras", { method: "POST", body: JSON.stringify(Object.fromEntries(new FormData(f))) });
      // Dónde quedó importa tanto como el monto: un extra sin periodo es el que
      // se escapa sin facturar, y hay que saberlo ahora, no en un mes.
      decir(msj, `Registrado · ${clp(r.monto_neto)} neto`
        + (r.periodo ? ` · va en el periodo N°${r.periodo.numero}` : ""),
        r.nota ? "" : "ok");
      if (r.nota) recado(r.nota, "mal");
      f.reset();
      $("#in-fecha").value = hoyISO();
      $("#in-precio").placeholder = "0";
      recalcular();
      estado.catalogos = await pedir("/catalogos");
      await recargar({ repintar: false });
    } catch (e) { decir(msj, e.message, "error"); }
  };
}

// ------------------------------------------------------------- calendario
const MESES = ["enero","febrero","marzo","abril","mayo","junio",
               "julio","agosto","septiembre","octubre","noviembre","diciembre"];

let mesVisto = null;   // "YYYY-MM"
let diaAbierto = null; // "YYYY-MM-DD"

const mesVecino = (mes, paso) => {
  const [a, m] = mes.split("-").map(Number);
  const d = new Date(Date.UTC(a, m - 1 + paso, 1));
  return d.toISOString().slice(0, 7);
};

/**
 * Los años que vale la pena ofrecer: desde el primer dato cargado hasta el
 * último, más el que viene. Una lista de cien años para elegir uno es tan
 * latoso como ir mes por mes con la flecha.
 */
function aniosDe(ag) {
  const hasta = ag.anio_hasta || Number(ag.hoy.slice(0, 4)) + 1;
  const desde = Math.min(ag.anio_desde || hasta, hasta);
  const lista = [];
  for (let a = desde; a <= hasta; a++) lista.push(a);
  return lista;
}

/**
 * El calendario del mes. Existe porque el panel contesta "cuánto falta por
 * cobrar" pero no "qué pasa esta semana": cuándo cierra un periodo y hay que
 * pedir la OC, y qué días hubo servicios extra.
 */
async function pintarCalendario() {
  mesVisto = mesVisto || hoyISO().slice(0, 7);
  $("#app").innerHTML = `<p class="cargando">Cargando…</p>`;
  const ag = await pedir(`/agenda?mes=${mesVisto}`);

  // Todo lo del mes, indexado por día: así cada casilla se arma de una pasada.
  const porDia = new Map();
  const enDia = (f) => {
    if (!porDia.has(f)) porDia.set(f, []);
    return porDia.get(f);
  };
  for (const c of ag.ciclos) {
    enDia(c.desde).push({ tipo: "inicio", ciclo: c,
      texto: `Parte N°${c.numero} · ${c.instalacion}` });
    enDia(c.hasta).push({ tipo: "cierre", ciclo: c,
      texto: `Cierra N°${c.numero} · ${c.instalacion}` });
    if (c.factura_fecha) {
      enDia(c.factura_fecha).push({ tipo: "factura", ciclo: c,
        texto: `Factura ${c.factura_folio} · ${c.instalacion}` });
    }
  }
  for (const e of ag.extras) {
    enDia(e.fecha).push({ tipo: "extra", extra: e, suelto: !e.ciclo_id,
      texto: `${clp(e.monto_neto)} · ${e.item}` });
  }

  const [anio, mes] = mesVisto.split("-").map(Number);
  const primero = new Date(Date.UTC(anio, mes - 1, 1));
  const dias = new Date(Date.UTC(anio, mes, 0)).getUTCDate();
  // getUTCDay() da 0 para domingo; acá la semana parte el lunes.
  const corrimiento = (primero.getUTCDay() + 6) % 7;

  const netoExtras = ag.extras.reduce((t, e) => t + Number(e.monto_neto || 0), 0);
  const cierran = ag.ciclos.filter(c => c.hasta >= ag.primer_dia && c.hasta <= ag.ultimo_dia);

  let casillas = "";
  for (let i = 0; i < corrimiento; i++) casillas += `<div class="cal__dia cal__dia--fuera"></div>`;
  for (let d = 1; d <= dias; d++) {
    const iso = `${mesVisto}-${String(d).padStart(2, "0")}`;
    const cosas = porDia.get(iso) || [];
    casillas += `<div class="cal__dia${iso === ag.hoy ? " cal__dia--hoy" : ""}">
      <span class="cal__n">${d}</span>
      <div class="cal__chips">
        ${cosas.slice(0, 3).map(x =>
          `<button class="chip chip--${x.tipo}${x.suelto ? " suelto" : ""}" data-dia="${iso}"
                   title="${esc(x.texto)}"><span>${esc(x.texto)}</span></button>`).join("")}
        ${cosas.length > 3
          ? `<button class="chip chip--mas" data-dia="${iso}" title="${cosas.length - 3} más ese día"><span>+${cosas.length - 3} más</span></button>`
          : ""}
      </div>
    </div>`;
  }
  const resto = (7 - ((corrimiento + dias) % 7)) % 7;
  for (let i = 0; i < resto; i++) casillas += `<div class="cal__dia cal__dia--fuera"></div>`;

  $("#app").innerHTML = `
    <div class="mes">
      <button class="bt bt--fino" id="mes-antes" aria-label="Mes anterior">←</button>
      <button class="bt bt--fino" id="mes-despues" aria-label="Mes siguiente">→</button>
      <div class="salto">
        <select id="salto-mes" aria-label="Mes">
          ${MESES.map((m, i) =>
            `<option value="${i + 1}"${i + 1 === mes ? " selected" : ""}>${m}</option>`).join("")}
        </select>
        <select id="salto-anio" aria-label="Año">
          ${aniosDe(ag).map(a =>
            `<option value="${a}"${a === anio ? " selected" : ""}>${a}</option>`).join("")}
        </select>
      </div>
      <button class="bt bt--fino" id="mes-hoy">Hoy</button>
      <span class="nota" style="margin-left:auto;color:var(--texto-2);font-size:.85rem">
        ${ag.ciclos.length} periodo${ag.ciclos.length === 1 ? "" : "s"} corriendo${
          cierran.length ? ` · ${cierran.length} cierra${cierran.length === 1 ? "" : "n"} este mes` : ""}${
          ag.extras.length ? ` · ${ag.extras.length} extra${ag.extras.length === 1 ? "" : "s"} por ${clp(netoExtras)}` : ""}
      </span>
    </div>

    <div class="cal">
      ${["lun","mar","mié","jue","vie","sáb","dom"].map(d =>
        `<div class="cal__dia-sem">${d}</div>`).join("")}
      ${casillas}
    </div>

    <div class="leyenda">
      <span><i style="background:var(--gris)"></i>Parte un periodo</span>
      <span><i style="background:var(--ambar)"></i>Cierra un periodo · pedir la OC</span>
      <span><i style="background:var(--cian)"></i>Servicio extra asignado</span>
      <span><i style="background:var(--rojo)"></i>Servicio extra sin asignar</span>
      <span><i style="background:var(--verde)"></i>Factura emitida</span>
    </div>

    <div id="detalle-dia" style="margin-top:20px"></div>`;

  const abrir = (iso) => {
    diaAbierto = iso;
    const cosas = porDia.get(iso) || [];
    $("#detalle-dia").innerHTML = `
      <section class="caja">
        <div class="caja__tit"><h2>${fecha(iso)}</h2>
          <span class="nota">${cosas.length} cosa${cosas.length === 1 ? "" : "s"} ese día</span></div>
        ${cosas.length ? `<div class="desliza"><table style="min-width:620px"><tbody>
          ${cosas.map(x => `<tr>
            <td style="width:190px"><span class="sello ${
              x.tipo === "cierre" ? "e-solicitar_oc"
              : x.tipo === "factura" ? "e-cerrado"
              : x.tipo === "extra" ? (x.suelto ? "p-por_cobrar atrasado" : "e-pendiente_facturacion")
              : "e-en_curso"}">${
              x.tipo === "inicio" ? "Parte periodo"
              : x.tipo === "cierre" ? "Cierra periodo"
              : x.tipo === "factura" ? "Factura"
              : x.suelto ? "Extra sin asignar" : "Extra"}</span></td>
            <td>${x.tipo === "extra"
              ? `<b>${esc(x.extra.item)}</b><span class="sub">${esc(x.extra.instalacion)}${
                  x.extra.detalle ? " · " + esc(x.extra.detalle) : ""}</span>`
              : `<b>${esc(x.ciclo.instalacion)}</b><span class="sub">${esc(x.ciclo.servicio)} · N°${x.ciclo.numero} · ${fecha(x.ciclo.desde)} → ${fecha(x.ciclo.hasta)}</span>`}</td>
            <td class="num nowrap"><b>${x.tipo === "extra"
              ? clp(x.extra.monto_neto) : clp(x.ciclo.total_neto)}</b>
              <span class="sub">${x.tipo === "extra"
                ? `${x.extra.cantidad} × ${clp(x.extra.precio_unitario)}` : "neto del periodo"}</span></td>
          </tr>`).join("")}
        </tbody></table></div>`
        : `<p class="vacio">Ese día no tiene nada registrado.</p>`}
      </section>`;
  };

  document.querySelectorAll("[data-dia]").forEach(b => {
    b.onclick = () => abrir(b.dataset.dia);
  });
  if (diaAbierto && diaAbierto.startsWith(mesVisto)) abrir(diaAbierto);

  const ir2 = (m) => { mesVisto = m; diaAbierto = null; pintarCalendario(); };
  $("#mes-antes").onclick = () => ir2(mesVecino(mesVisto, -1));

function cotizacionNueva() {

};

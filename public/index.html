<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Administración · Seguridad Garridos</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700&family=Archivo:wght@400;500;600;700&display=swap">
<style>
/* Pantalla de trabajo: se opera, no se lee. Cromo azul marino de la marca,
   datos sobre papel claro. El color sirve para el estado, no para decorar. */
:root{
  --tinta:#130052; --tinta-prof:#0A0031; --tinta-alta:#1E0A72;
  --papel:#F4F5F2; --papel-2:#E7EBE3; --raya:#CFD6C9;
  --sobre-tinta:#F2F0FF; --sobre-tinta-2:#B3ACE4;
  --texto:#1A1140; --texto-2:#58508C;
  --verde:#00A866; --verde-suave:#DCF5E9;     /* cerrado */
  --ambar:#B86E00; --ambar-suave:#FDF0DC;     /* solicitar OC */
  --cian:#0071A8;  --cian-suave:#DDEEF8;      /* pendiente facturación */
  --gris:#6A6A86;  --gris-suave:#ECECF2;      /* en curso */
  --rojo:#B3261E;  --rojo-suave:#FBE4E2;
  --display:"Big Shoulders Display","Arial Narrow",sans-serif;
  --cuerpo:"Archivo","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--papel);color:var(--texto);font:400 15px/1.5 var(--cuerpo)}
::selection{background:var(--tinta);color:#fff}
:where(a,button,input,select,textarea):focus-visible{outline:2px solid var(--tinta-alta);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:700;text-transform:uppercase;
  letter-spacing:.01em;line-height:1}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

/* ---------- marco ---------- */
.barra{background:var(--tinta-prof);color:var(--sobre-tinta);
  padding:0 clamp(14px,3vw,26px);padding-top:env(safe-area-inset-top,0px);
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;min-height:58px;
  position:sticky;top:0;z-index:20}
.marca{display:flex;align-items:center;gap:10px;margin-right:auto}
.marca img{width:30px;height:30px}
.marca b{font-family:var(--display);font-size:1.05rem;text-transform:uppercase;letter-spacing:.02em}
.marca span{font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--sobre-tinta-2);display:block}
.pestanas{display:flex;gap:2px;flex-wrap:wrap}
.pestanas button{background:none;border:0;color:var(--sobre-tinta-2);font:600 .85rem var(--cuerpo);
  padding:9px 13px;border-radius:3px 3px 0 0;cursor:pointer;border-bottom:2px solid transparent}
.pestanas button:hover{color:#fff;background:rgba(255,255,255,.07)}
.pestanas button[aria-current="true"]{color:#fff;border-bottom-color:var(--verde)}
.quien{font-size:.78rem;color:var(--sobre-tinta-2);text-align:right;line-height:1.3}
.quien b{display:block;color:var(--sobre-tinta);font-weight:600;font-size:.85rem}

main{padding:clamp(16px,2.5vw,28px);max-width:1500px;margin-inline:auto}
.cargando{padding:60px 0;text-align:center;color:var(--texto-2)}

/* ---------- avisos ---------- */
.aviso{border-radius:4px;padding:14px 16px;margin-bottom:18px;display:flex;gap:12px;
  align-items:flex-start;font-size:.92rem;line-height:1.5}
.aviso b{display:block;font-weight:600;margin-bottom:2px}
.aviso--mal{background:var(--rojo-suave);color:#7A1A14;border:1px solid #F0C5C1}
.aviso--ojo{background:var(--ambar-suave);color:#7A4A00;border:1px solid #EBD3AE}
.aviso--bien{background:var(--verde-suave);color:#07603C;border:1px solid #B6E3CD}
.aviso svg{width:20px;height:20px;flex:none;margin-top:1px}

/* ---------- tarjetas de resumen ---------- */
.resumen{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.ficha{background:#fff;border:1px solid var(--raya);border-radius:4px;padding:14px 16px}
.ficha dt{font-size:.68rem;letter-spacing:.13em;text-transform:uppercase;color:var(--texto-2);font-weight:600}
.ficha dd{margin:7px 0 0;font-family:var(--display);font-size:2rem;line-height:1;font-weight:700}
.ficha small{display:block;margin-top:5px;font-size:.76rem;color:var(--texto-2)}
.ficha--ojo dd{color:var(--ambar)} .ficha--plata dd{color:var(--tinta)}

/* ---------- tablas ---------- */
.caja{background:#fff;border:1px solid var(--raya);border-radius:4px;overflow:hidden;margin-bottom:22px}
.caja__tit{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:12px 16px;background:var(--papel-2);border-bottom:1px solid var(--raya)}
.caja__tit h2{font-size:1rem}
.caja__tit .nota{font-size:.8rem;color:var(--texto-2);margin-left:auto}
.desliza{overflow-x:auto}
.desliza table{min-width:1080px}
.sub{color:var(--texto-2);font-size:.8rem;display:block;margin-top:2px}
.nowrap{white-space:nowrap}
td b{display:block}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{text-align:left;font-size:.67rem;letter-spacing:.11em;text-transform:uppercase;
  color:var(--texto-2);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--raya);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--papel-2);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#FAFBF9}
td.num,th.num{text-align:right}
.vacio{padding:26px 16px;text-align:center;color:var(--texto-2);font-size:.9rem}

/* ---------- cobranza ---------- */
.p-pagado{background:var(--verde-suave);color:var(--verde)}
.p-factorizado{background:#EAE4FB;color:#5B3BB8}
.p-por_cobrar{background:var(--cian-suave);color:var(--cian)}
.p-por_cobrar.atrasado{background:var(--ambar-suave);color:var(--ambar)}
tr.fila--cobrado td:first-child{box-shadow:inset 3px 0 0 var(--verde)}
tr.fila--facturado td:first-child{box-shadow:inset 3px 0 0 var(--cian)}
tr.fila--atrasado td:first-child{box-shadow:inset 3px 0 0 var(--ambar)}

/* ---------- estados ---------- */
.sello{display:inline-block;font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;
  font-weight:700;padding:4px 8px;border-radius:3px;white-space:nowrap}
.e-solicitar_oc{background:var(--ambar-suave);color:var(--ambar)}
.e-pendiente_facturacion{background:var(--cian-suave);color:var(--cian)}
.e-cerrado{background:var(--verde-suave);color:var(--verde)}
.e-en_curso{background:var(--gris-suave);color:var(--gris)}
tr.fila--cerrado{background:#FBFEFC}
tr.fila--cerrado td:first-child{box-shadow:inset 3px 0 0 var(--verde)}
tr.fila--solicitar_oc td:first-child{box-shadow:inset 3px 0 0 var(--ambar)}

/* ---------- cotizaciones ---------- */
.cot__cab{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;padding:16px}
.lineas{width:100%;border-collapse:collapse}
.lineas th{font-size:.64rem;padding:8px 10px}
.lineas td{padding:6px 8px;vertical-align:middle;border-bottom:1px solid var(--papel-2)}
.lineas input,.lineas select{padding:7px 9px;font-size:.86rem}
.lineas td.num input{text-align:right}
.lineas .quitar{background:none;border:0;color:var(--texto-2);cursor:pointer;font-size:1.1rem;
  line-height:1;padding:4px 7px;border-radius:3px}
.lineas .quitar:hover{color:var(--rojo);background:var(--rojo-suave)}
.col-desc{min-width:260px} .col-cant{width:92px} .col-uni{width:96px}
.col-precio{width:124px} .col-sub{width:124px} .col-x{width:40px}
.sumas{margin-left:auto;min-width:290px;padding:14px 16px;background:var(--papel-2);border-radius:4px}
.sumas div{display:flex;justify-content:space-between;gap:20px;padding:5px 0;font-size:.92rem}
.sumas .total{border-top:1px solid var(--raya);margin-top:7px;padding-top:10px;
  font-family:var(--display);font-size:1.5rem;font-weight:700;align-items:baseline}
.e-borrador{background:var(--gris-suave);color:var(--gris)}
.e-enviada{background:var(--cian-suave);color:var(--cian)}
.e-aceptada{background:var(--verde-suave);color:var(--verde)}
.e-rechazada{background:var(--rojo-suave);color:var(--rojo)}
.vencida{color:var(--ambar);font-size:.76rem}

/* ---------- entrada ---------- */
.puerta{min-height:100%;display:grid;place-items:center;padding:24px 16px;background:var(--tinta)}
.puerta__caja{width:100%;max-width:400px;background:#fff;border-radius:5px;
  box-shadow:0 24px 60px -24px rgba(4,0,22,.7);overflow:hidden}
.puerta__tit{background:var(--tinta-prof);color:var(--sobre-tinta);padding:22px 24px;
  display:flex;align-items:center;gap:12px}
.puerta__tit img{width:40px;height:40px}
.puerta__tit b{display:block;font-family:var(--display);font-size:1.2rem;text-transform:uppercase}
.puerta__tit span{display:block;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--sobre-tinta-2);margin-top:3px}
.puerta form{padding:24px;display:flex;flex-direction:column;gap:14px}
.puerta .campo>span{color:var(--texto-2)}
.puerta .bt{justify-content:center;padding:12px}
.puerta__aviso{margin:0 24px 22px;padding:12px 14px;border-radius:4px;font-size:.84rem;line-height:1.5}

/* ---------- controles ---------- */
.bt{display:inline-flex;align-items:center;gap:7px;font:600 .84rem var(--cuerpo);
  padding:9px 14px;border-radius:3px;border:1px solid transparent;cursor:pointer;
  background:var(--tinta);color:#fff;transition:background-color .14s}
.bt:hover{background:var(--tinta-alta)}
.bt--fino{background:#fff;color:var(--tinta);border-color:var(--raya)}
.bt--fino:hover{background:var(--papel-2)}
.bt--chico{padding:6px 10px;font-size:.78rem}
.bt[disabled]{opacity:.5;cursor:not-allowed}
label.campo{display:flex;flex-direction:column;gap:5px;font-size:.78rem;color:var(--texto-2);min-width:0}
label.campo>span{font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:.68rem}
input,select,textarea{font:400 .9rem var(--cuerpo);color:var(--texto);background:#fff;
  border:1px solid var(--raya);border-radius:3px;padding:8px 10px;width:100%;caret-color:var(--tinta)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--tinta-alta);box-shadow:0 0 0 3px rgba(30,10,114,.1)}
.rejilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;padding:16px}
.pie-form{padding:0 16px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.error{color:var(--rojo);font-size:.82rem;font-weight:500}
.ok{color:var(--verde);font-size:.82rem;font-weight:600}
details.detalle{border-top:1px solid var(--papel-2)}
details.detalle>summary{cursor:pointer;padding:9px 12px;font-size:.8rem;color:var(--tinta);
  font-weight:600;list-style:none}
details.detalle>summary::-webkit-details-marker{display:none}
details.detalle>summary::before{content:"▸ ";display:inline-block;transition:transform .15s}
details.detalle[open]>summary::before{content:"▾ "}

/* ---------- selección de varias filas ---------- */
th.sel,td.sel{width:36px;padding-left:14px;padding-right:0}
th.sel input,td.sel input{width:15px;height:15px;accent-color:var(--tinta);cursor:pointer;
  margin:0;padding:0;border-radius:2px}
tr.marcada{background:var(--cian-suave)}
tr.marcada:hover{background:#D3E7F4}
.barra-sel{position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--tinta-prof);color:var(--sobre-tinta);
  padding:12px clamp(14px,3vw,26px);padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -3px 16px rgba(19,0,82,.26)}
.barra-sel__fila{max-width:1500px;margin-inline:auto;
  display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.barra-sel__n{font-family:var(--display);font-size:1.15rem;line-height:1;white-space:nowrap}
.barra-sel__n span{display:block;font-family:var(--cuerpo);font-size:.68rem;font-weight:600;
  letter-spacing:.13em;text-transform:uppercase;color:var(--sobre-tinta-2);margin-top:3px}
.barra-sel select,.barra-sel input{width:auto;min-width:0;padding:7px 9px;font-size:.84rem}
.barra-sel .bt{background:#fff;color:var(--tinta-prof);border-color:#fff}
.barra-sel .bt:hover{background:var(--papel)}
.barra-sel .bt--fino{background:rgba(255,255,255,.09);color:#fff;border-color:rgba(255,255,255,.3)}
.barra-sel .bt--fino:hover{background:rgba(255,255,255,.19)}
.barra-sel .bt--mal{background:#C3312A;border-color:#C3312A;color:#fff}
.barra-sel .bt--mal:hover{background:#D8463F}
.barra-sel .mensaje{font-size:.82rem;color:var(--sobre-tinta-2)}
.barra-sel .mensaje.ok{color:#5BE3A8} .barra-sel .mensaje.error{color:#FFB9B3}
.omitidos{max-width:1500px;margin:8px auto 0;padding:9px 12px 9px 28px;border-radius:3px;
  background:rgba(255,255,255,.08);font-size:.81rem;line-height:1.55;color:#FFC2BC;
  max-height:132px;overflow-y:auto}
/* Lo que no se hizo va en rojo; lo que sí se hizo pero hay que saber, en ámbar. */
.omitidos--ojo{color:#FFDFAE}
.barra-sel .bt[disabled]{opacity:.45}
.barra-sel label.campo{gap:3px}
.barra-sel label.campo>span{color:var(--sobre-tinta-2);font-size:.62rem}
.recado{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:50;
  background:var(--tinta-prof);color:#fff;border-left:3px solid var(--verde);
  padding:12px 18px;border-radius:4px;font-size:.88rem;font-weight:500;
  box-shadow:0 6px 22px rgba(19,0,82,.3)}
.recado--mal{border-left-color:var(--rojo)}
body.hay-seleccion .recado{bottom:96px}
</style>
</head>
<body>

<header class="barra">
  <div class="marca">
    <img src="logo.png" alt="">
    <span>
      <b>Administración</b>
      <span>Seguridad Garridos</span>
    </span>
  </div>
  <nav class="pestanas" id="pestanas" aria-label="Secciones"></nav>
  <div class="quien" id="quien"></div>
</header>

<main id="app">
  <p class="cargando">Cargando…</p>
</main>

<script>
"use strict";

const $ = (s, r = document) => r.querySelector(s);

/** Escribe en un cartel de estado conservando su clase .mensaje: asignar
 *  className a secas la borraba, y el siguiente intento ya no encontraba el
 *  elemento. tipo: "", "ok" o "error". */
function decir(el, texto, tipo = "") {
  if (!el) return;
  el.className = "mensaje" + (tipo ? " " + tipo : "");
  el.textContent = texto;
}
const clp = n => "$" + (Math.round(n || 0)).toLocaleString("es-CL");
const fecha = s => s ? s.split("-").reverse().join("-") : "—";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const ROTULO = {
  solicitar_oc: "Solicitar OC",
  pendiente_facturacion: "Pendiente de facturación",
  cerrado: "Facturado",
  en_curso: "En curso",
};

const ROTULO_PAGO = {
  por_cobrar: "Por cobrar",
  pagado: "Pagado",
  factorizado: "Factorizado",
};

/** Una factura sin cobrar a más de 45 días merece verse distinto. */
const atrasado = c => c.estado === "cerrado" && c.pago_estado === "por_cobrar"
  && (c.dias_desde_factura || 0) > 45;

/** El color de la fila dice lo que de verdad importa: si entró la plata. */
function marcaDeFila(c) {
  if (c.estado !== "cerrado") return c.estado === "solicitar_oc" ? "solicitar_oc" : c.estado;
  if (c.pago_estado !== "por_cobrar") return "cobrado";
  return atrasado(c) ? "atrasado" : "facturado";
}

const hoyISO = () => new Date().toISOString().slice(0, 10);

// ------------------------------------------- seleccionar varias filas a la vez
/**
 * Un solo motor para todas las tablas. Cada casilla dice de qué tipo es y qué
 * id tiene; marcar algo de otro tipo descarta lo anterior, porque las acciones
 * no son las mismas y mezclarlas solo lleva a equivocarse.
 *
 * Lo que el servidor omite vuelve marcado y con el motivo a la vista: así nadie
 * se queda con la idea de que se hicieron diez cuando se hicieron ocho.
 */
const seleccion = { tipo: null, ids: new Set(), op: 0, campos: {}, aviso: null };

const celdaSel = (tipo, id) =>
  `<td class="sel"><input type="checkbox" data-sel="${tipo}:${id}" aria-label="Seleccionar esta fila"></td>`;
const cabeceraSel = tipo =>
  `<th class="sel"><input type="checkbox" data-sel-todo="${tipo}" aria-label="Seleccionar todas"></th>`;

const ACCIONES = {
  ciclos: {
    rotulo: n => n === 1 ? "periodo marcado" : "periodos marcados",
    nombre: n => n === 1 ? "periodo" : "periodos",
    nota: "Para detener un servicio y sus periodos, vaya a Servicios.",
    opciones: [
      { rot: "Marcar como pagado", accion: "pago_estado", valor: "pagado",
        pide: ["fecha"], boton: "Marcar pagado" },
      { rot: "Marcar como factorizado", accion: "pago_estado", valor: "factorizado",
        pide: ["fecha", "factoring"], boton: "Marcar factorizado" },
      { rot: "Volver a por cobrar", accion: "pago_estado", valor: "por_cobrar",
        boton: "Volver a por cobrar" },
      { rot: "Eliminar", accion: "borrar", peligro: true, boton: "Eliminar", soloBorrador: true,
        confirmar: (n, ids) => {
          const sel = (estado.panel?.ciclos || []).filter(c => ids.includes(c.id));
          const conFactura = sel.filter(c => c.factura_folio);
          return `¿Eliminar ${n} periodo${n > 1 ? "s" : ""}?\n\n`
            + (conFactura.length
                ? `OJO: ${conFactura.length} ya tiene${conFactura.length > 1 ? "n" : ""} factura registrada (folio ${conFactura.map(c => c.factura_folio).join(", ")}).\n\n`
                : "")
            + "Los servicios extra que tengan quedan sin asignar, no se borran.";
        } },
    ],
  },
  extras: {
    rotulo: n => n === 1 ? "extra marcado" : "extras marcados",
    nombre: n => n === 1 ? "extra" : "extras",
    opciones: [
      { rot: "Asignar a un periodo", accion: "asignar", pide: ["ciclo"], boton: "Asignar" },
      { rot: "Dejar sin asignar", accion: "asignar", valor: null, boton: "Dejar sueltos" },
      { rot: "Eliminar", accion: "borrar", peligro: true, boton: "Eliminar", soloBorrador: true,
        confirmar: n => `¿Eliminar ${n} servicio${n > 1 ? "s" : ""} extra?\n\nEs trabajo que se hizo: borrado, ya no se cobra. Los que estén dentro de un periodo ya facturado no se tocan.` },
    ],
  },
  servicios: {
    rotulo: n => n === 1 ? "servicio marcado" : "servicios marcados",
    nombre: n => n === 1 ? "servicio" : "servicios",
    opciones: [
      { rot: "Dar de baja", accion: "activo", valor: false, boton: "Dar de baja",
        confirmar: n => `¿Dar de baja ${n} servicio${n > 1 ? "s" : ""}?\n\nDejan de generarse periodos nuevos. Todo lo registrado se conserva.` },
      { rot: "Reactivar", accion: "activo", valor: true, boton: "Reactivar" },
      { rot: "Eliminar", accion: "borrar", peligro: true, boton: "Eliminar", soloBorrador: true,
        confirmar: n => `¿Eliminar ${n} servicio${n > 1 ? "s" : ""}?\n\nSe borran también todos sus periodos. Los que tengan periodos ya facturados no se borran: a esos deles de baja.` },
    ],
  },
  instalaciones: {
    rotulo: n => n === 1 ? "instalación marcada" : "instalaciones marcadas",
    nombre: n => n === 1 ? "instalación" : "instalaciones",
    nota: "Dar de baja la saca de las listas sin perder nada de lo registrado.",
    opciones: [
      { rot: "Dar de baja", accion: "activa", valor: false, boton: "Dar de baja",
        confirmar: n => `¿Dar de baja ${n} instalación${n > 1 ? "es" : ""}?\n\nDejan de aparecer en los desplegables. Todo lo registrado se conserva.` },
      { rot: "Reactivar", accion: "activa", valor: true, boton: "Reactivar" },
      { rot: "Eliminar", accion: "borrar", peligro: true, boton: "Eliminar", soloBorrador: true,
        confirmar: n => `¿Eliminar ${n} instalación${n > 1 ? "es" : ""}?\n\nSolo se borran las que no tengan ningún servicio ni servicio extra. Las demás quedan marcadas con el motivo.` },
    ],
  },
  cotizaciones: {
    rotulo: n => n === 1 ? "cotización marcada" : "cotizaciones marcadas",
    nombre: n => n === 1 ? "cotización" : "cotizaciones",
    opciones: [
      { rot: "Marcar como enviada", accion: "estado", valor: "enviada", boton: "Marcar enviada" },
      { rot: "Marcar como aceptada", accion: "estado", valor: "aceptada", boton: "Marcar aceptada",
        confirmar: n => `¿Marcar ${n} como aceptada${n > 1 ? "s" : ""}?\n\nUna cotización aceptada ya no se puede editar.` },
      { rot: "Marcar como rechazada", accion: "estado", valor: "rechazada", boton: "Marcar rechazada" },
      { rot: "Volver a borrador", accion: "estado", valor: "borrador", boton: "Volver a borrador" },
      { rot: "Eliminar", accion: "borrar", peligro: true, boton: "Eliminar", soloBorrador: true,
        confirmar: n => `¿Eliminar ${n} cotización${n > 1 ? "es" : ""}?\n\nSe van también sus líneas. Las aceptadas quedan como respaldo y no se borran.` },
    ],
  },
  contactos: {
    rotulo: n => n === 1 ? "contacto marcado" : "contactos marcados",
    nombre: n => n === 1 ? "contacto" : "contactos",
    opciones: [
      { rot: "Marcar como contactado", accion: "estado", valor: "contactado", boton: "Marcar contactado" },
      { rot: "Marcar como cotizado", accion: "estado", valor: "cotizado", boton: "Marcar cotizado" },
      { rot: "Marcar como cerrado", accion: "estado", valor: "cerrado", boton: "Marcar cerrado" },
      { rot: "Marcar como descartado", accion: "estado", valor: "descartado", boton: "Descartar" },
      { rot: "Eliminar", accion: "borrar", peligro: true, boton: "Eliminar", soloBorrador: true,
        confirmar: n => `¿Eliminar ${n} contacto${n > 1 ? "s" : ""}? Son personas que pidieron que las llamaran.` },
    ],
  },
};

/** Vuelve a dibujar marcas y barra sin rehacer la tabla. */
function repintarSeleccion() {
  document.querySelectorAll("[data-sel]").forEach(c => {
    const [tipo, id] = c.dataset.sel.split(":");
    c.checked = seleccion.tipo === tipo && seleccion.ids.has(Number(id));
    c.closest("tr")?.classList.toggle("marcada", c.checked);
  });
  document.querySelectorAll("[data-sel-todo]").forEach(h => {
    const dentro = [...h.closest("table").querySelectorAll(`[data-sel^="${h.dataset.selTodo}:"]`)];
    h.checked = dentro.length > 0 && dentro.every(c => c.checked);
  });
  pintarBarraSel();
}

function cambiarTipo(tipo) {
  if (seleccion.tipo === tipo) return;
  seleccion.tipo = tipo;
  seleccion.ids.clear();
  seleccion.op = 0;
  seleccion.aviso = null;
}

/** Se llama después de pintar cualquier vista con tablas seleccionables. */
function conectarSeleccion() {
  const casillas = [...document.querySelectorAll("[data-sel]")];

  // Lo que ya no está en pantalla deja de estar seleccionado: así lo borrado
  // en la pasada anterior no sigue contando.
  if (seleccion.tipo) {
    const vivos = new Set(casillas
      .filter(c => c.dataset.sel.startsWith(seleccion.tipo + ":"))
      .map(c => Number(c.dataset.sel.split(":")[1])));
    seleccion.ids = new Set([...seleccion.ids].filter(id => vivos.has(id)));
  }

  for (const c of casillas) {
    const [tipo, id] = c.dataset.sel.split(":");
    c.onchange = () => {
      cambiarTipo(tipo);
      if (c.checked) seleccion.ids.add(Number(id)); else seleccion.ids.delete(Number(id));
      seleccion.aviso = null;
      repintarSeleccion();
    };
  }
  document.querySelectorAll("[data-sel-todo]").forEach(h => {
    const tipo = h.dataset.selTodo;
    h.onchange = () => {
      cambiarTipo(tipo);
      const dentro = [...h.closest("table").querySelectorAll(`[data-sel^="${tipo}:"]`)];
      for (const c of dentro) {
        const id = Number(c.dataset.sel.split(":")[1]);
        if (h.checked) seleccion.ids.add(id); else seleccion.ids.delete(id);
      }
      seleccion.aviso = null;
      repintarSeleccion();
    };
  });
  repintarSeleccion();
}

function campoSel(cual) {
  const v = seleccion.campos;
  if (cual === "fecha") {
    return `<label class="campo" style="color:var(--sobre-tinta-2)"><span>Fecha en que entró</span>
      <input type="date" data-campo="fecha" value="${esc(v.fecha || hoyISO())}"></label>`;
  }
  if (cual === "factoring") {
    return `<label class="campo" style="color:var(--sobre-tinta-2)"><span>Empresa de factoring</span>
      <input data-campo="factoring" value="${esc(v.factoring || "")}" placeholder="Quién compró la factura"></label>`;
  }
  if (cual === "ciclo") {
    const abiertos = (estado.panel?.ciclos || []).filter(c => c.estado !== "cerrado");
    return `<label class="campo" style="color:var(--sobre-tinta-2)"><span>Periodo</span>
      <select data-campo="ciclo">
        <option value="">— elegir —</option>
        ${abiertos.map(c => `<option value="${c.id}"${String(v.ciclo) === String(c.id) ? " selected" : ""}>${esc(c.instalacion)} · N°${c.numero} (${fecha(c.desde)})</option>`).join("")}
      </select></label>`;
  }
  return "";
}

function pintarBarraSel() {
  $("#barra-sel")?.remove();
  const n = seleccion.ids.size;
  const def = ACCIONES[seleccion.tipo];
  // Una advertencia sobre algo que ya se hizo tiene que quedarse en pantalla
  // aunque no quede nada marcado, o nadie se entera.
  const soloAvisos = !n && seleccion.aviso?.avisos?.length > 0;
  if ((!n || !def) && !soloAvisos) {
    document.body.classList.remove("hay-seleccion");
    $("main").style.paddingBottom = "";
    return;
  }
  if (soloAvisos) return pintarBarraAvisos(def);
  if (seleccion.op >= def.opciones.length) seleccion.op = 0;
  const op = def.opciones[seleccion.op];
  const a = seleccion.aviso;
  // Borrar lo hace una sola persona. Al resto no se le esconde el botón: se le
  // muestra apagado y se le dice a quién pedírselo.
  const vetado = op.soloBorrador && estado.usuario?.puede_borrar !== true;
  const quienes = estado.quienBorra.length ? estado.quienBorra.join(" o ") : "la gerencia";

  const barra = document.createElement("div");
  barra.id = "barra-sel";
  barra.className = "barra-sel";
  barra.innerHTML = `
    <div class="barra-sel__fila">
      <span class="barra-sel__n">${n}<span>${def.rotulo(n)}</span></span>
      <select id="sel-accion" aria-label="Qué hacer con lo marcado">
        ${def.opciones.map((o, i) =>
          `<option value="${i}"${i === seleccion.op ? " selected" : ""}>${esc(o.rot)}</option>`).join("")}
      </select>
      ${(op.pide || []).map(campoSel).join("")}
      <button class="bt${op.peligro ? " bt--mal" : ""}" id="sel-aplicar"${vetado ? " disabled" : ""}>${esc(op.boton)}</button>
      <button class="bt bt--fino" id="sel-nada">Quitar selección</button>
      <span class="mensaje${vetado ? " error" : a ? (a.hechos ? " ok" : " error") : ""}">${
        vetado ? esc(`Solo ${quienes} puede eliminar. Pídaselo.`)
        : a ? esc(`${a.hechos} listo${a.hechos === 1 ? "" : "s"}${a.omitidos.length ? ` · ${a.omitidos.length} sin tocar` : ""}`)
          : esc(def.nota || "")}</span>
    </div>
    ${a && a.omitidos.length
      ? `<ul class="omitidos">${a.omitidos.map(o => `<li>${esc(o.razon)}</li>`).join("")}</ul>` : ""}
    ${a && a.avisos?.length
      ? `<ul class="omitidos omitidos--ojo">${a.avisos.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : ""}`;
  document.body.appendChild(barra);
  document.body.classList.add("hay-seleccion");
  // Sin este hueco la barra tapa las últimas filas de la tabla.
  $("main").style.paddingBottom = (barra.offsetHeight + 24) + "px";

  $("#sel-accion").onchange = ev => {
    seleccion.op = Number(ev.target.value);
    seleccion.aviso = null;
    pintarBarraSel();
    $("#sel-accion").focus();
  };
  barra.querySelectorAll("[data-campo]").forEach(c => {
    c.oninput = () => { seleccion.campos[c.dataset.campo] = c.value; };
  });
  $("#sel-nada").onclick = () => {
    seleccion.ids.clear();
    seleccion.aviso = null;
    repintarSeleccion();
  };
  if (!vetado) $("#sel-aplicar").onclick = aplicarSeleccion;
}

/** La barra cuando ya no queda nada marcado pero algo hay que advertir. */
function pintarBarraAvisos(def) {
  const a = seleccion.aviso;
  const barra = document.createElement("div");
  barra.id = "barra-sel";
  barra.className = "barra-sel";
  barra.innerHTML = `
    <div class="barra-sel__fila">
      <span class="barra-sel__n">${a.hechos}<span>${def ? def.nombre(a.hechos) : "registros"}</span></span>
      <span class="mensaje ok">Hecho. Lea esto antes de seguir:</span>
      <button class="bt bt--fino" id="sel-nada" style="margin-left:auto">Entendido</button>
    </div>
    <ul class="omitidos omitidos--ojo">${a.avisos.map(t => `<li>${esc(t)}</li>`).join("")}</ul>`;
  document.body.appendChild(barra);
  document.body.classList.add("hay-seleccion");
  $("main").style.paddingBottom = (barra.offsetHeight + 24) + "px";
  $("#sel-nada").onclick = () => {
    seleccion.aviso = null;
    repintarSeleccion();
  };
}

async function aplicarSeleccion() {
  const def = ACCIONES[seleccion.tipo];
  const op = def.opciones[seleccion.op];
  const ids = [...seleccion.ids];
  if (!ids.length) return;
  if (op.confirmar && !confirm(op.confirmar(ids.length, ids))) return;

  const cuerpo = { tipo: seleccion.tipo, accion: op.accion, ids };
  if ("valor" in op) cuerpo.valor = op.valor;
  for (const c of op.pide || []) {
    if (c === "fecha") cuerpo.fecha = seleccion.campos.fecha || hoyISO();
    if (c === "factoring") cuerpo.factoring = seleccion.campos.factoring || "";
    if (c === "ciclo") {
      if (!seleccion.campos.ciclo) {
        seleccion.aviso = { hechos: 0, omitidos: [{ razon: "Elija a qué periodo asignarlos" }] };
        return pintarBarraSel();
      }
      cuerpo.valor = Number(seleccion.campos.ciclo);
    }
  }

  const boton = $("#sel-aplicar");
  if (boton) { boton.disabled = true; boton.textContent = "Trabajando…"; }
  try {
    const r = await pedir("/lote", { method: "POST", body: JSON.stringify(cuerpo) });
    const omitidos = r.omitidos || [];
    const avisos = r.avisos || [];
    // Lo que no se pudo hacer queda marcado: así se ve sobre qué hay que volver.
    seleccion.ids = new Set(omitidos.map(o => o.id).filter(Boolean));
    seleccion.aviso = { hechos: r.hechos, omitidos, avisos };
    if (!omitidos.length && !avisos.length) {
      recado(`${r.hechos} ${def.nombre(r.hechos)}: listo`);
      seleccion.aviso = null;
    }
    await refrescarVista();
  } catch (e) {
    seleccion.aviso = { hechos: 0, omitidos: [{ razon: e.message }] };
    pintarBarraSel();
  }
}

/** Trae de nuevo los datos de la vista actual y la vuelve a pintar. */
async function refrescarVista() {
  if (estado.vista === "panel") await recargar();
  else ir(estado.vista);
}

let recadoReloj;
function recado(texto, tipo = "ok") {
  $("#recado")?.remove();
  const el = document.createElement("div");
  el.id = "recado";
  el.className = "recado" + (tipo === "mal" ? " recado--mal" : "");
  el.textContent = texto;
  document.body.appendChild(el);
  clearTimeout(recadoReloj);
  recadoReloj = setTimeout(() => el.remove(), 4200);
}

let estado = { usuario: null, quienBorra: [], panel: null, catalogos: null, vista: "panel" };

async function pedir(ruta, opciones) {
  const r = await fetch("/api" + ruta, {
    headers: { "content-type": "application/json" },
    ...opciones,
  });
  const cuerpo = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(cuerpo.error || `Error ${r.status}`);
  return cuerpo;
}

// ------------------------------------------------------------- vistas
function pintarPanel() {
  const { ciclos, extras_sueltos: sueltos, resumen: r } = estado.panel;
  const porEstado = e => ciclos.filter(c => c.estado === e);
  const pendientes = [...porEstado("solicitar_oc"), ...porEstado("pendiente_facturacion")];

  let html = "";

  if (r.extras_sin_asignar > 0) {
    html += aviso("mal",
      `${r.extras_sin_asignar} servicio${r.extras_sin_asignar > 1 ? "s" : ""} extra sin asignar a ningún periodo`,
      `Suman ${clp(r.neto_extras_sueltos)} neto y no se van a cobrar hasta que los asigne. Están al final de esta pantalla.`);
  }
  if (r.solicitar_oc > 0) {
    html += aviso("ojo",
      `${r.solicitar_oc} periodo${r.solicitar_oc > 1 ? "s" : ""} cumplió los 30 días`,
      "Hay que pedir la orden de compra al cliente para poder facturar.");
  }
  if (!r.extras_sin_asignar && !r.solicitar_oc && !r.pendiente_facturacion && ciclos.length) {
    html += aviso("bien", "No hay nada pendiente de cobro", "Todos los periodos cerrados o en curso.");
  }

  html += `<dl class="resumen">
    <div class="ficha ficha--plata"><dt>Neto por cobrar</dt><dd class="num">${clp(r.neto_por_cobrar)}</dd>
      <small>IVA aparte · ${ciclos.filter(c => c.estado !== "cerrado").length} periodos abiertos</small></div>
    <div class="ficha ficha--ojo"><dt>Solicitar OC</dt><dd class="num">${r.solicitar_oc}</dd>
      <small>Cumplieron los 30 días</small></div>
    <div class="ficha"><dt>Pendiente de facturación</dt><dd class="num">${r.pendiente_facturacion}</dd>
      <small>Con OC, sin factura</small></div>
    <div class="ficha ficha--ojo"><dt>Facturado sin cobrar</dt>
      <dd class="num">${clp(r.neto_facturado_sin_cobrar)}</dd>
      <small>${r.facturado_sin_cobrar} factura${r.facturado_sin_cobrar === 1 ? "" : "s"}${
        r.dias_mas_antiguo ? ` · la más antigua hace ${r.dias_mas_antiguo} días` : ""}</small></div>
    <div class="ficha"><dt>En curso</dt><dd class="num">${r.en_curso}</dd>
      <small>Periodo corriendo</small></div>
  </dl>`;

  html += tablaCiclos("Pendientes de cobro", pendientes,
    "Nada pendiente. Cuando un periodo cumpla 30 días aparece acá.");

  const cerrados = porEstado("cerrado"), enCurso = porEstado("en_curso");
  if (enCurso.length) html += tablaCiclos("Periodos en curso", enCurso, "");
  if (cerrados.length) html += tablaCiclos("Cerrados", cerrados, "");

  html += tablaSueltos(sueltos);
  $("#app").innerHTML = html;
  conectarPanel();
}

function aviso(tipo, titulo, texto) {
  const icono = tipo === "bien"
    ? '<path d="M4 12.5l5 5 11-11"/>'
    : '<path d="M12 8v5"/><circle cx="12" cy="16.5" r="1.1" fill="currentColor" stroke="none"/><path d="M10.3 3.9 2.6 17.4A2 2 0 0 0 4.3 20.4h15.4a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>';
  return `<div class="aviso aviso--${tipo}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${icono}</svg>
    <div><b>${esc(titulo)}</b>${esc(texto)}</div></div>`;
}

function tablaCiclos(titulo, filas, vacio) {
  if (!filas.length && !vacio) return "";
  const total = filas.reduce((t, c) => t + c.total_neto, 0);
  let h = `<section class="caja"><div class="caja__tit"><h2>${esc(titulo)}</h2>
    <span class="nota">${filas.length} · ${clp(total)} neto</span></div>`;
  if (!filas.length) return h + `<p class="vacio">${esc(vacio)}</p></section>`;
  h += `<div class="desliza"><table><thead><tr>
      ${cabeceraSel("ciclos")}
      <th>Instalación</th><th>Servicio</th><th>Periodo</th><th>Estado</th>
      <th class="num">Base</th><th class="num">Extras</th><th class="num">Neto</th>
      <th class="num">Total con IVA</th><th>OC</th><th>Factura</th><th>Cobranza</th><th></th>
    </tr></thead><tbody>`;
  for (const c of filas) {
    h += `<tr class="fila--${marcaDeFila(c)}">
      ${celdaSel("ciclos", c.id)}
      <td><b>${esc(c.instalacion)}</b><span class="sub">${esc(c.cliente)}</span></td>
      <td>${esc(c.servicio)}</td>
      <td class="num nowrap">N°${c.numero}<span class="sub nowrap">${fecha(c.desde)} → ${fecha(c.hasta)}</span></td>
      <td><span class="sello e-${c.estado}">${ROTULO[c.estado]}</span>
        ${c.estado === "solicitar_oc" && c.dias_desde_cierre > 0
          ? `<span class="sub" style="color:var(--ambar)">hace ${c.dias_desde_cierre} día${c.dias_desde_cierre > 1 ? "s" : ""}</span>` : ""}</td>
      <td class="num">${c.monto_neto ? clp(c.monto_neto) : "—"}</td>
      <td class="num">${c.extras_n ? `${clp(c.extras_neto)}<span class="sub">${c.extras_n} ítem${c.extras_n > 1 ? "s" : ""}</span>` : "—"}</td>
      <td class="num"><b>${clp(c.total_neto)}</b></td>
      <td class="num nowrap">${clp(c.total)}<span class="sub">IVA ${clp(c.iva)}</span></td>
      <td class="nowrap">${c.oc_numero ? esc(c.oc_numero) + `<span class="sub">${fecha(c.oc_fecha)}</span>` : "—"}</td>
      <td class="nowrap">${c.factura_folio ? esc(c.factura_folio) + `<span class="sub">${fecha(c.factura_fecha)}</span>` : "—"}</td>
      <td class="nowrap">${c.estado !== "cerrado" ? "—" : `
        <span class="sello p-${c.pago_estado}${atrasado(c) ? " atrasado" : ""}">${ROTULO_PAGO[c.pago_estado]}</span>
        ${c.pago_estado === "por_cobrar"
          ? (c.dias_desde_factura != null ? `<span class="sub">hace ${c.dias_desde_factura} días</span>` : "")
          : `<span class="sub">${fecha(c.pago_fecha)}${c.pago_monto ? " · " + clp(c.pago_monto) : ""}</span>`}
        ${c.factoring ? `<span class="sub">${esc(c.factoring)}</span>` : ""}`}</td>
      <td class="nowrap"><button class="bt bt--fino bt--chico" data-editar="${c.id}">${c.estado === "cerrado" ? "Ver" : "Registrar"}</button></td>
    </tr>
    <tr hidden data-form="${c.id}"><td colspan="13" style="background:var(--papel-2);padding:0">
      ${formCiclo(c)}
    </td></tr>`;
  }
  return h + "</tbody></table></div></section>";
}

/**
 * Dice de dónde salió el precio de un extra. Un monto distinto al del tarifario
 * no es un error —hay servicios que se negocian— pero mirando la tabla nadie
 * tiene por qué adivinar cuál fue negociado y cuál no.
 */
function notaDePrecio(e) {
  if (!e.tarifa_id) {
    return `<span class="sub" style="color:var(--cian)">fuera del tarifario</span>`;
  }
  const t = (estado.catalogos?.tarifas || []).find(x => x.id === e.tarifa_id);
  if (!t || Number(t.precio) === Number(e.precio_unitario)) return "";
  return `<span class="sub" style="color:var(--ambar)">ajustado · lista ${clp(t.precio)}</span>`;
}

function tablaSueltos(sueltos) {
  let h = `<section class="caja"><div class="caja__tit">
    <h2>Servicios extra sin asignar</h2>
    <span class="nota">${sueltos.length} · ${clp(sueltos.reduce((t, e) => t + e.monto_neto, 0))} neto</span></div>`;
  if (!sueltos.length) {
    h += `<p class="vacio">Todos los servicios extra están asignados a un periodo.</p>`;
  } else {
    h += `<div class="desliza"><table><thead><tr>${cabeceraSel("extras")}
      <th>Fecha</th><th>Instalación</th><th>Ítem</th>
      <th class="num">Cant.</th><th class="num">Precio</th><th class="num">Neto</th>
      <th>Asignar al periodo</th></tr></thead><tbody>`;
    const abiertos = estado.panel.ciclos.filter(c => c.estado !== "cerrado");
    for (const e of sueltos) {
      h += `<tr>${celdaSel("extras", e.id)}<td class="num">${fecha(e.fecha)}</td><td>${esc(e.instalacion)}</td>
        <td>${esc(e.item)}${e.detalle ? `<br><span style="color:var(--texto-2);font-size:.8rem">${esc(e.detalle)}</span>` : ""}</td>
        <td class="num">${e.cantidad}</td>
        <td class="num nowrap">${clp(e.precio_unitario)}${notaDePrecio(e)}</td>
        <td class="num"><b>${clp(e.monto_neto)}</b></td>
        <td><select data-asignar="${e.id}">
          <option value="">— elegir —</option>
          ${abiertos.map(c => `<option value="${c.id}">${esc(c.instalacion)} · N°${c.numero} (${fecha(c.desde)})</option>`).join("")}
        </select></td></tr>`;
    }
    h += "</tbody></table></div>";
  }
  return h + "</section>";
}

function conectarPanel() {
  conectarSeleccion();
  document.querySelectorAll("[data-editar]").forEach(b => {
    b.onclick = () => {
      const fila = $(`[data-form="${b.dataset.editar}"]`);
      fila.hidden = !fila.hidden;
      if (!fila.hidden) fila.querySelector("input")?.focus();
    };
  });
  document.querySelectorAll("[data-cerrar]").forEach(b => {
    b.onclick = () => { $(`[data-form="${b.dataset.cerrar}"]`).hidden = true; };
  });
  document.querySelectorAll("form[data-ciclo]").forEach(f => {
    f.onsubmit = async ev => {
      ev.preventDefault();
      const msj = f.querySelector(".mensaje");
      const datos = Object.fromEntries(new FormData(f));
      decir(msj, "Guardando…");
      try {
        const r = await pedir(`/ciclos/${f.dataset.ciclo}`, { method: "PATCH", body: JSON.stringify(datos) });
        decir(msj, "Guardado · " + ROTULO[r.estado], "ok");
        await recargar({ repintar: false });
        setTimeout(() => { if (estado.vista === "panel") pintarPanel(); }, 650);
      } catch (e) { decir(msj, e.message, "error"); }
    };
  });
  document.querySelectorAll("[data-asignar]").forEach(s => {
    s.onchange = async () => {
      if (!s.value) return;
      try {
        await pedir(`/extras/${s.dataset.asignar}`, { method: "PATCH", body: JSON.stringify({ ciclo_id: Number(s.value) }) });
        await recargar();
      } catch (e) { alert(e.message); }
    };
  });
}

/**

      <form id="f-servicio">

          <td><b>${esc(s.instalacion)}</b><span class="sub">${esc(s.cliente)}${

function pintarNuevoExtra() {
  const { tarifas, instalaciones } = estado.catalogos;
  const grupos = [...new Set(tarifas.map(t => t.grupo))];
  const abiertos = estado.panel.ciclos.filter(c => c.estado !== "cerrado");
  $("#app").innerHTML = `
    ${aviso("ojo", "Registre el extra el mismo día que ocurre",
      "Si queda sin asignar a un periodo, aparece en rojo en el panel hasta que se asigne. Así no se pierde ninguno.")}
    <section class="caja" style="max-width:820px">
      <div class="caja__tit"><h2>Registrar servicio extraordinario</h2></div>
      <form id="f-extra">
        <div class="rejilla">
          <label class="campo"><span>Instalación</span>
            <select name="instalacion_id" required><option value="">— elegir —</option>
              ${instalaciones.map(i => `<option value="${i.id}">${esc(i.nombre)}</option>`).join("")}
            </select></label>
          <label class="campo"><span>Fecha del servicio</span>
            <input name="fecha" type="date" required value="${new Date().toISOString().slice(0, 10)}"></label>
          <label class="campo" style="grid-column:1/-1"><span>Ítem del tarifario</span>
            <select name="tarifa_id" required id="sel-tarifa"><option value="">— elegir —</option>
              ${grupos.map(g => `<optgroup label="${esc(g)}">` +
                tarifas.filter(t => t.grupo === g).map(t =>
                  `<option value="${t.id}" data-precio="${t.precio}" data-unidad="${esc(t.unidad || "")}">${esc(t.nombre)} — ${clp(t.precio)} por ${esc(t.unidad)}</option>`).join("") +
                "</optgroup>").join("")}
              <optgroup label="Fuera del tarifario">
                <option value="otro">Otro ítem — lo escribo y le pongo precio</option>
              </optgroup>
            </select></label>
          <label class="campo" style="grid-column:1/-1" id="campo-item" hidden><span>Qué se hizo</span>
            <input name="item" id="in-item" maxlength="200"
                   placeholder="Ej: Guardia adicional por corte de camino"></label>
          <label class="campo"><span>Precio unitario</span>
            <input name="precio_unitario" type="number" min="0" step="1" id="in-precio"
                   placeholder="0"></label>
          <label class="campo"><span>Cantidad</span>
            <input name="cantidad" type="number" min="0.5" step="0.5" value="1" required id="in-cant"></label>
          <label class="campo"><span>Periodo al que se cobra</span>
            <select name="ciclo_id"><option value="">Asignar después</option>
              ${abiertos.map(c => `<option value="${c.id}">${esc(c.instalacion)} · N°${c.numero}</option>`).join("")}
            </select></label>
          <label class="campo" style="grid-column:1/-1"><span>Detalle</span>
            <input name="detalle" placeholder="Ej: 3 horas diarias sábado 30 y domingo 31"></label>
        </div>
        <div class="pie-form">
          <button class="bt" type="submit">Registrar</button>
          <span class="mensaje"></span>
          <span style="margin-left:auto;font-weight:600" id="calculo">Neto: —</span>
        </div>
      </form>
    </section>`;
  // El precio del tarifario se propone, no se impone: hay servicios que se
  // negocian caso a caso y antes había que elegir el ítem más parecido y
  // tragarse un monto que no era el real.
  const deLista = () => {
    const op = $("#sel-tarifa").selectedOptions[0];
    const v = op?.dataset.precio;
    return v === undefined ? null : Number(v);
  };

  const recalcular = () => {
    const precio = Number($("#in-precio").value || 0);
    const cant = Number($("#in-cant").value || 0);
    const neto = Math.round(precio * cant);
    const lista = deLista();
    const ajustado = lista !== null && precio !== lista;
    $("#calculo").innerHTML = neto
      ? `Neto: ${clp(neto)} · IVA: ${clp(neto * 0.19)} · Total: ${clp(neto * 1.19)}`
        + (ajustado ? `<span class="sub" style="color:var(--ambar);text-align:right">precio ajustado · el de lista es ${clp(lista)}</span>` : "")
      : "Neto: —";
  };

  const cambioDeItem = () => {
    const otro = $("#sel-tarifa").value === "otro";
    $("#campo-item").hidden = !otro;
    $("#in-item").required = otro;
    const op = $("#sel-tarifa").selectedOptions[0];
    // Al elegir del tarifario el precio se rellena para que se vea y se pueda
    // corregir; al escribir un ítem propio se parte en blanco.
    $("#in-precio").value = otro ? "" : (op?.dataset.precio ?? "");
    const unidad = op?.dataset.unidad;
    $("#in-precio").placeholder = unidad ? `Por ${unidad}` : "0";
    if (otro) $("#in-item").focus();
    recalcular();
  };

  $("#sel-tarifa").onchange = cambioDeItem;
  $("#in-precio").oninput = recalcular;
  $("#in-cant").oninput = recalcular;
  $("#f-extra").onsubmit = async ev => {
    ev.preventDefault();
    const f = ev.target, msj = f.querySelector(".mensaje");
    decir(msj, "Guardando…");
    try {
      const r = await pedir("/extras", { method: "POST", body: JSON.stringify(Object.fromEntries(new FormData(f))) });
      decir(msj, `Registrado · ${clp(r.monto_neto)} neto`, "ok");
      f.reset(); cambioDeItem();
      await recargar({ repintar: false });
    } catch (e) { decir(msj, e.message, "error"); }
  };
}

function cotizacionNueva() {

const sumasDe = items => {

};

const JSPDF = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";

function cargarScript(url) {
  return new Promise((listo, falla) => {
    if (document.querySelector(`script[src="${url}"]`)) return listo();
    const s = document.createElement("script");
    s.src = url;
    s.onload = listo;
    s.onerror = () => falla(new Error("No se pudo cargar el generador de PDF. ¿Hay internet?"));
    document.head.appendChild(s);
  });
}

/** Carga el logo reducido. A tamaño completo son 140 KB que se incrustan en
 *  cada PDF y lo dejan en más de un mega; a 150 px se ve igual de nítido en
 *  los 20 mm que ocupa en la hoja. */
const cargarLogo = (src, lado = 150) => new Promise(listo => {
  const i = new Image();
  i.onload = () => {
    const c = document.createElement("canvas");
    c.width = c.height = lado;
    c.getContext("2d").drawImage(i, 0, 0, lado, lado);
    listo(c.toDataURL("image/png"));
  };
  i.onerror = () => listo(null);     // sin logo, el PDF se arma igual
  i.src = src;
});

async function generarPDF(c) {
  const msj = $(".pie-form .mensaje");
  decir(msj, "Armando el PDF…");
  try {
    await cargarScript(JSPDF);
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "mm", format: "a4" });
    const A = 210, M = 16;
    const der = A - M;
    const gris = [110, 110, 134], tinta = [19, 0, 82];
    let y = 16;

    const logo = await cargarLogo("logo.png");
    if (logo) doc.addImage(logo, "PNG", M, y - 2, 20, 20);

    doc.setFont("helvetica", "bold").setFontSize(15).setTextColor(...tinta);
    doc.text("SEGURIDAD GARRIDOS", M + (logo ? 24 : 0), y + 5);
    doc.setFont("helvetica", "normal").setFontSize(8.5).setTextColor(...gris);
    doc.text("GLOBSEG SPA · RUT 78.095.104-4", M + (logo ? 24 : 0), y + 10);
    doc.text("Seguridad privada: guardias, rondas, cámaras y eventos.", M + (logo ? 24 : 0), y + 14);

    doc.setFont("helvetica", "bold").setFontSize(13).setTextColor(...tinta);
    doc.text("COTIZACIÓN", der, y + 4, { align: "right" });
    doc.setFontSize(11);
    doc.text("N° " + c.numero, der, y + 10, { align: "right" });
    doc.setFont("helvetica", "normal").setFontSize(8.5).setTextColor(...gris);
    doc.text("Fecha: " + fecha(c.fecha), der, y + 15, { align: "right" });
    doc.text("Válida por " + c.validez_dias + " días", der, y + 19, { align: "right" });

    y += 27;
    doc.setDrawColor(...tinta).setLineWidth(0.5).line(M, y, der, y);
    y += 7;

    doc.setFont("helvetica", "bold").setFontSize(8).setTextColor(...gris);
    doc.text("CLIENTE", M, y);
    y += 5;
    doc.setFont("helvetica", "bold").setFontSize(11).setTextColor(...tinta);
    doc.text(c.cliente_nombre, M, y);
    doc.setFont("helvetica", "normal").setFontSize(9).setTextColor(60, 60, 80);
    const datos = [
      c.cliente_rut && "RUT " + c.cliente_rut,
      c.cliente_contacto, c.cliente_email,
    ].filter(Boolean);
    if (datos.length) { y += 5; doc.text(datos.join("  ·  "), M, y); }
    if (c.instalacion) { y += 5; doc.text("Instalación: " + c.instalacion, M, y); }

    y += 9;
    doc.setFillColor(231, 235, 227).rect(M, y, der - M, 8, "F");
    doc.setFont("helvetica", "bold").setFontSize(8).setTextColor(...tinta);
    doc.text("DETALLE", M + 2, y + 5.5);
    doc.text("CANT.", der - 76, y + 5.5, { align: "right" });
    doc.text("P. UNITARIO", der - 40, y + 5.5, { align: "right" });
    doc.text("SUBTOTAL", der - 2, y + 5.5, { align: "right" });
    y += 12;

    doc.setFont("helvetica", "normal").setFontSize(9).setTextColor(30, 25, 60);
    for (const i of c.items) {
      const lineas = doc.splitTextToSize(i.descripcion, 92);
      if (y + lineas.length * 4.6 > 262) { doc.addPage(); y = 22; }
      doc.text(lineas, M + 2, y);
      const cant = i.cantidad + (i.unidad ? " " + i.unidad : "");
      doc.text(String(cant), der - 76, y, { align: "right" });
      doc.text(clp(i.precio_unitario), der - 40, y, { align: "right" });
      doc.setFont("helvetica", "bold");
      doc.text(clp(i.subtotal), der - 2, y, { align: "right" });
      doc.setFont("helvetica", "normal");
      y += lineas.length * 4.6 + 3;
      doc.setDrawColor(207, 214, 201).setLineWidth(0.15).line(M, y - 1.5, der, y - 1.5);
    }

    y += 4;
    if (y > 232) { doc.addPage(); y = 22; }
    const x1 = der - 62, x2 = der - 2;
    doc.setFontSize(9.5).setTextColor(...gris);
    doc.text("Neto", x1, y);
    doc.setTextColor(30, 25, 60).text(clp(c.neto), x2, y, { align: "right" });
    y += 5.5;
    doc.setTextColor(...gris).text("IVA 19%", x1, y);
    doc.setTextColor(30, 25, 60).text(clp(c.iva), x2, y, { align: "right" });
    y += 3;
    doc.setDrawColor(...tinta).setLineWidth(0.4).line(x1, y, x2, y);
    y += 6.5;
    doc.setFont("helvetica", "bold").setFontSize(12.5).setTextColor(...tinta);
    doc.text("TOTAL", x1, y);
    doc.text(clp(c.total), x2, y, { align: "right" });

    y += 12;
    for (const [rotulo, texto] of [["CONDICIONES", c.condiciones], ["OBSERVACIONES", c.observaciones]]) {
      if (!texto) continue;
      const lineas = doc.splitTextToSize(texto, der - M);
      if (y + lineas.length * 4.2 > 272) { doc.addPage(); y = 22; }
      doc.setFont("helvetica", "bold").setFontSize(8).setTextColor(...gris);
      doc.text(rotulo, M, y);
      y += 5;
      doc.setFont("helvetica", "normal").setFontSize(8.8).setTextColor(60, 60, 80);
      doc.text(lineas, M, y);
      y += lineas.length * 4.2 + 6;
    }

    const n = doc.internal.getNumberOfPages();
    for (let p = 1; p <= n; p++) {
      doc.setPage(p);
      doc.setFont("helvetica", "normal").setFontSize(7.5).setTextColor(...gris);
      doc.text("Seguridad Garridos · GLOBSEG SPA · RUT 78.095.104-4", M, 288);
      doc.text(`Página ${p} de ${n}`, der, 288, { align: "right" });
    }

    // \w no incluye letras acentuadas: sin la u y el rango, "Energía" quedaba
    // como "Energa" en el nombre del archivo.
    const limpio = c.cliente_nombre
      .replace(/[^\p{L}\p{N}\s-]/gu, "").replace(/\s+/g, " ").trim().slice(0, 40);
    doc.save(`Cotizacion-${c.numero}-${limpio}.pdf`);
    decir(msj, "PDF descargado", "ok");
  } catch (e) {
    decir(msj, e.message, "error");
  }
}

        ${cabeceraSel("contactos")}
        <th>Llegó</th><th>Nombre</th><th>Contacto</th><th>Qué necesita</th>
        <th>Estado</th><th>Notas</th>
      </tr></thead><tbody>
        ${contactos.map(c => `<tr>
          ${celdaSel("contactos", c.id)}
          <td class="num nowrap">${esc(String(c.creado_en).slice(8,10))}-${esc(String(c.creado_en).slice(5,7))}-${esc(String(c.creado_en).slice(0,4))}
            <span class="sub">${esc(String(c.creado_en).slice(11,16))}</span></td>
          <td><b>${esc(c.nombre)}</b>${c.empresa ? `<span class="sub">${esc(c.empresa)}</span>` : ""}</td>
          <td class="nowrap">${c.telefono ? esc(c.telefono) : ""}${c.email ? `<span class="sub">${esc(c.email)}</span>` : ""}</td>
          <td>${esc(c.que_cuidar || c.servicio || "—")}
            ${c.turno ? `<span class="sub">turno ${esc(c.turno)}</span>` : ""}
            ${c.comuna ? `<span class="sub">${esc(c.comuna)}</span>` : ""}
            ${c.detalle ? `<span class="sub">${esc(c.detalle)}</span>` : ""}</td>
          <td><select data-estado="${c.id}" style="min-width:132px">
            ${ESTADOS_CONTACTO.map(e => `<option value="${e}"${e === c.estado ? " selected" : ""}>${e}</option>`).join("")}
          </select></td>
          <td><input data-notas="${c.id}" value="${esc(c.notas || "")}" placeholder="Qué se hizo" style="min-width:180px"></td>
        </tr>`).join("")}
      </tbody></table></div>`
      : `<p class="vacio">Todavía no ha llegado ningún contacto desde la página.</p>`}
    </section>`;

  conectarSeleccion();
  const guardar = async (id, campos) => {
    try { await pedir(`/contactos/${id}`, { method: "PATCH", body: JSON.stringify(campos) }); }
    catch (e) { alert(e.message); }
  };
  document.querySelectorAll("[data-estado]").forEach(sel => {
    sel.onchange = () => guardar(sel.dataset.estado, { estado: sel.value });
  });
  document.querySelectorAll("[data-notas]").forEach(inp => {
    inp.onchange = () => guardar(inp.dataset.notas, { notas: inp.value });
  });
}

const VISTAS = {
  panel: { rotulo: "Panel", pintar: pintarPanel, modulo: "facturacion" },
  contactos: { rotulo: "Contactos web", pintar: pintarContactos, modulo: "facturacion" },
  cotizaciones: { rotulo: "Cotizaciones", pintar: pintarCotizaciones, modulo: "cotizaciones" },
  servicio: { rotulo: "Servicios", pintar: pintarServicios, modulo: "facturacion" },
  instalaciones: { rotulo: "Instalaciones", pintar: pintarInstalaciones, modulo: "facturacion" },
  extra: { rotulo: "Registrar extra", pintar: pintarNuevoExtra, modulo: "facturacion" },
  bitacora: { rotulo: "Bitácora", pintar: pintarBitacora, modulo: "facturacion" },
};

// Cada quien ve solo las pestañas de los módulos a los que tiene acceso.
const vistasPermitidas = () =>
  Object.entries(VISTAS).filter(([, v]) => !v.modulo || estado.usuario.permisos.includes(v.modulo));

function ir(vista) {
  // Cambiar de sección descarta lo marcado: las acciones de la barra no
  // aplican a lo que se está mirando ahora y quedaría apuntando a otra cosa.
  if (vista !== estado.vista) {
    seleccion.tipo = null;
    seleccion.ids.clear();
    seleccion.op = 0;
    seleccion.aviso = null;
    pintarBarraSel();
  }
  estado.vista = vista;
  document.querySelectorAll("#pestanas button").forEach(b =>
    b.setAttribute("aria-current", String(b.dataset.vista === vista)));
  // Varias vistas son asíncronas: si fallan y nadie atrapa el error, la
  // pantalla se queda en blanco sin decir por qué. Mejor mostrar el motivo.
  Promise.resolve()
    .then(() => VISTAS[vista].pintar())
    .catch(e => {
      $("#app").innerHTML = aviso("mal", "No se pudo cargar esta sección", e.message);
    });
}

async function recargar({ repintar = true } = {}) {
  estado.panel = await pedir("/panel");
  // Traer los datos no servía de nada si la pantalla seguía mostrando los viejos.
  if (repintar && estado.vista === "panel") pintarPanel();
}

function pintarIngreso(mensaje) {
  document.body.innerHTML = `<div class="puerta"><div class="puerta__caja">
    <div class="puerta__tit"><img src="logo.png" alt="">
      <span><b>Administración</b><span>Seguridad Garridos</span></span></div>
    <form id="f-entrar">
      <label class="campo"><span>Usuario</span>
        <input name="usuario" autocomplete="username" autocapitalize="none"
               spellcheck="false" required autofocus></label>
      <label class="campo"><span>Contraseña</span>
        <input name="clave" type="password" autocomplete="current-password" required></label>
      <button class="bt" type="submit">Entrar</button>
      <span class="mensaje"></span>
    </form>
  </div></div>`;
  const f = document.getElementById("f-entrar");
  if (mensaje) { const m = f.querySelector(".mensaje"); decir(m, mensaje, "error"); }
  f.onsubmit = async ev => {
    ev.preventDefault();
    const m = f.querySelector(".mensaje"), bt = f.querySelector("button");
    decir(m, "Entrando…"); bt.disabled = true;
    try {
      await pedir("/sesion", { method: "POST", body: JSON.stringify(Object.fromEntries(new FormData(f))) });
      location.reload();
    } catch (e) {
      decir(m, e.message, "error");
      bt.disabled = false;
      f.clave.value = ""; f.clave.focus();
    }
  };
}

function pintarCambioClave(usuario) {
  document.body.innerHTML = `<div class="puerta"><div class="puerta__caja">
    <div class="puerta__tit"><img src="logo.png" alt="">
      <span><b>Cambie su contraseña</b><span>${esc(usuario.nombre)}</span></span></div>
    <form id="f-clave">
      <label class="campo"><span>Contraseña actual</span>
        <input name="actual" type="password" autocomplete="current-password" required autofocus></label>
      <label class="campo"><span>Contraseña nueva</span>
        <input name="nueva" type="password" autocomplete="new-password" required></label>
      <label class="campo"><span>Repita la nueva</span>
        <input name="repetir" type="password" autocomplete="new-password" required></label>
      <button class="bt" type="submit">Guardar y entrar</button>
      <span class="mensaje"></span>
    </form>
    <div class="puerta__aviso" style="background:var(--ambar-suave);color:#7A4A00">
      Al menos 8 caracteres, mezclando letras y números. Es suya: nadie más,
      yo incluido, puede verla después de guardada.
    </div>
  </div></div>`;
  const f = document.getElementById("f-clave");
  f.onsubmit = async ev => {
    ev.preventDefault();
    const m = f.querySelector(".mensaje"), bt = f.querySelector("button");
    if (f.nueva.value !== f.repetir.value) {
      decir(m, "Las dos contraseñas nuevas no coinciden", "error");
      f.repetir.focus(); return;
    }
    decir(m, "Guardando…"); bt.disabled = true;
    try {
      await pedir("/clave", { method: "POST",
        body: JSON.stringify({ actual: f.actual.value, nueva: f.nueva.value }) });
      location.reload();
    } catch (e) { decir(m, e.message, "error"); bt.disabled = false; }
  };
}

async function arrancar() {
  let usuario, quien_borra;
  try {
    ({ usuario, quien_borra } = await pedir("/yo"));
  } catch (e) {
    return pintarIngreso(e.message.includes("Sin sesión") ? "" : e.message);
  }
  if (usuario.debe_cambiar_clave) return pintarCambioClave(usuario);

  try {
    estado.usuario = usuario;
    estado.quienBorra = quien_borra || [];
    $("#quien").innerHTML =
      `<b>${esc(usuario.nombre)}</b>${esc(usuario.usuario)} · ${esc(usuario.rol)}`;
    $("#quien").insertAdjacentHTML("afterend",
      `<button class="bt bt--fino bt--chico" id="salir" style="margin-left:12px">Cerrar sesión</button>`);
    $("#salir").onclick = async () => {
      await pedir("/sesion", { method: "DELETE" }).catch(() => {});
      location.reload();
    };
    const permitidas = vistasPermitidas();
    if (!permitidas.length) {
      $("#app").innerHTML = aviso("ojo", "Su cuenta todavía no tiene módulos asignados",
        "Su rol es «" + esc(usuario.rol) + "». El módulo correspondiente aún no está construido.");
      return;
    }
    $("#pestanas").innerHTML = permitidas
      .map(([k, v]) => `<button data-vista="${k}">${v.rotulo}</button>`).join("");
    document.querySelectorAll("#pestanas button").forEach(b => { b.onclick = () => ir(b.dataset.vista); });

    // Los catálogos los usan los dos módulos; el panel solo quien lo tenga.
    estado.catalogos = await pedir("/catalogos");
    if (usuario.permisos.includes("facturacion")) estado.panel = await pedir("/panel");
    ir(permitidas[0][0]);
  } catch (e) {
    $("#app").innerHTML = aviso("mal", "No se pudo entrar", e.message);
  }
}

arrancar();
</script>

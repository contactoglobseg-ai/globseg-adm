  $("#volver").onclick = () => ir("cotizaciones");
  $("#agregar").onclick = () => { c.items.push({ descripcion: "", unidad: "", cantidad: 1, precio_unitario: 0 }); pintarLineas(); };
  $("#del-tarifario").onchange = ev => {
    const t = estado.catalogos.tarifas.find(x => String(x.id) === ev.target.value);
    ev.target.value = "";
    if (!t) return;
    // El tarifario está en pesos. En UF se convierte con el valor de la
    // cotización; sin ese valor la línea entra en cero y se dice, en vez de
    // meter el precio en pesos adentro de una cotización en UF.
    let precio = t.precio;
    if (moneda === "uf") {
      precio = c.uf_valor ? redondearM(t.precio / c.uf_valor, "uf") : 0;
    }
    c.items.push({ descripcion: t.nombre, unidad: t.unidad, cantidad: 1, precio_unitario: precio });
    pintarLineas();
    if (moneda === "uf" && !c.uf_valor) {
      decir($(".pie-form .mensaje"),
            "Sin valor de la UF no se pudo convertir el precio del tarifario: escríbalo en UF.",
            "error");
    }
  };

  $("#c-moneda").onchange = ev => {
    const nuevaM = ev.target.value;
    if (nuevaM === moneda) return;
    // Viniendo de pesos todavía no hay campo ni valor en la cotización: el que
    // sirve para convertir es el que RRHH tiene cargado hoy.
    const valor = Number($("#c-uf") ? $("#c-uf").value : 0)
      || c.uf_valor || (estado.uf ? estado.uf.valor : 0) || 0;
    // Cambiar de moneda no convierte nada solo: "450.000" leído en UF es un
    // disparate y "1,8" leído en pesos también. Se ofrece convertir con el
    // valor de la UF, y si no hay valor, los precios quedan como están y se
    // avisa, porque convertirlos con un número inventado sería peor.
    const hayPrecios = c.items.some(i => Number(i.precio_unitario) > 0);
    let enCero = false;
    if (hayPrecios && valor > 0) {
      const aUF = nuevaM === "uf";
      const pregunta = aUF
        ? `¿Convertir los precios a UF con ${clpExacto(valor)} por UF?\n\n` +
          "Aceptar convierte. Cancelar deja los números como están."
        : `¿Convertir los precios a pesos con ${clpExacto(valor)} por UF?\n\n` +
          "Aceptar convierte. Cancelar deja los números como están.";
      if (confirm(pregunta)) {
        for (const i of c.items) {
          const p = Number(i.precio_unitario) || 0;
          i.precio_unitario = redondearM(aUF ? p / valor : p * valor, nuevaM);
          // Un precio que valía algo y quedó en cero es, casi siempre, una
          // conversión de vuelta sobre precios que ya estaban convertidos.
          if (p > 0 && i.precio_unitario === 0) enCero = true;
        }
      }
    }
    c.moneda = nuevaM;
    if (nuevaM === "uf") {
      if (!c.uf_valor) c.uf_valor = estado.uf ? estado.uf.valor : null;
    } else {
      c.uf_valor = null;
    }
    pintarEditor();
    if (hayPrecios && !(valor > 0)) {
      decir($(".pie-form .mensaje"),
            "Sin valor de la UF los precios quedaron tal cual: revíselos antes de guardar.",
            "error");
    } else if (enCero) {
      decir($(".pie-form .mensaje"),
            "Algún precio quedó en cero al convertir: revíselos antes de guardar.", "error");
    }
  };
  $("#guardar").onclick = guardarCotizacion;
  if ($("#pdf")) $("#pdf").onclick = () => generarPDF(c);
  if ($("#c-uf")) $("#c-uf").oninput = ev => {
    c.uf_valor = Number(ev.target.value) || null;
    pintarSumas();
  };
  pintarLineas();
}

function pintarLineas() {
  const c = borrador;
  const moneda = c.moneda || "clp";
  const paso = MONEDAS[moneda].paso;
  $("#lineas").innerHTML = c.items.map((i, n) => `<tr>
    <td class="col-desc" data-rotulo="Descripción"><input data-i="${n}" data-campo="descripcion" value="${esc(i.descripcion)}" placeholder="Qué se cotiza"></td>
    <td class="col-cant num" data-rotulo="Cantidad"><input data-i="${n}" data-campo="cantidad" type="number" min="0.5" step="0.5" value="${i.cantidad}"></td>
    <td class="col-uni" data-rotulo="Unidad"><input data-i="${n}" data-campo="unidad" value="${esc(i.unidad || "")}" placeholder="turno"></td>
    <td class="col-precio num" data-rotulo="Precio unitario${moneda === "uf" ? " (UF)" : ""}"><input data-i="${n}" data-campo="precio_unitario" type="number" min="0" step="${paso}" value="${i.precio_unitario}"></td>
    <td class="col-sub num" data-rotulo="Subtotal"><b>${montoDe(subtotalDe(i, moneda), moneda)}</b></td>
    <td class="col-x"><button class="quitar" data-quitar="${n}" title="Quitar línea">×</button></td>
  </tr>`).join("");

  $("#lineas").oninput = ev => {
    const el = ev.target;
    if (!el.dataset.campo) return;
    const v = el.dataset.campo === "descripcion" || el.dataset.campo === "unidad"
      ? el.value : Number(el.value);
    c.items[el.dataset.i][el.dataset.campo] = v;
    const fila = el.closest("tr");
    fila.querySelector(".col-sub b").textContent =
      montoDe(subtotalDe(c.items[el.dataset.i], moneda), moneda);
    pintarSumas();
  };
  document.querySelectorAll("[data-quitar]").forEach(b => {
    b.onclick = () => {
      if (c.items.length === 1) return;
      c.items.splice(Number(b.dataset.quitar), 1);
      pintarLineas();
    };
  });
  pintarSumas();
}

function pintarSumas() {
  const c = borrador, moneda = c.moneda || "clp";
  const s = sumasDe(c.items, moneda);
  $("#sumas").innerHTML = `
    <div><span>Neto</span><b class="num">${montoDe(s.neto, moneda)}</b></div>
    <div><span>IVA 19%</span><b class="num">${montoDe(s.iva, moneda)}</b></div>
    <div class="total"><span>Total</span><b class="num">${montoDe(s.total, moneda)}</b></div>
    ${moneda === "uf" && c.uf_valor
      ? `<div style="font-size:.82rem;color:var(--texto-3)">
           <span>Referencial en pesos</span>
           <b class="num" style="font-weight:600">${clp(s.total * c.uf_valor)}</b></div>` : ""}`;
}

async function guardarCotizacion() {
  const c = borrador, msj = $(".pie-form .mensaje");
  c.cliente_nombre = $("#c-nombre").value.trim();
  c.cliente_rut = $("#c-rut").value.trim();
  c.cliente_contacto = $("#c-contacto").value.trim();
  c.cliente_email = $("#c-email").value.trim();
  c.instalacion = $("#c-inst").value.trim();
  c.validez_dias = Number($("#c-validez").value);
  if ($("#c-moneda")) c.moneda = $("#c-moneda").value;
  c.uf_valor = c.moneda === "uf" && $("#c-uf")
    ? (Number($("#c-uf").value) || null) : null;
  c.condiciones = $("#c-cond").value.trim();
  c.observaciones = $("#c-obs").value.trim();
  if ($("#c-estado")) c.estado = $("#c-estado").value;

  decir(msj, "Guardando…");
  try {
    if (c.id) {
      await pedir(`/cotizaciones/${c.id}`, { method: "PATCH", body: JSON.stringify(c) });
      // Se vuelve a pedir lo guardado, igual que al crear. El PDF imprime
      // item.subtotal y los totales de la cabecera, que los calcula el
      // servidor: una línea agregada en esta pasada todavía no trae subtotal,
      // y sin este paso el PDF la imprimía en $0 con el neto y el total viejos.
      const { cotizacion } = await pedir(`/cotizaciones/${c.id}`);
      borrador = cotizacion;
      pintarEditor();
      decir($(".pie-form .mensaje"), "Guardada", "ok");
    } else {
      const r = await pedir("/cotizaciones", { method: "POST", body: JSON.stringify(c) });
      const { cotizacion } = await pedir(`/cotizaciones/${r.cotizacion.id}`);
      borrador = cotizacion;
      pintarEditor();
      decir($(".pie-form .mensaje"), `Creada con el N° ${cotizacion.numero}`, "ok");
    }
  } catch (e) { decir(msj, e.message, "error"); }
}

// ------------------------------------------------------------- PDF


async function generarPDF(c) {
  const msj = $(".pie-form .mensaje");

  // El PDF imprime lo que guardó el servidor, no lo que hay en pantalla: es el
  // documento que se le manda al cliente y tiene que decir lo mismo que la
  // cotización. Si todavía no se guarda, los montos no calzan y se avisa en
  // vez de emitir un PDF con otras cifras.
  // En UF los montos llevan decimales, así que la comparación va con holgura
  // de medio centésimo: dos sumas iguales en coma flotante pueden diferir en
  // el último bit y eso no es un cambio sin guardar.
  const moneda = c.moneda || "clp";
  if (Math.abs(sumasDe(c.items, moneda).total - Number(c.total)) > 0.005) {
    return decir(msj, "Hay cambios sin guardar: guarde antes de descargar el PDF.", "error");
  }

  decir(msj, "Armando el PDF…");
  try {
    await cargarScript(JSPDF);
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "mm", format: "a4" });
    const A = 210, M = 16;
    const der = A - M;
    const gris = [110, 110, 134], tinta = [19, 0, 82];
    let y = 16;

    const logo = await cargarLogo("logo.png");
    if (logo) doc.addImage(logo, "PNG", M, y - 2, 20, 20);

    doc.setFont("helvetica", "bold").setFontSize(15).setTextColor(...tinta);
    doc.text("SEGURIDAD GARRIDOS", M + (logo ? 24 : 0), y + 5);
    doc.setFont("helvetica", "normal").setFontSize(8.5).setTextColor(...gris);
    doc.text("GLOBSEG SPA · RUT 78.095.104-4", M + (logo ? 24 : 0), y + 10);
    doc.text("Seguridad privada: guardias, rondas, cámaras y eventos.", M + (logo ? 24 : 0), y + 14);

    doc.setFont("helvetica", "bold").setFontSize(13).setTextColor(...tinta);
    doc.text("COTIZACIÓN", der, y + 4, { align: "right" });
    doc.setFontSize(11);
    doc.text("N° " + c.numero, der, y + 10, { align: "right" });
    doc.setFont("helvetica", "normal").setFontSize(8.5).setTextColor(...gris);
    doc.text("Fecha: " + fecha(c.fecha), der, y + 15, { align: "right" });
    doc.text("Válida por " + c.validez_dias + " días", der, y + 19, { align: "right" });

    y += 27;
    doc.setDrawColor(...tinta).setLineWidth(0.5).line(M, y, der, y);
    y += 7;

    doc.setFont("helvetica", "bold").setFontSize(8).setTextColor(...gris);
    doc.text("CLIENTE", M, y);
    y += 5;
    doc.setFont("helvetica", "bold").setFontSize(11).setTextColor(...tinta);
    doc.text(c.cliente_nombre, M, y);
    doc.setFont("helvetica", "normal").setFontSize(9).setTextColor(60, 60, 80);
    const datos = [
      c.cliente_rut && "RUT " + c.cliente_rut,
      c.cliente_contacto, c.cliente_email,
    ].filter(Boolean);
    if (datos.length) { y += 5; doc.text(datos.join("  ·  "), M, y); }
    if (c.instalacion) { y += 5; doc.text("Instalación: " + c.instalacion, M, y); }

    y += 9;
    doc.setFillColor(231, 235, 227).rect(M, y, der - M, 8, "F");
    doc.setFont("helvetica", "bold").setFontSize(8).setTextColor(...tinta);
    doc.text("DETALLE", M + 2, y + 5.5);
    doc.text("CANT.", der - 76, y + 5.5, { align: "right" });
    doc.text(moneda === "uf" ? "P. UNITARIO UF" : "P. UNITARIO", der - 40, y + 5.5, { align: "right" });
    doc.text(moneda === "uf" ? "SUBTOTAL UF" : "SUBTOTAL", der - 2, y + 5.5, { align: "right" });
    y += 12;

    doc.setFont("helvetica", "normal").setFontSize(9).setTextColor(30, 25, 60);
    for (const i of c.items) {
      const lineas = doc.splitTextToSize(i.descripcion, 92);
      if (y + lineas.length * 4.6 > 262) { doc.addPage(); y = 22; }
      doc.text(lineas, M + 2, y);
      const cant = i.cantidad + (i.unidad ? " " + i.unidad : "");
      doc.text(String(cant), der - 76, y, { align: "right" });
      doc.text(montoDe(i.precio_unitario, moneda), der - 40, y, { align: "right" });
      doc.setFont("helvetica", "bold");
      doc.text(montoDe(i.subtotal, moneda), der - 2, y, { align: "right" });
      doc.setFont("helvetica", "normal");
      y += lineas.length * 4.6 + 3;
      doc.setDrawColor(207, 214, 201).setLineWidth(0.15).line(M, y - 1.5, der, y - 1.5);
    }

    y += 4;
    if (y > 232) { doc.addPage(); y = 22; }
    const x1 = der - 62, x2 = der - 2;
    doc.setFontSize(9.5).setTextColor(...gris);
    doc.text("Neto", x1, y);
    doc.setTextColor(30, 25, 60).text(montoDe(c.neto, moneda), x2, y, { align: "right" });
    y += 5.5;
    doc.setTextColor(...gris).text("IVA 19%", x1, y);
    doc.setTextColor(30, 25, 60).text(montoDe(c.iva, moneda), x2, y, { align: "right" });
    y += 3;
    doc.setDrawColor(...tinta).setLineWidth(0.4).line(x1, y, x2, y);
    y += 6.5;
    doc.setFont("helvetica", "bold").setFontSize(12.5).setTextColor(...tinta);
    doc.text("TOTAL", x1, y);
    doc.text(montoDe(c.total, moneda), x2, y, { align: "right" });

    // Lo que se pactó son UF; los pesos de abajo son del día en que se cotizó
    // y van dichos como referencia, no como el precio. Sin valor de UF no se
    // imprime ninguna cifra en pesos: una inventada adentro de un documento
    // que recibe el cliente es peor que no ponerla.
    if (moneda === "uf") {
      y += 5.5;
      doc.setFont("helvetica", "normal").setFontSize(8).setTextColor(...gris);
      doc.text(c.uf_valor
        ? `Referencia: ${clp(c.total * c.uf_valor)} con la UF a ${clpExacto(c.uf_valor)} del ${fecha(c.fecha)}`
        : "Valores en UF. La equivalencia en pesos no se incluye.",
        x2, y, { align: "right" });
    }

    y += 12;
    const condiciones = moneda === "uf"
      ? [c.condiciones, "Los valores están expresados en Unidades de Fomento. " +
         "Se facturan en pesos según el valor de la UF del día de emisión de la factura."]
          .filter(Boolean).join(" ")
      : c.condiciones;
    for (const [rotulo, texto] of [["CONDICIONES", condiciones], ["OBSERVACIONES", c.observaciones]]) {
      if (!texto) continue;
      const lineas = doc.splitTextToSize(texto, der - M);
      if (y + lineas.length * 4.2 > 272) { doc.addPage(); y = 22; }
      doc.setFont("helvetica", "bold").setFontSize(8).setTextColor(...gris);
      doc.text(rotulo, M, y);
      y += 5;
      doc.setFont("helvetica", "normal").setFontSize(8.8).setTextColor(60, 60, 80);
      doc.text(lineas, M, y);
      y += lineas.length * 4.2 + 6;
    }

    const n = doc.internal.getNumberOfPages();
    for (let p = 1; p <= n; p++) {
      doc.setPage(p);
      doc.setFont("helvetica", "normal").setFontSize(7.5).setTextColor(...gris);
      doc.text("Seguridad Garridos · GLOBSEG SPA · RUT 78.095.104-4", M, 288);
      doc.text(`Página ${p} de ${n}`, der, 288, { align: "right" });
    }

    // \w no incluye letras acentuadas: sin la u y el rango, "Energía" quedaba
    // como "Energa" en el nombre del archivo.
    const limpio = c.cliente_nombre
      .replace(/[^\p{L}\p{N}\s-]/gu, "").replace(/\s+/g, " ").trim().slice(0, 40);
    doc.save(`Cotizacion-${c.numero}-${limpio}.pdf`);
    decir(msj, "PDF descargado", "ok");
  } catch (e) {
    decir(msj, e.message, "error");
  }
}

          <td class="nowrap">${t.ultimo_ingreso
            ? esc(new Date(t.ultimo_ingreso).toLocaleString("es-CL",
                { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }))
            : "<span class=\"sub\">Nunca ha entrado</span>"}</td>
          <td>${t.activo
            ? (t.bloqueado ? '<span class="sello e-solicitar_oc">Bloqueado</span>'
                           : '<span class="sello e-cerrado">Activo</span>')
            : '<span class="sello e-en_curso">De baja</span>'}</td>
          <td class="nowrap">
            <button class="bt bt--fino bt--chico" data-baja="${t.id}" data-activo="${t.activo}"
              >${t.activo ? "Dar de baja" : "Reactivar"}</button>
            ${t.bloqueado ? `<button class="bt bt--fino bt--chico" data-desbloquear="${t.id}"
              >Desbloquear</button>` : ""}
            <button class="bt bt--fino bt--chico" data-clave="${t.id}"
              title="Vuelve la clave al RUT">Clave al RUT</button>
          </td>
        </tr>`).join("")}
        </tbody></table></div>`
      : `<p class="vacio">Todavía no hay trabajadores cargados.
           El primero que cree ya puede entrar a asistencia.seggarridos.com.</p>`}
    </section>`;

  const f = $("#f-trab");
  const previo = $("#previo");
  const verPrevio = () => {
    const u = usuarioPropuesto(f.nombres.value, f.apellido_paterno.value, f.apellido_materno.value);
    previo.textContent = u
      ? `Entrará como «${u}» con su RUT de clave`
      : "El usuario se arma con el nombre y los apellidos";
  };
  ["nombres", "apellido_paterno", "apellido_materno"].forEach(c => { f[c].oninput = verPrevio; });
  f.rut.onblur = () => { if (f.rut.value) f.rut.value = rutLindo(f.rut.value); };
  verPrevio();

  f.onsubmit = async ev => {
    ev.preventDefault();
    const m = f.querySelector(".mensaje"), bt = f.querySelector("button");
    decir(m, "Guardando…"); bt.disabled = true;
    try {
      const r = await pedir("/trabajadores", { method: "POST",
        body: JSON.stringify(Object.fromEntries(new FormData(f))) });
      alert(`${r.trabajador.nombre} ya puede entrar.\n\n` +
            `Página: asistencia.seggarridos.com\n` +
            `Usuario: ${r.trabajador.usuario}\n` +
            `Clave: su RUT (${r.trabajador.rut})`);
      pintarTrabajadores();
    } catch (e) { decir(m, e.message, "error"); bt.disabled = false; }
  };

  const cambiar = async (id, campos, pregunta) => {
    if (pregunta && !confirm(pregunta)) return;
    try {
      await pedir(`/trabajadores/${id}`, { method: "PATCH", body: JSON.stringify(campos) });
      pintarTrabajadores();
    } catch (e) { alert(e.message); }
  };
  document.querySelectorAll("[data-baja]").forEach(b => {
    b.onclick = () => cambiar(b.dataset.baja, { activo: b.dataset.activo !== "true" },
      b.dataset.activo === "true"
        ? "¿Dar de baja? No podrá entrar a marcar, y lo que ya marcó se conserva."
        : null);
  });
  document.querySelectorAll("[data-desbloquear]").forEach(b => {
    b.onclick = () => cambiar(b.dataset.desbloquear, { desbloquear: true });
  });
  document.querySelectorAll("[data-clave]").forEach(b => {
    b.onclick = () => cambiar(b.dataset.clave, { restablecer_clave: true },
      "¿Volver la clave a su RUT? Es lo único que se puede hacer: la clave guardada no la ve nadie.");
  });
}

// ------------------------------------------------------------- Excel del libro
/**
 * El libro en una planilla.
 *
 * Esto existe para remuneraciones: lo que se hace con el libro al final de mes
 * es sumar horas por persona, y eso se hace en Excel. Por eso las horas van
 * como número y no como texto —si no, no se pueden sumar— y la fecha va como
 * fecha de verdad, para poder ordenar y filtrar por mes.
 *
 * Tres hojas: el resumen de lo que se descargó (para que el archivo diga solo
 * de qué periodo es cuando llegue por correo), una fila por jornada, y las
 * correcciones aparte, con quién las hizo y por qué. Lo que la oficina
 * intervino nunca se mezcla en silencio con lo que marcó el guardia.
 */

async function bajarLibroExcel(libro) {
  await cargarScript(SHEETJS, "el generador de Excel");
  const XLSX = window.XLSX;
  if (!XLSX) throw new Error("No se pudo cargar el generador de Excel.");

  // Mediodía para que el cambio de huso no corra la fecha un día.
  const comoFecha = iso => iso ? new Date(iso + "T12:00:00") : null;
  const r = libro.resumen;
  const quien = estado.usuario ? `${estado.usuario.nombre} (${estado.usuario.usuario})` : "";

  const resumen = [
    ["Libro de asistencia"],
    ["Seguridad Garridos · GLOBSEG SPA"],
    [],
    ["Desde", comoFecha(libro.desde)],
    ["Hasta", comoFecha(libro.hasta)],
    ["Jornadas", r.jornadas],
    ["Trabajadores", r.trabajadores],
    ["Horas registradas", r.horas],
    ["Sin salida marcada", r.sin_salida],
    ["Corregidas por la oficina", r.corregidas || 0],
    [],
    ["Descargado", new Date()],
    ["Por", quien],
  ];
  if (r.sin_salida) {
    resumen.push([], ["Aviso", "Las jornadas sin salida no suman horas: falta la marca."]);
  }

  const jornadas = libro.jornadas.map(j => ({
    "Fecha": comoFecha(j.fecha),
    "Trabajador": j.trabajador,
    "RUT": j.rut || "",
    "Usuario": j.usuario || "",
    "Instalación": j.instalacion || "",
    "Entrada": j.hora_entrada || "",
    "Salida": j.hora_salida || "",
    "Horas": j.horas ?? "",
    "Estado": j.completa ? "Completa" : "Sin salida",
    "Entrada marcada por": j.entrada_origen === "oficina" ? "Oficina" : (j.entrada ? "El guardia" : ""),
    "Salida marcada por": j.salida_origen === "oficina" ? "Oficina" : (j.salida ? "El guardia" : ""),
    "Con ubicación": j.entrada_ubicada || j.salida_ubicada ? "Sí" : "No",
  }));

  const correcciones = libro.jornadas.flatMap(j =>
    (j.correcciones || []).map(c => ({
      "Fecha": comoFecha(j.fecha),
      "Trabajador": j.trabajador,
      "RUT": j.rut || "",
      "Qué se agregó": c.tipo === "entrada" ? "Entrada" : "Salida",
      "Hora": c.hora || "",
      "Quién la puso": c.por_nombre || c.por || "",
      "Motivo": c.motivo || "",
      "Cuándo se registró": c.cuando ? new Date(c.cuando) : "",
    })));

  const libroXL = XLSX.utils.book_new();

  const hojaResumen = XLSX.utils.aoa_to_sheet(resumen);
  hojaResumen["!cols"] = [{ wch: 26 }, { wch: 46 }];
  formatear(hojaResumen, { "B4": "dd-mm-yyyy", "B5": "dd-mm-yyyy", "B12": "dd-mm-yyyy hh:mm" });
  XLSX.utils.book_append_sheet(libroXL, hojaResumen, "Resumen");

  const hojaJornadas = XLSX.utils.json_to_sheet(jornadas);
  hojaJornadas["!cols"] = [{ wch: 11 }, { wch: 28 }, { wch: 13 }, { wch: 13 }, { wch: 22 },
                           { wch: 9 }, { wch: 9 }, { wch: 8 }, { wch: 12 },
                           { wch: 19 }, { wch: 19 }, { wch: 13 }];
  // La primera fila es el encabezado; Excel la congela y se puede filtrar.
  hojaJornadas["!freeze"] = { xSplit: 0, ySplit: 1 };
  if (jornadas.length) {
    hojaJornadas["!autofilter"] = { ref: XLSX.utils.encode_range({
      s: { r: 0, c: 0 }, e: { r: jornadas.length, c: 11 } }) };
  }
  formatearColumna(hojaJornadas, 0, "dd-mm-yyyy", jornadas.length);
  formatearColumna(hojaJornadas, 7, "0.00", jornadas.length);
  XLSX.utils.book_append_sheet(libroXL, hojaJornadas, "Jornadas");

  if (correcciones.length) {
    const hojaCorr = XLSX.utils.json_to_sheet(correcciones);
    hojaCorr["!cols"] = [{ wch: 11 }, { wch: 28 }, { wch: 13 }, { wch: 14 }, { wch: 8 },
                         { wch: 24 }, { wch: 52 }, { wch: 19 }];
    formatearColumna(hojaCorr, 0, "dd-mm-yyyy", correcciones.length);
    formatearColumna(hojaCorr, 7, "dd-mm-yyyy hh:mm", correcciones.length);
    XLSX.utils.book_append_sheet(libroXL, hojaCorr, "Correcciones");
  }

  XLSX.writeFile(libroXL, `asistencia ${libro.desde} a ${libro.hasta}.xlsx`);
}

/** Pone el formato de una celda suelta, si existe. */
function formatear(hoja, formatos) {
  for (const [celda, z] of Object.entries(formatos)) {
    if (hoja[celda]) hoja[celda].z = z;
  }
}

/** Pone el formato a toda una columna de datos, sin tocar el encabezado. */
function formatearColumna(hoja, columna, z, filas) {
  for (let i = 1; i <= filas; i++) {
    const celda = hoja[window.XLSX.utils.encode_cell({ r: i, c: columna })];
    if (celda && celda.v !== "") celda.z = z;
  }
}


// --------------------------------------------------------- estados de pago
/*
 * La carpeta que el mandante exige por instalación y por mes: libro de
 * asistencia, libro de remuneraciones, liquidaciones, F30 y F30-1.
 *
 * Lo que esta pantalla hace y antes se hacía a mano es **armar los tres
 * primeros**: el libro de asistencia sale del libro que ya marcan los
 * guardias, el de remuneraciones y las liquidaciones salen del mes calculado.
 * El F30 y el F30-1 los emite un tercero (la Dirección del Trabajo), así que
 * acá se suben; del F30-1 lo que se hace es repartir por instalación el Excel
 * que entrega Previred, que es el trámite que se pedía.
 */

const pagosEstado = { mes: null, instalacion: null, abierto: null, detalle: null,
                      dotacion: null, omitidos: null };

const mesPorDefecto = () => {
  // El estado de pago que se cursa es el del mes pasado: el de este mes
  // todavía no termina.
  const h = new Date();
  const d = new Date(h.getFullYear(), h.getMonth() - 1, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
};

const MES_NOMBRE = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto",
                    "septiembre", "octubre", "noviembre", "diciembre"];
const mesLindo = m => m ? `${MES_NOMBRE[Number(m.slice(5, 7)) - 1]} de ${m.slice(0, 4)}` : "";

const ESTADOS_PAGO = {
  armando: "Armando", enviado: "Enviado", aprobado: "Aprobado", pagado: "Pagado",
};

async function pintarEstadosPago() {
  if (!pagosEstado.mes) pagosEstado.mes = mesPorDefecto();
  $("#app").innerHTML = `<p class="cargando">Cargando…</p>`;

  let datos;
  try {
    datos = await pedir(`/pagos/estados?mes=${pagosEstado.mes}`);
  } catch (e) {
    $("#app").innerHTML = `<section class="caja"><div class="caja__tit">
      <h2>Estados de pago</h2></div>
      ${aviso("ojo", "No se pudieron leer los estados de pago", e.message)}</section>`;
    return;
  }
  if (datos.sin_migracion) {
    $("#app").innerHTML = `<section class="caja"><div class="caja__tit">
      <h2>Estados de pago</h2></div>
      ${aviso("ojo", "Falta aplicar una migración", datos.aviso)}</section>`;
    return;
  }

  // Las instalaciones vienen en la misma respuesta: ver el comentario de la
  // ruta. `estado.catalogos` puede estar en null acá, porque una cuenta de solo
  // RRHH no puede pedir ese catálogo.
  const insts = datos.instalaciones || estado.catalogos?.instalaciones || [];
  $("#app").innerHTML = `
  <section class="caja">
    <div class="caja__tit"><h2>Estados de pago</h2>
      <span class="nota">La carpeta que se le entrega al mandante, por instalación y por mes</span></div>
    <div class="rejilla">
      <label class="campo"><span>Mes</span>
        <input type="month" id="ep-mes" value="${esc(pagosEstado.mes)}"></label>
      <label class="campo"><span>Instalación</span><select id="ep-inst">
        <option value="">— elija una —</option>
        ${insts.map(i => `<option value="${i.id}">${esc(i.nombre)}</option>`).join("")}
      </select></label>
      <button class="bt" id="ep-abrir">Abrir la carpeta del mes</button>
    </div>
    ${datos.estados.length ? `<div class="desliza"><table style="min-width:720px"><thead><tr>
      <th>Instalación</th><th>Cliente</th><th>Estado</th><th class="num">Documentos</th>
      <th>Factura</th><th></th></tr></thead><tbody>
      ${datos.estados.map(e => `<tr><td>${esc(e.instalacion)}</td>
        <td>${esc(e.cliente || "—")}</td>
        <td>${esc(ESTADOS_PAGO[e.estado] || e.estado)}</td>
        <td class="num">${e.archivos}</td>
        <td>${esc(e.folio_factura || "—")}</td>
        <td><button class="bt bt--chico bt--fino" data-ver="${e.id}">Ver</button></td></tr>`).join("")}
      </tbody></table></div>`
      : `<p class="vacio">Todavía no hay ninguna carpeta armada para ${esc(mesLindo(pagosEstado.mes))}.</p>`}
  </section>
  <div id="ep-detalle"></div>`;

  $("#ep-mes").onchange = e => {
    pagosEstado.mes = e.target.value || mesPorDefecto();
    pagosEstado.abierto = null;
    pintarEstadosPago();
  };
  $("#ep-inst").onchange = e => { pagosEstado.instalacion = Number(e.target.value) || null; };
  if (pagosEstado.instalacion) $("#ep-inst").value = String(pagosEstado.instalacion);

  $("#ep-abrir").onclick = async () => {
    if (!pagosEstado.instalacion) return recado("Elija la instalación", "mal");
    try {
      const r = await pedir("/pagos/estados", {
        method: "POST",
        body: JSON.stringify({ mes: pagosEstado.mes, instalacion_id: pagosEstado.instalacion }),
      });
      pagosEstado.abierto = r.id;
      await pintarEstadosPago();
      await pintarCarpeta(r.id);

    b.onclick = () => pintarCarpeta(Number(b.dataset.ver));
  });

}

/** Un botón que se apaga mientras trabaja: armar un PDF de treinta
 *  liquidaciones toma unos segundos y sin esto se aprieta tres veces. */
async function conPaciencia(boton, trabajo) {
  const antes = boton.textContent;
  boton.disabled = true;
  boton.textContent = "Generando…";
  try { await trabajo(); }
  catch (e) { recado(e.message, "mal"); }
  finally { boton.disabled = false; boton.textContent = antes; }
}

async function subirALaCarpeta(id, archivo, clase) {
  if (!archivo) return;
  try {
    const r = await fetch(`/api/pagos/estados/${id}/archivo?clase=${clase}`, {
      method: "POST",
      headers: { "x-archivo-nombre": encodeURIComponent(archivo.name) },
      body: archivo,
    });
    const datos = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(datos.error || `La subida falló (${r.status})`);
    recado("Documento cargado");
    await pintarCarpeta(id);
  } catch (e) { recado(e.message, "mal"); }
}

/** El libro de asistencia de esa instalación y ese mes, con el mismo generador
 *  de Excel que usa la pestaña Asistencia: una sola forma de armar el libro. */
async function bajarAsistenciaDeLaCarpeta(e) {
  const fin = new Date(Number(e.mes.slice(0, 4)), Number(e.mes.slice(5, 7)), 0);
  const desde = `${e.mes}-01`;
  const hasta = `${e.mes}-${String(fin.getDate()).padStart(2, "0")}`;
  const libro = await pedir(
    `/libro?desde=${desde}&hasta=${hasta}&instalacion=${e.instalacion_id}`);
  if (!libro.jornadas?.length) throw new Error("No hay jornadas marcadas en ese mes y esa instalación.");
  await bajarLibroExcel(libro);
}

      Movilización: Number(h.movilizacion || 0),

      AFP: Number(x.afp || 0),
      Salud: Number(x.salud || 0),
      "Seguro de cesantía": Number(x.cesantia || 0),
      "Impuesto único": Number(x.impuesto_unico || 0),
      "Otros descuentos": Number(x.otros || 0) + Number(x.apv || 0),
      "Total descuentos": Number(x.total_descuentos || 0),
      "Líquido a pagar": Number(r.liquido || 0),
      Estado: r.estado === "cerrado" ? "Cerrado" : "Borrador",
    };
  });

  const libro = XLSX.utils.book_new();
  const quien = estado.usuario ? `${estado.usuario.nombre} (${estado.usuario.usuario})` : "";
  const cab = XLSX.utils.aoa_to_sheet([
    ["Libro de remuneraciones"],
    ["Seguridad Garridos · GLOBSEG SPA · RUT 78.095.104-4"],
    [],
    ["Instalación", e.instalacion],

/** Las liquidaciones de la instalación en un PDF, una por página. */
async function bajarLiquidaciones(e) {
  const d = await pedir(`/pagos/remuneraciones?mes=${e.mes}&instalacion=${e.instalacion_id}`);
  if (!d.remuneraciones.length) {
    throw new Error("Ese mes todavía no está calculado. Use «Calcular el mes» más abajo.");
  }
  await cargarScript(JSPDF);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  const plata = n => "$" + Math.round(Number(n) || 0).toLocaleString("es-CL");

  d.remuneraciones.forEach((r, i) => {
    if (i) doc.addPage();
    const h = r.detalle?.haberes || {}, x = r.detalle?.descuentos || {};
    let y = 18;
    doc.setFontSize(13).setFont(undefined, "bold");
    doc.text("LIQUIDACIÓN DE REMUNERACIONES", 15, y); y += 6;
    doc.setFontSize(9).setFont(undefined, "normal");
    doc.text("GLOBSEG SPA · RUT 78.095.104-4 · Seguridad Garridos", 15, y); y += 5;
    doc.text(`${mesLindo(e.mes)} · ${e.instalacion}`, 15, y); y += 8;
    doc.setFont(undefined, "bold").text(r.trabajador, 15, y);
    doc.setFont(undefined, "normal").text(`RUT ${r.rut || "—"}`, 150, y); y += 5;
    doc.text(`Cargo: ${r.cargo || "—"}`, 15, y);
    doc.text(`Días: ${r.dias_trabajados ?? "—"}`, 150, y); y += 8;

    const linea = (rotulo, monto, negrita) => {
      doc.setFont(undefined, negrita ? "bold" : "normal");
      doc.text(String(rotulo), 18, y);
      doc.text(plata(monto), 95, y, { align: "right" });
      y += 5;
    };
    doc.setFont(undefined, "bold").setFontSize(10).text("HABERES", 15, y); y += 5;
    doc.setFontSize(9);
    linea("Sueldo base", h.sueldo_base);
    if (h.gratificacion) linea("Gratificación", h.gratificacion);
    if (h.horas_extra) linea("Horas extra", h.horas_extra);
    if (h.bono_imponible) linea("Bonos imponibles", h.bono_imponible);
    linea("Total imponible", h.total_imponible, true);
    if (h.colacion) linea("Colación", h.colacion);
    if (h.movilizacion) linea("Movilización", h.movilizacion);
    if (h.asignacion) linea("Otras asignaciones", h.asignacion);
    if (h.asignacion_familiar) linea("Asignación familiar", h.asignacion_familiar);
    linea("TOTAL HABERES", h.total_haberes, true); y += 3;

    doc.setFont(undefined, "bold").setFontSize(10).text("DESCUENTOS", 15, y); y += 5;
    doc.setFontSize(9);
    linea(`AFP ${x.afp_nombre || ""} (${x.afp_tasa || 0}%)`, x.afp);
    linea("Salud", x.salud);
    linea("Seguro de cesantía", x.cesantia);
    if (x.impuesto_unico) linea("Impuesto único", x.impuesto_unico);
    if (x.apv) linea("APV", x.apv);
    if (x.otros) linea("Otros descuentos", x.otros);
    linea("TOTAL DESCUENTOS", x.total_descuentos, true); y += 4;

    doc.setFontSize(11).setFont(undefined, "bold");
    doc.text("LÍQUIDO A PAGAR", 18, y);
    doc.text(plata(r.liquido), 95, y, { align: "right" }); y += 10;

    doc.setFontSize(8).setFont(undefined, "normal");
    const notas = r.detalle?.notas || [];
    notas.forEach(n => { doc.text(doc.splitTextToSize(`· ${n}`, 170), 15, y); y += 4; });
    if (r.detalle?.por_confirmar?.length) {
      y += 2;
      doc.text(doc.splitTextToSize(
        "Hay parámetros legales sin confirmar en este cálculo: "
        + r.detalle.por_confirmar.map(c => c.glosa || c.codigo).join("; "), 170), 15, y);
      y += 6;
    }
    y = Math.max(y, 250);
    doc.text("Recibí conforme el monto indicado:", 15, y); y += 14;
    doc.text("__________________________          __________________________", 15, y); y += 4;
    doc.text(`${r.trabajador}                                   p. GLOBSEG SPA`, 15, y);
    doc.setFontSize(7).text(
      r.estado === "cerrado" ? "Liquidación cerrada." : "BORRADOR · todavía se puede corregir.",
      15, 288);
  });

  doc.save(`liquidaciones ${e.instalacion} ${e.mes}.pdf`);
}

/**
 * Reparte el Excel de Previred por instalación.
 *
 * **Se conservan las filas de encabezado tal como vienen** y se copian las
 * celdas sin tocarlas: el archivo que la DT acepta es el que genera Previred, y
 * lo único que acá se hace es dejar en cada copia las filas de la gente de una
 * instalación. Si una fila no se puede asignar —RUT que no está en el registro,
 * o persona sin instalación en su ficha— sale en una copia aparte y se dice
 * quién es: una fila que desaparece sin aviso es una persona que el mandante va
 * a echar de menos.
 */
async function repartirF301(estadoId, archivo) {
  const salida = $("#ep-previred-salida");
  if (!archivo) return;
  salida.innerHTML = `<p class="cargando">Leyendo el archivo…</p>`;
  try {
    await cargarScript(SHEETJS, "el generador de Excel");
    const XLSX = window.XLSX;
    const buf = await archivo.arrayBuffer();
    const libro = XLSX.read(buf, { cellDates: true });
    const hoja = libro.Sheets[libro.SheetNames[0]];
    const filas = XLSX.utils.sheet_to_json(hoja, { header: 1, defval: "", raw: true });
    if (!filas.length) throw new Error("Ese archivo no tiene filas.");

    // La fila de encabezados es la primera que nombre el RUT. Previred cambia
    // el título de arriba según el informe, así que buscarla es más seguro que
    // suponer que es la primera.
    const esRut = v => /^\s*(rut|run)\b/i.test(String(v ?? ""));
    let fCab = filas.findIndex(f => f.some(esRut));
    if (fCab < 0) fCab = 0;
    const cRut = filas[fCab].findIndex(esRut);
    if (cRut < 0) throw new Error("No se encontró la columna del RUT en ese archivo.");

    const { trabajadores, sin_instalacion } = pagosEstado.dotacion
      || (pagosEstado.dotacion = await pedir("/pagos/dotacion"));
    const insts = pagosEstado.detalle?.instalaciones
      || (await pedir(`/pagos/estados?mes=${pagosEstado.mes}`)).instalaciones || [];
    const cuerpoDe = v => String(v ?? "").replace(/[^0-9kK]/g, "").toUpperCase().slice(0, -1);
    const porRut = new Map();
    trabajadores.forEach(t => porRut.set(cuerpoDe(t.rut), t));

    const encabezado = filas.slice(0, fCab + 1);
    const grupos = new Map();   // instalacion_id | "sueltos" -> filas
    const sueltos = [];
    for (const fila of filas.slice(fCab + 1)) {
      if (!String(fila[cRut] ?? "").trim()) continue;
      const t = porRut.get(cuerpoDe(fila[cRut]));
      if (!t || !t.instalacion_id) { sueltos.push({ fila, nombre: t?.nombre || null }); continue; }
      if (!grupos.has(t.instalacion_id)) grupos.set(t.instalacion_id, []);
      grupos.get(t.instalacion_id).push(fila);
    }

    const bajar = (nombre, cuerpo) => {
      const nuevo = XLSX.utils.book_new();
      const h = XLSX.utils.aoa_to_sheet([...encabezado, ...cuerpo]);
      XLSX.utils.book_append_sheet(nuevo, h, (libro.SheetNames[0] || "Hoja1").slice(0, 28));
      XLSX.writeFile(nuevo, nombre);
    };

    const hechos = [];
    for (const [id, cuerpo] of grupos) {
      const nombre = insts.find(i => i.id === id)?.nombre || `instalacion ${id}`;
      bajar(`F30-1 ${nombre} ${pagosEstado.mes}.xlsx`, cuerpo);
      hechos.push(`${nombre}: ${cuerpo.length} ${cuerpo.length === 1 ? "persona" : "personas"}`);
    }
    if (sueltos.length) bajar(`F30-1 sin instalacion ${pagosEstado.mes}.xlsx`,
                              sueltos.map(s => s.fila));

    salida.innerHTML = `
      ${aviso("bien", grupos.size === 1
        ? "Se generó un archivo"
        : `Se generaron ${grupos.size} archivos, uno por instalación`,
        "Quedaron descargados en el computador.")}
      <ul>${hechos.map(t => `<li>${esc(t)}</li>`).join("")}</ul>
      ${sueltos.length ? aviso("ojo",
        `${sueltos.length} ${sueltos.length === 1 ? "fila quedó" : "filas quedaron"} sin instalación`,
        `Salieron en un archivo aparte: `
        + sueltos.map(s => s.nombre || "un RUT que no está en el registro").join(", ")
        + ". Se arregla asignándoles la instalación en su ficha.") : ``}
      ${sin_instalacion?.length ? `<p class="sub" style="padding:0 16px 12px">En el registro hay
        ${sin_instalacion.length} ${sin_instalacion.length === 1 ? "persona" : "personas"}
        sin instalación asignada: ${esc(sin_instalacion.map(t => t.nombre).join(", "))}.</p>` : ``}
      <p class="sub" style="padding:0 16px 12px">Los archivos se descargaron al computador. Si además los quiere dejar
        en la carpeta, súbalos con «Subir otro documento».</p>`;
  } catch (e) {
    salida.innerHTML = aviso("ojo", "No se pudo repartir ese archivo", e.message);
  }
}

/** Las liquidaciones del mes, con lo que va encima del contrato editable

  catch (err) {
    caja.innerHTML = aviso("ojo", "No se pudieron leer las remuneraciones", err.message);
    return;
  }

  const t = d.totales;
  const hayBorrador = d.remuneraciones.some(r => r.estado === "borrador");
  const hayCerrado = d.remuneraciones.some(r => r.estado === "cerrado");
  caja.innerHTML = `
    ${pagosEstado.omitidos ? aviso("ojo",
      `${pagosEstado.omitidos.length} ${pagosEstado.omitidos.length === 1
        ? "persona quedó" : "personas quedaron"} sin liquidación`,
      pagosEstado.omitidos.map(o => `${o.trabajador}: ${o.motivo}`).join(" · ")) : ""}
    <section class="caja">
    <div class="caja__tit"><h2>Remuneraciones de ${esc(mesLindo(e.mes))}</h2>
      <span class="nota">${t.personas} ${t.personas === 1 ? "persona" : "personas"} ·
        líquido ${clp(t.liquido)} · costo empresa ${clp(t.costo_empresa)}</span></div>
    <div class="pie-form">
      <button class="bt" id="rm-calc">${d.remuneraciones.length ? "Recalcular el mes" : "Calcular el mes"}</button>
      ${hayBorrador ? `<button class="bt" id="rm-cerrar">Cerrar el mes</button>` : ``}
      ${hayCerrado ? `<button class="bt bt--chico bt--fino" id="rm-reabrir">Reabrir</button>` : ``}
    </div>
    ${d.remuneraciones.length ? `<div class="desliza"><table style="min-width:940px"><thead><tr>
      <th>Persona</th><th>Cargo</th><th class="num">Días</th><th class="num">H. extra</th>
      <th class="num">Bonos</th><th class="num">Otros desc.</th><th class="num">Haberes</th>
      <th class="num">Descuentos</th><th class="num">Líquido</th><th>Estado</th>
      </tr></thead><tbody>
      ${d.remuneraciones.map(r => {
        const abierta = r.estado === "borrador";
        const num = (campo, valor, plata = true) => abierta
          ? `<input type="number" min="0" step="1" data-campo="${campo}" data-id="${r.id}"
               value="${valor ?? ""}" style="width:4.5rem">`
          : valor ? (plata ? clp(valor) : esc(valor)) : "—";
        return `<tr><td>${esc(r.trabajador)}<br><span class="sub">${esc(r.rut || "")}</span></td>
          <td>${esc(r.cargo || "—")}</td>
          <td class="num">${num("dias_trabajados", r.dias_trabajados, false)}</td>
          <td class="num">${num("horas_extra_monto", r.extra?.horas_extra_monto)}</td>
          <td class="num">${num("bono_imponible", r.extra?.bono_imponible)}</td>
          <td class="num">${num("otros_descuentos", r.extra?.otros_descuentos)}</td>
          <td class="num">${clp(r.total_haberes)}</td>
          <td class="num">${clp(r.total_descuentos)}</td>
          <td class="num"><b>${clp(r.liquido)}</b></td>
          <td class="nowrap">${abierta
            ? `Borrador<br><button class="bt bt--chico bt--fino" data-rec="${r.id}">Guardar</button>`
            : "Cerrado"}</td>
        </tr>`;
      }).join("")}
      </tbody></table></div>
      <p class="sub" style="padding:0 16px 12px">Los montos de esta tabla son los que van al libro de remuneraciones, a las
        liquidaciones y a la nómina de transferencias. Mientras el mes esté en borrador se
        recalculan; al cerrarlo quedan congelados.</p>`
      : `<p class="vacio">Este mes todavía no está calculado.</p>`}
  </section>`;

  $("#rm-calc").onclick = () => conPaciencia($("#rm-calc"), async () => {
    const r = await pedir("/pagos/remuneraciones/calcular", { method: "POST",
      body: JSON.stringify({ mes: e.mes, instalacion_id: e.instalacion_id }) });
    let texto = `${r.escritas} ${r.escritas === 1 ? "liquidación calculada" : "liquidaciones calculadas"}`;
    if (r.cerradas) texto += ` · ${r.cerradas} ya cerradas, no se tocaron`;
    // Quién quedó fuera NO va solo en el recado: ese se borra a los cuatro
    // segundos y es el único lugar donde se dice que a alguien no se le calculó
    // el sueldo. Queda arriba de la tabla hasta el próximo cálculo.
    pagosEstado.omitidos = r.omitidos?.length ? r.omitidos : null;
    recado(texto, r.omitidos?.length ? "mal" : "ok");
    await pintarRemuneracionesDelMes(e);
  });
  if ($("#rm-cerrar")) $("#rm-cerrar").onclick = async () => {
    if (!confirm("Cerrar el mes congela estas liquidaciones. ¿Seguir?")) return;
    try {
      const r = await pedir("/pagos/remuneraciones/cerrar", { method: "POST",
        body: JSON.stringify({ mes: e.mes, instalacion_id: e.instalacion_id }) });
      recado(`${r.cerradas} liquidaciones cerradas`);
      await pintarRemuneracionesDelMes(e);
    } catch (err) { recado(err.message, "mal"); }
  };
  if ($("#rm-reabrir")) $("#rm-reabrir").onclick = async () => {
    const motivo = prompt("¿Por qué se reabre el mes? Queda anotado en la bitácora.");
    if (!motivo) return;
    try {
      const r = await pedir("/pagos/remuneraciones/reabrir", { method: "POST",
        body: JSON.stringify({ mes: e.mes, instalacion_id: e.instalacion_id, motivo }) });
      recado(`${r.reabiertas} liquidaciones reabiertas`);
      await pintarRemuneracionesDelMes(e);
    } catch (err) { recado(err.message, "mal"); }
  };
  caja.querySelectorAll("[data-rec]").forEach(b => {
    b.onclick = async () => {
      const id = b.dataset.rec;
      const campos = {};
      caja.querySelectorAll(`[data-id="${id}"]`).forEach(i => {
        campos[i.dataset.campo] = i.value === "" ? null : Number(i.value);
      });
      const { dias_trabajados, ...extra } = campos;
      try {
        await pedir(`/pagos/remuneraciones/${id}`, { method: "PATCH",
          body: JSON.stringify({ dias_trabajados, extra }) });
        await pintarRemuneracionesDelMes(e);
      } catch (err) { recado(err.message, "mal"); }
    };
  });
}

/* ---------------------------------------------------------------- usuarios
   Quién entra al sistema y qué abre. Hasta el 29-10-2026 esto no existía:
   los permisos estaban escritos en el código y de las contraseñas solo se
   podían arreglar las de los guardias. Una cuenta de oficina olvidada o
   bloqueada no tenía más salida que pegar SQL a mano en Supabase.

   Tres cosas de esta pantalla, por si mañana alguien la toca:

   - **La contraseña temporal se muestra una sola vez y no se guarda.** No
     está en la base en claro, no va en la bitácora y no vuelve si se recarga
     la página. Por eso el recuadro es grande y dice que hay que anotarla
     ahora: si se pierde, se restablece otra vez y sale otra distinta.
   - **Los botones de los guardias llaman a `/trabajadores/:id`**, que es la
     misma ruta que usa la pestaña Trabajadores. No hay una segunda forma de
     desbloquear a un guardia, porque dos formas se separan solas.
   - **Lo que el rol ya da no se ofrece como módulo propio.** Si se pudiera
     marcar, el día que ese módulo saliera del rol la persona lo conservaría
     sin que nadie lo hubiera decidido.

   Dos cosas de la forma, para no repetirlas:

   - La tabla de cuentas tiene **seis columnas y va a 860px**, no a los 1080
     del .desliza por omisión, que son para las de diez. El correo va bajo el
     nombre y no en columna propia: con una para él, «Qué abre» quedaba tan
     angosta que los seis módulos se apilaban uno por línea y cada fila crecía
     al alto de un párrafo.
   - Y por eso MODULOS tiene un rótulo corto aparte del largo.

   Ojo con los comentarios: todo este dibujo vive dentro de una plantilla de
   texto, así que **un comentario HTML con un acento grave adentro cierra la
   cadena** y deja la página en blanco con «Unexpected identifier». Los
   comentarios van acá afuera, en JavaScript. */

let USR = null;
let abrirCuentaNueva = false;
let buscarGuardia = "";
// { usuario, nombre, clave, nueva } — vive en memoria y se borra al salir.
let claveMostrada = null;

const ROL_ROTULO = {
  gerencia: "Gerencia", operaciones: "Operaciones",
  rrhh: "Recursos humanos", prevencion: "Prevención de riesgos",
};

/* Una casilla de verdad tiene que medirse a mano en este panel.
   `input,select,textarea{…width:100%;padding:9px 11px;border:…}` de panel.css
   le pega también a las casillas, y las únicas que lo anulan son las de
   seleccionar filas (`th.sel input,td.sel input`). Sin esto, cada casilla sale
   de 85px de ancho con borde y relleno, y el rótulo queda flotando lejos. Es
   primo del `appearance:none` que rompía las casillas en control de acceso: una
   regla escrita para los campos de texto alcanzando a lo que no lo es.
   Va en rem para que crezca con el tamaño de letra que elija cada uno. */
const ESTILO_CASILLA = "width:1.05rem;height:1.05rem;flex:none;margin:.2rem 0 0;"
  + "padding:0;accent-color:var(--btn);cursor:pointer";

/** El sello de situación de una cuenta: lo primero que se mira. */
function selloCuenta(c) {
  if (!c.activo) return '<span class="sello e-en_curso">De baja</span>';
  if (c.bloqueada) return '<span class="sello e-rechazada">Bloqueada</span>';
  if (c.debe_cambiar_clave) return '<span class="sello e-solicitar_oc">Clave sin cambiar</span>';
  if (c.nunca_entro) return '<span class="sello e-pendiente_facturacion">Nunca ha entrado</span>';
  return '<span class="sello e-cerrado">Al día</span>';
}

const cuandoEntro = v => {
  if (!v) return "—";
  const d = new Date(v);
  return `${String(d.getDate()).padStart(2, "0")}-${String(d.getMonth() + 1).padStart(2, "0")}-${d.getFullYear()}`
    + ` ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
};

/** El recuadro de la contraseña recién puesta. Sale una vez y no vuelve. */
function cajaClave() {
  if (!claveMostrada) return "";
  const { nombre, usuario, clave, nueva } = claveMostrada;
  /* `--sup-2: transparent` es para que la franja del título tome el verde de
     la caja: `.caja__tit` se pinta con ese token, así que sin esto el título
     queda gris sobre un cuerpo verde. */
  return `<section class="caja" id="caja-clave"
      style="border-color:var(--verde);background:var(--verde-suave);--sup-2:transparent">
    <div class="caja__tit"><h2>${nueva ? "Cuenta creada" : "Contraseña restablecida"}</h2>
      <span class="nota">Anótela ahora: no se vuelve a mostrar</span></div>
    <div style="padding:16px">
      <p style="margin:0 0 14px">Déle estos dos datos a <b>${esc(nombre)}</b>. Al entrar, el
        sistema le va a pedir que elija una contraseña propia, así que esta sirve una sola vez.</p>
      <div style="display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end">
        <div><div class="sub">Usuario</div>
          <div style="font-size:1.3rem;font-weight:600">${esc(usuario)}</div></div>
        <div><div class="sub">Contraseña temporal</div>
          <div id="la-clave" style="font-size:1.6rem;font-weight:600;letter-spacing:.06em;
               font-family:ui-monospace,SFMono-Regular,Menlo,monospace">${esc(clave)}</div></div>
        <button class="bt bt--fino" id="copiar-clave" type="button">Copiar</button>
        <button class="bt bt--fino" id="cerrar-clave" type="button">Listo, ya la anoté</button>
      </div>
      <p class="sub" style="margin:14px 0 0">No la mande por WhatsApp si puede evitarlo: ahí
        queda escrita para siempre. Dictarla por teléfono es mejor, y por eso no lleva letras
        ni números que se confundan al oírlos.</p>
    </div>
  </section>`;
}

/** Las casillas de módulos de un rol o de una persona. */
function casillasModulos(modulos, marcados, prefijo, bloqueados = []) {
  return `<div style="display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">
    ${modulos.map(m => {
      const fijo = bloqueados.includes(m.codigo);
      return `<label style="display:flex;gap:9px;align-items:flex-start;padding:10px 12px;
          border:1px solid var(--borde);border-radius:12px;${fijo ? "opacity:.55" : "cursor:pointer"}">
        <input type="checkbox" name="${prefijo}" value="${m.codigo}"
               ${marcados.includes(m.codigo) ? "checked" : ""} ${fijo ? "disabled" : ""}
               style="${ESTILO_CASILLA}">
        <span><b style="font-size:.9rem">${esc(m.rotulo)}</b>
          <span class="sub" style="display:block;margin-top:2px">${esc(m.abre)}</span>
          ${fijo ? '<span class="sub" style="display:block;color:var(--ambar)">Ya se lo da su rol</span>' : ""}
        </span></label>`;
    }).join("")}
  </div>`;
}

/** El formulario que se abre bajo la fila de una cuenta de oficina. */
function formCuenta(c, modulos, roles) {
  const delRol = roles.find(r => r.codigo === c.rol)?.permisos || [];
  const esYo = c.usuario === USR.yo;
  return `<form class="f-cuenta" data-usuario="${esc(c.usuario)}" style="padding:16px 18px">
    <div class="rejilla">
      <label class="campo"><span>Rol</span>
        <select name="rol" ${esYo ? "disabled" : ""}>
          ${Object.entries(ROL_ROTULO).map(([k, v]) =>
            `<option value="${k}"${c.rol === k ? " selected" : ""}>${esc(v)}</option>`).join("")}
        </select>
        <div class="sub">${esYo
          ? "No puede cambiarse el rol a usted mismo: se quedaría fuera de esta pantalla sin querer."
          : "El rol decide la mayoría de los accesos. Lo que abre cada uno se edita más abajo."}</div></label>
      <label class="campo"><span>Situación de la cuenta</span>
        <select name="activo" ${esYo ? "disabled" : ""}>
          <option value="true"${c.activo ? " selected" : ""}>Activa</option>
          <option value="false"${c.activo ? "" : " selected"}>De baja</option>
        </select>
        <div class="sub">${esYo
          ? "Tampoco puede darse de baja usted mismo."
          : "De baja no entra, y si tiene la sesión abierta se le corta en la siguiente pantalla."}</div></label>
    </div>

    <div style="margin:16px 0 8px"><b style="font-size:.92rem">Módulos propios de esta persona</b>
      <div class="sub">Además de los que le da su rol. Lo normal es no marcar ninguno.</div></div>
    ${casillasModulos(modulos, c.permisos_extra, `extra-${c.usuario}`, delRol)}

    <label style="display:flex;gap:9px;align-items:flex-start;margin:16px 0 0;
        padding:10px 12px;border:1px solid var(--borde);border-radius:12px;cursor:pointer">
      <input type="checkbox" name="puede_borrar" ${c.puede_borrar ? "checked" : ""}
             style="${ESTILO_CASILLA}">
      <span><b style="font-size:.9rem">Puede eliminar registros</b>
        <span class="sub" style="display:block;margin-top:2px">Borrar es lo único que no se
          puede deshacer mirando la bitácora. Va por persona y no por rol a propósito.</span></span></label>

    <div class="pie-form" style="gap:10px;flex-wrap:wrap">
      <button class="bt" type="submit">Guardar</button>
      ${c.bloqueada ? `<button class="bt bt--fino" type="button" data-desbloquear="${esc(c.usuario)}">
        Desbloquear ahora</button>` : ""}
      <button class="bt bt--fino" type="button" data-restablecer="${esc(c.usuario)}">
        Restablecer la contraseña</button>
      <span class="mensaje"></span>
    </div>
    <p class="sub" style="margin:10px 0 0">Nadie puede ver la contraseña que tiene puesta,
      tampoco gerencia: lo guardado es una derivación y no el texto. Restablecer le pone una
      temporal que se muestra una sola vez acá.</p>
  </form>`;
}

async function pintarUsuarios() {
  $("#app").innerHTML = `<p class="cargando">Cargando…</p>`;
  USR = await pedir("/usuarios");
  const { cuentas, roles, modulos, guardias, permisos_en_la_base, archivo_migracion } = USR;

  const bloqueadas = [...cuentas.filter(c => c.activo && c.bloqueada),
                      ...guardias.filter(g => g.activo && g.bloqueada)];
  const conClaveInicial = guardias.filter(g => g.activo && g.debe_cambiar_clave);
  const oficinaSinCambiar = cuentas.filter(c => c.activo && c.debe_cambiar_clave);

  const guardiasVisibles = buscarGuardia
    ? guardias.filter(g => `${g.nombre} ${g.usuario} ${g.rut} ${g.instalacion || ""}`
        .toLowerCase().includes(buscarGuardia.toLowerCase()))
    : guardias;

  $("#app").innerHTML = `
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap">
      <h2 style="font-size:1.5rem">Usuarios</h2>
      <span class="nota" style="color:var(--texto-2);font-size:.85rem">
        ${cuentas.filter(c => c.activo).length} de oficina ·
        ${guardias.filter(g => g.activo).length} guardias</span>
      <button class="bt" id="nueva-cuenta" style="margin-left:auto">
        ${abrirCuentaNueva ? "Ocultar formulario" : "Nueva cuenta de oficina"}</button>
    </div>

    ${permisos_en_la_base ? "" : aviso("ojo",
      "Los permisos todavía no viven en la base. ",
      "Mientras tanto el sistema usa los que estaban escritos en el código, que son los "
      + "mismos de siempre: nadie perdió ni ganó acceso. Lo que no se puede todavía es "
      + "cambiarlos desde acá. Hay que pegar " + archivo_migracion
      + " en el SQL Editor de Supabase.")}

    ${bloqueadas.length ? aviso("ojo",
      bloqueadas.length === 1 ? "Hay una cuenta bloqueada ahora mismo. " : `Hay ${bloqueadas.length} cuentas bloqueadas ahora mismo. `,
      "Es alguien que tecleó mal su clave cinco veces, no un ataque. Se arregla acá abajo "
      + "con «Desbloquear», o solo esperando cinco minutos: "
      + bloqueadas.map(c => c.nombre).join(", ") + ".") : ""}

    ${cajaClave()}

    <section class="caja"${abrirCuentaNueva ? "" : " hidden"} style="max-width:860px">
      <div class="caja__tit"><h2>Nueva cuenta de oficina</h2>
        <span class="nota">Para los guardias, use la pestaña Trabajadores</span></div>
      <form id="f-cuenta-nueva">
        <div class="rejilla">
          <label class="campo"><span>Nombres</span>
            <input name="nombres" required autocomplete="off" placeholder="Ej: María Fernanda">
            <div class="sub">Los que use. De la inicial del primero sale el usuario.</div></label>
          <label class="campo"><span>Apellido paterno</span>
            <input name="apellido_paterno" required autocomplete="off" placeholder="Ej: Soto"></label>
          <label class="campo"><span>Apellido materno</span>
            <input name="apellido_materno" autocomplete="off" placeholder="Ej: Ruiz">
            <div class="sub">Opcional. Si va, aporta su inicial al usuario.</div></label>
          <label class="campo"><span>Correo</span>
            <input name="email" type="email" required autocomplete="off"
                   placeholder="alguien@ejemplo.cl">
            <div class="sub">Identifica la cuenta. No se puede repetir.</div></label>
          <label class="campo"><span>Rol</span>
            <select name="rol" required>
              <option value="">Elija uno</option>
              ${Object.entries(ROL_ROTULO).map(([k, v]) =>
                `<option value="${k}">${esc(v)}</option>`).join("")}
            </select>
            <div class="sub">Decide qué módulos abre.</div></label>
        </div>
        <div class="pie-form">
          <button class="bt" type="submit">Crear la cuenta</button>
          <span class="mensaje"></span>
        </div>
      </form>
    </section>

    <section class="caja">
      <div class="caja__tit"><h2>Cuentas de la oficina</h2>
        <span class="nota">${oficinaSinCambiar.length
          ? `${oficinaSinCambiar.length} sigue${oficinaSinCambiar.length > 1 ? "n" : ""} con la clave inicial`
          : "Todas eligieron su contraseña"}</span></div>
      <div class="desliza"><table style="min-width:860px"><thead><tr>
        <th>Persona</th><th>Rol</th><th>Qué abre</th>
        <th>Situación</th><th>Último ingreso</th><th></th>
      </tr></thead><tbody>
        ${cuentas.map(c => `<tr${c.activo ? "" : ' style="opacity:.6"'}>
          <td><b class="nowrap">${esc(c.nombre)}</b><span class="sub">${esc(c.usuario)}${
            c.usuario === USR.yo ? " · usted" : ""} · ${esc(c.email)}</span></td>
          <td class="nowrap">${esc(ROL_ROTULO[c.rol] || c.rol)}</td>
          <td><span class="sub">${c.permisos.length
            ? c.permisos.map(p => esc(modulos.find(m => m.codigo === p)?.corto || p)).join(" · ")
            : "Ningún módulo"}</span>${c.puede_borrar
            ? '<span class="sello e-pendiente_facturacion">Puede eliminar</span>' : ""}</td>
          <td>${selloCuenta(c)}</td>
          <td class="sub nowrap">${cuandoEntro(c.ultimo_ingreso)}</td>
          <td class="nowrap"><button class="bt bt--fino bt--chico"
            data-editar-cuenta="${esc(c.usuario)}">Editar</button></td>
        </tr>
        <tr hidden data-form-cuenta="${esc(c.usuario)}">
          <td colspan="6" style="background:var(--sup-2);padding:0">
            ${formCuenta(c, modulos, roles)}
          </td></tr>`).join("")}
      </tbody></table></div>
    </section>

    <section class="caja">
      <div class="caja__tit"><h2>Cuentas de los guardias</h2>
        <span class="nota">${conClaveInicial.length
          ? `${conClaveInicial.length} sigue${conClaveInicial.length > 1 ? "n" : ""} entrando con el RUT`
          : "Todos eligieron su clave"}</span></div>
      ${aviso("ojo", "Un guardia que sigue con el RUT de clave no puede marcar turno. ",
        "El sistema no lo deja hasta que elija una propia, y eso es justamente lo que hace "
        + "que el libro de asistencia sirva de respaldo: con el RUT de clave, cualquier "
        + "compañero podría marcar la entrada por él.")}
      <label class="campo" style="max-width:360px;margin-bottom:14px"><span>Buscar</span>
        <input id="buscar-guardia" type="search" autocomplete="off"
               value="${esc(buscarGuardia)}" placeholder="Nombre, usuario, RUT o instalación"></label>
      ${guardiasVisibles.length ? `<div class="desliza"><table style="min-width:900px"><thead><tr>
        <th>Guardia</th><th>RUT</th><th>Cargo</th><th>Instalación</th>
        <th>Situación</th><th>Último ingreso</th><th></th>
      </tr></thead><tbody>
        ${guardiasVisibles.map(g => `<tr${g.activo ? "" : ' style="opacity:.6"'}>
          <td><b class="nowrap">${esc(g.nombre)}</b><span class="sub">${esc(g.usuario)}</span></td>
          <td class="sub nowrap">${esc(g.rut)}</td>
          <td>${esc(g.cargo)}</td>
          <td class="sub">${esc(g.instalacion || "sin asignar")}</td>
          <td>${selloCuenta({ ...g, nunca_entro: !g.ultimo_ingreso })}</td>
          <td class="sub">${cuandoEntro(g.ultimo_ingreso)}</td>
          <td class="nowrap">
            ${g.bloqueada ? `<button class="bt bt--fino bt--chico"
              data-guardia-desbloquear="${g.id}">Desbloquear</button> ` : ""}
            <button class="bt bt--fino bt--chico"
              data-guardia-rut="${g.id}" data-nombre="${esc(g.nombre)}">Clave al RUT</button>
          </td></tr>`).join("")}
      </tbody></table></div>`
      : `<p class="vacio">${buscarGuardia
          ? "Ningún guardia calza con esa búsqueda."
          : "Todavía no hay guardias cargados. Se crean en la pestaña Trabajadores."}</p>`}
    </section>

    <section class="caja">
      <div class="caja__tit"><h2>Qué abre cada rol</h2>
        <span class="nota">Le cambia el acceso a todas las personas con ese rol</span></div>
      ${aviso("ojo", "Esto no es por persona: es por rol. ",
        "Quitarle un módulo a «Operaciones» se lo quita a todos los que tengan ese rol, "
        + "ahora y en el futuro. Para darle algo a una sola persona, use «Módulos propios» "
        + "en su fila de la tabla de arriba. Un cambio acá puede tardar hasta un minuto en "
        + "notarse en los computadores que ya tienen el sistema abierto.")}
      ${roles.map(r => `<form class="f-rol" data-rol="${r.codigo}"
          style="padding:16px;border-top:1px solid var(--borde)">
        <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px">
          <b style="font-size:1.05rem">${esc(r.rotulo)}</b>
          <span class="sub">${esc(r.descripcion || "")}</span>
          <span class="sub" style="margin-left:auto">${r.actualizado_por
            ? `Lo cambió ${esc(r.actualizado_por)}` : ""}</span>
        </div>
        ${casillasModulos(modulos, r.permisos, `rol-${r.codigo}`)}
        <div class="pie-form"><button class="bt bt--fino" type="submit">Guardar ${esc(r.rotulo)}</button>
          <span class="mensaje"></span></div>
      </form>`).join("")}
    </section>`;

  conectarUsuarios();
}

function conectarUsuarios() {
  $("#nueva-cuenta").onclick = () => { abrirCuentaNueva = !abrirCuentaNueva; pintarUsuarios(); };

  const buscador = $("#buscar-guardia");
  if (buscador) {
    buscador.oninput = ev => {
      buscarGuardia = ev.target.value;
      const donde = ev.target.selectionStart;
      pintarUsuarios().then(() => {
        const nuevo = $("#buscar-guardia");
        if (nuevo) { nuevo.focus(); nuevo.setSelectionRange(donde, donde); }
      });
    };
  }

  $("#cerrar-clave")?.addEventListener("click", () => {
    claveMostrada = null;
    $("#caja-clave")?.remove();
  });
  $("#copiar-clave")?.addEventListener("click", async ev => {
    try {
      await navigator.clipboard.writeText(claveMostrada.clave);
      recado("Contraseña copiada");
    } catch {
      // En http sin permiso del navegador no hay portapapeles: se selecciona
      // para que se pueda copiar a mano, en vez de no hacer nada.
      const r = document.createRange();
      r.selectNodeContents($("#la-clave"));
      getSelection().removeAllRanges();
      getSelection().addRange(r);
      recado("Selecciónela y cópiela con Cmd+C", "mal");
    }
    ev.target.blur();
  });

  // Abrir y cerrar el formulario de cada cuenta.
  document.querySelectorAll("[data-editar-cuenta]").forEach(b => {
    b.onclick = () => {
      const fila = $(`[data-form-cuenta="${b.dataset.editarCuenta}"]`);
      fila.hidden = !fila.hidden;
      b.textContent = fila.hidden ? "Editar" : "Cerrar";
    };
  });

  $("#f-cuenta-nueva").onsubmit = async ev => {
    ev.preventDefault();
    const f = ev.target, msj = f.querySelector(".mensaje");
    const boton = f.querySelector("button[type=submit]");
    boton.disabled = true;
    decir(msj, "Creando…");
    try {
      const r = await pedir("/usuarios",
        { method: "POST", body: JSON.stringify(Object.fromEntries(new FormData(f))) });
      claveMostrada = { usuario: r.cuenta.usuario, nombre: r.cuenta.nombre,
                        clave: r.clave_temporal, nueva: true };
      abrirCuentaNueva = false;
      await pintarUsuarios();
      $("#caja-clave")?.scrollIntoView({ behavior: "smooth", block: "center" });
    } catch (e) {
      decir(msj, e.message, "error");
      boton.disabled = false;
    }
  };

  document.querySelectorAll(".f-cuenta").forEach(f => {
    const msj = f.querySelector(".mensaje");

    f.onsubmit = async ev => {
      ev.preventDefault();
      const boton = f.querySelector("button[type=submit]");
      boton.disabled = true;
      decir(msj, "Guardando…");
      const cuerpo = {
        rol: f.rol.value,
        activo: f.activo.value === "true",
        puede_borrar: f.puede_borrar.checked,
        permisos_extra: [...f.querySelectorAll('input[name^="extra-"]:checked:not(:disabled)')]
          .map(c => c.value),
      };
      try {
        const r = await pedir(`/usuarios/cuenta/${f.dataset.usuario}`,
          { method: "PATCH", body: JSON.stringify(cuerpo) });
        recado(r.cambios?.length ? r.cambios.join(", ") : "Guardado");
        await pintarUsuarios();
      } catch (e) {
        decir(msj, e.message, "error");
        boton.disabled = false;
      }
    };

    f.querySelector("[data-desbloquear]")?.addEventListener("click", async ev => {
      ev.target.disabled = true;
      decir(msj, "Desbloqueando…");
      try {
        await pedir(`/usuarios/cuenta/${ev.target.dataset.desbloquear}`,
          { method: "PATCH", body: JSON.stringify({ desbloquear: true }) });
        recado("Desbloqueada: ya puede volver a intentar");
        await pintarUsuarios();
      } catch (e) { decir(msj, e.message, "error"); ev.target.disabled = false; }
    });

    f.querySelector("[data-restablecer]")?.addEventListener("click", async ev => {
      const usuario = ev.target.dataset.restablecer;
      // Se pregunta porque la contraseña que esa persona tenía deja de servir
      // en el momento: si estaba en medio de algo, queda afuera.
      if (!confirm(`¿Restablecer la contraseña de ${usuario}?\n\n`
        + "La que tiene puesta deja de servir ahora mismo. Se le va a mostrar una "
        + "temporal, una sola vez, que esa persona tendrá que cambiar al entrar.")) return;
      ev.target.disabled = true;
      decir(msj, "Restableciendo…");
      try {
        const r = await pedir(`/usuarios/cuenta/${usuario}`,
          { method: "PATCH", body: JSON.stringify({ restablecer_clave: true }) });
        claveMostrada = { usuario: r.cuenta.usuario, nombre: r.cuenta.nombre,
                          clave: r.clave_temporal, nueva: false };
        await pintarUsuarios();
        $("#caja-clave")?.scrollIntoView({ behavior: "smooth", block: "center" });
      } catch (e) { decir(msj, e.message, "error"); ev.target.disabled = false; }
    });
  });

  // Los guardias pasan por /trabajadores/:id, que es la ruta que ya usaba la
  // pestaña Trabajadores: una segunda forma de desbloquear se separaría de la
  // primera el día que alguna de las dos cambie.
  document.querySelectorAll("[data-guardia-desbloquear]").forEach(b => {
    b.onclick = async () => {
      b.disabled = true;
      try {
        await pedir(`/trabajadores/${b.dataset.guardiaDesbloquear}`,
          { method: "PATCH", body: JSON.stringify({ desbloquear: true }) });
        recado("Desbloqueado: ya puede marcar");
        await pintarUsuarios();
      } catch (e) { recado(e.message, "mal"); b.disabled = false; }
    };
  });

  document.querySelectorAll("[data-guardia-rut]").forEach(b => {
    b.onclick = async () => {
      if (!confirm(`¿Devolverle la clave al RUT a ${b.dataset.nombre}?\n\n`
        + "Entra con su RUT y el sistema le va a pedir que elija otra antes de "
        + "dejarlo marcar turno. La que tenía deja de servir.")) return;
      b.disabled = true;
      try {
        await pedir(`/trabajadores/${b.dataset.guardiaRut}`,
          { method: "PATCH", body: JSON.stringify({ restablecer_clave: true }) });
        recado(`${b.dataset.nombre} entra con su RUT y tiene que elegir otra clave`);
        await pintarUsuarios();
      } catch (e) { recado(e.message, "mal"); b.disabled = false; }
    };
  });

  document.querySelectorAll(".f-rol").forEach(f => {
    f.onsubmit = async ev => {
      ev.preventDefault();
      const msj = f.querySelector(".mensaje");
      const boton = f.querySelector("button[type=submit]");
      boton.disabled = true;
      decir(msj, "Guardando…");
      const permisos = [...f.querySelectorAll('input[type=checkbox]:checked')].map(c => c.value);
      try {
        const r = await pedir(`/usuarios/rol/${f.dataset.rol}`,
          { method: "PATCH", body: JSON.stringify({ permisos }) });
        recado([r.agregados.length ? `agregó ${r.agregados.join(", ")}` : "",
                r.quitados.length ? `quitó ${r.quitados.join(", ")}` : ""]
               .filter(Boolean).join(" · ") || "Guardado");
        await pintarUsuarios();
      } catch (e) {
        decir(msj, e.message, "error");
        boton.disabled = false;
      }
    };
  });
}

const VISTAS = {
  panel: { rotulo: "Panel", pintar: pintarPanel, modulo: "facturacion" },
  calendario: { rotulo: "Calendario", pintar: pintarCalendario, modulo: "facturacion" },
  contactos: { rotulo: "Contactos web", pintar: pintarContactos, modulo: "facturacion" },
  cotizaciones: { rotulo: "Cotizaciones", pintar: pintarCotizaciones, modulo: "cotizaciones" },
  servicio: { rotulo: "Servicios", pintar: pintarServicios, modulo: "facturacion" },
  instalaciones: { rotulo: "Instalaciones", pintar: pintarInstalaciones, modulo: "facturacion" },
  extra: { rotulo: "Registrar extra", pintar: pintarNuevoExtra, modulo: "facturacion" },
  trabajadores: { rotulo: "Trabajadores", pintar: pintarTrabajadores, modulo: "personal" },
  libro: { rotulo: "Asistencia", pintar: pintarLibro, modulo: "personal" },
  bitacora: { rotulo: "Bitácora", pintar: pintarBitacora, modulo: "facturacion" },
  /* Estados de pago lo abren cobranza y recursos humanos: la carpeta es de
     cobro, pero lo que lleva adentro son sueldos. Adentro hay una segunda
     puerta, en el servidor. */
  pagos: { rotulo: "Estados de pago", pintar: pintarEstadosPago,
           modulo: ["facturacion", "rrhh"] },
  /* Usuarios la abre solo gerencia: es la pantalla desde la que se reparten
     los demás permisos, incluido el de ver sueldos, así que no se gana
     entrando por otra puerta. Las cuentas de los guardias se ven acá, pero
     quien las toca sigue siendo la pestaña Trabajadores, que pide `personal`:
     Joaquín no perdió ningún botón de los que ya usaba. */
  usuarios: { rotulo: "Usuarios", pintar: pintarUsuarios, modulo: "usuarios" },
  /* Personas —RRHH, Fichas, Documentos, Sueldos y Carga masiva— se mudó a
     rrhh.seggarridos.com y NO se dejó una copia acá: dos copias de la misma
     pantalla se separan solas, que es lo que ya pasó tres veces en este
     proyecto. En la lateral queda el enlace, y las dos páginas son la misma
     base y la misma gente. */
};

/* Las pantallas, agrupadas por área de trabajo. Catorce pestañas en una fila
   sola se partían en tres líneas y todas pesaban igual: no había forma de ver
   de un vistazo qué era de cobranza y qué de personas. Ahora cada una vive
   bajo el título del área que la usa.

   Los grupos calzan casi uno a uno con los permisos, y eso no es casualidad:
   el permiso ya dice quién usa qué. A una cuenta de operaciones le aparece un
   grupo y a una de cotizaciones otro, sin grupos vacíos de por medio. Por eso
   mismo, cuando Personas se fue a su dominio se llevó un grupo entero y no
   media pantalla de cada uno.

   El orden de acá manda también para qué se abre al entrar: la primera
   sección que la cuenta pueda ver. */
const GRUPOS = [
  { rotulo: "Cobranza",    vistas: ["panel", "calendario", "pagos", "bitacora"] },
  { rotulo: "Comercial",   vistas: ["contactos", "cotizaciones"] },
  { rotulo: "Operaciones", vistas: ["servicio", "instalaciones", "extra", "libro", "trabajadores"] },
  { rotulo: "Sistema",     vistas: ["usuarios"] },
];

/** Cambiar de sección descarta lo marcado: las acciones de la barra no aplican
 *  a lo que se está mirando ahora y quedaría apuntando a otra cosa. Lo llama
 *  `ir()`, en comun.js; la página de Personas no tiene tablas con casillas y
 *  no define este gancho. */
function alCambiarVista() {
  // La contraseña temporal se muestra una sola vez: si quien la generó se fue
  // a otra pantalla, ya no la va a encontrar al volver. Es a propósito, y por
  // eso el recuadro dice que hay que anotarla en el momento.
  claveMostrada = null;
  seleccion.tipo = null;
  seleccion.ids.clear();
  seleccion.op = 0;
  seleccion.aviso = null;
  pintarBarraSel();
}

/** Lo que el panel necesita tener a mano antes de pintar nada. Cada cosa se
 *  pide solo si la cuenta puede pedirla: `/catalogos` exige facturación o
 *  cotizaciones, y pedirlo igual dejaba sin entrar a quien no las tiene. */
async function precargar(usuario) {
  if (usuario.permisos.includes("facturacion") || usuario.permisos.includes("cotizaciones")) {
    estado.catalogos = await pedir("/catalogos");
  }
  if (usuario.permisos.includes("facturacion")) estado.panel = await pedir("/panel");
}

async function recargar({ repintar = true } = {}) {
  estado.panel = await pedir("/panel");
  // Traer los datos no servía de nada si la pantalla seguía mostrando los viejos.
  if (repintar && estado.vista === "panel") pintarPanel();
}

conectarApariencia();
arrancar();
</script>

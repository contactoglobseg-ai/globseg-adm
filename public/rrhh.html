<script>
// Antes de pintar nada: si hay tema o tamaño guardados, se aplican ya. Si algo
// falla acá, la página igual carga con los valores por defecto.
//
// Sigue estando escrito acá dentro, repetido en cada página, y a propósito: en
// un archivo aparte el navegador lo baja después del primer pintado y quien usa
// modo oscuro ve un destello blanco en cada carga, que es justo lo que este
// script existe para evitar.
try {
  var t = localStorage.getItem("globseg.tema");
  if (t === "claro" || t === "oscuro") document.documentElement.dataset.tema = t;
  var e = localStorage.getItem("globseg.escala");
  if (e) document.documentElement.style.setProperty("--escala", e);
} catch (_) {}
</script>

<script>
"use strict";

/* Personas: rrhh.seggarridos.com.
 *
 * El marco —lateral, cajón, puerta de entrada, arranque— y los ayudantes
 * (`$`, `pedir`, `esc`, `aviso`, `recado`…) viven en comun.js, que esta página
 * carga más arriba. Acá abajo va solo lo propio de Personas.
 *
 * OJO: comun.js y este `<script>` comparten el ámbito global. Una sola
 * declaración repetida entre los dos deja la página EN BLANCO, no a medias.
 *
 * Esta página y el panel son la misma base y la misma gente: la ficha de un
 * guardia es una fila en `trabajadores`, la misma con la que marca turno en el
 * libro de asistencia y la misma de la que sale su contrato. Lo que cambia es
 * desde dónde se mira.
 */

const VISTAS = {
  rrhh:       { rotulo: "RRHH",         pintar: pintarRrhh,       modulo: "rrhh" },
  personal:   { rotulo: "Fichas",       pintar: pintarPersonal,   modulo: "rrhh" },
  /* Dos permisos porque la usan dos áreas: RRHH emite los contratos y el
     prevencionista hace firmar entregas de EPP y charlas, y no comparten
     permiso. El servidor abre esta puerta con la misma regla. */
  documentos: { rotulo: "Documentos",   pintar: pintarDocumentos,
                modulo: ["rrhh", "documentos"] },
  sueldos:    { rotulo: "Sueldos",      pintar: pintarSueldos,    modulo: "rrhh" },
  carga:      { rotulo: "Carga masiva", pintar: pintarCarga,      modulo: "rrhh" },
};

/* Un solo grupo, el mismo que tenía en el panel. Se deja el título igual que
   allá: quien venía usando las pestañas desde el panel encuentra lo mismo con
   el mismo nombre, y el encabezado del teléfono sigue diciendo «PERSONAS /
   Fichas» en vez de solo «Fichas». */
const GRUPOS = [
  { rotulo: "Personas", vistas: ["rrhh", "personal", "documentos", "sueldos", "carga"] },
];

/** Quien entra acá sin el módulo no es alguien a quien le falte una pantalla
 *  por construir: es alguien que se equivocó de puerta. Se le dice eso y se le
 *  muestra por dónde entrar, en vez del aviso del panel. */
function sinNada(usuario) {
  return aviso("ojo", "Su cuenta no tiene acceso a Personas",
    "Su rol es «" + usuario.rol + "». Esta página es de Recursos Humanos; "
    + "lo suyo está en el panel, en adm.seggarridos.com.");
}

// ============================================================ recursos humanos
/**
 * Personas, en cinco pantallas:
 *   · RRHH      — qué vence, qué falta y a quién. Lo primero que hay que mirar.
 *   · Fichas    — la ficha de cada uno, con su contrato, sus papeles y su feriado.
 *   · Documentos — contratos desde plantilla, firmados con el dedo.
 *   · Sueldos   — liquidación estimada, finiquito estimado y los parámetros del año.
 *   · Carga masiva — subir la planilla que ya existe, en vez de teclearla.
 *
 * Todo lo que es estimación lo dice. Todo parámetro que nadie confirmó se
 * muestra en ámbar, igual que en la página pública: un número sin confirmar
 * que se ve como un número confirmado es peor que no tenerlo.
 */
const RRHH = {
  catalogos: null, panel: null, personal: null, ficha: null,
  verFicha: null,            // id de la persona abierta, o null para la lista
  editaContrato: null,       // contrato que se está corrigiendo dentro de esa ficha
  ingresos: null, verIngreso: null,   // enlaces de ficha de ingreso y el que se revisa
  busca: "", soloActivos: true,
  docFiltro: { estado: "", grupo: "", trabajador: "" },
  sueldos: { trabajador: "", mes: hoyISO().slice(0, 7), vista: "liquidacion" },
  subirA: null,                // documento al que va el archivo que se está eligiendo
  carga: { tipo: "trabajadores", filas: null, encabezados: null, mapa: null,
           revision: null, avance: null },
};

async function catalogosRrhh() {
  if (!RRHH.catalogos) RRHH.catalogos = await pedir("/rrhh/catalogos");
  return RRHH.catalogos;
}

const ROTULO_DOC = { vencido: "Vencido", por_vencer: "Por vencer", vigente: "Vigente",
  sin_vencimiento: "Sin vencimiento", anulado: "Anulado" };
const SELLO_DOC = { vencido: "e-rechazada", por_vencer: "e-solicitar_oc",
  vigente: "e-cerrado", sin_vencimiento: "e-en_curso", anulado: "e-borrador" };

const ROTULO_CONTRATO = { indefinido: "Indefinido", plazo_fijo: "Plazo fijo",
  por_obra: "Por obra o faena" };
const ROTULO_JORNADA = {
  art22: "Jornada ordinaria (art. 22)",
  art38_2: "Turnos continuos (art. 38 N°2)",
  excepcional: "Sistema excepcional autorizado por la DT",
  parcial: "Jornada parcial (art. 40 bis)",
  art22_excluido: "Sin fiscalización de jornada (art. 22 inc. 2°)",
};
const ROTULO_AUSENCIA = {
  feriado: "Feriado legal", feriado_progresivo: "Feriado progresivo",
  licencia_medica: "Licencia médica", accidente_trabajo: "Accidente del trabajo",
  permiso_legal: "Permiso legal", permiso_con_goce: "Permiso con goce",
  permiso_sin_goce: "Permiso sin goce", falta_injustificada: "Falta injustificada",
  suspension: "Suspensión", otra: "Otra",
};
const ROTULO_CARGO = {
  guardia: "Guardia", supervisor: "Supervisor", nochero: "Nochero", rondin: "Rondín",
  jefe_servicio: "Jefe de servicio", administrativo: "Administrativo",
  prevencionista: "Prevencionista", conductor: "Conductor",
};
const rotCargo = c => ROTULO_CARGO[c] || (c ? c[0].toUpperCase() + c.slice(1) : "—");

/** Cuántos días faltan, dicho como lo diría una persona. */
function enDias(n) {
  if (n === null || n === undefined) return "";
  if (n < 0) return `hace ${Math.abs(n)} día${Math.abs(n) === 1 ? "" : "s"}`;
  if (n === 0) return "hoy";
  if (n === 1) return "mañana";
  return `en ${n} días`;
}

const rutLindoSeguro = v => { try { return rutLindo(v); } catch { return v || "—"; } };

/** El peso de un archivo como lo diría una persona. Un PDF chico no puede
 *  salir como «0 KB»: parece que no se subió nada. */
const pesoArchivo = n => !n ? "—"
  : n < 1024 ? `${n} bytes`
  : n < 1048576 ? `${Math.round(n / 1024)} KB`
  : `${(n / 1048576).toFixed(1)} MB`;

const MAX_ARCHIVO = 10 * 1024 * 1024;

/**
 * Sube un archivo a un documento.
 *
 * Va como bytes crudos y no como formulario: el nombre viaja en una cabecera y
 * el cuerpo es el archivo tal cual, así que no se arma una copia en memoria
 * para envolverlo. El tamaño se mira acá antes de mandarlo, para no hacer
 * subir diez megas por la red y recién entonces decir que no.
 */
async function subirArchivo(documentoId, archivo) {
  if (!archivo) return null;
  if (archivo.size > MAX_ARCHIVO) {
    throw new Error(`«${archivo.name}» pesa ${pesoArchivo(archivo.size)} y el máximo es 10 MB. `
      + "Si es una foto, sáquela con menos resolución o conviértala a PDF.");
  }
  const r = await fetch(`/api/rrhh/documentos/${documentoId}/archivo`, {
    method: "POST",
    headers: {
      "content-type": archivo.type || "application/octet-stream",
      // El nombre puede traer acentos y una cabecera HTTP no los admite tal cual.
      "x-archivo-nombre": encodeURIComponent(archivo.name || ""),
    },
    body: archivo,
  });
  const cuerpo = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(cuerpo.error || `Error ${r.status} al subir el archivo`);
  return cuerpo;
}

// ------------------------------------------------------------- panel de RRHH
async function pintarRrhh() {
  const [panel] = await Promise.all([pedir("/rrhh/panel"), catalogosRrhh()]);
  RRHH.panel = panel;

  const d = panel.dotacion;
  const urgentes = panel.vencidos.length + panel.plazo_por_vencer.filter(c => c.dias <= 15).length;

  let html = "";

  if (panel.vencidos.length) {
    const guardias = panel.vencidos.filter(x => x.tipo.startsWith("os10"));
    html += aviso("mal",
      `${panel.vencidos.length} documento${panel.vencidos.length > 1 ? "s" : ""} vencido${panel.vencidos.length > 1 ? "s" : ""}`,
      guardias.length
        ? `${guardias.length} ${guardias.length > 1 ? "son credenciales o cursos OS-10" : "es una credencial o curso OS-10"}. `
          + "Sin credencial vigente esa persona no puede hacer turno, y el mandante puede "
          + "cerrar la faena si lo revisa."
        : "Están abajo, en rojo, con el nombre de cada uno.");
  }
  const plazoCerca = panel.plazo_por_vencer.filter(c => c.dias <= 15);
  if (plazoCerca.length) {
    html += aviso("mal",
      `${plazoCerca.length} contrato${plazoCerca.length > 1 ? "s" : ""} a plazo vence${plazoCerca.length > 1 ? "n" : ""} en 15 días o menos`,
      "Si la persona sigue trabajando después de la fecha de término, el contrato pasa a ser "
      + "indefinido por el solo hecho de seguir (art. 159 N°4). Renueve o termine antes.");
  }
  if (panel.resoluciones.length) {
    html += aviso("ojo",
      `${panel.resoluciones.length} resolución${panel.resoluciones.length > 1 ? "es" : ""} de turnos excepcionales por vencer`,
      "Es la autorización de la Dirección del Trabajo para el 4x4 o el 7x7. Vencida, ese turno "
      + "deja de estar autorizado aunque siga saliendo igual todas las semanas.");
  }
  // Una ficha que llegó y nadie revisó no es una urgencia legal, pero sí es
  // trabajo esperando de alguien que ya hizo su parte. Va arriba para que no
  // se quede dos semanas en una pestaña que nadie abre.
  const porRevisar = panel.fichas_por_revisar || [];
  if (porRevisar.length) {
    html += aviso("ojo",
      `${porRevisar.length} ficha${porRevisar.length > 1 ? "s" : ""} de ingreso esperando revisión`,
      porRevisar.map(x => esc(x.nombre_referencia)).join(", ")
      + ". Lo que mandaron no está en el sistema hasta que alguien lo acepte, "
      + "acá mismo en Personas → Fichas.");
  }
  if (!urgentes && !panel.resoluciones.length) {
    html += aviso("bien", "Nada vencido ni por vencer en los próximos 15 días",
      `Se revisan ${panel.dias_aviso} días hacia adelante.`);
  }

  html += `<dl class="resumen">
    <div class="ficha ficha--plata"><dt>Dotación activa</dt><dd class="num">${d.activos}</dd>
      <small>${Object.entries(d.por_cargo).map(([c, n]) => `${n} ${rotCargo(c).toLowerCase()}`).join(" · ") || "sin cargos cargados"}</small></div>
    <div class="ficha ${d.con_contrato < d.activos ? "ficha--ojo" : ""}"><dt>Con contrato cargado</dt>
      <dd class="num">${d.con_contrato}</dd>
      <small>${d.activos - d.con_contrato} sin contrato en el sistema</small></div>
    <div class="ficha ${panel.vencidos.length ? "ficha--ojo" : ""}"><dt>Documentos vencidos</dt>
      <dd class="num">${panel.vencidos.length}</dd><small>Hay que renovarlos ya</small></div>
    <div class="ficha ${panel.por_vencer.length ? "ficha--ojo" : ""}"><dt>Por vencer</dt>
      <dd class="num">${panel.por_vencer.length}</dd><small>En los próximos ${panel.dias_aviso} días</small></div>
    <div class="ficha"><dt>Ausencias en curso</dt><dd class="num">${panel.ausencias_vigentes.length}</dd>
      <small>Hoy y los próximos 30 días</small></div>
  </dl>`;

  // Vencimientos: lo vencido primero y en rojo, lo que viene después.
  const vencimientos = [...panel.vencidos, ...panel.por_vencer];
  html += `<section class="caja">
    <div class="caja__tit"><h2>Vencimientos</h2>
      <span class="nota">${vencimientos.length} documento${vencimientos.length === 1 ? "" : "s"}</span></div>
    ${vencimientos.length ? `<div class="desliza"><table>
      <thead><tr><th>Persona</th><th>Documento</th><th>N°</th><th>Vence</th>
        <th>Estado</th><th></th></tr></thead><tbody>
      ${vencimientos.map(v => `<tr${v.estado === "vencido" ? ' class="fila--atrasado"' : ""}>
        <td><b>${esc(v.trabajador)}</b><span class="sub">${rotCargo(v.trabajador_cargo)}</span></td>
        <td>${esc(v.tipo_nombre)}${v.obligatorio ? '<span class="sub">Obligatorio</span>' : ""}</td>
        <td class="nowrap">${esc(v.numero || "—")}</td>
        <td class="nowrap">${fecha(v.fecha_vencimiento)}<span class="sub">${enDias(v.dias_para_vencer)}</span></td>
        <td><span class="sello ${SELLO_DOC[v.estado]}">${ROTULO_DOC[v.estado]}</span></td>
        <td class="nowrap"><button class="bt bt--fino bt--chico" data-ver-ficha="${v.trabajador_id}">Ver ficha</button></td>
      </tr>`).join("")}
    </tbody></table></div>`
    : `<p class="vacio">Ningún documento vence en los próximos ${panel.dias_aviso} días.</p>`}
  </section>`;

  if (panel.plazo_por_vencer.length) {
    html += `<section class="caja">
      <div class="caja__tit"><h2>Contratos a plazo por vencer</h2>
        <span class="nota">Pasada la fecha, el contrato se vuelve indefinido</span></div>
      <div class="desliza"><table>
        <thead><tr><th>Persona</th><th>Tipo</th><th>Termina</th><th></th></tr></thead><tbody>
        ${panel.plazo_por_vencer.map(c => `<tr${c.dias <= 15 ? ' class="fila--atrasado"' : ""}>
          <td><b>${esc(c.trabajador)}</b></td>
          <td>${ROTULO_CONTRATO[c.tipo] || c.tipo}</td>
          <td class="nowrap">${fecha(c.fecha_termino)}<span class="sub">${enDias(c.dias)}</span></td>
          <td class="nowrap"><button class="bt bt--fino bt--chico" data-ver-ficha="${c.trabajador_id}">Ver ficha</button></td>
        </tr>`).join("")}
      </tbody></table></div></section>`;
  }

  if (panel.resoluciones.length) {
    html += `<section class="caja">
      <div class="caja__tit"><h2>Resoluciones de turnos excepcionales</h2>
        <span class="nota">Art. 38 inciso final del Código del Trabajo</span></div>
      <div class="desliza"><table>
        <thead><tr><th>Persona</th><th>Resolución</th><th>Vence</th></tr></thead><tbody>
        ${panel.resoluciones.map(r => `<tr>
          <td><b>${esc(r.trabajador)}</b></td>
          <td>${esc(r.resolucion || "—")}</td>
          <td class="nowrap">${fecha(r.vence)}<span class="sub">${enDias(r.dias)}</span></td>
        </tr>`).join("")}
      </tbody></table></div></section>`;
  }

  if (panel.sin_contrato.length || panel.fichas_incompletas.length) {
    html += `<section class="caja">
      <div class="caja__tit"><h2>Lo que falta cargar</h2>
        <span class="nota">Sin esto no se puede calcular sueldo, feriado ni finiquito</span></div>
      <div class="desliza"><table>
        <thead><tr><th>Persona</th><th>Qué falta</th><th></th></tr></thead><tbody>
        ${panel.sin_contrato.map(t => `<tr>
          <td><b>${esc(t.nombre)}</b><span class="sub">${esc(t.rut)} · ${rotCargo(t.cargo)}</span></td>
          <td><span class="sello e-rechazada">Sin contrato</span></td>
          <td class="nowrap"><button class="bt bt--fino bt--chico" data-ver-ficha="${t.id}">Abrir ficha</button></td>
        </tr>`).join("")}
        ${panel.fichas_incompletas.map(t => `<tr>
          <td><b>${esc(t.nombre)}</b></td>
          <td>Falta ${esc(t.falta.join(", "))}</td>
          <td class="nowrap"><button class="bt bt--fino bt--chico" data-ver-ficha="${t.id}">Abrir ficha</button></td>
        </tr>`).join("")}
      </tbody></table></div></section>`;
  }

  if (panel.faltantes.length) {
    html += `<section class="caja">
      <div class="caja__tit"><h2>Documentos obligatorios que faltan</h2>
        <span class="nota">${panel.faltantes.length} persona${panel.faltantes.length === 1 ? "" : "s"}</span></div>
      <div class="desliza"><table>
        <thead><tr><th>Persona</th><th>Papeles que no están cargados</th><th></th></tr></thead><tbody>
        ${panel.faltantes.map(t => `<tr>
          <td><b>${esc(t.nombre)}</b><span class="sub">${rotCargo(t.cargo)}</span></td>
          <td>${t.faltan.map(f => `<span class="sello e-en_curso" style="margin:0 4px 4px 0">${esc(f)}</span>`).join("")}</td>
          <td class="nowrap"><button class="bt bt--fino bt--chico" data-ver-ficha="${t.id}">Abrir ficha</button></td>
        </tr>`).join("")}
      </tbody></table></div></section>`;
  }

  if (panel.ausencias_vigentes.length) {
    html += `<section class="caja">
      <div class="caja__tit"><h2>Quién no está</h2>
        <span class="nota">Hoy y los próximos 30 días</span></div>
      <div class="desliza"><table>
        <thead><tr><th>Persona</th><th>Motivo</th><th>Desde</th><th>Hasta</th>
          <th class="num">Días hábiles</th><th>Estado</th></tr></thead><tbody>
        ${panel.ausencias_vigentes.map(a => `<tr>
          <td><b>${esc(a.trabajadores?.nombre || "—")}</b></td>
          <td>${ROTULO_AUSENCIA[a.tipo] || a.tipo}${a.folio ? `<span class="sub">Folio ${esc(a.folio)}</span>` : ""}</td>
          <td class="nowrap">${fecha(a.desde)}</td>
          <td class="nowrap">${fecha(a.hasta)}</td>
          <td class="num">${a.dias_habiles ?? "—"}</td>
          <td><span class="sello ${a.estado === "aprobada" ? "e-cerrado" : "e-solicitar_oc"}">${esc(a.estado)}</span></td>
        </tr>`).join("")}
      </tbody></table></div></section>`;
  }

  if (panel.parametros_por_confirmar.length) {
    html += `<section class="caja">
      <div class="caja__tit"><h2>Parámetros sin confirmar</h2>
        <span class="nota">Se usan igual, pero nadie los ha revisado</span></div>
      <p style="padding:0 16px;color:var(--texto-3);font-size:.86rem;margin:0 0 4px">
        Estos números salen de la ley y cambian todos los años. El sistema trae un valor de
        partida, pero no tiene cómo verificarlo: mientras nadie lo confirme en
        <b>Sueldos → Parámetros</b>, todo cálculo que los use sale marcado.</p>
      <div class="desliza"><table>
        <thead><tr><th>Parámetro</th><th class="num">Valor</th><th>Vigente desde</th>
          <th>De dónde sale</th></tr></thead><tbody>
        ${panel.parametros_por_confirmar.map(p => `<tr class="fila--solicitar_oc">
          <td><b>${esc(p.glosa || p.codigo)}</b><span class="sub">${esc(p.codigo)}</span></td>
          <td class="num">${p.unidad === "pesos" ? clp(p.valor) : p.valor}${
            p.unidad === "porcentaje" ? "%" : p.unidad === "uf" ? " UF" : ""}</td>
          <td class="nowrap">${fecha(p.vigente_desde)}</td>
          <td><span class="sub" style="margin:0">${esc(p.base_legal || "—")}</span></td>
        </tr>`).join("")}
      </tbody></table></div></section>`;
  }

  $("#app").innerHTML = html;
  document.querySelectorAll("[data-ver-ficha]").forEach(b => {
    b.onclick = () => {
      RRHH.verFicha = Number(b.dataset.verFicha); RRHH.editaContrato = null; ir("personal");
    };
  });
}

// ------------------------------------------------------------- personal
async function pintarPersonal() {
  if (RRHH.verFicha) return pintarFicha(RRHH.verFicha);
  if (RRHH.verIngreso) return pintarFichaIngreso(RRHH.verIngreso);

  const [{ personal }, ingresos] = await Promise.all([
    pedir("/rrhh/personal"),
    // Si la migración de la ficha de ingreso todavía no corrió, esto no puede
    // dejar sin pantalla al resto: la lista queda vacía con su aviso.
    pedir("/rrhh/fichas-ingreso").catch(e => ({ fichas: [], sin_tabla: true, aviso: e.message })),
    catalogosRrhh(),
  ]);
  RRHH.personal = personal;
  RRHH.ingresos = ingresos;

  const q = RRHH.busca.trim().toLowerCase();
  const lista = personal
    .filter(t => (RRHH.soloActivos ? t.activo : true))
    .filter(t => !q || [t.nombre, t.rut, t.usuario, t.cargo, t.instalacion]
      .some(v => String(v || "").toLowerCase().includes(q)));

  $("#app").innerHTML = `
    ${seccionIngresos(ingresos)}
    <section class="caja">
      <div class="caja__tit"><h2>Personal</h2>
        <span class="nota">${lista.length} de ${personal.length}</span>
        <button class="bt bt--chico" type="button" id="nueva-persona">Nueva persona</button></div>
      <div class="rejilla">
        <label class="campo" style="grid-column:span 2"><span>Buscar</span>
          <input id="f-busca" value="${esc(RRHH.busca)}" placeholder="Nombre, RUT, cargo o instalación"
            autocomplete="off"></label>
        <label class="campo"><span>Mostrar</span>
          <select id="f-activos">
            <option value="si"${RRHH.soloActivos ? " selected" : ""}>Solo activos</option>
            <option value="no"${RRHH.soloActivos ? "" : " selected"}>Todos, incluidos los de baja</option>
          </select></label>
      </div>
      ${lista.length ? `<div class="desliza"><table>
        <thead><tr><th>Persona</th><th>RUT</th><th>Cargo</th><th>Instalación</th>
          <th>Contrato</th><th>Ingreso</th><th>Previsión</th><th></th></tr></thead><tbody>
        ${lista.map(t => `<tr${t.activo ? "" : ' class="fila--cerrado"'}>
          <td><b>${esc(t.nombre)}</b><span class="sub">${esc(t.usuario)}${
            t.telefono ? " · " + esc(t.telefono) : ""}</span></td>
          <td class="nowrap num">${rutLindoSeguro(t.rut)}</td>
          <td>${rotCargo(t.cargo)}</td>
          <td>${t.instalacion ? esc(t.instalacion) : '<span class="sub">Sin asignar</span>'}</td>
          <td>${t.sin_contrato
            ? '<span class="sello e-rechazada">Sin contrato</span>'
            : `<span class="sello e-cerrado">${ROTULO_CONTRATO[t.contrato_tipo] || t.contrato_tipo}</span>`
              + (t.contrato_hasta ? `<span class="sub">hasta ${fecha(t.contrato_hasta)}</span>` : "")}</td>
          <td class="nowrap">${t.fecha_ingreso ? fecha(t.fecha_ingreso)
            : '<span class="sello e-solicitar_oc">Falta</span>'}</td>
          <td>${t.afp || t.salud_sistema
            ? `${esc(t.afp || "sin AFP")}<span class="sub">${esc(t.salud_isapre || t.salud_sistema || "sin salud")}</span>`
            : '<span class="sello e-solicitar_oc">Falta</span>'}</td>
          <td class="nowrap"><button class="bt bt--fino bt--chico" data-ficha="${t.id}">Ver ficha</button></td>
        </tr>`).join("")}
      </tbody></table></div>`
      : `<p class="vacio">No hay nadie que calce con lo buscado.
           ${personal.length ? "" : "Empiece por «Carga masiva» si ya tiene la planilla."}</p>`}
    </section>`;

  const busca = $("#f-busca");
  busca.oninput = () => {
    RRHH.busca = busca.value;
    clearTimeout(RRHH._t);
    // Se espera a que deje de escribir: repintar en cada tecla con 150 filas
    // hace saltar el cursor.
    RRHH._t = setTimeout(pintarPersonal, 220);
  };
  $("#f-activos").onchange = e => { RRHH.soloActivos = e.target.value === "si"; pintarPersonal(); };
  document.querySelectorAll("[data-ficha]").forEach(b => {
    b.onclick = () => {
      RRHH.verFicha = Number(b.dataset.ficha); RRHH.editaContrato = null;
      pintarFicha(RRHH.verFicha);
    };
  });
  $("#nueva-persona").onclick = pintarNuevaPersona;
  conectarIngresos();
}

// ------------------------------------------- fichas de ingreso por enlace
/**
 * El enlace que se le manda a quien entra, para que llene su ficha solo.
 *
 * Vive dentro de «Fichas» y no en una pestaña aparte a propósito: es parte de
 * dar de alta a una persona, y una pestaña más en la lateral sería una
 * pantalla que hay que acordarse de visitar. Acá está donde ya se mira.
 *
 * Lo que llega NO entra a la ficha: queda esperando revisión, y de eso se
 * encarga pintarFichaIngreso().
 */
const SELLO_INGRESO = {
  pendiente: "e-en_curso", recibida: "e-solicitar_oc",
  aceptada: "e-cerrado", vencida: "e-borrador", anulada: "e-borrador",
};
const ROTULO_INGRESO = {
  pendiente: "Esperando", recibida: "Llegó: hay que revisarla",
  aceptada: "Aceptada", vencida: "Venció", anulada: "Anulada",
};

function seccionIngresos(ingresos) {
  const fichas = ingresos.fichas || [];
  const porRevisar = fichas.filter(f => f.estado_visible === "recibida");
  // Las vencidas y las anuladas se guardan, pero no tienen por qué estar a la
  // vista todos los días: la pregunta de esta pantalla es a quién hay que
  // perseguir y a quién hay que revisar.
  const vivas = fichas.filter(f => ["pendiente", "recibida"].includes(f.estado_visible));
  const viejas = fichas.length - vivas.length;

  return `<section class="caja">
    <div class="caja__tit"><h2>Fichas de ingreso</h2>
      <span class="nota">La llena la propia persona, desde su teléfono</span>
      <button class="bt bt--chico" type="button" id="bt-nuevo-enlace">Generar un enlace</button></div>

    ${ingresos.sin_tabla ? aviso("mal", "Esto todavía no está en la base",
      ingresos.aviso || "Falta aplicar la migración.") : ""}

    <div id="enlace-recien" hidden></div>

    ${porRevisar.length ? aviso("ojo",
      `${porRevisar.length} ficha${porRevisar.length > 1 ? "s" : ""} esperando revisión`,
      "Lo que mandaron no está en el sistema todavía. Revíselo y acéptelo: si alguien se "
      + "equivocó en el RUT o en la AFP, eso después sale en una liquidación.") : ""}

    ${vivas.length ? `<div class="desliza"><table class="ingresos">
      <thead><tr><th>A nombre de</th><th>Se mandó a</th><th>Estado</th><th>Vence</th>
        <th>Generó</th><th></th></tr></thead><tbody>
      ${vivas.map(f => `<tr>
        <td><b>${esc(f.nombre_referencia)}</b>${f.rut_esperado
          ? `<span class="sub">${esc(f.rut_esperado)}</span>` : ""}${f.trabajadores?.nombre
          ? '<span class="sub">Ya está en el sistema</span>' : ""}</td>
        <td>${esc(f.enviado_a || "—")}${f.nota ? `<span class="sub">${esc(f.nota)}</span>` : ""}</td>
        <td><span class="sello ${SELLO_INGRESO[f.estado_visible]}">${ROTULO_INGRESO[f.estado_visible]}</span>
          ${f.recibido_en ? `<span class="sub">${fecha(f.recibido_en.slice(0, 10))}</span>` : ""}</td>
        <td class="nowrap">${fecha(f.vence_en.slice(0, 10))}</td>
        <td><span class="sub" style="margin:0">${esc(f.creado_por)}</span></td>
        <td class="nowrap">${f.estado_visible === "recibida"
          ? `<button class="bt bt--chico" data-revisar-ingreso="${f.id}">Revisar</button>` : ""}
          <button class="bt bt--fino bt--chico" data-anular-ingreso="${f.id}">Anular</button></td>
      </tr>`).join("")}
    </tbody></table></div>`
      : `<p class="vacio">No hay enlaces esperando.
           ${ingresos.sin_tabla ? "" : "Genere uno y mándeselo por WhatsApp a quien entra."}</p>`}
    ${viejas ? `<p class="sub" style="padding:0 16px 14px;margin:0">${viejas} más ya aceptadas,
      vencidas o anuladas. Quedan guardadas.</p>` : ""}
  </section>`;
}

function conectarIngresos() {
  const caja = $("#enlace-recien");

  $("#bt-nuevo-enlace").onclick = () => {
    caja.hidden = false;
    caja.innerHTML = `<form id="f-enlace" style="padding:4px 16px 16px">
      <div class="rejilla">
        <label class="campo" style="grid-column:span 2"><span>¿Para quién es? *</span>
          <select name="trabajador_id" id="e-quien">
            <option value="">Alguien que todavía no está en el sistema</option>
            ${(RRHH.personal || []).filter(t => t.activo).map(t =>
              `<option value="${t.id}">${esc(t.nombre)}</option>`).join("")}
          </select></label>
        <label class="campo" id="e-nombre-caja" style="grid-column:span 2">
          <span>Nombre y apellido, para no perderle el rastro al enlace *</span>
          <input name="nombre_referencia" autocomplete="off" placeholder="Camila Núñez Soto"></label>
        <label class="campo"><span>RUT, si lo sabe</span>
          <input name="rut" placeholder="12.345.678-9" autocomplete="off">
          <span class="sub" style="margin:0">Si lo pone, el enlace queda amarrado a ese RUT y
            no sirve para cargar a otra persona.</span></label>
        <label class="campo"><span>¿A qué número o correo se lo va a mandar?</span>
          <input name="enviado_a" autocomplete="off" placeholder="+56 9 ..."></label>
        <label class="campo"><span>Sirve por</span><select name="dias">
          <option value="3">3 días</option>
          <option value="7" selected>7 días</option>
          <option value="15">15 días</option>
          <option value="30">30 días</option></select>
          <span class="sub" style="margin:0">Pasado el plazo deja de abrir, y hay que generar otro.</span></label>
        <label class="campo"><span>Nota para la oficina</span><input name="nota" autocomplete="off"></label>
      </div>
      <div class="pie-form">
        <button class="bt" type="submit">Generar el enlace</button>
        <span class="mensaje"></span>
      </div></form>`;

    // Para alguien que ya está cargado, el nombre y el RUT salen de su ficha.
    const quien = $("#e-quien");
    const verQuien = () => {
      const propio = !quien.value;
      $("#e-nombre-caja").style.display = propio ? "" : "none";
      $("#f-enlace").rut.closest("label").style.display = propio ? "" : "none";
    };
    quien.onchange = verQuien;
    verQuien();

    const f = $("#f-enlace");
    f.onsubmit = async ev => {
      ev.preventDefault();
      const m = f.querySelector(".mensaje"), bt = f.querySelector("button[type=submit]");
      decir(m, "Generando…"); bt.disabled = true;
      try {
        const r = await pedir("/rrhh/fichas-ingreso", { method: "POST",
          body: JSON.stringify(Object.fromEntries(new FormData(f))) });
        mostrarEnlace(r);
      } catch (e) { decir(m, e.message, "error"); bt.disabled = false; }
    };
  };

  document.querySelectorAll("[data-revisar-ingreso]").forEach(b => {
    b.onclick = () => {
      RRHH.verIngreso = Number(b.dataset.revisarIngreso);
      pintarFichaIngreso(RRHH.verIngreso);
    };
  });
  document.querySelectorAll("[data-anular-ingreso]").forEach(b => {
    b.onclick = async () => {
      const motivo = prompt("¿Por qué se anula este enlace?\n\n"
        + "Queda guardado con su nombre. Después de esto el enlace deja de abrir.");
      if (motivo === null) return;
      try {
        await pedir(`/rrhh/fichas-ingreso/${b.dataset.anularIngreso}`, { method: "PATCH",
          body: JSON.stringify({ motivo }) });
        pintarPersonal();
      } catch (e) { alert(e.message); }
    };
  });
}

/**
 * El enlace recién generado, que es la única vez que existe.
 *
 * El token no se guarda en ninguna parte: en la base vive su hash. Si esta
 * pantalla se cierra sin copiarlo, no hay de dónde sacarlo y hay que generar
 * otro. Por eso se muestra grande, con el texto listo para pegar, y se dice
 * que es ahora o nunca.
 */
function mostrarEnlace(r) {
  const caja = $("#enlace-recien");
  const mensaje = `Hola ${r.ficha.nombre_referencia.split(" ")[0]}, le dejo el enlace para que `
    + `llene su ficha de ingreso en Seguridad Garridos. Son unos minutos y se hace desde el `
    + `teléfono. Sirve ${r.dias} días y una sola vez: ${r.enlace}`;
  caja.innerHTML = `<div style="padding:4px 16px 18px">
    ${aviso("bien", "Enlace listo para " + r.ficha.nombre_referencia,
      "Cópielo ahora: el sistema no lo guarda en claro en ninguna parte, así que esta es la "
      + "única vez que se puede ver. Si se pierde, se genera otro. Este deja de servir "
      + `cuando lo llenen, o el ${fecha(r.ficha.vence_en.slice(0, 10))}.`)}
    <label class="campo" style="margin-top:10px"><span>El enlace</span>
      <input id="e-url" readonly value="${esc(r.enlace)}"></label>
    <label class="campo" style="margin-top:10px"><span>Mensaje listo para pegar en WhatsApp</span>
      <input id="e-msg" readonly value="${esc(mensaje)}"></label>
    <div class="pie-form">
      <button class="bt" type="button" id="e-copiar">Copiar el mensaje</button>
      <button class="bt bt--fino" type="button" id="e-copiar-url">Copiar solo el enlace</button>
      <button class="bt bt--fino" type="button" id="e-listo">Listo</button>
      <span class="mensaje" id="e-m"></span>
    </div></div>`;

  const copiar = async (campo, que) => {
    const el = $(campo);
    try {
      await navigator.clipboard.writeText(el.value);
      decir($("#e-m"), que + " copiado", "ok");
    } catch {
      // Sin permiso de portapapeles queda seleccionado: copiar a mano sigue
      // siendo posible, y es mejor que un error que no dice qué hacer.
      el.focus(); el.select();
      decir($("#e-m"), "Quedó seleccionado: cópielo con ⌘C o Ctrl+C", "ok");
    }
  };
  $("#e-copiar").onclick = () => copiar("#e-msg", "El mensaje");
  $("#e-copiar-url").onclick = () => copiar("#e-url", "El enlace");
  $("#e-listo").onclick = () => pintarPersonal();
}

/**
 * Revisar lo que llegó antes de escribirlo.
 *
 * La pantalla entera existe por un motivo: lo que manda la persona puede
 * estar mal, y el RUT y la AFP mal puestos no se notan hasta la primera
 * liquidación. Así que se muestra lo que llegó al lado de lo que había, se
 * marca en ámbar lo que pisa un dato que ya existía, y nada se escribe hasta
 * que alguien acepta.
 */
async function pintarFichaIngreso(id) {
  $("#app").innerHTML = `<p class="cargando">Cargando la ficha que llegó…</p>`;
  const [d] = await Promise.all([pedir(`/rrhh/fichas-ingreso/${id}`), catalogosRrhh()]);
  const c = RRHH.catalogos;
  const f = d.ficha;
  const nuevos = d.comparacion.filter(x => x.cambia && !x.pisa);
  const pisados = d.comparacion.filter(x => x.pisa);

  $("#app").innerHTML = `
    <p style="margin-bottom:14px">
      <button class="bt bt--fino bt--chico" id="volver">← Volver a las fichas</button></p>

    ${d.rut_distinto ? aviso("mal", "El RUT no calza con el de la ficha que ya existe",
      `Escribió ${d.rut} y ${d.trabajador.nombre} está cargado con ${d.trabajador.rut}. `
      + "El RUT es su clave del libro de asistencia, así que no se cambia desde acá. "
      + "Llámelo, confirme cuál es el bueno y arréglelo en su ficha, o anule este enlace.") : ""}
    ${pisados.length ? aviso("ojo",
      `${pisados.length} dato${pisados.length > 1 ? "s" : ""} que cambia${pisados.length > 1 ? "n" : ""} algo que ya estaba`,
      "Van marcados abajo. Lo que llega donde no había nada es lo que se estaba buscando; "
      + "lo que pisa un dato distinto es lo que hay que mirar dos veces.") : ""}

    <dl class="resumen">
      <div class="ficha ficha--plata"><dt>${esc(f.nombre_referencia)}</dt>
        <dd style="font-size:1.1rem">${esc(d.rut || "sin RUT")}</dd>
        <small>Llegó el ${f.recibido_en ? fecha(f.recibido_en.slice(0, 10)) : "—"}
          · enlace generado por ${esc(f.creado_por)}</small></div>
      <div class="ficha"><dt>${d.trabajador ? "Ya está en el sistema" : "Es alguien nuevo"}</dt>
        <dd style="font-size:1.05rem">${d.trabajador ? esc(d.trabajador.nombre) : "Se va a crear"}</dd>
        <small>${d.trabajador
          ? `usuario ${esc(d.trabajador.usuario)}`
          : "Con su cuenta del libro de asistencia y el RUT de clave"}</small></div>
      <div class="ficha ${nuevos.length ? "" : "ficha--ojo"}"><dt>Datos nuevos</dt>
        <dd class="num">${nuevos.length}</dd>
        <small>${pisados.length} cambian algo que ya había</small></div>
    </dl>

    <section class="caja">
      <div class="caja__tit"><h2>Lo que llegó</h2>
        <span class="nota">Destilde lo que no quiera escribir</span></div>
      ${d.comparacion.length ? `<div class="desliza"><table class="comparar">
        <thead><tr><th style="width:34px"></th><th>Dato</th><th>Lo que hay hoy</th>
          <th>Lo que mandó</th></tr></thead><tbody>
        ${d.comparacion.map(x => `<tr${x.pisa ? ' class="fila--solicitar_oc"' : ""}>
          <td><input type="checkbox" class="campo-ok" value="${x.campo}"
            ${x.cambia ? " checked" : ""} style="width:auto"></td>
          <td><b>${esc(x.rotulo)}</b></td>
          <td>${x.actual ? esc(x.actual) : '<span class="sub" style="margin:0">—</span>'}</td>
          <td>${x.propuesto ? `<b>${esc(x.propuesto)}</b>` : '<span class="sub" style="margin:0">—</span>'}
            ${x.pisa ? '<span class="sub" style="color:var(--ambar)">pisa lo anterior</span>' : ""}</td>
        </tr>`).join("")}
      </tbody></table></div>` : `<p class="vacio">No mandó ningún dato.</p>`}

      <div style="padding:14px 16px 4px">
        ${d.trabajador ? "" : `<div class="rejilla">
          <label class="campo"><span>Cargo</span><select id="i-cargo">
            ${(d.cargos || c.cargos).map(x => `<option value="${x}">${rotCargo(x)}</option>`).join("")}</select>
            <span class="sub" style="margin:0">Esto no se le pregunta a la persona: lo decide la oficina.</span></label>
          <label class="campo"><span>Instalación habitual</span><select id="i-instalacion">
            <option value="">Sin asignar</option>
            ${c.instalaciones.map(i => `<option value="${i.id}">${esc(i.nombre)}</option>`).join("")}</select></label>
        </div>`}
        <label class="campo" style="margin-top:10px"><span>Nota de la revisión</span>
          <input id="i-nota" autocomplete="off" placeholder="Qué confirmó por teléfono, si confirmó algo"></label>
      </div>
      <div class="pie-form">
        <button class="bt" type="button" id="i-aceptar">${d.trabajador
          ? "Aceptar y escribir en su ficha" : "Aceptar y crear su ficha"}</button>
        <button class="bt bt--fino" type="button" id="i-anular">Anular este enlace</button>
        <span class="sub" style="margin:0">Hasta que apriete, nada de esto está en el sistema.</span>
        <span class="mensaje"></span>
      </div>
    </section>`;

  const volver = () => { RRHH.verIngreso = null; pintarPersonal(); };
  $("#volver").onclick = volver;

  $("#i-aceptar").onclick = async () => {
    const bt = $("#i-aceptar"), m = $("#app .pie-form .mensaje");
    const campos = [...document.querySelectorAll(".campo-ok:checked")].map(x => x.value);
    decir(m, "Guardando…"); bt.disabled = true;
    try {
      const r = await pedir(`/rrhh/fichas-ingreso/${id}/aceptar`, { method: "POST",
        body: JSON.stringify({
          campos,
          cargo: $("#i-cargo") ? $("#i-cargo").value : undefined,
          instalacion_id: $("#i-instalacion") ? $("#i-instalacion").value : undefined,
          nota_revision: $("#i-nota").value,
        }) });
      RRHH.verIngreso = null; RRHH.panel = null; RRHH.personal = null;
      // Se abre su ficha: lo siguiente que hay que hacer con esta persona es
      // cargarle el contrato y sus papeles, y eso está ahí.
      RRHH.verFicha = r.trabajador_id;
      pintarFicha(r.trabajador_id);
    } catch (e) { decir(m, e.message, "error"); bt.disabled = false; }
  };

  $("#i-anular").onclick = async () => {
    const motivo = prompt("¿Por qué se anula?\n\nLo que mandó queda guardado, pero no se escribe "
      + "en ninguna ficha.");
    if (motivo === null) return;
    try {
      await pedir(`/rrhh/fichas-ingreso/${id}`, { method: "PATCH",
        body: JSON.stringify({ motivo }) });
      volver();
    } catch (e) { alert(e.message); }
  };
}

function pintarNuevaPersona() {
  const c = RRHH.catalogos;
  $("#app").innerHTML = `
    <p style="margin-bottom:14px"><button class="bt bt--fino bt--chico" id="volver">← Volver al personal</button></p>
    <section class="caja">
      <div class="caja__tit"><h2>Nueva persona</h2>
        <span class="nota">El usuario del libro de asistencia lo arma el sistema</span></div>
      <form id="f-nueva">
        <div class="rejilla">
          <label class="campo"><span>Nombres *</span><input name="nombres" required autocomplete="off"></label>
          <label class="campo"><span>Apellido paterno *</span><input name="apellido_paterno" required autocomplete="off"></label>
          <label class="campo"><span>Apellido materno</span><input name="apellido_materno" autocomplete="off"></label>
          <label class="campo"><span>RUT *</span><input name="rut" required placeholder="12.345.678-9"></label>
          <label class="campo"><span>Fecha de nacimiento</span><input type="date" name="fecha_nacimiento"></label>
          <label class="campo"><span>Sexo</span><select name="sexo"><option value="">—</option>
            <option value="F">Femenino</option><option value="M">Masculino</option><option value="X">Otro</option></select></label>
          <label class="campo"><span>Teléfono</span><input name="telefono" inputmode="tel" placeholder="+56 9 ..."></label>
          <label class="campo"><span>Correo</span><input name="email" type="email" autocomplete="off"></label>
          <label class="campo"><span>Cargo</span><select name="cargo">
            ${c.cargos.map(x => `<option value="${x}">${rotCargo(x)}</option>`).join("")}</select></label>
          <label class="campo"><span>Instalación habitual</span><select name="instalacion_id">
            <option value="">Sin asignar</option>
            ${c.instalaciones.map(i => `<option value="${i.id}">${esc(i.nombre)}</option>`).join("")}</select></label>
          <label class="campo"><span>Fecha de ingreso</span><input type="date" name="fecha_ingreso"></label>
          <label class="campo"><span>AFP</span><select name="afp"><option value="">—</option>
            ${c.afps.map(a => `<option value="${esc(a.nombre)}">${esc(a.nombre)} (${a.comision}%)</option>`).join("")}</select></label>
          <label class="campo"><span>Salud</span><select name="salud_sistema"><option value="">—</option>
            <option value="fonasa">Fonasa</option><option value="isapre">Isapre</option></select></label>
          <label class="campo"><span>Isapre</span><input name="salud_isapre" autocomplete="off"></label>
          <label class="campo"><span>Plan de isapre (UF)</span><input name="salud_plan_uf" inputmode="decimal"></label>
          <label class="campo"><span>Dirección</span><input name="direccion" autocomplete="off"></label>
          <label class="campo"><span>Comuna</span><input name="comuna" autocomplete="off"></label>
          <label class="campo"><span>Contacto de emergencia</span><input name="emergencia_nombre" autocomplete="off"></label>
          <label class="campo"><span>Teléfono de emergencia</span><input name="emergencia_telefono" inputmode="tel"></label>
        </div>
        <div class="pie-form">
          <button class="bt" type="submit">Crear</button>
          <span class="sub" id="previo-usuario" style="margin:0"></span>
          <span class="mensaje"></span>
        </div>
      </form>
    </section>`;

  $("#volver").onclick = () => { RRHH.verFicha = null; pintarPersonal(); };
  const f = $("#f-nueva");
  const previo = $("#previo-usuario");
  const verPrevio = () => {
    const u = usuarioPropuesto(f.nombres.value, f.apellido_paterno.value, f.apellido_materno.value);
    previo.textContent = u ? `Entrará a asistencia como «${u}», con su RUT de clave` : "";
  };
  ["nombres", "apellido_paterno", "apellido_materno"].forEach(k => { f[k].oninput = verPrevio; });
  f.rut.onblur = () => { if (f.rut.value) f.rut.value = rutLindoSeguro(f.rut.value); };

  f.onsubmit = async ev => {
    ev.preventDefault();
    const m = f.querySelector(".mensaje"), bt = f.querySelector("button");
    decir(m, "Guardando…"); bt.disabled = true;
    try {
      const r = await pedir("/rrhh/personal", { method: "POST",
        body: JSON.stringify(Object.fromEntries(new FormData(f))) });
      RRHH.verFicha = r.trabajador.id;
      pintarFicha(RRHH.verFicha);
    } catch (e) { decir(m, e.message, "error"); bt.disabled = false; }
  };
}

// ------------------------------------------------------------- ficha
async function pintarFicha(id) {
  $("#app").innerHTML = `<p class="cargando">Cargando la ficha…</p>`;
  const [datos] = await Promise.all([pedir(`/rrhh/personal/${id}`), catalogosRrhh()]);
  RRHH.ficha = datos;
  const { ficha: t, contratos, contrato_vigente: cv, documentos, ausencias, feriado } = datos;
  const c = RRHH.catalogos;

  const vencidos = documentos.filter(d => d.estado === "vencido");
  const porVencer = documentos.filter(d => d.estado === "por_vencer");

  $("#app").innerHTML = `
    <p style="margin-bottom:14px">
      <button class="bt bt--fino bt--chico" id="volver">← Volver al personal</button></p>

    ${!cv ? aviso("mal", "Esta persona no tiene contrato cargado",
      "Sin contrato no se puede calcular el sueldo, ni el feriado, ni un finiquito, "
      + "y no hay nada que mostrar en una fiscalización. Cárguelo más abajo.") : ""}
    ${vencidos.length ? aviso("mal",
      `${vencidos.length} documento${vencidos.length > 1 ? "s" : ""} vencido${vencidos.length > 1 ? "s" : ""}`,
      vencidos.map(d => d.tipo_nombre).join(", ") + ".") : ""}
    ${porVencer.length ? aviso("ojo",
      `${porVencer.length} por vencer`, porVencer.map(d =>
        `${d.tipo_nombre} (${fecha(d.fecha_vencimiento)})`).join(", ") + ".") : ""}

    <dl class="resumen">
      <div class="ficha ficha--plata"><dt>${esc(t.nombre)}</dt>
        <dd style="font-size:1.1rem">${rutLindoSeguro(t.rut_plano)}</dd>
        <small>${rotCargo(t.cargo)}${t.instalacion ? " · " + esc(t.instalacion) : ""}
          ${t.activo ? "" : " · <b>de baja</b>"}</small></div>
      <div class="ficha"><dt>Antigüedad</dt>
        <dd class="num" style="font-size:1.3rem">${t.fecha_ingreso ? fecha(t.fecha_ingreso) : "—"}</dd>
        <small>${feriado.anios_empresa !== undefined && t.fecha_ingreso
          ? `${feriado.anios_empresa} años en la empresa` : "Falta la fecha de ingreso"}</small></div>
      <div class="ficha ${feriado.saldo < 0 ? "ficha--ojo" : ""}"><dt>Feriado disponible</dt>
        <dd class="num">${t.fecha_ingreso ? feriado.saldo : "—"}</dd>
        <small>días hábiles · ${feriado.dias_por_anio || 15} al año${
          feriado.progresivo ? ` (${feriado.progresivo} de progresivo)` : ""}</small></div>
      <div class="ficha"><dt>Sueldo base</dt>
        <dd class="num" style="font-size:1.3rem">${cv ? clp(cv.sueldo_base) : "—"}</dd>
        <small>${cv ? (ROTULO_CONTRATO[cv.tipo] || cv.tipo) : "sin contrato"}</small></div>
      <div class="ficha"><dt>Documentos</dt><dd class="num">${documentos.filter(d => d.vigente).length}</dd>
        <small>${vencidos.length} vencidos · ${porVencer.length} por vencer</small></div>
    </dl>

    ${seccionContratos(contratos, cv, c)}
    ${seccionDocumentos(documentos, c, contratos)}
    ${seccionAusencias(ausencias, feriado, t)}
    ${seccionDatos(t, c)}`;

  $("#volver").onclick = () => {
    RRHH.verFicha = null; RRHH.editaContrato = null; pintarPersonal();
  };
  conectarFicha(datos);
}

/**
 * Los campos de un contrato, una sola vez.
 *
 * Los usan el alta y la corrección. Escribirlos dos veces es cómo terminan
 * separándose: alguien agrega un campo en uno, nadie se acuerda del otro, y a
 * los tres meses el formulario de corrección guarda menos de lo que guarda el
 * de alta sin que nada lo diga.
 *
 * `v` es el contrato que se está corrigiendo, o {} si es uno nuevo.
 */
function camposContrato(c, v = {}) {
  const t = k => esc(v[k] ?? "");
  const sel = (k, x, pordefecto = false) =>
    ((k in v && v[k] !== null && v[k] !== undefined && v[k] !== "")
      ? (String(v[k]) === String(x) ? " selected" : "")
      : (pordefecto ? " selected" : ""));
  return `<div class="rejilla">
    <label class="campo"><span>Tipo *</span><select name="tipo">
      ${c.tipos_contrato.map(x => `<option value="${x}"${sel("tipo", x, x === "indefinido")}>${ROTULO_CONTRATO[x] || x}</option>`).join("")}</select></label>
    <label class="campo"><span>Desde *</span><input type="date" name="fecha_inicio" required
      value="${t("fecha_inicio")}"></label>
    <label class="campo"><span>Hasta (plazo fijo / por obra)</span><input type="date" name="fecha_termino"
      value="${t("fecha_termino")}"></label>
    <label class="campo"><span>Cargo *</span><select name="cargo">
      ${c.cargos.map(x => `<option value="${x}"${sel("cargo", x)}>${rotCargo(x)}</option>`).join("")}</select></label>
    <label class="campo"><span>Instalación</span><select name="instalacion_id">
      <option value="">Sin asignar</option>
      ${c.instalaciones.map(i => `<option value="${i.id}"${sel("instalacion_id", i.id)}>${esc(i.nombre)}</option>`).join("")}</select></label>
    <label class="campo"><span>Jornada</span><select name="jornada_tipo">
      ${c.jornadas.map(x => `<option value="${x}"${sel("jornada_tipo", x, x === "art38_2")}>${ROTULO_JORNADA[x] || x}</option>`).join("")}</select></label>
    <label class="campo"><span>Horas semanales</span><input name="horas_semanales" inputmode="decimal"
      placeholder="42" value="${t("horas_semanales")}"></label>
    <label class="campo"><span>Turno</span><input name="turno" placeholder="4x4 de 12 horas"
      autocomplete="off" value="${t("turno")}"></label>
    <label class="campo"><span>Minutos de colación</span><input name="colacion_minutos" inputmode="numeric"
      value="${t("colacion_minutos")}"></label>
    <label class="campo"><span>Resolución DT</span><input name="resolucion_dt" placeholder="N° / año"
      autocomplete="off" value="${t("resolucion_dt")}"></label>
    <label class="campo"><span>La resolución vence</span><input type="date" name="resolucion_vence"
      value="${t("resolucion_vence")}"></label>
    <label class="campo"><span>Sueldo base *</span><input name="sueldo_base" inputmode="numeric" required
      value="${t("sueldo_base")}"></label>
    <label class="campo"><span>Gratificación</span><select name="gratificacion">
      <option value="legal_25"${sel("gratificacion", "legal_25", true)}>Legal: 25% con tope (art. 50)</option>
      <option value="convencional"${sel("gratificacion", "convencional")}>Convencional (monto fijo)</option>
      <option value="sin"${sel("gratificacion", "sin")}>Sin gratificación</option></select></label>
    <label class="campo"><span>Gratificación convencional</span><input name="gratificacion_monto"
      inputmode="numeric" value="${t("gratificacion_monto")}"></label>
    <label class="campo"><span>Colación</span><input name="colacion" inputmode="numeric"
      value="${v.colacion ?? 0}"></label>
    <label class="campo"><span>Movilización</span><input name="movilizacion" inputmode="numeric"
      value="${v.movilizacion ?? 0}"></label>
    <label class="campo"><span>Asignación (glosa)</span><input name="asignacion_glosa" autocomplete="off"
      value="${t("asignacion_glosa")}"></label>
    <label class="campo"><span>Asignación (monto)</span><input name="asignacion_monto" inputmode="numeric"
      value="${v.asignacion_monto ?? 0}"></label>
    <label class="campo"><span>Bono imponible (glosa)</span><input name="bono_imponible_glosa"
      autocomplete="off" value="${t("bono_imponible_glosa")}"></label>
    <label class="campo"><span>Bono imponible (monto)</span><input name="bono_imponible_monto"
      inputmode="numeric" value="${v.bono_imponible_monto ?? 0}"></label>
    <label class="campo"><span>¿Está firmado?</span><select name="firmado">
      <option value="false"${v.firmado ? "" : " selected"}>Todavía no</option>
      <option value="true"${v.firmado ? " selected" : ""}>Sí</option></select></label>
    <label class="campo"><span>Fecha de firma</span><input type="date" name="firmado_en"
      value="${t("firmado_en")}"></label>
    <label class="campo" style="grid-column:span 2"><span>Notas</span><input name="notas"
      autocomplete="off" value="${t("notas")}"></label>
  </div>`;
}

function seccionContratos(contratos, cv, c) {
  const editando = RRHH.editaContrato
    ? contratos.find(x => x.id === RRHH.editaContrato) : null;

  return `<section class="caja">
    <div class="caja__tit"><h2>Contratos</h2>
      <span class="nota">${contratos.length} en total</span></div>
    ${contratos.length ? `<div class="desliza"><table class="contratos">
      <thead><tr><th>Tipo</th><th>Desde</th><th>Hasta</th><th>Cargo</th><th>Jornada</th>
        <th class="num">Sueldo base</th><th>Estado</th><th></th></tr></thead><tbody>
      ${contratos.map(x => `<tr${x.estado === "vigente" ? "" : ' class="fila--cerrado"'}>
        <td><b>${ROTULO_CONTRATO[x.tipo] || x.tipo}</b>${x.firmado
          ? '<span class="sub">Firmado</span>'
          : '<span class="sub" style="color:var(--ambar)">Sin firmar</span>'}</td>
        <td class="nowrap">${fecha(x.fecha_inicio)}</td>
        <td class="nowrap">${x.fecha_termino ? fecha(x.fecha_termino) : "—"}</td>
        <td>${rotCargo(x.cargo)}${x.instalaciones?.nombre ? `<span class="sub">${esc(x.instalaciones.nombre)}</span>` : ""}</td>
        <td>${ROTULO_JORNADA[x.jornada_tipo] || x.jornada_tipo}
          ${x.turno ? `<span class="sub">${esc(x.turno)}</span>` : ""}
          ${x.resolucion_dt ? `<span class="sub">Res. ${esc(x.resolucion_dt)}${
            x.resolucion_vence ? ` · vence ${fecha(x.resolucion_vence)}` : ""}</span>` : ""}</td>
        <td class="num">${clp(x.sueldo_base)}
          ${x.colacion || x.movilizacion
            ? `<span class="sub">+ ${clp(x.colacion + x.movilizacion)} no imponible</span>` : ""}</td>
        <td>${x.estado === "vigente"
          ? '<span class="sello e-cerrado">Vigente</span>'
          : `<span class="sello e-borrador">Terminado</span>${x.termino_fecha
              ? `<span class="sub">${fecha(x.termino_fecha)}</span>` : ""}`}</td>
        <td class="celda-acciones">${x.estado === "vigente"
          ? `<button class="bt bt--fino bt--chico" data-editar-contrato="${x.id}">Corregir</button>
             <button class="bt bt--fino bt--chico" data-terminar="${x.id}">Terminar</button>`
          : '<span class="sub" style="margin:0">No se edita</span>'}</td>
      </tr>`).join("")}
    </tbody></table></div>` : `<p class="vacio">Sin contratos cargados.</p>`}

    ${editando ? `<details class="agregar" open>
      <summary>Corregir el contrato que empieza el ${fecha(editando.fecha_inicio)}</summary>
      <form id="f-editar-contrato">
        ${aviso("ojo", "Lo que cambie queda anotado con su nombre y la fecha",
          "La fecha de término manda la alerta de plazo por vencer: pasado un día, el contrato "
          + "pasa a ser indefinido por el solo hecho de seguir trabajando (art. 159 N°4). "
          + "Por eso cada cambio queda en la bitácora, con lo que decía antes y lo que dice ahora.")}
        ${camposContrato(c, editando)}
        <div class="pie-form">
          <button class="bt" type="submit">Guardar los cambios</button>
          <button class="bt bt--fino" type="button" id="bt-no-editar">Dejarlo como está</button>
          <span class="sub" style="margin:0">Esto corrige el contrato que ya existe. Si lo que hubo
            fue un cambio de condiciones, lo que corresponde es cargar uno nuevo más abajo.</span>
          <span class="mensaje"></span>
        </div>
      </form>
    </details>` : ""}

    <details class="agregar"${editando ? "" : ""}><summary>Cargar un contrato</summary>
      <form id="f-contrato">
        ${camposContrato(c, cv ? {} : { fecha_inicio: hoyISO() })}
        <div class="pie-form">
          <button class="bt" type="submit">Guardar contrato</button>
          <span class="sub" style="margin:0">${cv
            ? "El contrato vigente queda terminado el día antes de esta fecha de inicio."
            : "Es el primer contrato de esta persona."}</span>
          <span class="mensaje"></span>
        </div>
      </form>
    </details>
  </section>`;
}

function seccionDocumentos(documentos, c, contratos = []) {
  const porGrupo = {};
  for (const d of documentos) (porGrupo[d.tipo_grupo] ||= []).push(d);
  const GRUPO = { contratacion: "Contratación", os10: "Seguridad privada (OS-10)",
    salud: "Salud ocupacional", prevencion: "Prevención de riesgos",
    conduccion: "Conducción", termino: "Término", general: "Otros" };

  return `<section class="caja">
    <div class="caja__tit"><h2>Documentos</h2>
      <span class="nota">El archivo se guarda acá; el enlace a Drive sigue sirviendo para lo que ya está allá</span></div>
    ${documentos.length ? Object.entries(porGrupo).map(([g, docs]) => `
      <div style="padding:10px 16px 0"><b style="font-size:.84rem;color:var(--texto-2)">${esc(GRUPO[g] || g)}</b></div>
      <div class="desliza"><table>
        <thead><tr><th>Documento</th><th>N°</th><th>Emisión</th><th>Vencimiento</th>
          <th>Estado</th><th>Archivo</th><th></th></tr></thead><tbody>
        ${docs.map(d => `<tr${d.estado === "vencido" ? ' class="fila--atrasado"' : ""}>
          <td><b>${esc(d.tipo_nombre)}</b>${d.glosa ? `<span class="sub">${esc(d.glosa)}</span>` : ""}
            ${d.base_legal ? `<span class="sub" title="${esc(d.base_legal)}">${esc(d.base_legal.slice(0, 70))}${d.base_legal.length > 70 ? "…" : ""}</span>` : ""}</td>
          <td class="nowrap">${esc(d.numero || "—")}</td>
          <td class="nowrap">${d.fecha_emision ? fecha(d.fecha_emision) : "—"}</td>
          <td class="nowrap">${d.fecha_vencimiento
            ? `${fecha(d.fecha_vencimiento)}<span class="sub">${enDias(d.dias_para_vencer)}</span>` : "—"}</td>
          <td><span class="sello ${SELLO_DOC[d.estado]}">${ROTULO_DOC[d.estado]}</span></td>
          <td>${d.archivo_ruta
            ? `<a class="bt bt--fino bt--chico" href="/api/rrhh/documentos/${d.id}/archivo"
                 target="_blank" rel="noopener">Ver archivo</a>
               <span class="sub">${esc(d.archivo_nombre)} · ${pesoArchivo(d.archivo_bytes)}</span>`
            : `<button class="bt bt--fino bt--chico" data-subir="${d.id}">Subir archivo</button>`}
            ${d.enlace ? `<a class="sub" href="${esc(d.enlace)}" target="_blank" rel="noopener"
                 style="color:var(--acento)">También en Drive</a>` : ""}</td>
          <td class="nowrap">
            ${d.archivo_ruta ? `<button class="bt bt--fino bt--chico" data-subir="${d.id}">Reemplazar</button>
               <button class="bt bt--fino bt--chico" data-quitar-archivo="${d.id}">Quitar archivo</button>` : ""}
            ${d.vigente ? `<button class="bt bt--fino bt--chico" data-anular-doc="${d.id}">Anular</button>` : ""}
          </td>
        </tr>`).join("")}
      </tbody></table></div>`).join("")
      : `<p class="vacio">Sin documentos cargados.</p>`}

    <!-- Uno solo para toda la tabla: un input por fila serían treinta. El
         botón que se apretó deja su id en RRHH.subirA antes de abrirlo. -->
    <input type="file" id="archivo-oculto" style="display:none"
           accept="application/pdf,image/jpeg,image/png,image/webp,image/heic">

    <details class="agregar"><summary>Agregar un documento</summary>
      <form id="f-documento">
        <div class="rejilla">
          <label class="campo" style="grid-column:span 2"><span>Tipo *</span><select name="tipo" required>
            ${c.tipos_documento.map(td => `<option value="${td.codigo}">${esc(td.nombre)}${
              td.obligatorio ? " (obligatorio)" : ""}</option>`).join("")}</select></label>
          <label class="campo"><span>Número o folio</span><input name="numero" autocomplete="off"></label>
          <!-- A qué contrato pertenece. Importa de verdad en el finiquito: un
               finiquito enganchado a su contrato es lo que impide que después
               alguien corrija las condiciones que ya se firmaron. -->
          <label class="campo"><span>¿De qué contrato?</span><select name="contrato_id">
            <option value="">No corresponde a uno en particular</option>
            ${contratos.map(x => `<option value="${x.id}"${x.estado === "vigente" ? " selected" : ""}>${
              ROTULO_CONTRATO[x.tipo] || x.tipo} desde ${fecha(x.fecha_inicio)}${
              x.estado === "vigente" ? " (vigente)" : ""}</option>`).join("")}</select></label>
          <label class="campo"><span>Fecha de emisión</span><input type="date" name="fecha_emision" value="${hoyISO()}"></label>
          <label class="campo"><span>Vence el</span><input type="date" name="fecha_vencimiento"></label>
          <label class="campo" style="grid-column:span 2"><span>Archivo (PDF o foto)</span>
            <input type="file" name="archivo"
                   accept="application/pdf,image/jpeg,image/png,image/webp,image/heic"></label>
          <label class="campo" style="grid-column:span 2"><span>Enlace a la carpeta en Drive</span>
            <input name="enlace" placeholder="https://drive.google.com/..." autocomplete="off"></label>
          <label class="campo" style="grid-column:span 2"><span>Observación</span><input name="observacion" autocomplete="off"></label>
        </div>
        <div class="pie-form">
          <button class="bt" type="submit">Agregar</button>
          <span class="sub" id="ayuda-doc" style="margin:0"></span>
          <span class="mensaje"></span>
        </div>
      </form>
    </details>
  </section>`;
}

function seccionAusencias(ausencias, feriado, t) {
  return `<section class="caja">
    <div class="caja__tit"><h2>Ausencias y feriado</h2>
      <span class="nota">${ausencias.length} registro${ausencias.length === 1 ? "" : "s"}</span></div>

    ${t.fecha_ingreso ? `<div style="padding:12px 16px 0;font-size:.86rem;color:var(--texto-2)">

          <label class="campo"><span>Desde *</span><input type="date" name="desde" required></label>
          <label class="campo"><span>Hasta *</span><input type="date" name="hasta" required></label>

          <span class="mensaje"></span>
        </div>

    </details>
  </section>`;
}

function conectarFicha(datos) {
  const id = datos.ficha.id;
  const recargar = () => pintarFicha(id);

  const enviar = (sel, ruta, extra = {}, despues = recargar) => {
    const f = $(sel);
    if (!f) return;
    f.onsubmit = async ev => {
      ev.preventDefault();
      const m = f.querySelector(".mensaje"), bt = f.querySelector("button[type=submit]");
      decir(m, "Guardando…"); bt.disabled = true;
      try {
        const cuerpo = { ...Object.fromEntries(new FormData(f)), ...extra };
        const r = await pedir(ruta, { method: "POST", body: JSON.stringify(cuerpo) });
        if (r.avisos?.length) alert("Guardado.\n\nTenga presente:\n\n· " + r.avisos.join("\n· "));
        despues(r);
      } catch (e) { decir(m, e.message, "error"); bt.disabled = false; }
    };
  };

  enviar("#f-contrato", "/rrhh/contratos", { trabajador_id: id });

  // Corregir un contrato. Va aparte del ayudante `enviar` porque es un PATCH y
  // porque lo que devuelve es la lista de lo que cambió: eso hay que
  // mostrarlo, no tragárselo. Quien corrige tiene que ver lo mismo que quedó
  // escrito en la bitácora.
  document.querySelectorAll("[data-editar-contrato]").forEach(b => {
    b.onclick = () => {
      RRHH.editaContrato = Number(b.dataset.editarContrato);
      pintarFicha(id);
    };
  });
  const fec = $("#f-editar-contrato");
  if (fec) {
    $("#bt-no-editar").onclick = () => { RRHH.editaContrato = null; pintarFicha(id); };
    fec.onsubmit = async ev => {
      ev.preventDefault();
      const m = fec.querySelector(".mensaje"), bt = fec.querySelector("button[type=submit]");
      decir(m, "Guardando…"); bt.disabled = true;
      try {
        const r = await pedir(`/rrhh/contratos/${RRHH.editaContrato}`, { method: "PATCH",
          body: JSON.stringify(Object.fromEntries(new FormData(fec))) });
        if (!r.cambios?.length) {
          decir(m, "No había nada distinto que guardar", "ok");
          bt.disabled = false;
          return;
        }
        alert("Guardado y anotado en la bitácora a su nombre:\n\n· "
          + r.cambios.map(x => `${x.rotulo}: ${x.antes} → ${x.despues}`).join("\n· ")
          + (r.avisos?.length ? "\n\nTenga presente:\n\n· " + r.avisos.join("\n· ") : ""));
        RRHH.editaContrato = null;
        RRHH.panel = null;        // puede haber movido una alerta de plazo por vencer
        pintarFicha(id);
      } catch (e) { decir(m, e.message, "error"); bt.disabled = false; }
    };
  }

  // El documento se crea primero y el archivo se sube después, contra el id
  // recién creado. No se puede al revés: el archivo se guarda en una ruta que
  // lleva ese id adentro.
  const fdoc = $("#f-documento");
  if (fdoc) {
    fdoc.onsubmit = async ev => {
      ev.preventDefault();
      const m = fdoc.querySelector(".mensaje"), bt = fdoc.querySelector("button[type=submit]");
      const archivo = fdoc.archivo.files[0] || null;
      if (archivo && archivo.size > MAX_ARCHIVO) {
        return decir(m, `«${archivo.name}» pesa ${pesoArchivo(archivo.size)} y el máximo es 10 MB.`, "error");
      }
      decir(m, "Guardando…"); bt.disabled = true;
      try {
        const campos = Object.fromEntries(new FormData(fdoc));
        delete campos.archivo;                 // el archivo no va en el JSON
        const r = await pedir("/rrhh/documentos", { method: "POST",
          body: JSON.stringify({ ...campos, trabajador_id: id }) });
        if (archivo) {
          decir(m, `Subiendo ${esc(archivo.name)}…`);
          try {
            await subirArchivo(r.documento.id, archivo);
          } catch (e) {
            // El documento ya quedó creado: decirlo evita que lo carguen de
            // nuevo y queden dos.
            alert(`El documento se guardó, pero el archivo no se pudo subir.\n\n${e.message}`
              + "\n\nPuede subirlo desde el botón «Subir archivo» de su fila.");
          }
        }
        recargar();
      } catch (e) { decir(m, e.message, "error"); bt.disabled = false; }
    };
  }
  enviar("#f-ausencia", "/rrhh/ausencias", { trabajador_id: id }, r => {
    if (r.saldo) {
      alert(`Registrada.\n\nFeriado disponible ahora: ${r.saldo.saldo} días hábiles.`);
    }
    recargar();
  });

  // Ayuda viva mientras se escribe: el tipo de documento dice su validez y su
  // base legal, que es lo que nadie se sabe de memoria.
  const fd = $("#f-documento");
  if (fd) {
    const ayuda = $("#ayuda-doc");
    const verTipo = () => {
      const td = RRHH.catalogos.tipos_documento.find(x => x.codigo === fd.tipo.value);
      ayuda.textContent = td
        ? [td.vence ? (td.meses_validez ? `Vence a los ${td.meses_validez} meses (se propone solo)`
                                        : "Lleva fecha de vencimiento") : "No vence",
           td.base_legal].filter(Boolean).join(" · ")
        : "";
    };
    fd.tipo.onchange = verTipo;
    verTipo();
  }

  // Y lo mismo con las ausencias: cuántos días hábiles van a quedar, antes de
  // apretar guardar.
  const fa = $("#f-ausencia");
  if (fa) {
    const nota = $("#calculo-dias");
    const base = nota.textContent;
    const ver = () => {
      if (!fa.desde.value || !fa.hasta.value || fa.hasta.value < fa.desde.value) {
        nota.textContent = base; return;
      }
      const n = habilesLocal(fa.desde.value, fa.hasta.value);
      nota.textContent = `Son ${n} día${n === 1 ? "" : "s"} hábiles. Si no calza, escríbalo a mano.`;
    };
    fa.desde.onchange = ver; fa.hasta.onchange = ver;
  }

  const ff = $("#f-ficha");
  if (ff) {
    ff.onsubmit = async ev => {
      ev.preventDefault();
      const m = ff.querySelector(".mensaje"), bt = ff.querySelector("button[type=submit]");
      decir(m, "Guardando…"); bt.disabled = true;
      try {
        await pedir(`/rrhh/personal/${id}`, { method: "PATCH",
          body: JSON.stringify(Object.fromEntries(new FormData(ff))) });
        decir(m, "Guardado", "ok");
        bt.disabled = false;
        RRHH.panel = null;
      } catch (e) { decir(m, e.message, "error"); bt.disabled = false; }
    };
    $("#bt-baja").onclick = async () => {
      const activo = datos.ficha.activo;
      if (activo && !confirm("¿Dar de baja?\n\nNo podrá entrar a marcar asistencia. "
        + "Su ficha, contratos y documentos se conservan enteros.")) return;
      try {
        await pedir(`/rrhh/personal/${id}`, { method: "PATCH",
          body: JSON.stringify({ activo: !activo }) });
        recargar();
      } catch (e) { alert(e.message); }
    };
  }

  // Terminar un contrato lleva al finiquito: la causal decide lo que se paga,
  // así que elegirla sin ver el monto es elegir a ciegas.
  document.querySelectorAll("[data-terminar]").forEach(b => {
    b.onclick = () => {
      RRHH.sueldos = { trabajador: String(id), mes: hoyISO().slice(0, 7), vista: "finiquito" };
      ir("sueldos");
    };
  });

  // Un solo input para toda la tabla: el botón apretado deja su documento acá.
  const oculto = $("#archivo-oculto");
  if (oculto) {
    document.querySelectorAll("[data-subir]").forEach(b => {
      b.onclick = () => {
        RRHH.subirA = Number(b.dataset.subir);
        oculto.value = "";          // sin esto, elegir el mismo archivo no dispara nada
        oculto.click();
      };
    });
    oculto.onchange = async () => {
      const archivo = oculto.files[0];
      if (!archivo || !RRHH.subirA) return;
      const fila = document.querySelector(`[data-subir="${RRHH.subirA}"]`);
      const antes = fila ? fila.textContent : "";
      if (fila) { fila.disabled = true; fila.textContent = "Subiendo…"; }
      try {
        const r = await subirArchivo(RRHH.subirA, archivo);
        if (r?.reemplazo) console.log("archivo reemplazado");
        recargar();
      } catch (e) {
        alert(e.message);
        if (fila) { fila.disabled = false; fila.textContent = antes; }
      }
    };
  }

  document.querySelectorAll("[data-quitar-archivo]").forEach(b => {
    b.onclick = async () => {
      if (!confirm("¿Quitar el archivo?\n\nEl documento sigue registrado con sus fechas; "
        + "lo que se borra es el archivo subido, y eso no se deshace.")) return;
      try {
        await pedir(`/rrhh/documentos/${b.dataset.quitarArchivo}/archivo`, { method: "DELETE" });
        recargar();
      } catch (e) { alert(e.message); }
    };
  });

  document.querySelectorAll("[data-anular-doc]").forEach(b => {
    b.onclick = async () => {
      if (!confirm("¿Anular este documento?\n\nNo se borra: queda registrado como anulado, "
        + "para que se vea que alguna vez estuvo.")) return;
      try {
        await pedir(`/rrhh/documentos/${b.dataset.anularDoc}`, { method: "PATCH",
          body: JSON.stringify({ vigente: false }) });
        recargar();
      } catch (e) { alert(e.message); }
    };
  });
  document.querySelectorAll("[data-aprobar]").forEach(b => {
    b.onclick = async () => {
      try {
        await pedir(`/rrhh/ausencias/${b.dataset.aprobar}`, { method: "PATCH",
          body: JSON.stringify({ estado: "aprobada" }) });
        recargar();
      } catch (e) { alert(e.message); }
    };
  });
  document.querySelectorAll("[data-anular-aus]").forEach(b => {
    b.onclick = async () => {
      if (!confirm("¿Anular esta ausencia? Deja de descontar feriado.")) return;
      try {
        await pedir(`/rrhh/ausencias/${b.dataset.anularAus}`, { method: "PATCH",
          body: JSON.stringify({ estado: "anulada" }) });
        recargar();
      } catch (e) { alert(e.message); }
    };
  });
}

/**
 * Días hábiles, calculados en el navegador solo para mostrarlos mientras se
 * escribe. El número que se guarda lo calcula el servidor, que es el que
 * conoce los feriados: acá se usa una lista corta, a propósito, para no tener
 * dos verdades. Si el servidor dice otra cosa, manda el servidor.
 */
function habilesLocal(desde, hasta) {
  let n = 0;
  let t = Date.parse(desde + "T00:00:00Z");
  const fin = Date.parse(hasta + "T00:00:00Z");
  if (!(fin >= t) || fin - t > 400 * 86400000) return 0;
  while (t <= fin) {
    const d = new Date(t).getUTCDay();
    if (d >= 1 && d <= 5) n++;
    t += 86400000;
  }
  return n;
}

// ------------------------------------------------------------- sueldos
async function pintarSueldos() {
  const c = await catalogosRrhh();
  if (!RRHH.personal) RRHH.personal = (await pedir("/rrhh/personal")).personal;
  const s = RRHH.sueldos;
  const gente = RRHH.personal.filter(t => t.activo || String(t.id) === String(s.trabajador));

  const cabecera = `
    <div class="caja" style="padding:14px 16px;margin-bottom:18px;display:flex;gap:14px;
         align-items:center;flex-wrap:wrap">
      <div class="segmento" role="group" id="seg-sueldos">
        <button type="button" data-sub="liquidacion" aria-pressed="${s.vista === "liquidacion"}">Liquidación</button>
        <button type="button" data-sub="finiquito" aria-pressed="${s.vista === "finiquito"}">Finiquito</button>
        <button type="button" data-sub="parametros" aria-pressed="${s.vista === "parametros"}">Parámetros</button>
      </div>
      <span class="sub" style="margin:0;max-width:52ch">Los dos primeros son
        <b>estimaciones</b>: sirven para saber cuánto da antes de comprometerlo. El documento
        que se firma lo emite quien corresponda.</span>
    </div>`;

  $("#app").innerHTML = cabecera + `<p class="cargando">Cargando…</p>`;
  document.querySelectorAll("#seg-sueldos button").forEach(b => {
    b.onclick = () => { RRHH.sueldos.vista = b.dataset.sub; pintarSueldos(); };
  });

  const caja = document.createElement("div");
  if (s.vista === "parametros") caja.innerHTML = await htmlParametros();
  else caja.innerHTML = htmlSelectorPersona(gente, s);

  $("#app").querySelector(".cargando").replaceWith(caja);

  if (s.vista === "parametros") return conectarParametros();

  const selector = $("#f-sueldo-persona");
  if (selector) {
    selector.onchange = () => {
      RRHH.sueldos.trabajador = selector.value;
      pintarSueldos();
    };
  }
  const selMes = $("#f-sueldo-mes");
  if (selMes) selMes.onchange = () => { RRHH.sueldos.mes = selMes.value; calcular(); };

  const destino = document.createElement("div");
  $("#app").append(destino);

  async function calcular() {
    if (!RRHH.sueldos.trabajador) {
      destino.innerHTML = `<p class="vacio">Elija a una persona.</p>`;
      return;
    }
    destino.innerHTML = `<p class="cargando">Calculando…</p>`;
    try {
      if (s.vista === "liquidacion") {
        const r = await pedir("/rrhh/liquidacion", { method: "POST", body: JSON.stringify({
          trabajador_id: Number(RRHH.sueldos.trabajador), mes: RRHH.sueldos.mes }) });
        destino.innerHTML = htmlLiquidacion(r);
      } else {
        const f = $("#f-finiquito");
        const cuerpo = { trabajador_id: Number(RRHH.sueldos.trabajador),
          causal: f?.causal.value || "161-1",
          fecha_termino: f?.fecha_termino.value || hoyISO(),
          aviso_dado: f?.aviso_dado.value === "true",
          base: f?.base.value || null };
        const r = await pedir("/rrhh/finiquito", { method: "POST", body: JSON.stringify(cuerpo) });
        destino.innerHTML = htmlFiniquito(r, cuerpo);
        conectarFiniquito(cuerpo, calcular);
      }
    } catch (e) {
      destino.innerHTML = aviso("mal", "No se pudo calcular", e.message);
    }
  }

  if (s.vista === "finiquito") {
    const caja2 = document.createElement("div");
    caja2.innerHTML = htmlFormFiniquito();
    $("#app").insertBefore(caja2, destino);
    $("#f-finiquito").oninput = () => { clearTimeout(RRHH._tf); RRHH._tf = setTimeout(calcular, 300); };
    $("#f-finiquito").onchange = calcular;
  }
  calcular();
}

function conectarFiniquito(cuerpo, recalcular) {
  const bt = $("#bt-registrar-termino");
  if (!bt) return;
  bt.onclick = async () => {
    const persona = RRHH.personal.find(t => String(t.id) === String(cuerpo.trabajador_id));
    if (!persona?.contrato_id) {
      return alert("Esa persona no tiene un contrato vigente que terminar.");
    }
    if (!confirm(`¿Terminar el contrato de ${persona.nombre} el ${cuerpo.fecha_termino}?\n\n`
      + "El contrato queda cerrado con esa causal. Lo registrado se conserva.")) return;
    const darDeBaja = confirm("¿Dar de baja también su cuenta del libro de asistencia?\n\n"
      + "Aceptar: no podrá marcar más. Cancelar: la cuenta queda activa.");
    const m = $("#m-termino");
    decir(m, "Guardando…"); bt.disabled = true;
    try {
      await pedir(`/rrhh/contratos/${persona.contrato_id}`, { method: "PATCH",
        body: JSON.stringify({ terminar: true, termino_causal: cuerpo.causal,
          termino_fecha: cuerpo.fecha_termino, dar_de_baja: darDeBaja }) });
      RRHH.personal = null; RRHH.panel = null;
      decir(m, "Contrato terminado", "ok");
      setTimeout(() => { RRHH.verFicha = Number(cuerpo.trabajador_id); ir("personal"); }, 600);
    } catch (e) { decir(m, e.message, "error"); bt.disabled = false; }
  };
}

function conectarParametros() {
  const f = $("#f-uf-utm");
  if (f) {
    f.onsubmit = async ev => {
      ev.preventDefault();
      const m = f.querySelector(".mensaje"), bt = f.querySelector("button");
      const desde = f.vigente_desde.value;
      if (!desde) return decir(m, "Falta la fecha de vigencia", "error");
      decir(m, "Guardando…"); bt.disabled = true;
      try {
        for (const codigo of ["uf", "utm"]) {
          const v = f[codigo].value.replace(/[^\d,.-]/g, "").replace(/\./g, "").replace(",", ".");
          if (!v) continue;
          await pedir("/rrhh/parametros", { method: "PATCH", body: JSON.stringify({
            codigo, vigente_desde: desde, valor: Number(v), unidad: "pesos",
            por_confirmar: false }) });
        }
        pintarSueldos();
      } catch (e) { decir(m, e.message, "error"); bt.disabled = false; }
    };
  }
  document.querySelectorAll(".val-param").forEach(inp => {
    const original = inp.value;
    inp.onkeydown = ev => { if (ev.key === "Enter") { ev.preventDefault(); inp.blur(); } };
    inp.onblur = async () => {
      if (inp.value === original) return;
      const v = Number(inp.value.replace(/\./g, "").replace(",", "."));
      if (!Number.isFinite(v)) { inp.value = original; return alert("Eso no es un número."); }
      try {
        await pedir("/rrhh/parametros", { method: "PATCH", body: JSON.stringify({
          codigo: inp.dataset.codigo, vigente_desde: inp.dataset.desde,
          valor: v, por_confirmar: false }) });
        pintarSueldos();
      } catch (e) { inp.value = original; alert(e.message); }
    };
  });
}

/** Arma la plantilla en Excel: una hoja para pegar, otra con las listas válidas. */
async function bajarPlantilla(tipo) {
  const XLSX = await cargarSheetJS();
  const c = RRHH.catalogos;
  const def = c.plantillas[tipo];

  const libro = XLSX.utils.book_new();

  // Hoja de datos: encabezados y una fila de ejemplo, para que se vea el
  // formato de cada celda antes de pegar nada.
  const hoja = XLSX.utils.aoa_to_sheet([
    def.columnas.map(x => x.nombre),
    def.columnas.map(x => x.ejemplo || ""),
  ]);
  hoja["!cols"] = def.columnas.map(x => ({ wch: Math.max(14, x.nombre.length + 2) }));
  XLSX.utils.book_append_sheet(libro, hoja, "Datos");

  // Instrucciones: quien abre esto no vio esta pantalla.
  const inst = [
    [`Plantilla de carga: ${def.rotulo}`],
    [def.nota],
    [],
    ["Cómo se usa"],
    ["1. Borre la fila de ejemplo (la fila 2) y pegue sus datos debajo de los encabezados."],
    ["2. No cambie los encabezados de la fila 1. Si su planilla ya usa otros nombres, el sistema"],
    ["   reconoce varias formas de escribirlos: vea la columna «También se acepta» más abajo."],
    ["3. Las fechas pueden ir como fecha de Excel, como 15-06-2024 o como 2024-06-15."],
    ["4. Suba el archivo en Administración → Carga masiva. Primero se revisa sin escribir nada."],
    [],
    ["Columna", "¿Obligatoria?", "Ejemplo", "También se acepta"],
    ...def.columnas.map(x => [x.nombre,
      x.requerido === true ? "sí" : (x.requerido || "no"),
      String(x.ejemplo ?? ""), (x.alias || []).join(", ")]),
  ];
  const hojaInst = XLSX.utils.aoa_to_sheet(inst);
  hojaInst["!cols"] = [{ wch: 34 }, { wch: 14 }, { wch: 24 }, { wch: 60 }];
  XLSX.utils.book_append_sheet(libro, hojaInst, "Instrucciones");

  // Listas: los valores que el sistema acepta. Sin esto, la mitad de las filas
  // se rechaza por escribir "Plazo Fijo" donde va "plazo_fijo".
  const listas = [["Valores que acepta el sistema"], []];
  const poner = (titulo, valores) => {
    listas.push([titulo]);
    for (const v of valores) listas.push(["", v]);
    listas.push([]);
  };
  if (tipo === "trabajadores") {
    poner("Cargo", c.cargos);
    poner("Sexo", ["F", "M", "X"]);
    poner("Salud", ["fonasa", "isapre"]);
    poner("AFP", c.afps.map(a => a.nombre));
  }
  if (tipo === "contratos") {
    poner("Tipo de contrato", c.tipos_contrato);
    poner("Jornada", c.jornadas);
    poner("Gratificación", ["legal_25", "convencional", "sin"]);
    poner("Cargo", c.cargos);
  }
  if (tipo === "documentos") {
    listas.push(["Tipo de documento: use el código de la primera columna"], []);
    listas.push(["Código", "Nombre", "¿Vence?", "Base legal"]);
    for (const td of c.tipos_documento) {
      listas.push([td.codigo, td.nombre, td.vence ? `sí, ${td.meses_validez || "?"} meses` : "no",
                   td.base_legal || ""]);
    }
  }
  if (tipo === "ausencias") {
    poner("Tipo de ausencia", c.tipos_ausencia);
    poner("Estado", ["aprobada", "solicitada", "rechazada", "anulada"]);
  }
  const hojaListas = XLSX.utils.aoa_to_sheet(listas);
  hojaListas["!cols"] = [{ wch: 22 }, { wch: 42 }, { wch: 18 }, { wch: 70 }];
  XLSX.utils.book_append_sheet(libro, hojaListas, "Listas");

  XLSX.writeFile(libro, `plantilla ${tipo}.xlsx`);
}

async function cargarSheetJS() {
  await cargarScript(SHEETJS, "el lector de Excel");
  if (!window.XLSX) throw new Error("No se pudo cargar el lector de Excel.");
  return window.XLSX;
}

/** Lee el archivo, empareja los encabezados y pide la revisión al servidor. */
async function leerPlanilla(archivo) {
  if (!archivo) return;
  const m = $("#m-carga");
  decir(m, "Leyendo la planilla…");
  $("#nombre-archivo").textContent = archivo.name;

  const XLSX = await cargarSheetJS();
  const datos = new Uint8Array(await archivo.arrayBuffer());
  // cellDates: las celdas con formato de fecha vuelven como Date construida en
  // hora local, no como número de serie de Excel. Pasar el serial a fecha a
  // mano es de donde salen las fechas corridas en un día: el serial cuenta
  // días desde 1900 (con el error del 1900 bisiesto encima) y convertirlo
  // mete la zona horaria de quien convierte. SheetJS ya sabe qué día decía la
  // celda; `comoCelda` solo escribe ese día.
  const libro = XLSX.read(datos, { type: "array", cellDates: true });
  const hoja = libro.Sheets[libro.SheetNames.includes("Datos")
    ? "Datos" : libro.SheetNames[0]];
  if (!hoja) throw new Error("El archivo no tiene ninguna hoja con datos.");

  const matriz = XLSX.utils.sheet_to_json(hoja, { header: 1, raw: true, blankrows: false });
  if (matriz.length < 2) throw new Error("La hoja no tiene filas de datos bajo los encabezados.");

  const encabezados = matriz[0].map(x => String(x ?? "").trim());
  const def = RRHH.catalogos.plantillas[RRHH.carga.tipo];
  const { mapa, sobran, faltan } = emparejarLocal(def, encabezados);

  if (faltan.length) {
    throw new Error(`Faltan columnas obligatorias: ${faltan.join(", ")}. `
      + "Descargue la plantilla para ver cómo tienen que llamarse.");
  }

  const filas = [];
  for (let i = 1; i < matriz.length; i++) {
    const cruda = matriz[i];
    if (!cruda || cruda.every(v => v === null || v === undefined || v === "")) continue;
    const fila = {};
    encabezados.forEach((e, j) => {
      const campo = mapa[e];
      if (campo) fila[campo] = comoCelda(cruda[j]);
    });
    // La fila de ejemplo de la plantilla no es un dato.
    const esEjemplo = def.columnas.every(col => !col.ejemplo
      || String(fila[col.campo] ?? "") === String(col.ejemplo));
    if (esEjemplo) continue;
    filas.push({ fila, n: i + 1 });
  }
  if (!filas.length) throw new Error("No quedó ninguna fila con datos.");

  RRHH.carga.filas = filas;
  RRHH.carga.encabezados = encabezados;
  RRHH.carga.mapa = mapa;
  RRHH.carga.sobran = sobran;

  decir(m, `Revisando ${filas.length} fila${filas.length === 1 ? "" : "s"}…`);
  RRHH.carga.revision = await revisar(filas);
  decir(m, "");
  pintarRevision();
}

/**
 * El valor de una celda, listo para mandar.
 *
 * Lo único que necesita trato aparte son las fechas: SheetJS las entrega como
 * Date construida en la hora local, así que se escribe el día que muestra el
 * reloj local y no el UTC. `toISOString()` acá restaría un día.
 */
function comoCelda(v) {
  if (v === undefined || v === "") return null;
  if (v instanceof Date) {
    const p = n => String(n).padStart(2, "0");
    return `${v.getFullYear()}-${p(v.getMonth() + 1)}-${p(v.getDate())}`;
  }
  return v ?? null;
}

function emparejarLocal(def, encabezados) {
  const limpiar = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "")
    .toLowerCase().replace(/[^a-z0-9]/g, "");
  const porAlias = new Map();
  for (const col of def.columnas) {
    porAlias.set(limpiar(col.nombre), col.campo);
    porAlias.set(limpiar(col.campo), col.campo);
    for (const a of col.alias || []) porAlias.set(limpiar(a), col.campo);
  }
  const mapa = {}, sobran = [];
  for (const e of encabezados) {
    const campo = porAlias.get(limpiar(e));
    if (campo && !Object.values(mapa).includes(campo)) mapa[e] = campo;
    else if (!campo && e) sobran.push(e);
  }
  const faltan = def.columnas
    .filter(col => col.requerido === true && !Object.values(mapa).includes(col.campo))
    .map(col => col.nombre);
  return { mapa, sobran, faltan };
}

/** Revisión en seco. Va en tandas porque el servidor tiene tope por llamada. */
async function revisar(filas) {
  const POR_VEZ = 200;
  const resultados = [];
  let extra = {};
  for (let i = 0; i < filas.length; i += POR_VEZ) {
    const tanda = filas.slice(i, i + POR_VEZ);
    const r = await pedir("/rrhh/carga", { method: "POST", body: JSON.stringify({
      tipo: RRHH.carga.tipo, confirmar: false,
      filas: tanda.map(x => x.fila), desde_fila: tanda[0].n }) });
    resultados.push(...r.resultados);
    extra = { ...extra, ...r };
  }
  return { resultados, resumen: {
    total: resultados.length,
    nuevos: resultados.filter(x => x.accion === "crear").length,
    actualiza: resultados.filter(x => x.accion === "actualizar").length,
    errores: resultados.filter(x => x.estado === "error").length,
  }, instalaciones_nuevas: extra.instalaciones_nuevas, nota_instalaciones: extra.nota_instalaciones };
}

    ${rev.nota_instalaciones ? aviso("ojo",
      `${rev.instalaciones_nuevas.length} instalación${rev.instalaciones_nuevas.length > 1 ? "es" : ""} no está${rev.instalaciones_nuevas.length > 1 ? "n" : ""} en el catálogo`,

    <dl class="resumen">
      <div class="ficha ficha--plata"><dt>Filas leídas</dt><dd class="num">${r.total}</dd>
        <small>de la planilla ${esc(g.tipo)}</small></div>
      <div class="ficha"><dt>Se crean</dt><dd class="num">${r.nuevos}</dd><small>registros nuevos</small></div>
      <div class="ficha"><dt>Se actualizan</dt><dd class="num">${r.actualiza}</dd>
        <small>ya existían, se completan</small></div>
      <div class="ficha ${r.errores ? "ficha--ojo" : ""}"><dt>No se cargan</dt>
        <dd class="num">${r.errores}</dd><small>con el motivo escrito</small></div>
    </dl>

    <section class="caja">
      <div class="caja__tit"><h2>Qué va a pasar con cada fila</h2>

      <div class="desliza"><table>
        <thead><tr><th>Fila</th><th>Persona</th><th>Acción</th><th>Detalle</th><th>Estado</th></tr></thead>
        <tbody>
        ${rev.resultados.map(x => `<tr${x.estado === "error" ? ' class="fila--atrasado"' : ""}>
          <td class="num nowrap">${x.n}</td>
          <td>${x.nombre ? `<b>${esc(x.nombre)}</b>` : ""}
            ${x.rut ? `<span class="sub">${esc(x.rut)}</span>` : ""}</td>
          <td class="nowrap">${x.accion === "crear" ? "Crear"
            : x.accion === "actualizar" ? "Actualizar" : "—"}</td>
          <td>${esc(x.detalle || x.motivo || "")}
            ${(x.avisos || []).map(a => `<span class="sub" style="color:var(--ambar)">${esc(a)}</span>`).join("")}</td>
          <td><span class="sello ${SELLO[x.estado] || "e-borrador"}">${ROT[x.estado] || x.estado}</span></td>
        </tr>`).join("")}

      <div class="pie-form">
        <button class="bt" type="button" id="bt-confirmar" ${buenas.length ? "" : "disabled"}>

        <button class="bt bt--fino" type="button" id="bt-cancelar">Descartar</button>
        <span class="sub" style="margin:0">${conAvisos.length

  $("#bt-cancelar").onclick = () => {

                   revision: null, avance: null };
    pintarCarga();
  };
  $("#bt-confirmar").onclick = confirmarCarga;

  // La revisión queda debajo de la tabla de columnas, que es larga: sin esto
  // se sube la planilla y en pantalla no pasa nada visible.
  $("#resultado-carga").scrollIntoView({ block: "start", behavior: "smooth" });

async function confirmarCarga() {
  const g = RRHH.carga;
  const buenos = new Set(g.revision.resultados
    .filter(x => x.estado !== "error" && (x.accion === "crear" || x.accion === "actualizar"))
    .map(x => x.n));
  const filas = g.filas.filter(x => buenos.has(x.n));
  if (!filas.length) return;

  if (!confirm(`¿Cargar ${filas.length} fila${filas.length === 1 ? "" : "s"}?\n\n`
    + "Esto sí escribe en el sistema. Lo que quede mal se corrige volviendo a subir la "
    + "planilla: las personas que ya estén se actualizan, no se duplican.")) return;

  const bt = $("#bt-confirmar"), m = $("#m-confirmar"), avance = $("#avance-carga");
  bt.disabled = true;
  $("#bt-cancelar").disabled = true;

  const porTanda = RRHH.catalogos.por_tanda || 25;
  const hechos = [];
  try {
    for (let i = 0; i < filas.length; i += porTanda) {
      const tanda = filas.slice(i, i + porTanda);
      decir(m, `Cargando ${Math.min(i + tanda.length, filas.length)} de ${filas.length}…`);
      const r = await pedir("/rrhh/carga", { method: "POST", body: JSON.stringify({
        tipo: g.tipo, confirmar: true,
        filas: tanda.map(x => x.fila), desde_fila: tanda[0].n }) });
      hechos.push(...r.resultados);
    }
  } catch (e) {
    // Lo que alcanzó a entrar, entró: la carga no se deshace sola. Decirlo es
    // lo que evita que alguien vuelva a subir todo y duplique la mitad.
    avance.innerHTML = aviso("mal", "La carga se cortó a mitad de camino",
      `${hechos.length} de ${filas.length} filas alcanzaron a entrar. Motivo: ${e.message}. `
      + "Vuelva a subir la misma planilla: lo ya cargado se reconoce por el RUT y se actualiza, "
      + "no se duplica.");
    decir(m, "", "error");
    $("#bt-cancelar").disabled = false;
    return;
  }

  const errores = hechos.filter(x => x.estado === "error");
  RRHH.panel = null; RRHH.personal = null;
  decir(m, "");
  avance.innerHTML = aviso(errores.length ? "ojo" : "bien",
    `${hechos.length - errores.length} de ${filas.length} filas cargadas`,
    errores.length
      ? `${errores.length} fallaron al escribir: ` + errores.map(x => `fila ${x.n} (${x.motivo})`).join(", ")
      : "Ya están en el sistema. Revise el panel de RRHH: puede que aparezcan vencimientos nuevos.")
    + `<p style="margin-top:12px"><button class="bt" type="button" id="bt-ir-panel">Ir al panel de RRHH</button>
       <button class="bt bt--fino" type="button" id="bt-otra">Cargar otra planilla</button></p>`;
  $("#bt-ir-panel").onclick = () => ir("rrhh");
  $("#bt-otra").onclick = () => {
    RRHH.carga = { tipo: g.tipo, filas: null, encabezados: null, mapa: null,
                   revision: null, avance: null };
    pintarCarga();
  };
}

// ------------------------------------------------------- documentos y firma
/**
 * Generar un documento desde una plantilla y firmarlo.
 *
 * El orden es a propósito el mismo que el de la carga masiva: primero se mira,
 * después se escribe. La vista previa arma el documento completo y no guarda
 * nada; recién al apretar «Generar» el texto queda congelado, y desde ese
 * momento no se edita más. Si salió mal, se anula y se hace otro: un documento
 * que se corrige después de firmado no sirve de respaldo, que es justamente
 * para lo que existe.
 */
const DOCS = {
  catalogos: null,
  plantilla: "",
  trabajador: "",
  bloque: "",
  campos: {},
  previa: null,
  abierto: null,
};

   no el contrato: el texto —que es lo que se firma— sí vive en la base. */
const CAMPOS_ARRIENDO = [
  { k: "arrendador", r: "Arrendador (nombre completo)", ancho: 2 },
  { k: "arrendador_rut", r: "RUT del arrendador" },
  { k: "arrendador_domicilio", r: "Domicilio del arrendador", ancho: 2 },
  { k: "marca", r: "Marca" }, { k: "modelo", r: "Modelo" },
  { k: "anio", r: "Año" }, { k: "patente", r: "Patente" },
  { k: "motor", r: "N° de motor" }, { k: "chasis", r: "N° de chasis" },
  { k: "color", r: "Color" },
  { k: "desde", r: "Desde", tipo: "date" }, { k: "hasta", r: "Hasta", tipo: "date" },
  { k: "renta", r: "Renta mensual", tipo: "number" },
  { k: "dia_pago", r: "Se paga dentro de los primeros (días)", tipo: "number" },
  { k: "kilometraje", r: "Kilometraje a la entrega" },
  { k: "combustible", r: "Combustible a la entrega" },
  { k: "aviso_dias", r: "Aviso para terminar antes (días)", tipo: "number" },
  { k: "garantia", r: "Garantía (en blanco si no hay)", tipo: "number" },
];

const catalogosDocs = async () => (DOCS.catalogos ||= await pedir("/documentos/catalogos"));

      .catch(e => decir($("#m-empresa"), e.message, "error"));
  }
  for (const b of document.querySelectorAll("[data-abrir]")) {
    b.onclick = () => abrirDocumento(Number(b.dataset.abrir))
      .catch(e => decir($("#m-docs"), e.message, "error"));
  }

  if (DOCS.previa) pintarPrevia();
  if (DOCS.abierto) pintarAbierto().catch(e => decir($("#m-docs"), e.message, "error"));
}

const selloDoc = d => d.estado === "firmado"
  ? '<span class="sello e-cerrado">Firmado</span>'
  : d.estado === "anulado"
    ? '<span class="sello e-rechazada">Anulado</span>'
    : '<span class="sello e-solicitar_oc">Por firmar</span>';

/* ------------------------------------------------- los datos de la empresa

   La razón social con que se firma, el representante, el domicilio. Entran en
   todos los contratos y el sistema se niega a generar uno al que le falte
   alguno, así que hasta hoy un dato mal puesto se arreglaba con un update a
   mano en la base: la pantalla los mostraba en ámbar como «hay que confirmar»
   y no había dónde confirmarlos.

   Guardar es confirmar: la glosa es la pregunta y guardar es la respuesta. Por
   eso hay dos botones y no uno. «Guardar los cambios» manda solo lo que se
   editó; «Confirmar tal como están» es para el caso de que el valor ya sea el
   correcto y lo único que falte sea que alguien lo diga. */

function seccionEmpresa(c) {
  if (!c.puede_empresa) return "";
  const faltan = c.empresa.filter(e => e.por_confirmar).length;
  return `
    <section class="caja" id="d-empresa">
      <div class="caja__tit"><h2>Datos de la empresa</h2>
        <span class="nota">Van en todos los contratos</span></div>
      <div class="rejilla">
        ${c.empresa.map(e => {
          // `rotulo` y `nota` los manda el servidor, sacados de la glosa: así el
          // nombre de cada dato se escribe en un solo lado.
          const { rotulo, nota } = e;
          return `<label class="campo" style="grid-column:span 2">
            <span>${esc(rotulo)}${e.por_confirmar
              ? ' <span class="sello e-solicitar_oc">Por confirmar</span>' : ""}</span>
            <input data-empresa="${esc(e.codigo)}" value="${esc(e.valor)}" maxlength="300">
            ${nota ? `<div class="sub">${esc(nota)}</div>` : ""}
          </label>`;
        }).join("")}
      </div>
      <div class="pie-form">
        <button class="bt" type="button" id="e-guardar">Guardar los cambios</button>
        ${faltan ? `<button class="bt bt--fino" type="button" id="e-confirmar">
          Confirmar ${faltan === 1 ? "el dato" : `los ${faltan} datos`} tal como ${
          faltan === 1 ? "está" : "están"}</button>` : ""}
        <span class="mensaje" id="m-empresa"></span>
      </div>
    </section>`;
}

/**
 * Guarda los datos de la empresa que cambiaron, o confirma los que están en
 * ámbar sin tocarles el valor.
 *
 * Va de a uno y no falla entero: si uno se cae, los demás igual quedan y se
 * dice cuál no pudo, como hace `POST /lote` con las tablas.
 */
async function guardarDatosEmpresa({ confirmar = false } = {}) {
  const msj = $("#m-empresa");
  const previos = Object.fromEntries((DOCS.catalogos?.empresa || []).map(e => [e.codigo, e]));
  const aMandar = [...document.querySelectorAll("[data-empresa]")]
    .map(el => ({ codigo: el.dataset.empresa, valor: el.value.trim() }))
    .filter(x => {
      const p = previos[x.codigo];
      if (!p) return false;
      return confirmar ? p.por_confirmar : x.valor !== p.valor;
    });

  if (!aMandar.length) {
    return decir(msj, confirmar ? "No queda nada por confirmar." : "No cambió ningún dato.");
  }

  decir(msj, confirmar ? "Confirmando…" : "Guardando…");
  const malos = [];
  for (const x of aMandar) {
    try {
      await pedir("/documentos/empresa", {
        method: "POST", body: JSON.stringify({ codigo: x.codigo, valor: x.valor }),
      });
    } catch (e) {
      // El mensaje del servidor ya nombra el dato: anteponerle el rótulo lo
      // dejaba diciendo «RUT de la empresa: RUT de la empresa no puede…».
      malos.push(e.message);
    }
  }

  // El catálogo se vuelve a pedir, y la vista previa se tira: se armó con los
  // datos viejos y con el aviso de «por confirmar» adentro.
  DOCS.catalogos = null;
  DOCS.previa = null;
  await pintarDocumentos();

  const hechos = aMandar.length - malos.length;
  decir($("#m-empresa"),
    malos.length
      ? `${hechos ? `Se guardaron ${hechos}. ` : ""}No se pudo con ${malos.join(" · ")}`
      : `Listo: ${hechos === 1 ? "un dato" : `${hechos} datos`} ${
         confirmar ? (hechos === 1 ? "confirmado" : "confirmados") : "al día"}.`,
    malos.length ? "error" : "ok");
}

/* Dónde se arregla cada cosa que falta. El servidor manda el campo, su rótulo
   y de qué grupo es; acá se traduce a la pantalla donde se corrige, que es lo
   que la persona necesita saber para no ir a buscarlo a tres lados. */
const DONDE_FALTA = {
  empresa:     "Datos de la empresa, acá abajo",
  ficha:       "Ficha de la persona",
  contrato:    "Contrato vigente — «Corregir», en la ficha",
  instalacion: "La instalación, en Operaciones",
  documento:   "Este mismo formulario, acá arriba",
  bloque:      "Funciones del cargo",
};

function listaFaltantes(campos) {
  const grupos = new Map();
  for (const c of campos) {
    if (!grupos.has(c.donde)) grupos.set(c.donde, []);
    grupos.get(c.donde).push(c.rotulo);
  }
  return `<div class="faltantes">${[...grupos].map(([donde, rotulos]) =>
    `<div><b>${esc(DONDE_FALTA[donde] || donde)}</b>
     <span>${rotulos.map(esc).join(" · ")}</span></div>`).join("")}</div>`;
}

/** Lo que se manda al servidor para armar el documento. */
function cuerpoDocumento() {
  const base = { plantilla: DOCS.plantilla };
  const p = DOCS.catalogos.plantillas.find(x => x.codigo === DOCS.plantilla);
  if (p && p.clase === "laboral") {
    if (!DOCS.trabajador) throw new Error("Elija a la persona.");
    base.trabajador_id = Number(DOCS.trabajador);
    if (DOCS.plantilla === "contrato_trabajo") base.bloque = DOCS.bloque;
  } else {
    base.campos = DOCS.campos;
  }
  return base;
}

async function verPrevia() {
  decir($("#m-docs"), "Armando el documento…");
  const r = await pedir("/documentos/vista-previa", {
    method: "POST", body: JSON.stringify(cuerpoDocumento()),
  });
  DOCS.previa = r.vista_previa;
  decir($("#m-docs"), "");
  pintarPrevia();
  $("#d-previa").scrollIntoView({ behavior: "smooth", block: "start" });
}

function pintarPrevia() {
  const v = DOCS.previa;
  $("#d-previa").innerHTML = `
    <section class="caja">
      <div class="caja__tit"><h2>Así va a quedar</h2>
        <span class="nota">Todavía no se guarda nada</span></div>
      ${v.por_confirmar ? aviso("ojo", "Por confirmar antes de firmar. ", v.por_confirmar) : ""}
      ${v.faltan ? (v.faltan_campos?.length
        ? aviso("ojo",
            `Faltan ${v.faltan_campos.length === 1 ? "un dato" : `${v.faltan_campos.length} datos`}. `,
            "En el texto salen como una línea de guiones. Complete esto y vuelva a ver cómo "
            + "queda; el documento no se puede generar con huecos adentro.")
          + listaFaltantes(v.faltan_campos)
        : aviso("ojo", "Faltan datos. ",
            `El documento tiene ${v.faltan} ${v.faltan === 1 ? "campo" : "campos"} sin completar, `
            + "marcados con una línea. Complete la ficha o el contrato y vuelva a verlo.")) : ""}
      <h3 style="margin:0 16px 10px;font-size:1rem">${esc(v.titulo)}</h3>
      <div class="documento">${esc(v.cuerpo)}</div>
      <div class="pie-form">
        <button class="bt" type="button" id="d-generar"${v.faltan ? " disabled" : ""}>
          Generar y mandar a firmar</button>
        <span class="mensaje" id="m-previa"></span>
      </div>
    </section>`;
  $("#d-generar").onclick = () => generarDocumento()
    .catch(e => decir($("#m-previa"), e.message, "error"));
}

async function generarDocumento() {
  decir($("#m-previa"), "Generando…");
  const r = await pedir("/documentos", {
    method: "POST", body: JSON.stringify(cuerpoDocumento()),
  });
  DOCS.previa = null;
  DOCS.abierto = r.documento.id;
  await pintarDocumentos();
}

async function abrirDocumento(id) {
  DOCS.abierto = id;
  await pintarAbierto();
  $("#d-abierto").scrollIntoView({ behavior: "smooth", block: "start" });
}

async function pintarAbierto() {
  const { documento: d } = await pedir(`/documentos/${DOCS.abierto}`);
  const puestas = new Set(d.firmas.map(f => f.rol));
  const faltan = d.firmantes.filter(r => !puestas.has(r));
  const tocaEmpresa = d.estado === "por_firmar" && faltan.includes("empleador");

  $("#d-abierto").innerHTML = `
    <section class="caja">
      <div class="caja__tit"><h2>${esc(d.titulo)}</h2>
        <span class="nota">N° ${esc(d.numero)} · ${selloDoc(d)}</span></div>

      ${d.descuadrado ? aviso("ojo", "Ojo. ",
        "Alguna firma no corresponde al texto que está guardado. Este documento no "
        + "sirve de respaldo: anúlelo y genere otro.") : ""}
      ${d.estado === "anulado" ? aviso("ojo", "Anulado. ", d.anulado_motivo || "") : ""}
      ${d.por_confirmar ? aviso("ojo", "Por confirmar. ", d.por_confirmar) : ""}
      ${d.estado === "por_firmar" && faltan.includes("trabajador") ? aviso("ojo",
        "Falta que firme el trabajador. ",
        "Lo ve al entrar a asistencia.seggarridos.com con su propia cuenta, la misma "
        + "con la que marca turno.") : ""}

      <div class="documento">${esc(d.cuerpo)}</div>

      ${d.firmas.length ? `<div class="firmas">${d.firmas.map(f => `
        <div class="firma-hecha">
          <img src="${esc(f.imagen)}" alt="Firma de ${esc(f.nombre)}">
          <div class="firma-linea" style="border-top:0;padding-top:0">
            <b style="color:var(--texto)">${esc(f.nombre)}</b><br>
            ${esc(f.rut || "")}<br>
            ${esc(rolRotulo(f.rol))} · ${esc(cuando(f.firmado_en))}<br>
            ${esc(f.origen === "asistencia" ? "Firmado desde el libro de asistencia"
              : "Firmado desde el panel")}${f.quien ? ` · cuenta ${esc(f.quien)}` : ""}
          </div>
        </div>`).join("")}</div>` : ""}

      ${tocaEmpresa ? `
      <div class="firma-caja">
        <h3 style="font-size:.95rem;margin:0 0 8px">Firma de la empresa</h3>
        <canvas class="firma-lienzo" id="d-lienzo"></canvas>
        <div class="firma-pie">
          <button class="bt bt--fino" type="button" id="d-limpiar">Borrar y firmar de nuevo</button>
          <label class="campo" style="flex:1;min-width:220px;margin:0">
            <span style="display:flex;gap:8px;align-items:flex-start">
              <input type="checkbox" id="d-leido" style="margin-top:3px">
              <span style="font-size:.82rem;color:var(--texto-2)">Leí el documento completo
                y firmo en representación de la empresa.</span></span></label>
        </div>
      </div>` : ""}

      <div class="pie-form">
        ${tocaEmpresa ? '<button class="bt" type="button" id="d-firmar">Firmar</button>' : ""}
        <button class="bt bt--fino" type="button" id="d-pdf">Descargar en PDF</button>
        ${d.estado === "firmado" && d.trabajador_id && !d.documento_id
          ? '<button class="bt bt--fino" type="button" id="d-archivar">Guardar en su ficha</button>'
          : ""}
        ${d.documento_id ? '<span class="sub" style="margin:0">Ya está guardado en su ficha</span>' : ""}
        ${d.estado !== "anulado"
          ? '<button class="bt bt--fino" type="button" id="d-anular">Anular</button>' : ""}
        <span class="mensaje" id="m-abierto"></span>
      </div>
    </section>`;

  let lienzo = null;
  if (tocaEmpresa) {
    lienzo = Firma.conectar($("#d-lienzo"));
    $("#d-limpiar").onclick = () => lienzo.limpiar();
    $("#d-firmar").onclick = () => firmarComoEmpresa(d, lienzo)
      .catch(e => decir($("#m-abierto"), e.message, "error"));
  }
  $("#d-pdf").onclick = () => pdfDocumento(d)
    .catch(e => decir($("#m-abierto"), e.message, "error"));
  if ($("#d-archivar")) {
    $("#d-archivar").onclick = () => archivarDocumento(d)
      .catch(e => decir($("#m-abierto"), e.message, "error"));
  }
  if ($("#d-anular")) {
    $("#d-anular").onclick = () => anularDocumento(d)
      .catch(e => decir($("#m-abierto"), e.message, "error"));
  }
}

const rolRotulo = r => ({ trabajador: "El trabajador", empleador: "Por la empresa",
                          arrendador: "El arrendador" }[r] || r);

const cuando = iso => {
  if (!iso) return "";
  const d = new Date(iso);
  return isNaN(d) ? String(iso).slice(0, 16).replace("T", " ")
    : d.toLocaleString("es-CL", { dateStyle: "short", timeStyle: "short" });
};

async function firmarComoEmpresa(d, lienzo) {
  if (lienzo.vacio()) throw new Error("Falta firmar en el recuadro.");
  if (!$("#d-leido").checked) throw new Error("Falta marcar que leyó el documento.");
  decir($("#m-abierto"), "Guardando la firma…");
  await pedir(`/documentos/${d.id}/firma`, {
    method: "POST",
    body: JSON.stringify({ imagen: lienzo.png(), leido: true }),
  });
  await pintarDocumentos();
}

async function anularDocumento(d) {
  const motivo = prompt("¿Por qué se anula este documento?\n\n"
    + "El documento y sus firmas no se borran: queda anulado y con el motivo a la vista.");
  if (!motivo) return;
  await pedir(`/documentos/${d.id}/anular`, {
    method: "POST", body: JSON.stringify({ motivo }),
  });
  await pintarDocumentos();
}

/**
 * Deja el documento firmado colgando de la ficha de la persona, con el PDF
 * adentro. Son dos pasos: el servidor crea la fila del documento y la pantalla
 * le sube el PDF por la ruta que ya existe para los archivos de RRHH. No hay
 * un segundo almacenamiento, y el PDF pasa por la misma revisión de bytes que
 * cualquier otro archivo que suba la oficina.
 */
async function archivarDocumento(d) {
  decir($("#m-abierto"), "Armando el PDF…");
  const blob = await pdfDocumento(d, { descargar: false });
  decir($("#m-abierto"), "Guardando en la ficha…");
  const r = await pedir(`/documentos/${d.id}/archivar`, { method: "POST" });
  const nombre = `${d.numero} ${d.titulo}.pdf`.replace(/[\\/:*?"<>|]/g, "-");
  await subirArchivo(r.documento_id, new File([blob], nombre, { type: "application/pdf" }));
  await pintarDocumentos();
}

/**
 * El PDF.
 *
 * Imprime el cuerpo congelado tal cual, sin volver a armar nada: lo que sale
 * en el papel es lo mismo que leyó y firmó la persona. Las firmas van al pie,
 * cada una con su nombre, su RUT y la fecha y hora en que se puso, porque una
 * firma que no se puede fechar no sirve de respaldo.
 */
async function pdfDocumento(d, opciones) {
  const op = opciones || {};
  await cargarScript(JSPDF);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  const A = 210, H = 297, M = 20;
  const ancho = A - M * 2;
  const tinta = [19, 0, 82], gris = [110, 110, 134];
  let y = M;

  const pie = () => {
    doc.setFont("helvetica", "normal").setFontSize(7.5).setTextColor(...gris);
    doc.text(`${d.numero} · ${d.titulo}`, M, H - 10, { maxWidth: ancho - 20 });
    doc.text(String(doc.getNumberOfPages()), A - M, H - 10, { align: "right" });
  };
  const saltar = (alto) => {
    if (y + alto <= H - 18) return;
    pie();
    doc.addPage();
    y = M;
  };

  const logo = await cargarLogo("logo.png");
  if (logo) doc.addImage(logo, "PNG", M, y - 2, 16, 16);
  doc.setFont("helvetica", "bold").setFontSize(12).setTextColor(...tinta);
  doc.text("SEGURIDAD GARRIDOS", M + (logo ? 20 : 0), y + 4);
  doc.setFont("helvetica", "normal").setFontSize(8).setTextColor(...gris);
  doc.text("GLOBSEG SPA · RUT 78.095.104-4", M + (logo ? 20 : 0), y + 9);
  doc.text(`Documento N° ${d.numero}`, A - M, y + 4, { align: "right" });
  y += 22;

  doc.setFont("helvetica", "bold").setFontSize(13).setTextColor(...tinta);
  for (const linea of String(d.titulo).split("\n")) {
    doc.text(linea, A / 2, y, { align: "center" });
    y += 6;
  }
  y += 4;

  // El cuerpo. Se respeta el salto de línea del texto guardado y se corta cada
  // párrafo al ancho de la hoja; los títulos de cláusula van en negrita, que
  // es como se leen en el papel que la empresa usa hoy.
  doc.setTextColor(30, 30, 40);
  for (const parrafo of String(d.cuerpo).split("\n")) {
    if (!parrafo.trim()) { y += 3; continue; }
    const esClausula = /^[A-ZÁÉÍÓÚÑ]{4,}[:.–\- ]/.test(parrafo.trim());
    doc.setFont("helvetica", esClausula ? "bold" : "normal").setFontSize(9.5);
    for (const linea of doc.splitTextToSize(parrafo, ancho)) {
      saltar(5);
      doc.text(linea, M, y);
      y += 4.6;
    }
  }

  // Las firmas. Si no caben, se van a una hoja nueva enteras: una firma
  // separada de su nombre por un salto de página no se entiende.
  if (d.firmas && d.firmas.length) {
    y += 8;
    saltar(46);
    const porFila = 2;
    const col = ancho / porFila;
    let fila = y;
    d.firmas.forEach((f, i) => {
      const x = M + (i % porFila) * col;
      if (i && i % porFila === 0) { fila += 44; saltar(46); }
      try {
        // Con compresión: sin ella jsPDF guarda el mapa de bits entero y un
        // contrato de tres hojas con dos firmas pesaba más de un mega.
        if (f.imagen) doc.addImage(f.imagen, "PNG", x, fila, 44, 16, undefined, "FAST");
      } catch (_) {
        // Una firma que el PDF no pueda dibujar no bota el documento entero:
        // lo que importa abajo es el nombre, el RUT y la hora.
      }
      doc.setDrawColor(150).line(x, fila + 18, x + col - 10, fila + 18);
      doc.setFont("helvetica", "bold").setFontSize(8.5).setTextColor(...tinta);
      doc.text(String(f.nombre || ""), x, fila + 22, { maxWidth: col - 10 });
      doc.setFont("helvetica", "normal").setFontSize(7.5).setTextColor(...gris);
      doc.text(`${f.rut || ""}`, x, fila + 26);
      doc.text(rolRotulo(f.rol), x, fila + 29.5);
      doc.text(`Firmado el ${cuando(f.firmado_en)}`, x, fila + 33);
    });
    y = fila + 44;
  }

  // Lo que hace que esto sirva de respaldo, dicho en el propio documento.
  saltar(18);
  doc.setFont("helvetica", "normal").setFontSize(7).setTextColor(...gris);
  for (const linea of doc.splitTextToSize(
      "Firmado electrónicamente en el sistema de Seguridad Garridos. Firma electrónica "
      + "simple conforme a la Ley 19.799. Cada firma quedó registrada con la cuenta que la "
      + "puso, la fecha y hora del servidor y el aparato desde el que se firmó. "
      + `Verificación del texto (SHA-256): ${d.cuerpo_hash || ""}`, ancho)) {
    doc.text(linea, M, y);
    y += 3.2;
  }
  pie();

  if (op.descargar === false) return doc.output("blob");
  doc.save(`${d.numero} ${d.titulo}.pdf`.replace(/[\\/:*?"<>|]/g, "-"));
  return null;
}

conectarApariencia();
arrancar();
